<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>우리 반 온라인 게시판</title>
<style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#dbe4f3;--blue:#2563eb;--blue-d:#1d4ed8;--soft:#e8f0ff;--pink:#ec4899;--warn:#b45309}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",system-ui,sans-serif;font-size:18px;line-height:1.55;padding-bottom:80px}
a{color:var(--blue-d)}
header{background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff;padding:18px 16px 20px}
header .in{max-width:760px;margin:auto}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;font-size:15px;opacity:.95}
header a.back{color:#fff;font-size:15px;text-decoration:none;font-weight:700;display:inline-block;margin-bottom:6px}
main{max-width:760px;margin:auto;padding:14px 14px 0}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:17px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;min-height:48px}
.btn.ghost{background:var(--soft);color:var(--blue-d)}
.btn.small{padding:8px 12px;min-height:40px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-size:16px;font-weight:800;cursor:pointer;color:var(--muted)}
.chip[aria-pressed=true]{border-color:var(--blue);background:var(--soft);color:var(--blue-d)}
.guide{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:10px 14px;margin:0 0 12px;font-size:16px}
.msg{padding:10px 14px;border-radius:12px;background:#fff7ed;color:var(--warn);margin:10px 0;font-weight:700;font-size:16px}
.msg:empty{display:none}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:14px 0;box-shadow:0 2px 8px rgba(37,99,235,.06)}
.post h2{margin:0 0 2px;font-size:21px}
.meta{color:var(--muted);font-size:14px;margin-bottom:8px}
.text{white-space:pre-wrap;word-break:break-word;font-size:18px}
.text.big{font-size:26px;line-height:1.5;font-weight:700}
.c-black{color:#111}.c-red{color:#dc2626}.c-blue{color:#2563eb}.c-green{color:#15803d}.c-purple{color:#7e22ce}.c-orange{color:#ea580c}
.emo{font-size:30px;margin:6px 0}
.photo{display:block;max-width:100%;max-height:340px;border-radius:12px;margin:8px 0;object-fit:contain;background:#f3f4f6}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.like{border:2px solid #fbcfe8;background:#fff;color:var(--pink);border-radius:99px;padding:8px 16px;font-size:17px;font-weight:800;cursor:pointer;min-height:44px}
.like[aria-pressed=true]{background:#fdf2f8;border-color:var(--pink)}
.cm{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.cmt{background:#f8fafc;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:16px}
.cmt b.k{display:inline-block;font-size:13px;background:var(--soft);color:var(--blue-d);border-radius:99px;padding:1px 9px;margin-right:6px}
.cmt .w{color:var(--muted);font-size:13px}
.cmt button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 6px}
.kinds button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:15px;font-weight:700;cursor:pointer}
.kinds button[aria-pressed=true]{border-color:var(--blue);background:var(--soft);color:var(--blue-d)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],textarea,select{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:17px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:110px}
.row input[type=text]{flex:1;min-width:0}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#fff;width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px 28px}
.sheet h3{margin:0 0 8px;font-size:21px}
label.l{display:block;font-weight:800;margin:12px 0 4px;font-size:16px}
.radio{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0}
.radio label{display:flex;gap:6px;align-items:center;font-size:17px;font-weight:700}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.colors button[aria-pressed=true]{box-shadow:0 0 0 3px var(--blue)}
.emos{display:flex;gap:6px;flex-wrap:wrap}
.emos button{font-size:26px;border:2px solid var(--line);background:#fff;border-radius:12px;width:48px;height:48px;cursor:pointer}
.prev{border:2px dashed var(--line);border-radius:14px;padding:10px 12px;margin-top:6px;background:#fcfdff}
.rule{background:#fff7ed;border:2px solid #fed7aa;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:16px}
.rule label{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.rule input{width:24px;height:24px;margin-top:2px;flex:none}
.hint{color:var(--muted);font-size:14px}
#fab{position:fixed;right:16px;bottom:18px;z-index:20;box-shadow:0 6px 18px rgba(37,99,235,.35);font-size:19px;padding:14px 22px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<header><div class="in">
  <a class="back" href="education.html">← 교육 도구 모음</a>
  <h1>📮 우리 반 온라인 게시판</h1>
  <p>글을 쓰고, 친구 글에 댓글과 ♥ 공감을 남겨요. 우리 반 친구들만 볼 수 있어요.</p>
</div></header>
<main>
  <div id="login" hidden>
    <div class="post"><h2>먼저 로그인해요</h2><p>우리 반 친구로 로그인해야 게시판을 쓸 수 있어요.</p><button class="btn" id="goLogin" type="button">로그인하러 가기</button></div>
  </div>
  <div id="teacherNote" hidden>
    <div class="post"><h2>선생님 계정이에요</h2><p>게시판은 학생 화면이에요. 글감 만들기·숨기기·삭제는 교사 관리 화면에서 해요.</p><a class="btn" href="classroom/teacher.html" style="display:inline-block;text-decoration:none">🧑‍🏫 교사 관리 화면</a></div>
  </div>
  <div id="app" hidden>
    <div class="chips" id="topics" role="tablist" aria-label="글감"></div>
    <div class="guide" id="guide"></div>
    <div class="msg" id="msg" role="status"></div>
    <div id="feed"></div>
  </div>
</main>
<button class="btn" id="fab" type="button" hidden>✏️ 글쓰기</button>
<div id="sheet" class="sheet" hidden><div id="sheetBox"></div></div>

<script>
const ST_URL='https://erzdvlcbjneabxqwnwfy.supabase.co', ST_KEY='sb_publishable_29w26VjvhHwI5O6iKOXTwA_sSTKUhfz';
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const COLORS=['black','red','blue','green','purple','orange'],COLOR_HEX={black:'#111',red:'#dc2626',blue:'#2563eb',green:'#15803d',purple:'#7e22ce',orange:'#ea580c'};
const EMOJIS=['😀','😢','😮','😍','😡','😴','👍','👏','🎉','❤️','⭐','🎂','🎆','😋','🙏','💪'];
const KINDS=[['question','🙋 질문'],['praise','👏 칭찬'],['thanks','🙏 감사'],['story','💭 나의 경험']];
const KIND_NAME=Object.fromEntries(KINDS.map(k=>[k[0],k[1].slice(2).trim()]));
const ERR={blocked_content:'전화번호·이메일·주소는 쓸 수 없어요. 나를 알아볼 수 있는 정보는 지켜요!',empty:'제목과 내용을 써 주세요.',nick_required:'별명을 적어 주세요.',nick_is_name:'친구 이름이 들어간 별명은 쓸 수 없어요.',bad_photo:'사진을 올리지 못했어요. 다른 사진으로 해 보세요.',too_fast:'조금 천천히 해요.',too_many_posts:'오늘은 더 쓸 수 없어요. 내일 또 써요.',topic_closed:'이 글감은 닫혔어요.',own_post:'내 글에는 ♥를 누를 수 없어요.',forbidden:'내가 쓴 것만 고칠 수 있어요.',login_required:'다시 로그인해 주세요.',session_expired:'다시 로그인해 주세요.',not_approved:'아직 승인되지 않았어요. 선생님께 물어보세요.'};
let session=null,topic=null,topics=[],posts=[],formOpen=false,timer=null;
let myNick='';try{myNick=localStorage.getItem('bd_nick')||''}catch(e){}

function readSession(){try{return JSON.parse(sessionStorage.getItem('st_s')||'null')}catch(e){return null}}
async function jwt(){
  let s=readSession();if(!s||!s.access)return null;
  if(Date.now()>(s.exp||0)-60000){
    s=readSession();
    if(Date.now()>(s.exp||0)-60000){
      const r=await fetch(ST_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:ST_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.access_token)return null;
      s={...s,access:j.access_token,refresh:j.refresh_token||s.refresh,exp:Date.now()+(j.expires_in||3600)*1000};
      try{sessionStorage.setItem('st_s',JSON.stringify(s))}catch(e){}
    }
  }
  return s.access;
}
async function call(body){
  const t=await jwt();if(!t)return{status:401,data:{error:'login_required'}};
  let r;try{r=await fetch(ST_URL+'/functions/v1/board-post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jwt:t,...body})})}catch(e){return{status:0,data:{error:'network'}}}
  let d=null;try{d=await r.json()}catch(e){}return{status:r.status,data:d||{}};
}
const say=t=>{$('msg').textContent=t||''};
const errText=r=>ERR[(r.data||{}).error]||'잠시 뒤에 다시 해 보세요.';
function ago(iso){const m=Math.floor((Date.now()-new Date(iso))/60000);if(m<1)return'방금';if(m<60)return m+'분 전';const h=Math.floor(m/60);if(h<24)return h+'시간 전';return Math.floor(h/24)+'일 전'}

// 사진을 작게 줄인 JPEG 로(가로세로 640px, 200KB 이하). 줄이는 과정에서 위치 정보 등은 사라진다.
function shrink(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=.7,d=c.toDataURL('image/jpeg',q);while(d.length*0.75>190000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('photo'))};img.src=u})}

function paintText(box,p){
  box.className='text c-'+(COLORS.includes(p.color)?p.color:'black')+(p.size==='big'?' big':'');
  box.textContent=p.body;
}

async function load(keep){
  const r=await call({action:'list',topic_id:topic&&topic.id});
  if(r.status!==200){if(r.status===401||r.status===403){showLogin();return}say(errText(r));return}
  topics=r.data.topics||[];topic=r.data.topic;posts=r.data.posts||[];
  drawTopics();drawFeed();
}
function drawTopics(){
  const box=$('topics');box.textContent='';
  topics.forEach(t=>{const b=el('button','chip',(t.open?'':'🔒 ')+t.title);b.type='button';b.setAttribute('aria-pressed',String(topic&&t.id===topic.id));b.onclick=()=>{topic=t;say('');load()};box.append(b)});
  $('guide').textContent=topic?(topic.guide||'친구들과 나누고 싶은 이야기를 써 보세요.')+(topic.open?'':' (이 글감은 닫혀서 읽기만 할 수 있어요.)'):'';
  $('fab').hidden=!topic||!topic.open;
}
function drawFeed(){
  if(formOpen)return;
  const feed=$('feed');feed.textContent='';
  if(!posts.length){const e=el('div','empty');e.append(el('div','','📝'),el('div','','아직 글이 없어요. 첫 글을 써 볼까요?'));feed.append(e);return}
  posts.forEach(p=>feed.append(card(p)));
}
function card(p){
  const c=el('article','post');
  c.append(el('h2','',p.title));
  c.append(el('div','meta',p.author+' · '+ago(p.created)+(p.edited?' · 고쳐 썼어요':'')));
  const tx=el('div');paintText(tx,p);c.append(tx);
  if(p.emojis)c.append(el('div','emo',p.emojis));
  if(p.photo){const im=el('img','photo');im.src=p.photo;im.alt=p.title+' 사진';im.loading='lazy';c.append(im)}
  const bar=el('div','bar');
  const lk=el('button','like','♥ 공감 '+p.likes);lk.type='button';lk.setAttribute('aria-pressed',String(p.liked));
  lk.onclick=async()=>{lk.disabled=true;const r=await call({action:'like',post_id:p.id});lk.disabled=false;if(r.status!==200){say(errText(r));return}say('');load()};
  if(p.mine)lk.disabled=true;
  bar.append(lk);
  if(p.mine){
    const ed=el('button','btn ghost small','✏️ 고쳐 쓰기');ed.type='button';ed.onclick=()=>openForm(p);
    const dl=el('button','btn ghost small','🗑 지우기');dl.type='button';dl.onclick=async()=>{if(!confirm('이 글을 지울까요? 댓글도 함께 지워져요.'))return;const r=await call({action:'delete',id:p.id});if(r.status!==200){say(errText(r));return}say('');load()};
    bar.append(ed,dl);
  }
  c.append(bar);
  const cm=el('div','cm');
  p.comments.forEach(m=>{
    const d=el('div','cmt');d.append(el('b','k',KIND_NAME[m.kind]||''));d.append(document.createTextNode(m.body));
    const w=el('span','w',' — '+m.author+' · '+ago(m.created));d.append(w);
    if(m.mine){const x=el('button','','지우기');x.type='button';x.onclick=async()=>{const r=await call({action:'uncomment',id:m.id});if(r.status===200)load()};d.append(document.createTextNode(' '),x)}
    cm.append(d);
  });
  if(topic&&topic.open)cm.append(commentBox(p));
  c.append(cm);
  return c;
}
function commentBox(p){
  const w=el('div');let kind='praise',asNick=false;
  const ks=el('div','kinds');
  const bs=KINDS.map(([k,l])=>{const b=el('button','',l);b.type='button';b.onclick=()=>{kind=k;bs.forEach((x,i)=>x.setAttribute('aria-pressed',String(KINDS[i][0]===k)))};ks.append(b);return b});
  bs.forEach((x,i)=>x.setAttribute('aria-pressed',String(KINDS[i][0]===kind)));
  const row=el('div','row');const inp=el('input');inp.type='text';inp.maxLength=100;inp.placeholder='댓글 (100자까지) — 글쓴이에게 도움이 되게!';inp.setAttribute('aria-label','댓글');
  const go=el('button','btn small','보내기');go.type='button';
  row.append(inp,go);
  const nm=el('label','hint');const cb=el('input');cb.type='checkbox';cb.style.cssText='width:18px;height:18px;margin-right:6px;vertical-align:middle';nm.append(cb,document.createTextNode('별명으로 쓰기'));
  const nk=el('input');nk.type='text';nk.maxLength=10;nk.placeholder='별명(10자까지)';nk.style.cssText='display:none;margin-top:6px';nk.value=myNick;
  cb.onchange=()=>{asNick=cb.checked;nk.style.display=asNick?'':'none'};
  go.onclick=async()=>{
    const t=inp.value.trim();if(!t){say('댓글을 써 주세요.');return}
    go.disabled=true;
    const r=await call({action:'comment',post_id:p.id,kind,body:t,as:asNick?'nick':'real',nick:nk.value});
    go.disabled=false;
    if(r.status!==200){say(errText(r));return}
    if(asNick){myNick=nk.value.trim();try{localStorage.setItem('bd_nick',myNick)}catch(e){}}
    say('');load();
  };
  w.append(ks,row,nm,nk);
  return w;
}

// ---- 글쓰기 / 고쳐 쓰기 ----
function openForm(edit){
  formOpen=true;
  const f={title:edit?edit.title:'',body:edit?edit.body:'',size:edit?edit.size:'normal',color:edit?edit.color:'black',emojis:edit?edit.emojis:'',photo:null,removePhoto:false,asNick:false,nick:myNick};
  const box=$('sheetBox');box.textContent='';
  box.append(el('h3','',edit?'✏️ 글 고쳐 쓰기':'✏️ 글쓰기'));
  if(edit)box.append(el('div','hint','댓글을 읽고 더 좋게 고쳐 써 봐요. 사진은 그대로 두거나 바꿀 수 있어요.'));
  // 이름
  box.append(el('label','l','글쓴이 이름'));
  const rd=el('div','radio');
  const r1=el('label'),i1=el('input');i1.type='radio';i1.name='nm';i1.checked=true;r1.append(i1,document.createTextNode('내 이름'));
  const r2=el('label'),i2=el('input');i2.type='radio';i2.name='nm';r2.append(i2,document.createTextNode('별명'));
  rd.append(r1,r2);box.append(rd);
  const nk=el('input');nk.type='text';nk.maxLength=10;nk.placeholder='별명(10자까지, 친구 이름은 안 돼요)';nk.value=f.nick;nk.style.display='none';box.append(nk);
  box.append(el('div','hint','별명으로 써도 선생님은 누가 썼는지 알 수 있어요.'));
  i1.onchange=i2.onchange=()=>{f.asNick=i2.checked;nk.style.display=f.asNick?'':'none'};
  // 제목·내용
  box.append(el('label','l','제목'));
  const ti=el('input');ti.type='text';ti.maxLength=30;ti.value=f.title;box.append(ti);
  box.append(el('label','l','내용 (500자까지)'));
  const bd=el('textarea');bd.maxLength=500;bd.value=f.body;box.append(bd);
  // 꾸미기
  box.append(el('label','l','글씨 크기'));
  const sz=el('div','radio');
  const mk=(v,t)=>{const l=el('label'),i=el('input');i.type='radio';i.name='sz';i.checked=f.size===v;i.onchange=()=>{f.size=v;prev()};l.append(i,document.createTextNode(t));sz.append(l)};
  mk('normal','보통');mk('big','크게(강조)');box.append(sz);
  box.append(el('label','l','글씨 색'));
  const cs=el('div','colors');
  COLORS.forEach(c=>{const b=el('button');b.type='button';b.style.background=COLOR_HEX[c];b.setAttribute('aria-label',c);b.setAttribute('aria-pressed',String(f.color===c));b.onclick=()=>{f.color=c;[...cs.children].forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');prev()};cs.append(b)});
  box.append(cs);
  box.append(el('label','l','그림말 (마음을 나타내요, 8개까지)'));
  const es=el('div','emos');
  EMOJIS.forEach(e=>{const b=el('button','',e);b.type='button';b.onclick=()=>{if(Array.from(f.emojis).length<8){f.emojis+=e;prev()}};es.append(b)});
  const ec=el('button','btn ghost small','그림말 지우기');ec.type='button';ec.onclick=()=>{f.emojis='';prev()};
  box.append(es,ec);
  // 사진
  box.append(el('label','l','사진 (선택)'));
  const pr=el('div','row');
  const mkIn=cam=>{const i=el('input');i.type='file';i.accept='image/*';if(cam)i.setAttribute('capture','environment');i.hidden=true;
    i.onchange=async()=>{if(!i.files[0])return;try{f.photo=await shrink(i.files[0]);f.removePhoto=false;pv.src=f.photo;pv.style.display='block';rule.hidden=false}catch(e){say('사진을 읽지 못했어요.')}i.value=''};return i};
  const ci=mkIn(true),gi=mkIn(false);
  const b1=el('button','btn ghost small','📷 사진 찍기');b1.type='button';b1.onclick=()=>ci.click();
  const b2=el('button','btn ghost small','🖼️ 갤러리에서 고르기');b2.type='button';b2.onclick=()=>gi.click();
  const b3=el('button','btn ghost small','사진 빼기');b3.type='button';
  pr.append(b1,b2,b3,ci,gi);box.append(pr);
  const pv=el('img','photo');pv.style.display=edit&&edit.photo?'block':'none';if(edit&&edit.photo)pv.src=edit.photo;pv.alt='';box.append(pv);
  b3.onclick=()=>{f.photo=null;f.removePhoto=!!(edit&&edit.photo);pv.style.display='none';rule.hidden=true;rc.checked=false};
  // 초상권·개인정보 확인
  const rule=el('div','rule');rule.hidden=!(f.photo);
  const rl=el('label'),rc=el('input');rc.type='checkbox';
  rl.append(rc,el('span','','내가 확인했어요: 사진에 친구나 내 얼굴·이름표·교복 이름·전화번호·집 주소가 나오지 않아요. 다른 사람이 나왔다면 허락을 받았어요.'));
  rule.append(rl);box.append(rule);
  // 미리보기
  box.append(el('label','l','미리 보기'));
  const pw=el('div','prev'),pt=el('div','',''),pe=el('div','emo');pw.append(pt,pe);box.append(pw);
  function prev(){paintText(pt,{body:bd.value||'여기에 글이 보여요.',color:f.color,size:f.size});pe.textContent=f.emojis}
  bd.oninput=prev;prev();
  const err=el('div','msg');box.append(err);
  const act=el('div','row');act.style.marginTop='12px';
  const ok=el('button','btn',edit?'고쳐서 올리기':'올리기');ok.type='button';
  const no=el('button','btn ghost','닫기');no.type='button';
  act.append(ok,no);box.append(act);
  const close=()=>{formOpen=false;$('sheet').hidden=true;drawFeed()};
  no.onclick=()=>{if((ti.value||bd.value)&&!edit&&!confirm('쓰던 글이 사라져요. 닫을까요?'))return;close()};
  ok.onclick=async()=>{
    err.textContent='';
    if(!ti.value.trim()||!bd.value.trim()){err.textContent=ERR.empty;return}
    if(f.photo&&!rc.checked){err.textContent='사진 확인(초상권·개인정보)에 체크해 주세요.';rule.scrollIntoView({block:'center'});return}
    if(f.asNick&&!nk.value.trim()){err.textContent=ERR.nick_required;return}
    ok.disabled=true;
    const payload={title:ti.value,body:bd.value,size:f.size,color:f.color,emojis:f.emojis,as:f.asNick?'nick':'real',nick:nk.value};
    if(f.photo)payload.photo=f.photo;
    let r;
    if(edit){payload.action='edit';payload.id=edit.id;if(f.removePhoto)payload.remove_photo=true;r=await call(payload)}
    else{payload.action='post';payload.topic_id=topic.id;r=await call(payload)}
    ok.disabled=false;
    if(r.status!==200){err.textContent=errText(r);return}
    if(f.asNick){myNick=nk.value.trim();try{localStorage.setItem('bd_nick',myNick)}catch(e){}}
    close();say('');load();
  };
  $('sheet').hidden=false;
}

function showLogin(){
  $('app').hidden=true;$('fab').hidden=true;$('login').hidden=false;clearInterval(timer);
}
async function start(){
  const s=readSession();
  if(!s||(!s.access&&!s.teacher)){showLogin();return}
  if(s.teacher){$('teacherNote').hidden=false;return}
  $('login').hidden=true;$('app').hidden=false;
  await load();
  $('fab').onclick=()=>openForm(null);
  timer=setInterval(()=>{if(!formOpen&&!document.hidden)load()},20000);
}
$('goLogin').onclick=()=>{try{sessionStorage.setItem('st_next','board.html')}catch(e){}location.href='school-tool/index.html'};
start();
</script>
</body>
</html>
