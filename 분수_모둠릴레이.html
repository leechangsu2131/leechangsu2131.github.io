<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>분수 모둠 릴레이</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F8FC;--ink:#25324A;--sub:#6B7690;--blue:#3D5A80;--blue-soft:#DCE6F2;--org:#E8873A;--org-soft:#FBE6D2;--ok:#4C8C5C;--ok-soft:#E1F0E3;--bad:#C0503F;--bad-soft:#FAE4E0;--line:#D7E3EE}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Gowun Batang",serif;min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{max-width:900px;margin:0 auto;padding:12px 12px 30px}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:30px;margin:0;color:var(--blue);text-align:center}
.sub{text-align:center;color:var(--sub);font-size:14px;margin:2px 0 10px}
.box{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px 18px;box-shadow:0 3px 14px rgba(61,90,128,.08);margin-bottom:10px}
.btn{font-family:"Jua",sans-serif;font-size:19px;padding:11px 20px;border-radius:14px;border:0;background:var(--blue);color:#fff;cursor:pointer}
.btn.org{background:var(--org)}.btn.ghost{background:var(--blue-soft);color:var(--blue)}.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.t{font-family:"Jua",sans-serif;font-size:17px;color:var(--blue);margin:8px 0 4px}
.opt{display:block;font-size:16px;margin:4px 0;cursor:pointer}.opt input{width:22px;height:22px;vertical-align:middle;margin-right:6px}.opt small{color:var(--sub);font-size:13px}
.hint{font-size:13.5px;color:var(--sub);margin-top:6px;line-height:1.6}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;font-family:"Jua",sans-serif}
.fr .n{border-bottom:3px solid currentColor;padding:0 6px}.fr .d{padding:0 6px}
.mx{display:inline-flex;align-items:center;vertical-align:middle;font-family:"Jua",sans-serif}.mx b{font-weight:400;font-size:1.15em;margin-right:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:"Jua",sans-serif;color:var(--blue);font-size:17px;margin-bottom:6px}
.top b{color:var(--org);font-weight:400;font-size:21px}

.lanes{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.lane{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 10px}
.lane .nm{font-family:"Jua",sans-serif;font-size:18px;width:96px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{flex:1;display:flex;gap:3px;align-items:center;position:relative;height:34px}
.track i{flex:1;height:10px;border-radius:99px;background:#E7EEF5}.track i.on{background:var(--org)}
.runner{position:absolute;top:0;font-size:28px;transition:left .4s;line-height:34px}
.lane .pt{font-family:"Jua",sans-serif;font-size:22px;color:var(--org);width:34px;text-align:right}
.q{background:var(--org-soft);border:3px solid var(--org);border-radius:20px;padding:14px 18px;font-family:"Jua",sans-serif;font-size:30px;text-align:center;line-height:1.7}
.q .big{font-size:36px;color:#b4560f}
.ch{display:grid;gap:12px;margin-top:12px}
.cb{font-family:"Jua",sans-serif;font-size:32px;padding:14px 8px;border-radius:16px;border:3px solid var(--blue);background:#fff;color:var(--ink);min-height:84px;display:flex;align-items:center;justify-content:center;gap:10px}
.cb .no{font-size:24px;color:var(--org)}
.cb.ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 0 0 4px #BFE3C9}
.ans{margin-top:12px;padding:12px;border-radius:16px;background:var(--ok-soft);border:2.5px solid var(--ok);text-align:center;font-family:"Jua",sans-serif;font-size:30px;color:var(--ok)}
.mb{display:inline-flex;flex-direction:column;gap:2px;margin:4px 6px;vertical-align:middle}.mr{display:flex;gap:1px}.mr i{display:block;width:18px;height:14px;border:1.5px solid var(--blue);background:#fff}.mr i.on{background:var(--org);border-color:#c76a22}
.grp{display:inline-flex;flex-wrap:wrap;gap:1px;border:2.5px solid var(--org);border-radius:10px;padding:2px 4px;margin:3px;background:#fff;font-size:24px}
.tm{height:12px;border-radius:99px;background:#E7EEF5;margin-top:10px;overflow:hidden}.tm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#F4B26B,#E8873A)}
.give{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.give .btn{font-size:22px;padding:14px 20px}
.res{text-align:center}.res .big{font-family:"Jua",sans-serif;font-size:36px;color:var(--org)}
.pod{display:flex;gap:8px;align-items:flex-end;justify-content:center;margin:12px 0}
.pod div{background:var(--blue-soft);border-radius:12px 12px 0 0;padding:6px 14px;text-align:center;font-family:"Jua",sans-serif;min-width:90px}
@media (max-height:520px) and (orientation:landscape){.app{padding:4px 8px}h1,.sub{display:none}.lane{padding:2px 8px}.q{font-size:18px;padding:6px}.q .big{font-size:22px}.cb{font-size:20px;min-height:46px;padding:6px}.give .btn{font-size:16px;padding:8px 12px}.box{padding:6px 10px}.ans{font-size:20px;padding:6px;margin-top:6px}.ch{gap:6px;margin-top:6px}}
</style>
</head>
<body>
<div class="app">
  <h1>🏃 분수 모둠 릴레이</h1><p class="sub">선생님 화면에서 진행해요 · 모둠이 답을 정하고, 정답이 공개되면 점수를 줘요</p>
  <div id="main"></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rand(0,a.length-1)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rand(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const mx=(w,n,d)=>`<span class="mx"><b>${w}</b>${fr(n,d)}</span>`;
const QS=new URLSearchParams(location.search);
// 값 표현: {n,d}(진·가분수) 또는 {w,q,d}(대분수)
const num=c=>c.w!==undefined?c.w*c.d+c.q:c.n;
const face=c=>c.w!==undefined?mx(c.w,c.q,c.d):fr(c.n,c.d);
const key=c=>c.w!==undefined?`m${c.w}.${c.q}/${c.d}`:`f${c.n}/${c.d}`;
const asMixed=(n,d)=>n%d===0||n<d?{n,d}:{w:Math.floor(n/d),q:n%d,d};
const asImp=(n,d)=>({n,d});
function barOf(c){ const v=num(c), W=Math.max(1,Math.ceil(v/c.d)); let h='<span class="mb">'; for(let w=0;w<W;w++){ h+='<span class="mr">'; for(let x=0;x<c.d;x++) h+=`<i class="${w*c.d+x<v?'on':''}"></i>`; h+='</span>'; } return h+'</span>'; }
const ITEMS=['🍪','🍓','🍎','🍬','🍊'], INAME=['쿠키','딸기','사과','사탕','귤'];
const dens=()=>opt.hard?[3,4,5,6,7,8,9,10]:[2,3,4,5];
/* ── 문제 만들기 ── */
function genQ(type){
  const D=dens();
  if(type==='cmp'){ const d=pick(D); let a,b; do{ a=rand(1,(opt.hard?3:2)*d-1); b=rand(1,(opt.hard?3:2)*d-1); }while(a===b);
    const f=n=>(n>d&&n%d!==0&&Math.random()<.5)?asMixed(n,d):asImp(n,d); const A=f(a), B=f(b);
    return {type,kind:'cmp',q:'어느 분수가 <span class="big">더 큰가요?</span>',ch:[A,B],ok:a>b?0:1,hintHtml:`${barOf(A)} 와 ${barOf(B)}`}; }
  if(type==='same'){ const d=pick(D); let w=rand(1,opt.hard?3:2), q=rand(1,d-1); const n=w*d+q; const toMixed=Math.random()<.5;
    const ref=toMixed?asImp(n,d):{w,q,d}; const right=toMixed?{w,q,d}:asImp(n,d);
    const wrongs=[]; const cand=[{dq:1},{dq:-1},{dw:1},{dw:-1},{dq:2},{dq:-2}]; shuffle(cand).forEach(c=>{ if(wrongs.length>=2) return; let w2=w+(c.dw||0), q2=q+(c.dq||0); if(q2<1||q2>=d||w2<1) return; if(w2===w&&q2===q) return; const x=toMixed?{w:w2,q:q2,d}:asImp(w2*d+q2,d); if(!wrongs.some(y=>key(y)===key(x))) wrongs.push(x); });
    if(wrongs.length<2) return genQ(type);
    const ch=shuffle([right,...wrongs]); return {type,kind:'same',q:`${face(ref)} 와(과) <span class="big">값이 같은 분수는?</span>`,ch,ok:ch.findIndex(c=>key(c)===key(right)),hintHtml:`${barOf(ref)} (이 분수의 그림이에요)`}; }
  if(type==='line'){ const d=pick(opt.hard?[3,4,5,6]:[2,3,4,5]), W=opt.hard?3:2, n=rand(1,W*d-1); if(n%d===0) return genQ(type);
    const right=asMixed(n,d), cands=[n-1,n+1,n+d,n-d,n+2,n-2].filter(x=>x>0&&x<W*d&&x%d!==0&&x!==n); const ws=shuffle([...new Set(cands)]).slice(0,3); if(ws.length<3) return genQ(type);
    const ch=shuffle([right,...ws.map(x=>asMixed(x,d))]); return {type,kind:'line',d,W,n,q:'<span class="big">▼가 가리키는 분수</span>는 얼마일까요?',ch,ok:ch.findIndex(c=>key(c)===key(right)),hintHtml:`눈금 한 칸은 ${fr(1,d)} 이에요. 0에서 1까지 ${d}칸으로 나뉘어 있어요.`}; }
  // of
  const d=pick(opt.hard?[3,4,5,6,8]:[2,3,4,5]), per=rand(2,opt.hard?6:4), a=rand(1,d-1), total=d*per, it=rand(0,ITEMS.length-1), ans=a*per;
  let ws=new Set(); [ans+per,ans-per,ans+1,ans-1,per,total-ans].forEach(x=>{ if(x>0&&x<total&&x!==ans) ws.add(x); }); ws=shuffle([...ws]).slice(0,3); if(ws.length<3) return genQ(type);
  const ch=shuffle([ans,...ws]); const g=Array.from({length:d},()=>`<span class="grp">${ITEMS[it].repeat(per)}</span>`).join('');
  return {type,kind:'of',q:`${INAME[it]} <span class="big">${total}개</span>의 ${fr(a,d)} 만큼은 <span class="big">몇 개</span>일까요?`,ch,ok:ch.indexOf(ans),hintHtml:`${total}개를 ${d}묶음으로 똑같이 나누면 이렇게 돼요 ${g}`}; }
function numLine(Qn){ const {d,W,n}=Qn, w=Math.min(820,Math.max(300,W*d*46)), pad=22, step=(w-pad*2)/(W*d); let s=`<svg viewBox="0 0 ${w} 84" style="width:100%;max-width:${w}px"><line x1="${pad}" y1="46" x2="${w-pad}" y2="46" stroke="#3D5A80" stroke-width="3"/>`;
  for(let i=0;i<=W*d;i++){ const x=pad+i*step, big=i%d===0; s+=`<line x1="${x}" y1="${46-(big?13:8)}" x2="${x}" y2="${46+(big?13:8)}" stroke="#3D5A80" stroke-width="${big?3:2}"/>`; if(big) s+=`<text x="${x}" y="74" text-anchor="middle" font-family="Jua" font-size="20" fill="#25324A">${i/d}</text>`; }
  const mx_=pad+n*step; s+=`<polygon points="${mx_-9},12 ${mx_+9},12 ${mx_},32" fill="#E8873A"/></svg>`; return s; }

const TYPES={cmp:'크기 비교',same:'같은 값 찾기',line:'수직선 읽기',of:'분수만큼 구하기',conv:'가분수↔대분수 바꾸기'};
let opt={teams:4,goal:8,hard:false,types:{cmp:true,same:true,line:true,of:true,conv:true},time:60,names:['1모둠','2모둠','3모둠','4모둠','5모둠'],pic:false};
let G=null, Q=null, tmr=null, tk=null;
const main=$('main');
const DEF=(Q0)=>Q0;
function genQ2(type){
  if(type!=='conv') return genQ(type);
  const D=opt.hard?[3,4,5,6,7,8]:[2,3,4,5]; const d=pick(D), w=rand(1,opt.hard?4:2), q=rand(1,d-1), n=w*d+q;
  if(Math.random()<.5) return {type,kind:'conv',q:`가분수 ${fr(n,d)} 를 <span class="big">대분수</span>로 나타내면?`,ch:null,ansHtml:mx(w,q,d),hintHtml:barOf({n,d})};
  return {type,kind:'conv',q:`대분수 ${mx(w,q,d)} 를 <span class="big">가분수</span>로 나타내면?`,ch:null,ansHtml:fr(n,d),hintHtml:barOf({n,d})};
}
function chip(g,v,l,cur){ return `<button class="btn ${cur?'org':'ghost'}" data-g="${g}" data-v="${v}" style="font-size:16px;padding:9px 14px">${l}</button>`; }
function home(){
  G=null; Q=null; clearTimeout(tmr); clearInterval(tk);
  main.innerHTML=`<div class="box">
   <div class="t">모둠 수</div><div class="row">${[2,3,4,5].map(n=>chip('teams',n,n+'모둠',opt.teams===n)).join('')}</div>
   <div class="t">모둠 이름 (고쳐 쓸 수 있어요)</div><div class="row">${Array.from({length:opt.teams},(_,i)=>`<input type="text" class="tn" data-i="${i}" value="${opt.names[i]}" style="height:42px;width:120px;border:2px solid var(--blue);border-radius:10px;font-size:16px;padding:0 8px;font-family:inherit;-webkit-user-select:text;user-select:text">`).join('')}</div>
   <div class="t">결승선 (정답을 이만큼 맞히면 도착)</div><div class="row">${[5,8,10].map(n=>chip('goal',n,n+'칸',opt.goal===n)).join('')}</div>
   <div class="t">분수</div><div class="row">${chip('hard',0,'🌱 쉬운 분수만',!opt.hard)}${chip('hard',1,'🌳 어려운 분수도 함께',opt.hard)}</div>
   <div class="t">문제 종류 (하나 이상)</div>${Object.keys(TYPES).map(k=>`<label class="opt"><input type="checkbox" data-t="${k}" ${opt.types[k]?'checked':''}> ${TYPES[k]}</label>`).join('')}
   <div class="t">생각하는 시간</div><div class="row">${chip('time',0,'없음 (선생님이 정해요)',opt.time===0)}${chip('time',30,'30초',opt.time===30)}${chip('time',60,'60초',opt.time===60)}${chip('time',90,'90초',opt.time===90)}</div>
   <label class="opt" style="margin-top:8px"><input type="checkbox" id="pic" ${opt.pic?'checked':''}> 📊 정답을 공개할 때 막대 그림도 함께 보여 주기</label>
   <div class="row" style="margin-top:14px"><button class="btn org" id="go" style="font-size:22px">릴레이 시작! 🏃</button></div><div class="hint" id="msg"></div>
   <div class="hint">진행 방법: ① 문제가 나오면 모둠이 모여 답을 정해요(칠판·학습판에 적기) ② 선생님이 <b>정답 공개</b>를 눌러요 ③ 맞힌 모둠 버튼을 눌러 점수를 줘요(한 칸씩 달려요) ④ <b>다음 문제</b>! 결승선에 먼저 도착하면 우승!</div></div>`;
  main.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{ saveNames(); const g=x.dataset.g, v=+x.dataset.v; opt[g]=(g==='hard')?!!v:v; home(); });
  main.querySelectorAll('[data-t]').forEach(x=>x.onchange=()=>{ opt.types[x.dataset.t]=x.checked; });
  $('pic').onchange=e=>{ opt.pic=e.target.checked; };
  $('go').onclick=()=>{ saveNames(); if(!Object.values(opt.types).some(Boolean)){ $('msg').textContent='문제 종류를 하나 이상 골라 주세요.'; return; } start(); };
}
function saveNames(){ main.querySelectorAll('.tn').forEach(x=>{ opt.names[+x.dataset.i]=x.value.trim()||(+x.dataset.i+1)+'모둠'; }); }
function start(){ G={score:Array(opt.teams).fill(0),given:[],qn:0,last:null,over:false,hist:[]}; next(); }
function next(){
  if(G.score.some(s=>s>=opt.goal)) return end();
  const ts=Object.keys(opt.types).filter(k=>opt.types[k]); let t=pick(ts); if(ts.length>1&&G.last===t) t=pick(ts.filter(x=>x!==t)); G.last=t;
  Q=genQ2(t); Q.shown=false; Q.given=Array(opt.teams).fill(false); G.qn++;
  clearTimeout(tmr); clearInterval(tk); Q.end=0;
  if(opt.time){ Q.dur=(QS.get('tl')?+QS.get('tl'):opt.time)*1000; Q.end=Date.now()+Q.dur; tk=setInterval(()=>{ const f=document.getElementById('tmb'); if(f) f.style.width=Math.max(0,(Q.end-Date.now())/Q.dur*100)+'%'; if(Date.now()>Q.end){ clearInterval(tk); const m=document.getElementById('tmsg'); if(m) m.textContent='⏰ 시간이 다 됐어요! 답을 정해 주세요'; } },200); }
  draw();
}
function lanes(){ return `<div class="lanes">${G.score.map((s,i)=>`<div class="lane"><span class="nm">${opt.names[i]}</span><div class="track">${Array.from({length:opt.goal},(_,k)=>`<i class="${k<s?'on':''}"></i>`).join('')}<span class="runner" style="left:calc(${Math.min(s,opt.goal)/opt.goal*100}% - ${s?28:0}px)">${s>=opt.goal?'🏆':'🏃'}</span></div><span class="pt">${s}</span></div>`).join('')}</div>`; }
function draw(){
  let h=lanes()+`<div class="box"><div style="font-family:Jua;color:var(--blue);margin-bottom:6px">문제 ${G.qn}</div><div class="q">${Q.q}${Q.kind==='line'?`<div style="margin-top:4px">${numLine(Q)}</div>`:''}</div>`;
  if(Q.ch) h+=`<div class="ch" style="grid-template-columns:repeat(2,1fr)">${Q.ch.map((c,i)=>`<div class="cb${Q.shown&&i===Q.ok?' ok':''}"><span class="no">${'①②③④'[i]}</span>${Q.kind==='of'?c+'개':face(c)}</div>`).join('')}</div>`;
  if(Q.shown){ const a=Q.kind==='conv'?Q.ansHtml:null; h+=`<div class="ans">${Q.ch?`정답은 ${'①②③④'[Q.ok]} 번!`:'정답: '+a}${opt.pic?`<div style="margin-top:6px;font-size:20px">${Q.kind==='of'?Q.hintHtml:(Q.kind==='line'?'':(Q.hintHtml||''))}</div>`:''}</div>`; }
  if(opt.time&&!Q.shown) h+=`<div class="tm"><i id="tmb" style="width:${Math.max(0,(Q.end-Date.now())/Q.dur*100)}%"></i></div><div class="hint" id="tmsg" style="text-align:center"> </div>`;
  h+=`<div class="give">`;
  if(!Q.shown) h+=`<button class="btn org" id="rv" style="font-size:24px;padding:14px 26px">정답 공개 ✅</button>`;
  else { h+=opt.names.slice(0,opt.teams).map((n,i)=>`<button class="btn ${Q.given[i]?'ghost':''}" data-team="${i}">${Q.given[i]?'✔ ':''}${n} +1</button>`).join('')+`<button class="btn org" id="nx" style="font-size:22px;padding:14px 24px">다음 문제 👉</button>`; }
  h+=`</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" id="qt" style="font-size:14px;padding:6px 12px">그만하기</button></div></div>`;
  main.innerHTML=h;
}
main.addEventListener('click',e=>{
  if(!G||!Q||G.over) return;
  if(e.target.id==='rv'){ Q.shown=true; clearInterval(tk); draw(); return; }
  if(e.target.id==='nx'){ next(); return; }
  if(e.target.id==='qt'){ if(confirm('릴레이를 그만할까요?')){ clearInterval(tk); home(); } return; }
  const tb=e.target.closest('[data-team]'); if(tb){ const i=+tb.dataset.team; if(Q.given[i]){ Q.given[i]=false; G.score[i]--; } else { Q.given[i]=true; G.score[i]++; } draw(); }
});
document.addEventListener('keydown',e=>{
  if(!G||!Q||G.over) return; if(e.target.tagName==='INPUT') return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(!Q.shown){ Q.shown=true; clearInterval(tk); draw(); } else next(); }
  else if(/^[1-5]$/.test(e.key)&&Q.shown){ const i=+e.key-1; if(i<opt.teams){ if(Q.given[i]){ Q.given[i]=false; G.score[i]--; } else { Q.given[i]=true; G.score[i]++; } draw(); } }
});
function end(){
  G.over=true; clearInterval(tk);
  const order=G.score.map((s,i)=>({i,s})).sort((a,b)=>b.s-a.s), top=order[0].s, winners=order.filter(o=>o.s===top);
  const medal=['🥇','🥈','🥉','4위','5위'];
  main.innerHTML=lanes()+`<div class="box res"><div class="big">🏆 ${winners.map(w=>opt.names[w.i]).join(', ')} 우승!</div><div class="pod">${order.map((o,k)=>`<div style="height:${60+o.s*6}px">${medal[k]}<br>${opt.names[o.i]}<br>${o.s}칸</div>`).join('')}</div><div class="hint">총 ${G.qn}문제를 풀었어요. 모두 수고했어요! 👏</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn org" id="again">같은 설정으로 다시</button><button class="btn ghost" id="hm">설정 바꾸기</button></div></div>`;
  $('again').onclick=start; $('hm').onclick=home;
}
window.__rl={get G(){return G;},get Q(){return Q;},get opt(){return opt;}};
home();
})();
</script>
