<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9C%96%EF%B8%8F</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>두 자리 수 곱셈 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7EF;
    --panel:#FFFFFF;
    --ink:#25324A;
    --sub:#6B7690;
    --tens:#3D5A80;
    --tens-soft:#DCE6F2;
    --ones:#E8873A;
    --ones-soft:#FBE6D2;
    --correct:#4C8C5C;
    --correct-soft:#E1F0E3;
    --wrong:#C0503F;
    --wrong-soft:#FAE4E0;
    --hundreds:#8B5FBF;
    --hundreds-soft:#EDE3F7;
    --line:#E4DCC9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Gowun Batang", serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .app{ width:100%; max-width:620px; }

  header{ text-align:center; margin-bottom:22px; }
  h1{
    font-family:"Jua", sans-serif;
    font-weight:400;
    font-size:30px;
    margin:0 0 4px;
    color:var(--tens);
    letter-spacing:0.5px;
  }
  .subtitle{
    color:var(--sub);
    font-size:14.5px;
    margin:0;
  }

  .stats{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:16px 0 20px;
  }
  .chip{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 16px;
    font-size:13.5px;
    color:var(--sub);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chip b{ color:var(--ink); font-family:"Jua",sans-serif; font-weight:400; font-size:15px;}

  .tabs{
    display:flex;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    margin-bottom:20px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 6px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    color:var(--sub);
    transition:background .15s, color .15s;
    user-select:none;
  }
  .tab .tnum{ font-family:"Jua",sans-serif; display:block; font-size:11.5px; margin-bottom:2px; opacity:.7;}
  .tab.active{ background:var(--tens); color:#fff; }
  .tab.active .tnum{ opacity:.85; }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px 22px 26px;
    box-shadow:0 2px 0 var(--line);
  }

  .problem-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:14px;
    font-family:"Jua", sans-serif;
    font-size:40px;
    margin-bottom:22px;
    color:var(--ink);
  }
  .problem-row .op{ color:var(--sub); font-size:30px; }
  .factor-a{ color:var(--tens); }
  .factor-b{ color:var(--ones); }

  /* Area model grid (Iconic 표상) */
  .grid-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
    user-select:none;
  }
  svg text{ font-family:"Jua", sans-serif; pointer-events:none; }
  .area-rect{ transition: filter .12s, transform .12s; }
  .area-rect:hover rect{ filter: brightness(0.95); }
  .area-rect.active rect{
    stroke: var(--ones) !important;
    stroke-width: 3.5px !important;
    filter: drop-shadow(0 2px 5px rgba(232,135,58,0.28));
  }
  .hint-wrap{ margin-bottom: 8px; }

  .partials{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .partial-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
    font-size:16px;
  }
  .partial-row .label{ color:var(--sub); font-size:14px; }
  .partial-row .expr{ font-family:"Jua",sans-serif; font-size:17px; }
  .partial-row input{
    width:84px;
    text-align:center;
    font-family:"Jua", sans-serif;
    font-size:18px;
    padding:8px 6px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .partial-row input:focus{ outline:none; border-color:var(--tens); }
  .partial-row.correct{ background:var(--correct-soft); border-color:var(--correct); }
  .partial-row.wrong{ background:var(--wrong-soft); border-color:var(--wrong); }

  .sum-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    border-top:2px dashed var(--line);
    padding-top:16px;
    margin-bottom:10px;
    font-family:"Jua", sans-serif;
    font-size:22px;
  }
  .sum-row input{
    width:120px;
    text-align:center;
    font-family:"Jua", sans-serif;
    font-size:24px;
    padding:10px 6px;
    border-radius:10px;
    border:2px solid var(--line);
  }
  .sum-row input:focus{ outline:none; border-color:var(--tens); }

  .vtable td.opnum{
    font-family:"Jua", sans-serif;
    font-size:26px;
    color:var(--tens);
    padding-top:4px;
  }
  .vtable td.opnum.multiplier{ color:var(--ones); }
  .vtable td.optimes{
    font-family:"Jua", sans-serif;
    font-size:22px;
    color:var(--ones);
  }
  .vtable-hr{ border-top:3px solid var(--ink); margin:2px 4px 0; }

  /* real <table> so column widths are guaranteed identical across every row by the browser */
  .vtable{
    border-collapse:collapse;
    margin:0 auto 18px;
    table-layout:fixed;
  }
  .vtable col{ width:44px; }
  .vtable td{
    text-align:center;
    vertical-align:middle;
    height:38px;
    padding:2px 1px;
  }
  .vtable td:not(:first-child){ border-left:1px dashed var(--line); }
  .vtable tr.vheader td{
    font-family:"Gowun Batang", serif;
    font-size:12.5px;
    color:var(--sub);
    height:20px;
    border-left:none !important;
  }
  .vtable col.labelcol{ width:150px; }
  .vtable td.row-label-side{
    font-size:13px;
    color:var(--sub);
    text-align:left;
    padding-left:12px;
    border-left:none !important;
    cursor:pointer;
    user-select:none;
    border-radius:8px;
    transition:background .12s, color .12s;
  }
  .vtable td.row-label-side:hover{ background:var(--paper); }
  .vtable td.row-label-side.active{ color:var(--tens); font-weight:bold; background:var(--tens-soft); }
  .vtable td.opnum.hl-target{ transition:background .15s, box-shadow .15s; border-radius:6px; }
  .vtable td.opnum.hl-target.hl-active{
    background:var(--tens-soft);
    box-shadow:0 0 0 2px var(--tens-soft);
  }
  .vtable td input{
    width:38px; height:34px;
    text-align:center;
    font-family:"Jua", sans-serif;
    font-size:18px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .vtable td input:focus{ outline:none; border-color:var(--tens); }
  .vtable td.wrong input{ border-color:var(--wrong) !important; background:var(--wrong-soft) !important; }
  .vtable td.correct input{ border-color:var(--correct) !important; background:var(--correct-soft) !important; }
  .vtable td.carry input{
    width:26px; height:26px;
    font-size:13px;
    border-radius:50%;
    border:1.5px dashed var(--ones);
    color:var(--ones);
    background:var(--ones-soft);
  }

  .answer-only{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:18px;
  }
  .answer-only input{
    width:150px;
    text-align:center;
    font-family:"Jua", sans-serif;
    font-size:30px;
    padding:14px 8px;
    border-radius:14px;
    border:2px solid var(--line);
  }
  .answer-only input:focus{ outline:none; border-color:var(--tens); }
  .answer-only .eq{ font-family:"Jua",sans-serif; font-size:26px; color:var(--sub); }

  .actions{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:6px;
  }
  button{
    font-family:"Jua", sans-serif;
    font-size:15.5px;
    border:none;
    border-radius:12px;
    padding:12px 22px;
    cursor:pointer;
    transition:transform .08s, opacity .15s;
  }
  button:active{ transform:scale(0.97); }
  .btn-check{ background:var(--tens); color:#fff; }
  .btn-next{ background:var(--ink); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--sub); border:1.5px solid var(--line); }
  button:disabled{ opacity:.4; cursor:default; }

  .feedback{
    text-align:center;
    margin-top:16px;
    font-size:15px;
    min-height:24px;
    color:var(--sub);
  }
  .feedback.good{ color:var(--correct); font-family:"Jua",sans-serif; }
  .feedback.bad{ color:var(--wrong); font-family:"Jua",sans-serif; }

  .explain{
    margin-top:14px;
    background:var(--tens-soft);
    border-radius:12px;
    padding:12px 16px;
    font-size:14.5px;
    color:var(--ink);
    line-height:1.7;
    display:none;
  }
  .explain.show{ display:block; }

  .timer{
    text-align:center;
    color:var(--sub);
    font-size:13.5px;
    margin-bottom:14px;
  }

  footer{
    text-align:center;
    color:var(--sub);
    font-size:12.5px;
    margin-top:26px;
    line-height:1.7;
  }

  @media (max-width:420px){
    h1{ font-size:25px; }
    .problem-row{ font-size:32px; }
    .card{ padding:18px 14px 20px; }
    .answer-only input{ width:120px; font-size:26px; }
    .tab{ font-size:12px; padding:9px 3px; }
    .tab .tnum{ font-size:10.5px; }
  }

  /* 학생 정보 & 결과 제출 */
  .who-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .who-card label{
    font-size:13.5px;
    color:var(--sub);
    white-space:nowrap;
  }
  .who-card input{
    font-family:"Gowun Batang", serif;
    font-size:15px;
    padding:9px 10px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .who-card input:focus{ outline:none; border-color:var(--tens); }
  .who-card input.who-num{ width:64px; flex:none; text-align:center; }
  .who-card input.who-name{ flex:1; min-width:140px; }

  .submit-bar{
    display:flex;
    justify-content:center;
    margin:18px 0 6px;
  }
  .btn-submit{
    font-family:"Jua", sans-serif;
    font-size:15.5px;
    border:none;
    border-radius:12px;
    padding:13px 26px;
    cursor:pointer;
    background:var(--correct);
    color:#fff;
    transition:transform .08s, opacity .15s;
  }
  .btn-submit:active{ transform:scale(0.97); }
  .btn-submit:disabled{ opacity:.45; cursor:default; }

  .submit-status{
    text-align:center;
    margin-top:10px;
    font-size:14px;
    min-height:20px;
  }
  .submit-status.ok{ color:var(--correct); }
  .submit-status.err{ color:var(--wrong); }
  .submit-status.pending{ color:var(--sub); }

  /* 종합 테스트용 메모장(그림판) */
  .scratchpad-wrap{
    margin:16px auto 4px;
  }
  .scratchpad-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .scratchpad-header span{
    font-size:13px;
    color:var(--sub);
  }
  .btn-clear-pad{
    font-family:"Gowun Batang", serif;
    font-size:12.5px;
    padding:6px 12px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--sub);
    cursor:pointer;
  }
  .btn-clear-pad:active{ transform:scale(0.96); }
  #scratchCanvas{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:600/520;
    border:1.5px dashed var(--line);
    border-radius:14px;
    background:#fff;
    touch-action:none;
    cursor:crosshair;
  }

  /* 안내 가이드 */
  /* 자기 진단 화면 */
  .assess-box{
    background:var(--panel);
    border:1.5px solid var(--line);
    border-radius:18px;
    padding:20px 18px;
    text-align:center;
  }
  .assess-title{
    font-family:"Jua", sans-serif;
    font-size:16px;
    color:var(--ink);
    margin-bottom:6px;
  }
  .assess-q{
    font-size:14px;
    color:var(--sub);
    margin-bottom:16px;
  }
  .assess-btn{
    display:flex;
    flex-direction:column;
    width:100%;
    font-family:"Gowun Batang", serif;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:10px;
    cursor:pointer;
    text-align:left;
    transition:border-color .15s, transform .08s;
  }
  .assess-btn:last-child{ margin-bottom:0; }
  .assess-btn:active{ transform:scale(0.98); }
  .assess-btn:hover{ border-color:var(--tens); }
  .assess-btn-main{
    font-family:"Jua", sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  .assess-btn-sub{
    font-size:12.5px;
    color:var(--sub);
    margin-top:2px;
  }

  /* 현재 단계 표시 (자동 진행, 클릭 불가) */
  .level-indicator{
    text-align:center;
    font-size:12.5px;
    color:var(--sub);
    margin-bottom:6px;
  }

  /* ── E·I 단계: 수모형 조작 패널 ── */
  .manip-panel{
    margin:2px 0 16px;
  }
  .manip-toggle{
    display:block;
    width:100%;
    font-family:"Jua", sans-serif;
    font-size:14px;
    color:var(--tens);
    background:var(--tens-soft);
    border:1.5px solid #C7D9EC;
    border-radius:12px;
    padding:10px 12px;
    cursor:pointer;
    text-align:center;
  }
  .manip-toggle:active{ transform:scale(0.99); }
  .manip-body{
    margin-top:10px;
    border:1.5px solid var(--line);
    background:#FCFBF6;
    border-radius:14px;
    padding:14px;
  }
  .manip-desc{
    font-size:13.5px;
    color:var(--ink);
    text-align:center;
    margin-bottom:10px;
  }
  .manip-desc b{ color:var(--tens); }
  .manip-empty{
    text-align:center;
    font-size:13px;
    color:var(--sub);
    padding:10px 0;
  }
  .manip-groups{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:4px;
  }
  .manip-group{
    border:1.5px dashed var(--line);
    border-radius:10px;
    background:#fff;
    padding:6px 7px;
    max-width:150px;
  }
  .manip-group-label{
    font-size:11px;
    color:var(--sub);
    text-align:center;
    margin-bottom:5px;
  }
  .manip-group-blocks{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    justify-content:center;
    min-height:26px;
  }
  .manip-board-label{
    font-size:12px;
    color:var(--sub);
    margin:10px 0 4px;
    text-align:center;
  }
  .manip-board-label small{
    color:var(--tens);
    font-size:11px;
  }
  .manip-empty-hint{
    font-size:12.5px;
    color:var(--sub);
    padding:6px 0;
  }
  .manip-canvas{
    position:relative;
    height:260px;
    border:1.5px dashed var(--line);
    border-radius:10px;
    background:#fff;
    overflow:hidden;
    touch-action:none;
  }
  .manip-canvas .manip-empty-hint{
    position:absolute;
    top:44%; left:50%;
    transform:translateX(-50%);
  }
  .manip-block.btb-block{
    position:absolute;
    margin:0;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
    transition: left .1s ease-out, top .1s ease-out, box-shadow .15s, border-color .15s, background .15s;
  }
  .manip-block.btb-block.manip-dragging{
    cursor:grabbing;
    z-index:50;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
    transform:scale(1.15);
    transition: box-shadow .15s, border-color .15s, background .15s; /* 드래그 중엔 위치는 즉시 반응(자석처럼 착 붙는 느낌) */
  }
  .manip-block.btb-block.manip-clustering{
    border-color:var(--ones) !important;
    background:var(--ones-soft) !important;
    box-shadow:0 0 0 2px var(--ones);
  }
  .manip-block.btb-block.manip-clustering-ready{
    border-color:#D9A400 !important;
    background:#FFF3C4 !important;
    box-shadow:0 0 0 3px #D9A400;
    animation:manipReadyPulse .6s ease-in-out infinite;
  }
  @keyframes manipReadyPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
  }
  .manip-board{
    min-height:70px;
    max-height:230px;
    overflow-y:auto;
    background:#fff;
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:8px;
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:4px;
  }
  .manip-rod{
    height:22px; width:78px;
    border:2px solid var(--tens);
    background:repeating-linear-gradient(90deg, var(--tens-soft) 0 8px, #fff 8px 10px);
    border-radius:5px;
    flex:none;
  }
  .manip-unit{
    height:22px; width:22px;
    border:2px solid var(--correct);
    background:var(--correct-soft);
    border-radius:5px;
    flex:none;
  }
  .manip-hundred{
    height:84px; width:84px;
    border:2px solid var(--hundreds);
    background:
      repeating-linear-gradient(0deg, var(--hundreds-soft) 0 7px, #fff 7px 9px),
      repeating-linear-gradient(90deg, var(--hundreds-soft) 0 7px, transparent 7px 9px);
    border-radius:6px;
    flex:none;
  }
  .manip-confirm{
    position:absolute;
    transform:translate(-50%,-50%);
    background:#fff;
    border:2px solid var(--tens);
    border-radius:12px;
    padding:10px 12px;
    box-shadow:0 6px 16px rgba(0,0,0,.18);
    text-align:center;
    z-index:80;
    width:160px;
  }
  .manip-confirm-text{
    font-size:12.5px;
    color:var(--ink);
    margin-bottom:8px;
    line-height:1.4;
  }
  .manip-confirm-btns{
    display:flex;
    gap:6px;
    justify-content:center;
  }
  .manip-confirm-btns button{
    font-family:"Gowun Batang", serif;
    font-size:12px;
    padding:6px 9px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:#fff;
    cursor:pointer;
  }
  .manip-confirm-yes{
    background:var(--correct) !important;
    color:#fff;
    border-color:var(--correct) !important;
  }
  .manip-count{
    text-align:center;
    font-size:12.5px;
    color:var(--sub);
    margin-top:8px;
  }
  .manip-tools{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    margin-top:12px;
  }
  .manip-tools button{
    font-family:"Gowun Batang", serif;
    font-size:12.5px;
    padding:7px 10px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .manip-tools button:disabled{ opacity:.4; cursor:not-allowed; }
  .manip-tools button.primary{ background:var(--tens); color:#fff; border-color:var(--tens); }

  /* 종합 테스트 후 결과 제출 영역 */
  .result-block{
    margin-top:4px;
  }
  .result-title{
    font-family:"Jua", sans-serif;
    font-size:14.5px;
    color:var(--ink);
    text-align:center;
    margin-bottom:12px;
  }

  /* ── 3학년용 즉시 힌트 / 현재 할 일 ── */
  .learning-hint{
    margin:0 auto 18px;

<body>
<div class="app">
  <header>
    <h1>두 자리 수 곱셈 연습</h1>
    <p class="subtitle">3학년 2학기 · 부분곱으로 차근차근 곱셈을 익혀요</p>
  </header>

  <div class="assess-box" id="assessScreen">
    <div class="assess-title">🙋 시작하기 전에 하나만 물어볼게요</div>
    <div class="assess-q">두 자리 수 곱셈, 지금 어느 정도 할 수 있을 것 같아요?</div>
    <button class="assess-btn" data-start-level="1">
      <span class="assess-btn-main">아직 어려워요</span>
      <span class="assess-btn-sub">몇십 곱하기부터 차근차근</span>
    </button>
    <button class="assess-btn" data-start-level="2">
      <span class="assess-btn-main">두 자리끼리도 할 수 있어요</span>
      <span class="assess-btn-sub">부분곱은 자신 있어요</span>
    </button>
    <button class="assess-btn" data-start-level="3">
      <span class="assess-btn-main">받아올림도 자신 있어요</span>
      <span class="assess-btn-sub">세로셈까지 문제없어요</span>
    </button>
  </div>

  <div class="stats" id="statsBar" style="display:none;">
    <div class="chip">맞힌 문제 <b id="statScore">0</b></div>
    <div class="chip">연속 정답 <b id="statStreak">0</b></div>
  </div>

  <div class="card" id="card" style="display:none;">
    <div class="level-indicator" id="levelIndicator"></div>
    <div class="problem-row" id="problemRow"></div>

    <div class="grid-wrap" id="gridWrap"></div>
    <div class="hint-wrap" id="hintWrap"></div>

    <div class="manip-panel" id="manipPanel" style="display:none;">
      <button type="button" class="manip-toggle" id="manipToggle">🧱 수모형으로 확인하기</button>
      <div class="manip-body" id="manipBody" style="display:none;">
        <div class="manip-desc" id="manipDesc"></div>
        <div id="manipContent"></div>
        <div class="manip-board-wrap" id="manipBoardWrap" style="display:none;">
          <div class="manip-board-label">모형판 <small>— 손가락(마우스)으로 자유롭게 옮기고, 필요한 만큼 직접 만들어보세요</small></div>
          <div class="manip-canvas" id="manipBoardEl"></div>

          <div class="manip-tools">
            <button type="button" id="manipAddOne">+ 낱개 1개</button>

          </div>
          <div class="manip-tools">
            <button type="button" id="manipExchangeUp">낱개 10개 → 십 모형 1개로 교환</button>
            <button type="button" id="manipExchangeUpTen">십 모형 10개 → 백 모형 1개로 교환</button>
            <button type="button" id="manipUndo">되돌리기</button>
            <button type="button" id="manipReset">모형판 비우기</button>
          </div>
          <div class="manip-tools" style="margin-top:4px;">
            <button type="button" id="manipNextStep" class="primary" style="display:none;">✅ 확인했어요, 다음 단계로 →</button>

    <div id="scaffoldArea"></div>

  <div class="result-block" id="resultBlock" style="display:none;">

    <div class="who-card">
      <label for="numInput">번호</label>
      <input type="number" id="numInput" inputmode="numeric" min="1" max="19" placeholder="예: 3" class="who-num" />
      <label for="nameInputField">이름</label>
      <input type="text" id="nameInputField" placeholder="본인 이름을 정확히 입력하세요" class="who-name" />
    </div>
    <div class="submit-bar" id="submitBar">
      <button class="btn-submit" id="btnSubmit" disabled>내 결과 선생님께 제출하기</button>
    </div>
    <div class="submit-status" id="submitStatus"></div>
  </div>

  <footer>화천초등학교 3학년 2반 · 두 자리 수 곱셈 연습</footer>

<script>
(function(){
  const assessScreen = document.getElementById('assessScreen');
  const statsBar = document.getElementById('statsBar');
  const card = document.getElementById('card');
  const levelIndicator = document.getElementById('levelIndicator');
  const resultBlock = document.getElementById('resultBlock');
  const problemRow = document.getElementById('problemRow');
  const gridWrap = document.getElementById('gridWrap');
  const hintWrap = document.getElementById('hintWrap');
  const scaffoldArea = document.getElementById('scaffoldArea');
  const btnCheck = document.getElementById('btnCheck');
  const btnNext = document.getElementById('btnNext');
  const btnReset = document.getElementById('btnReset');
  const feedback = document.getElementById('feedback');
  const explain = document.getElementById('explain');
  const statScore = document.getElementById('statScore');
  const statStreak = document.getElementById('statStreak');
  const numInput = document.getElementById('numInput');
  const nameInputField = document.getElementById('nameInputField');
  const btnSubmit = document.getElementById('btnSubmit');
  const submitStatus = document.getElementById('submitStatus');
  const submitBar = document.getElementById('submitBar');

  let level = 1;
  let score = 0;
  let streak = 0;
  let attempts = 0;
  let problem = null;
  let checked = false;
  let lastCorrect = false;   // 방금 문제를 맞혔는지 (자동 다음 단계 판단용)

  const LEVEL_NAME = { 1:'1단계 · (두 자리 수)×(몇십)', 2:'2단계 · (두 자리 수)×(두 자리 수)', 3:'3단계 · 세로셈·받아올림' };

  // ── E·I 단계: 수모형 조작 패널 상태 ──
  const manipPanel = document.getElementById('manipPanel');
  const manipToggle = document.getElementById('manipToggle');
  const manipBody = document.getElementById('manipBody');
  const manipDesc = document.getElementById('manipDesc');
  const manipContent = document.getElementById('manipContent');

  // ── 학생 명단 (번호 순서 = DB 등록 기준 이름) ──
  const ROSTER = [
    '강시우','김가을','김동규','김주안','박민서','박서우','박현규','백다온',
    '오지윤','이서우','이예나','이윤슬','정두영','조주아','천선율','한예기',
    '황보검','최윤채','박선우'
  ];

  function updateSubmitEnabled(){
    btnSubmit.disabled = !(numInput.value.trim() && nameInputField.value.trim());
  }
  numInput.addEventListener('input', updateSubmitEnabled);
  nameInputField.addEventListener('input', updateSubmitEnabled);

  // ── 4단계 종합 테스트 모드 상태 ──
  const TEST_TOTAL = 10;
  let testIndex = 0;
  let testProblem = null;
  let testResults = [];

  // ── Supabase 저장 설정 ──
  const SUPABASE_URL = 'https://erzdvlcbjneabxqwnwfy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_29w26VjvhHwI5O6iKOXTwA_sSTKUhfz';
  const LEVEL_LABEL = { 1:'1단계((두자리)×(몇십))', 2:'2단계((두자리)×(두자리))', 3:'3단계(세로셈·받아올림)' };

  function todayStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  // 번호+이름이 명단과 정확히 일치하는지 확인. 불일치 시 이름 필드는 '미분류'로
  // 저장하고, 학생이 실제 입력한 값은 내용 앞부분에 그대로 남겨 나중에 한 번에
  // 모아 확인할 수 있게 한다 ('🧑‍🎓 이름' = '미분류' 로 검색하면 전부 모임).
  function resolveStudent(){
    const numRaw = numInput.value.trim();
    const nameRaw = nameInputField.value.trim();
    const num = parseInt(numRaw, 10);
    const matched = (num >= 1 && num <= ROSTER.length && ROSTER[num-1] === nameRaw);
    return {
      valid: !!(numRaw && nameRaw),
      matched,
      recordName: matched ? ROSTER[num-1] : '미분류',
      noteIfMismatch: matched ? '' : `[확인필요 · 학생 입력: 번호 ${numRaw || '?'} / 이름 ${nameRaw || '?'}] `
    };
  }

  async function submitResult(){
    const who = resolveStudent();
    if(!who.valid){
      submitStatus.textContent = '먼저 내 번호와 이름을 입력해주세요.';
      submitStatus.className = 'submit-status err';
      return;
    }

    let record;
    if(level === 4){
      if(testResults.length < TEST_TOTAL){
        submitStatus.textContent = '4단계 테스트를 끝까지 풀고 제출해주세요.';
        submitStatus.className = 'submit-status err';
        return;
      }
      const correctCount = testResults.filter(r=>r.correct).length;
      const rate = Math.round((correctCount/TEST_TOTAL)*100);
      const 긍정도 = rate >= 80 ? '긍정✅' : (rate >= 50 ? '중립📋' : '관찰필요🔍');
      const detail = testResults.map((r,i)=>{
        const ua = (r.userAnswer===null || isNaN(r.userAnswer)) ? '미입력' : r.userAnswer;
        return `${i+1})${r.a}×${r.b}=${r.total} ${r.correct ? '정답' : `오답(입력:${ua})`}`;
      }).join(', ');
      record = {
        '기록제목': '두 자리수 곱셈 종합 테스트(4단계) 결과',
        '날짜': todayStr(),
        '분야': '학습능력',
        '긍정도': 긍정도,
        '출처': '학생직접제출',
        '과목': '수학',
        '내용': `${who.noteIfMismatch}1~3단계 문제가 섞인 종합 테스트 ${TEST_TOTAL}문제 중 ${correctCount}문제 정답(정답률 ${rate}%). 세부: ${detail}`,
        '🧑‍🎓 이름': who.recordName
      };
    } else {
      if(attempts === 0){
        submitStatus.textContent = '문제를 최소 1개 이상 풀고 제출해주세요.';
        submitStatus.className = 'submit-status err';
        return;
      }
      const rate = Math.round((score/attempts)*100);
      const 긍정도 = rate >= 80 ? '긍정✅' : (rate >= 50 ? '중립📋' : '관찰필요🔍');
      record = {
        '기록제목': '두 자리수 곱셈 연습 결과',
        '날짜': todayStr(),
        '분야': '학습능력',
        '긍정도': 긍정도,
        '출처': '학생직접제출',
        '과목': '수학',
        '내용': `${who.noteIfMismatch}${LEVEL_LABEL[level]} 기준, 총 ${attempts}문제 중 ${score}문제를 맞혀 정답률 ${rate}%를 기록함. 최고 연속 정답 ${streak}회.`,
        '🧑‍🎓 이름': who.recordName
      };
    }

    btnSubmit.disabled = true;
    submitStatus.textContent = '제출 중...';
    submitStatus.className = 'submit-status pending';

    try{
      if(navigator.onLine === false){
        throw new Error('오프라인(navigator.onLine=false)');
      }
      const res = await fetch(`${SUPABASE_URL}/rest/v1/class-manage`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(record)
      });
      if(!res.ok){
        let bodyText = '';
        try{ bodyText = await res.text(); }catch(e){}
        throw new Error(`HTTP ${res.status} ${bodyText}`.trim());
      }
      submitStatus.textContent = who.matched
        ? `제출 완료! 결과가 선생님께 전달되었어요.`
        : `제출 완료! (번호·이름이 명단과 달라 '미분류'로 저장했어요. 선생님께 확인을 부탁드리세요.)`;
      submitStatus.className = 'submit-status ok';
    } catch(err){
      submitStatus.textContent = `제출에 실패했어요. 인터넷 연결을 확인하고 다시 눌러주세요. (오류: ${err.message})`;
      submitStatus.className = 'submit-status err';
    } finally {
      updateSubmitEnabled();
    }
  }

  btnSubmit.addEventListener('click', submitResult);

  const PRAISE = ["참 잘했어요!","정확해요!","실력이 늘고 있어요!","완벽해요!","멋져요!","최고예요!"];
  const NUDGE = ["다시 한 번 살펴볼까요?","괜찮아요, 부분곱을 다시 확인해요.","조금만 더 생각해봐요.","천천히 다시 계산해볼까요?"];

  function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function genProblem(lv){
    let a, b;
    if(lv === 1){
      a = rand(12, 89);
      b = rand(2, 9) * 10; // 몇십
    } else if(lv === 2){
      a = rand(11, 99);
      b = rand(11, 99);
    } else {
      // level 3 (vertical + carrying) needs a meaningful two-row split, so b must not be a multiple of ten
      do {
        a = rand(11, 99);
        b = rand(11, 99);
      } while (b % 10 === 0);
    }
    const a10 = Math.floor(a/10)*10, a1 = a%10;
    const b10 = Math.floor(b/10)*10, b1 = b%10;
    return {
      a, b, a10, a1, b10, b1,
      p1: a10*b10, // tens x tens
      p2: a10*b1,  // tens x ones
      p3: a1*b10,  // ones x tens
      p4: a1*b1,   // ones x ones
      vOnes: a*b1, // full a x ones digit of b (vertical algorithm, row 1)
      vTens: a*b10, // full a x tens value of b (vertical algorithm, row 2)
      total: a*b
    };
  }

  function fmt(n){ return n.toLocaleString('ko-KR'); }

  function drawGrid(p, activeGroup){
    // scaled (not literal) widths so both digits stay legible
    const wTens = 118, wOnes = p.b1 > 0 ? 58 : 0;
    const hTens = 92, hOnes = p.a1 > 0 ? 50 : 0;
    const gap = 3;
    const totalW = wTens + (wOnes ? gap+wOnes : 0);
    const totalH = hTens + (hOnes ? gap+hOnes : 0);
    const svgW = totalW + 70, svgH = totalH + 46;
    const ox = 56, oy = 10;

    function rect(x,y,w,h,fill,label,key){
      if(w<=0||h<=0) return '';
      const isGroup1 = (key === 'tens-ones' || key === 'ones-ones');
      const isGroup2 = (key === 'tens-tens' || key === 'ones-tens');
      const isHl = (activeGroup === 1 && isGroup1) || (activeGroup === 2 && isGroup2);
      const stroke = isHl ? 'var(--ones)' : '#fff';
      const strokeW = isHl ? '3.5' : '2';
      return `<g class="area-rect ${isHl ? 'active' : ''}" data-key="${key}" style="cursor:pointer;">
        <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}"/>
        <text x="${x+w/2}" y="${y+h/2+6}" font-size="16" text-anchor="middle" fill="#25324A" font-weight="${isHl ? 'bold' : 'normal'}">${label}</text>
      </g>`;
    }

    let svg = `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}">`;
    // top axis labels (b10 / b1)
    svg += `<text x="${ox+wTens/2}" y="${oy-2}" font-size="14" text-anchor="middle" fill="#E8873A">${p.b10}</text>`;
    if(wOnes) svg += `<text x="${ox+wTens+gap+wOnes/2}" y="${oy-2}" font-size="14" text-anchor="middle" fill="#E8873A">${p.b1}</text>`;
    // left axis labels (a10 / a1)
    svg += `<text x="${ox-10}" y="${oy+hTens/2+5}" font-size="14" text-anchor="end" fill="#3D5A80">${p.a10}</text>`;
    if(hOnes) svg += `<text x="${ox-10}" y="${oy+hTens+gap+hOnes/2+5}" font-size="14" text-anchor="end" fill="#3D5A80">${p.a1}</text>`;

    svg += rect(ox, oy, wTens, hTens, '#DCE6F2', fmt(p.p1), 'tens-tens');
    if(wOnes) svg += rect(ox+wTens+gap, oy, wOnes, hTens, '#F2E3CE', fmt(p.p2), 'tens-ones');
    if(hOnes) svg += rect(ox, oy+hTens+gap, wTens, hOnes, '#F2E3CE', fmt(p.p3), 'ones-tens');
    if(wOnes && hOnes) svg += rect(ox+wTens+gap, oy+hTens+gap, wOnes, hOnes, '#FBE6D2', fmt(p.p4), 'ones-ones');
    svg += `</svg>`;
    return svg;
  }

  // ══════════════════════════════════════════════════════════════
  // BaseTenBoard — 문제·화면과 완전히 독립된 수모형 조작판 모듈.
  // "지금 여기 모형이 몇 개 있는지"만 관리하고, 곱셈이든(나중의) 나눗셈이든
  // 그대로 재사용할 수 있게 만든다. 마우스/터치를 각각 명시적으로 처리해서
  // (Pointer Events나 setPointerCapture에 기대지 않음) 호환성을 최대한 넓힌다.
  // ══════════════════════════════════════════════════════════════
  function createBaseTenBoard(container){
    let changeCb = null;
    // 자리값 단계: 일(one) → 십(ten) → 백(hundred). 인덱스가 1 크면 그 다음 자리.
    const TIERS = ['one', 'ten', 'hundred'];
    const TIER_CLASS = { one:'manip-unit', ten:'manip-rod', hundred:'manip-hundred' };
    const TIER_LABEL  = { one:'낱개', ten:'십 모형', hundred:'백 모형' };

    const state = { blocks: [], pending: null };
    // blocks: {id, type:'one'|'ten'|'hundred', x, y} — x,y는 컨테이너 기준 %
    // pending: {type, ids:[...10개], cx, cy} — "이거 바꿀까요?" 확인 대기 중인 뭉치
    let drag = null;               // {id, offX, offY} (offX/offY는 px)
    let history = [];              // 되돌리기용 스냅샷

    function uid(){ return 'b' + Math.random().toString(36).slice(2, 9); }
    function randomPos(){ return { x: 3 + Math.random()*68, y: 3 + Math.random()*58 }; }

    function render(){
      const blocksHtml = state.blocks.map(b =>
        `<div class="manip-block ${TIER_CLASS[b.type]} btb-block" data-id="${b.id}" style="left:${b.x}%; top:${b.y}%;"></div>`
      ).join('');

      let confirmHtml = '';
      if(state.pending){
        const p = state.pending;
        const nextLabel = TIER_LABEL[TIERS[TIERS.indexOf(p.type)+1]];
        confirmHtml = `
          <div class="manip-confirm" style="left:${p.cx}%; top:${p.cy}%;">
            <div class="manip-confirm-text">${TIER_LABEL[p.type]} 10개를<br>${nextLabel} 1개로 바꿀까요?</div>
            <div class="manip-confirm-btns">
              <button type="button" class="manip-confirm-yes">네, 바꿔요</button>
              <button type="button" class="manip-confirm-no">아니요</button>
            </div>
          </div>`;
      }

      container.innerHTML = (state.blocks.length ? blocksHtml : `<span class="manip-empty-hint">모형이 없어요</span>`) + confirmHtml;

      if(state.pending){
        container.querySelector('.manip-confirm-yes').addEventListener('click', confirmPending);
        container.querySelector('.manip-confirm-no').addEventListener('click', ()=>{ state.pending = null; render(); });
      }

      if(changeCb) changeCb(getCounts());
    }

    function saveHistory(){ history.push(state.blocks.map(b=>({...b}))); }

    function addBlocks(type, count){
      if(count > 0) saveHistory();
      for(let i=0;i<count;i++){
        const pos = randomPos();
        state.blocks.push({ id: uid(), type, x: pos.x, y: pos.y, groupId: null });
      }
      render();
    }

    function getCounts(){
      return {
        hundreds: state.blocks.filter(b=>b.type==='hundred').length,
        tens: state.blocks.filter(b=>b.type==='ten').length,
        ones: state.blocks.filter(b=>b.type==='one').length
      };
    }

    // 10개를 한 단계 위(다음 자리)로 교환한다. type: 'one' 또는 'ten'.
    function exchangeUp(type){
      const tierIdx = TIERS.indexOf(type);
      if(tierIdx < 0 || tierIdx+1 >= TIERS.length) return false;
      const group = state.blocks.filter(b=>b.type===type);
      if(group.length < 10) return false;
      saveHistory();
      const removeIds = group.slice(0,10).map(b=>b.id);
      state.blocks = state.blocks.filter(b=>!removeIds.includes(b.id));
      const pos = randomPos();
      state.blocks.push({ id: uid(), type: TIERS[tierIdx+1], x:pos.x, y:pos.y, groupId: null });
      render();
      return true;
    }

    // 1개를 한 단계 아래(이전 자리) 10개로 교환한다. type: 'ten' 또는 'hundred'.
    function exchangeDown(type){
      const tierIdx = TIERS.indexOf(type);
      if(tierIdx <= 0) return false;
      const one = state.blocks.find(b=>b.type===type);
      if(!one) return false;
      saveHistory();
      state.blocks = state.blocks.filter(b=>b.id!==one.id);
      for(let i=0;i<10;i++){
        const pos = randomPos();
        state.blocks.push({ id: uid(), type: TIERS[tierIdx-1], x:pos.x, y:pos.y, groupId: null });
      }
      render();
      return true;
    }

    function confirmPending(){
      if(!state.pending) return;
      const { type, ids } = state.pending;
      const tierIdx = TIERS.indexOf(type);
      saveHistory();
      state.blocks = state.blocks.filter(b=>!ids.includes(b.id));
      const pos = randomPos();
      state.blocks.push({ id: uid(), type: TIERS[tierIdx+1], x:pos.x, y:pos.y, groupId: null });
      state.pending = null;
      render();
    }

    function undo(){
      if(!history.length) return false;
      state.pending = null;
      state.blocks = history.pop();
      render();
      return true;
    }

    function clear(){ state.blocks = []; state.pending = null; history = []; render(); }
    function historyLength(){ return history.length; }

    // 컨테이너 실제 크기 기준으로, 같은 종류 블록 하나 크기의 몇 배를 "닿았다"로
    // 볼지 계산한다 (자석 스냅 범위, 뭉침 판정 범위에 공용으로 쓴다).
    // CSS(.manip-unit/.manip-rod/.manip-hundred)와 맞춘 고정 크기.
    // DOM에서 offsetWidth를 직접 재는 대신 이렇게 고정값을 쓰면, 아직 화면에
    // 그려지기 전이거나(막 추가된 블록) 레이아웃 계산 타이밍 문제가 있어도
    // 항상 정확한 값을 쓸 수 있다.
    const TYPE_SIZE = {
      one: { w: 22, h: 22 },
      ten: { w: 78, h: 22 },
      hundred: { w: 84, h: 84 }
    };

    function getThresholds(type){
      const rect = container.getBoundingClientRect();
      const size = TYPE_SIZE[type] || { w: 22, h: 22 };
      return {
        touchX: ((size.w * 1.3) / rect.width) * 100,
        touchY: ((size.h * 1.3) / rect.height) * 100,
        bwPct: (size.w / rect.width) * 100,
        bhPct: (size.h / rect.height) * 100
      };
    }

    // 드래그 중인 블록 주변 뭉침 상태를 실시간으로 색깔로 보여준다.
    // (전체 render()는 드래그를 끊으니, 여기서는 클래스만 살짝 바꿔준다.)
    function updateLiveHighlight(draggedId){
      container.querySelectorAll('.manip-clustering, .manip-clustering-ready').forEach(el=>{
        el.classList.remove('manip-clustering', 'manip-clustering-ready');
      });
      const dragged = state.blocks.find(b=>b.id===draggedId);
      if(!dragged || !dragged.groupId) return;
      const group = state.blocks.filter(b=>b.groupId === dragged.groupId);
      if(group.length >= 2){
        const cls = group.length >= 10 ? 'manip-clustering-ready' : 'manip-clustering';
        group.forEach(b=>{
          const el = container.querySelector('[data-id="'+b.id+'"]');
          if(el) el.classList.add(cls);
        });
      }
    }

    // 학생이 방금 내려놓은 블록 주변에, 서로 닿을 만큼 가까운 같은 종류 블록이
    // 10개 이상 모였는지 확인한다 (묶음 인식). 모이면 "바꿀까요?" 확인을 띄운다.
    // 학생이 방금 내려놓은 블록이 속한 "그룹"(드래그로 실제 이어붙인 것들만)이
    // 10개가 됐는지 확인한다. 우연히 근처에 있을 뿐인 무관한 블록은 groupId가
    // 다르므로(또는 없으므로) 절대 섞이지 않는다.
    function checkCluster(droppedId){
      const dropped = state.blocks.find(b=>b.id===droppedId);
      if(!dropped || !dropped.groupId) return;
      const tierIdx = TIERS.indexOf(dropped.type);
      if(tierIdx+1 >= TIERS.length) return; // 이미 가장 큰 단위면 더 합칠 곳이 없음

      const group = state.blocks.filter(b=>b.groupId === dropped.groupId);
      if(group.length >= 10){
        const chosen = group.slice(0,10);
        const cx = Math.max(6, Math.min(84, chosen.reduce((s,b)=>s+b.x,0)/chosen.length));
        const cy = Math.max(6, Math.min(80, chosen.reduce((s,b)=>s+b.y,0)/chosen.length));
        state.pending = { type: dropped.type, ids: chosen.map(b=>b.id), cx, cy };
        render();
      }
    }

    function moveTo(clientX, clientY){
      if(!drag) return;
      const rect = container.getBoundingClientRect();
      let xPx = clientX - rect.left - drag.offX;
      let yPx = clientY - rect.top - drag.offY;
      let x = (xPx / rect.width) * 100;
      let y = (yPx / rect.height) * 100;
      x = Math.max(0, Math.min(92, x));
      y = Math.max(0, Math.min(92, y));

      const b = state.blocks.find(b=>b.id===drag.id);
      if(!b) return;

      // ── 자석 스냅: 같은 종류 블록이 가까이 있으면 그 옆으로 착 붙는다 ──
      // 이미 그룹이 있는 이웃에 합류하는 건 넉넉하게 허용하고(뭉치를 계속 키우기
      // 쉽게), 아직 아무 그룹도 없는 블록끼리 "새로" 짝을 맺는 건 훨씬 엄격하게
      // 본다 — 안 그러면 학생이 의도하지 않은, 그냥 근처에 흩어져 있던 블록과
      // 우연히 첫 짝이 맺어져 버릴 수 있다.
      const th = getThresholds(b.type);
      const wideX = th.touchX * 1.15, wideY = th.touchY * 1.15;
      const tightX = th.touchX * 0.55, tightY = th.touchY * 0.55;
      let nearest = null, nearestDist = Infinity;
      // 1차: 이미 그룹이 있는 이웃을 넉넉한 범위에서 우선 찾는다
      state.blocks.forEach(o=>{
        if(o.id === b.id || o.type !== b.type || !o.groupId) return;
        const dx = o.x - x, dy = o.y - y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(Math.abs(dx) <= wideX && Math.abs(dy) <= wideY && dist < nearestDist){
          nearest = o; nearestDist = dist;
        }
      });
      // 2차: 그룹 있는 이웃이 없을 때만, 그룹 없는 이웃을 훨씬 엄격한 범위로 찾는다
      if(!nearest){
        state.blocks.forEach(o=>{
          if(o.id === b.id || o.type !== b.type || o.groupId) return;
          const dx = o.x - x, dy = o.y - y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if(Math.abs(dx) <= tightX && Math.abs(dy) <= tightY && dist < nearestDist){
            nearest = o; nearestDist = dist;
          }
        });
      }

      if(nearest){
        // "뭉치"는 groupId로만 판단한다(공간적으로 우연히 가깝다고 섞이지 않게).
        // 이웃이 이미 그룹에 속해 있으면 그 그룹에 합류하고, 아직 아니면
        // 이번에 처음으로 둘이 새 그룹을 만든다.
        if(!nearest.groupId){
          nearest.groupId = uid();
        }
        b.groupId = nearest.groupId;

        const groupMembers = state.blocks.filter(o => o.groupId === b.groupId && o.id !== b.id);
        const anchor = groupMembers.length
          ? groupMembers.reduce((m,o)=> (o.y<m.y || (o.y===m.y && o.x<m.x)) ? o : m, groupMembers[0])
          : nearest;
        // 낱개는 5개씩 2줄(십틀 모양)로, 십 모형은 가로로 5개면 캔버스 폭을 넘기 쉬워서
        // 세로로 한 줄(10칸)씩 쌓이도록 — "십 모형을 세로로도 쌓을 수 있으면" 요청 반영.
        const cols = b.type === 'ten' ? 1 : 5;
        const idx = groupMembers.length; // 이미 채워진 칸 수 = 새 블록이 들어갈 칸 번호
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        x = anchor.x + col * (th.bwPct + 0.6);
        y = anchor.y + row * (th.bhPct + 0.6);
      } else {
        // 주변에 같은 종류가 없으면(뭉치에서 멀리 떨어지면) 그룹에서도 빠진다.
        b.groupId = null;
      }

      b.x = x; b.y = y;
      const el = container.querySelector('[data-id="'+drag.id+'"]');
      if(el){ el.style.left = x+'%'; el.style.top = y+'%'; el.classList.add('manip-dragging'); }

      updateLiveHighlight(drag.id);
    }

    function startDrag(id, clientX, clientY, blockEl){
      const rect = blockEl.getBoundingClientRect();
      drag = { id, offX: clientX-rect.left, offY: clientY-rect.top };
    }

    function endDrag(){
      if(drag){
        const el = container.querySelector('[data-id="'+drag.id+'"]');
        if(el) el.classList.remove('manip-dragging');
        const droppedId = drag.id;
        drag = null;
        checkCluster(droppedId);
        return;
      }
      drag = null;
    }

    // ── 마우스 ──
    container.addEventListener('mousedown', (e)=>{
      const el = e.target.closest('.btb-block');
      if(!el) return;
      startDrag(el.dataset.id, e.clientX, e.clientY, el);
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e)=>{ if(drag) moveTo(e.clientX, e.clientY); });
    window.addEventListener('mouseup', endDrag);

    // ── 터치 ──
    container.addEventListener('touchstart', (e)=>{
      const el = e.target.closest('.btb-block');
      if(!el) return;
      const t = e.touches[0];
      startDrag(el.dataset.id, t.clientX, t.clientY, el);
      e.preventDefault();
    }, { passive:false });
    window.addEventListener('touchmove', (e)=>{
      if(!drag) return;
      const t = e.touches[0];
      moveTo(t.clientX, t.clientY);
      e.preventDefault();
    }, { passive:false });
    window.addEventListener('touchend', endDrag);
    window.addEventListener('touchcancel', endDrag);

    render();
    function onChangeSet(fn){ changeCb = fn; }

    return { addBlocks, getCounts, exchangeUp, exchangeDown, undo, clear, historyLength, render, onChangeSet };
  }

  // ── 곱셈 화면 ↔ BaseTenBoard 연결 (얇은 접착 코드) ──
  // 보드 자체는 컨테이너가 재생성되지 않으므로 딱 한 번만 만든다.
  const manipBoard = createBaseTenBoard(document.getElementById('manipBoardEl'));
  const manipBoardWrap = document.getElementById('manipBoardWrap');
  const manipCount = document.getElementById('manipCount');
  const manipNextHint = document.getElementById('manipNextHint');
  const manipNextStep = document.getElementById('manipNextStep');
  let manipCurrentGroup = null;

  // 보드 내부에서 뭉쳐서 자동 교환되는 경우(확인창 "네")까지 포함해 모든 변화에서
  // 카운트 표시가 갱신되도록, 버튼 클릭이 아니라 보드의 render() 자체에 연결한다.
  manipBoard.onChangeSet((c)=>{
    const hundredsPart = c.hundreds ? `백 모형 ${c.hundreds}개 · ` : '';
    manipCount.textContent = `지금: ${hundredsPart}십 모형 ${c.tens}개 · 낱개 ${c.ones}개`;
    const undoBtn = document.getElementById('manipUndo');
    if(undoBtn) undoBtn.disabled = manipBoard.historyLength() === 0;

    // 블록이 하나라도 있으면 "직접 써보세요" + "다음 단계로" 버튼 표시
    const hasBlocks = c.hundreds + c.tens + c.ones > 0;
    if(manipNextHint) manipNextHint.style.display = hasBlocks ? 'block' : 'none';
    if(manipNextStep) manipNextStep.style.display = (hasBlocks && manipCurrentGroup < 3) ? 'inline-block' : 'none';
  });

  // "다음 단계로" 버튼: 수모형 확인 후 다음 힌트 그룹으로 이동
  document.getElementById('manipNextStep').addEventListener('click', ()=>{
    if(manipCurrentGroup === null || manipCurrentGroup >= 3) return;
    const nextGroup = manipCurrentGroup + 1;
    activateHintGroup(nextGroup);
    // 해당 그룹의 첫 번째 입력칸에 포커스
    const target = document.querySelector(`input[data-hint-group="${nextGroup}"]`);
    if(target) setTimeout(()=>target.focus(), 80);
  });

  document.getElementById('manipExchangeUp').addEventListener('click', ()=>{
    manipBoard.exchangeUp('one');
  });
  document.getElementById('manipExchangeUpTen').addEventListener('click', ()=>{
    manipBoard.exchangeUp('ten');
  });
  document.getElementById('manipAddOne').addEventListener('click', ()=>{
    manipBoard.addBlocks('one', 1);
  });
  document.getElementById('manipAddTen').addEventListener('click', ()=>{
    manipBoard.addBlocks('ten', 1);
  });
  document.getElementById('manipAddHundred').addEventListener('click', ()=>{
    manipBoard.addBlocks('hundred', 1);
  });
  document.getElementById('manipUndo').addEventListener('click', ()=>{
    manipBoard.undo();
  });
  document.getElementById('manipReset').addEventListener('click', ()=>{
    manipSetGroup(manipCurrentGroup, problem);
  });

  // 자리값 그룹(1=일의 자리 계산, 2=십의 자리 계산, 3=합치기)에 맞춰 지금 확인할
  // 곱셈식을 안내 문구로만 보여준다. 모형은 자동으로 채워주지 않고, 학생이
  // + 버튼으로 필요한 만큼 직접 만들어야 한다 — 정답 모양을 미리 보여주지 않기 위함.
  function manipSetGroup(group, p){
    if(!p) return;
    manipCurrentGroup = group;

    // 그룹 바뀔 때마다 힌트 문구와 버튼 초기화
    if(manipNextHint) manipNextHint.style.display = 'none';
    if(manipNextStep) manipNextStep.style.display = 'none';

    // ③(두 부분곱 더하기)은 곱셈 반복이 아니라 자리값 덧셈 단계라서, 수모형은
    // ①·②에서만 쓰고 여기서는 세로셈으로 안내한다.
    if(group === 3){
      manipDesc.innerHTML = `<b>③ 두 부분곱 더하기</b> · 이 단계는 모형 대신 세로셈으로 확인해요`;
      manipContent.innerHTML = `<div class="manip-empty">①번과 ②번에서 확인한 두 값을, 자리를 맞춰 그대로 더하면 돼요.<br>②번 결과가 한 칸 왼쪽에서 시작하는 걸 잊지 마세요!</div>`;
      manipContent.style.display = 'block';
      manipBoardWrap.style.display = 'none';
      return;
    }

    let a, mult, label;
    if(group === 1){
      a = p.a; mult = p.b1; label = '① 일의 자리 계산';
    } else {
      a = p.a; mult = Math.floor(p.b/10); label = '② 십의 자리 계산';
    }

    if(mult === 0){
      manipDesc.innerHTML = `<b>${label}</b> · 이 문제는 이 단계에서 계산할 곱셈이 없어요.`;
      manipContent.innerHTML = `<div class="manip-empty">몇십을 곱하는 문제라 일의 자리 계산이 따로 없어요. 다음 단계를 확인해보세요!</div>`;
      manipContent.style.display = 'block';
      manipBoardWrap.style.display = 'none';
      // mult===0이면 모형 없이 바로 다음 단계로 갈 수 있도록 버튼 표시
      if(manipNextStep && group < 3) manipNextStep.style.display = 'inline-block';
      return;
    }

    manipDesc.innerHTML = `<b>${label}</b> · <b>${a} × ${mult}</b>를 모형으로 직접 만들어보세요`;
    manipContent.style.display = 'none';
    manipBoardWrap.style.display = 'block';
    manipBoard.clear();
  }

  manipToggle.addEventListener('click', ()=>{
    const willShow = manipBody.style.display === 'none';
    manipBody.style.display = willShow ? 'block' : 'none';
    manipToggle.textContent = willShow ? '🧱 수모형 접기' : '🧱 수모형으로 확인하기';
  });

  function manipShowPanel(){
    manipPanel.style.display = 'block';
  }
  function manipHidePanel(){
    manipPanel.style.display = 'none';
    manipBody.style.display = 'none';
    manipToggle.textContent = '🧱 수모형으로 확인하기';

  function renderProblem(){
    problem = genProblem(level);
    checked = false;
    btnNext.disabled = true;
    feedback.textContent = '';
    feedback.className = 'feedback';
    explain.className = 'explain';
    explain.innerHTML = '';

    problemRow.innerHTML = `<span class="factor-a">${problem.a}</span><span class="op">×</span><span class="factor-b">${problem.b}</span>`;

    if(level === 3){
      const d1 = problem.b1;               // ones digit of b
      const d2 = Math.floor(problem.b/10);  // tens digit of b
      const prod1 = problem.a * d1;
      const prod2 = problem.a * d2;

      const digits1 = String(prod1).split('');
      const digits2 = String(prod2).split('');
      const colEnd1 = 4, colStart1 = colEnd1 - (digits1.length - 1);
      const colEnd2 = 3, colStart2 = colEnd2 - (digits2.length - 1);

      gridWrap.innerHTML = '';
      gridWrap.style.display = 'none';
      hintWrap.innerHTML = buildLearningHint(1, problem);
      scaffoldArea.innerHTML = `
        ${buildVerticalGrid({d1, d2, a: problem.a, b: problem.b, digits1, digits2, colStart1, colEnd1, colStart2, colEnd2})}
        <div class="sum-row">
          <span>두 줄을 모두 계산한 뒤 합치기</span>
          <input type="number" inputmode="numeric" id="sumInput" placeholder="?" data-hint-group="3" />
        </div>`;
      activateHintGroup(1);
      const firstInput = scaffoldArea.querySelector('input[data-digit="r1"]:last-of-type');
      if(firstInput) setTimeout(()=>firstInput.focus(), 0);
    } else {
      const initGroup = problem.b1 > 0 ? 1 : 2;
      gridWrap.style.display = 'flex';
      gridWrap.innerHTML = drawGrid(problem, initGroup);
      hintWrap.innerHTML = buildLearningHint(initGroup, problem);

      let rows = '';
      rows += partialRow('tens-tens', `${problem.a10} × ${problem.b10}`, '십 × 십');
      if(problem.b1 > 0) rows += partialRow('tens-ones', `${problem.a10} × ${problem.b1}`, '십 × 일');
      if(problem.a1 > 0) rows += partialRow('ones-tens', `${problem.a1} × ${problem.b10}`, '일 × 십');
      if(problem.a1 > 0 && problem.b1 > 0) rows += partialRow('ones-ones', `${problem.a1} × ${problem.b1}`, '일 × 일');

      scaffoldArea.innerHTML = `
        <div class="partials">${rows}</div>
        <div class="sum-row">
          <span>합계 =</span>
          <input type="number" inputmode="numeric" id="sumInput" placeholder="?" data-hint-group="3" />
        </div>`;

      // 1단계((두자리)×(몇십))는 일의 자리 계산이 없으면 ②단계부터 시작
      activateHintGroup(initGroup);
    }
  }

  function partialRow(key, expr, label){
    return `<div class="partial-row" data-key="${key}">
      <span class="label">${label}</span>
      <span class="expr">${expr} =</span>
      <input type="number" inputmode="numeric" data-key="${key}" data-hint-group="${(key === 'ones-ones' || key === 'tens-ones') ? '1' : '2'}" />
    </div>`;
  }

  // Builds ONE grid (header + both carry/digit rows) so every box shares the exact
  // same 4 fixed-width columns (천/백/십/일) as the header — no separate grids to drift apart.
  // Real <table> row of 4 <td>s: cells inside [colStart, colEnd] get an input (carry or digit),
  // everything else is a blank <td>. Because every row is a row of the SAME <table>, the browser
  // guarantees each column lines up under the same header column on every row — no manual math.
  function buildVerticalGrid(p){
    // 각 부분곱은 '곱해지는 수 전체 × 한 자리 숫자'로 계산합니다.
    // 따라서 한 줄 안에서는 최대 두 번의 올림이 생길 수 있습니다.
    // ①번 줄: 일의 자리 계산에서 생긴 올림 → 십의 자리 위(col 3)
    //         십의 자리 계산에서 생긴 올림 → 백의 자리 위(col 2)
    // ②번 줄: 일의 자리 계산에서 생긴 올림 → 십의 자리 위(col 2)
    //         십의 자리 계산에서 생긴 올림 → 백의 자리 위(col 1)
    function tdRange(colStart, colEnd, kind, key){
      let tds = '';
      for(let c=1;c<=4;c++){
        if(c < colStart || c > colEnd){
          tds += `<td></td>`;
        } else if(kind === 'carry'){
          const group = key.startsWith('c1') ? '1' : '2';
          tds += `<td class="carry carry-cell" data-hint-group="${group}">
            <div class="carry-help">올림</div>
            <input type="text" inputmode="numeric" maxlength="1" data-carry="${key}" data-hint-group="${group}" aria-label="받아올림 숫자" />
            <span class="carry-caption">작은 수</span>
          </td>`;
        } else {
          const idx = c - colStart;
          const group = key === 'r1' ? '1' : '2';
          tds += `<td><input type="text" inputmode="numeric" maxlength="1" data-digit="${key}" data-idx="${idx}" data-hint-group="${group}" /></td>`;
        }
      }
      return tds;
    }

    // ①/② 각 줄에 서로 다른 두 개의 올림 칸을 서로 다른 열에 정확히 배치한다.
    // (기존 tdRange는 하나의 key를 여러 열에 그대로 복제해버려 같은 id가 두 번 생기고,
    //  두 번째 올림 칸(c1b/c2b)은 아예 그려지지 않던 문제가 있었다.)
    function carryCellHtml(key, group){
      return `<td class="carry carry-cell" data-hint-group="${group}">
        <div class="carry-help">올림</div>
        <input type="text" inputmode="numeric" maxlength="1" data-carry="${key}" data-hint-group="${group}" aria-label="받아올림 숫자" />
        <span class="carry-caption">작은 수</span>
      </td>`;
    }
    function tdCarryPair(colNear, keyNear, colFar, keyFar, group){
      let tds = '';
      for(let c=1;c<=4;c++){
        if(c === colFar) tds += carryCellHtml(keyFar, group);
        else if(c === colNear) tds += carryCellHtml(keyNear, group);
        else tds += `<td></td>`;
      }
      return tds;
    }

    const digitsA = String(p.a).split('');
    const digitsB = String(p.b).split('');
    const colStartA = 4 - (digitsA.length - 1);
    const colStartB = 4 - (digitsB.length - 1);

    function tdOperand(digits, colStart){
      let tds = '';
      for(let c=1;c<=4;c++){
        const idx = c - colStart;
        if(idx >= 0 && idx < digits.length){
          tds += `<td class="opnum hl-target" data-group="both">${digits[idx]}</td>`;
        } else {
          tds += `<td></td>`;
        }
      }
      return tds;
    }

    function tdMultiplierRow(digits, colStart){
      let tds = '';
      for(let c=1;c<=4;c++){
        const idx = c - colStart;
        if(c === colStart - 1){
          tds += `<td class="optimes">×</td>`;
        } else if(idx >= 0 && idx < digits.length){
          const grp = (idx === digits.length - 1) ? '1' : '2';
          tds += `<td class="opnum multiplier hl-target" data-group="${grp}">${digits[idx]}</td>`;
        } else {
          tds += `<td></td>`;
        }
      }
      return tds;
    }

    let html = `<table class="vtable"><colgroup><col><col><col><col><col class="labelcol"></colgroup><tbody>`;
    html += `<tr>${tdOperand(digitsA, colStartA)}<td></td></tr>`;
    html += `<tr>${tdMultiplierRow(digitsB, colStartB)}<td></td></tr>`;
    html += `<tr><td colspan="4"><div class="vtable-hr"></div></td><td></td></tr>`;
    html += `<tr class="vheader"><td>천</td><td>백</td><td>십</td><td>일</td><td></td></tr>`;

    html += `<tr>
      ${tdCarryPair(3, 'c1a', 2, 'c1b', '1')}
      <td rowspan="2" class="row-label-side" data-group="1">
        ① <b>곱하는 수의 일의 자리</b>로 계산해요
      </td>
    </tr>`;
    html += `<tr>${tdRange(p.colStart1, p.colEnd1, 'digit', 'r1')}</tr>`;

    html += `<tr>
      ${tdCarryPair(2, 'c2a', 1, 'c2b', '2')}
      <td rowspan="2" class="row-label-side" data-group="2">
        ② <b>곱하는 수의 십의 자리</b>로 계산해요
      </td>
    </tr>`;
    html += `<tr>${tdRange(p.colStart2, p.colEnd2, 'digit', 'r2')}</tr>`;
    html += `</tbody></table>`;
    return html;
  }

  function buildLearningHint(group, p){
    const titles = {
      1:'① 곱하는 수의 일의 자리로 계산해요',
      2:'② 곱하는 수의 십의 자리로 계산해요',
      3:'③ 두 줄을 더해요'
    };
    const bodies = {
      1:`먼저 <b>곱해지는 수 전체</b>와 <b>곱하는 수의 일의 자리 숫자</b>를 곱해요.<br>
         일의 자리끼리 먼저 계산하고, 그 결과가 10 이상이면 생긴 <b>올림</b>을 같은 줄의 다음 자리 계산에 더해요.`,
      2:`이번에는 <b>곱해지는 수 전체</b>와 <b>곱하는 수의 십의 자리 숫자</b>를 곱해요.<br>
         이 계산에서 새로 생기는 올림이 있다면 ②의 다음 자리 계산에 더해요.
         그리고 이 결과는 <b>십의 자리에서 시작</b>하도록 한 칸 왼쪽에 놓아요.`,
      3:`①과 ②의 계산이 끝났다면 <b>두 부분곱을 같은 자리에 맞춰 더해요.</b><br>
         ②의 줄이 한 칸 왼쪽에 있는 이유는 <b>곱하는 수의 십의 자리</b>를 계산했기 때문이에요.`
    };
    return `<div class="learning-hint" id="learningHint" data-current-group="${group}">
      <div class="hint-top">
        <span class="hint-badge">지금 할 일</span>
        <span class="hint-title">${titles[group]}</span>
      </div>
      <div class="hint-main" id="hintMain">${bodies[group]}</div>
      <div class="hint-steps">
        <button type="button" class="hint-step ${group===1?'active':''}" data-hint-step="1">① × 일의 자리</button>
        <button type="button" class="hint-step ${group===2?'active':''}" data-hint-step="2">② × 십의 자리</button>
        <button type="button" class="hint-step ${group===3?'active':''}" data-hint-step="3">③ 두 줄 더하기</button>
      </div>
      <div class="hint-note">💡 입력칸을 누르면 그 자리의 힌트가 자동으로 바뀌어요.</div>
    </div>`;
  }

  function activateHintGroup(group){
    const hint = document.getElementById('learningHint');
    if(!hint) return;
    hint.dataset.currentGroup = String(group);

    const titles = {
      1:'① 곱하는 수의 일의 자리로 계산해요',
      2:'② 곱하는 수의 십의 자리로 계산해요',
      3:'③ 두 줄을 더해요'
    };
    const bodies = {
      1:`먼저 <b>곱해지는 수 전체</b>와 <b>곱하는 수의 일의 자리 숫자</b>를 계산해요.<br>
         일의 자리끼리 먼저 계산하고, 10 이상이면 생긴 <b>올림을 같은 줄의 다음 자리 계산에 더해요.</b>`,
      2:`이번에는 <b>곱해지는 수 전체</b>와 <b>곱하는 수의 십의 자리 숫자</b>를 계산해요.<br>
         이 계산에서 새로 생기는 올림이 있다면 ②의 다음 자리 계산에 더해요.
         결과는 <b>한 칸 왼쪽</b>에서 시작해요.`,
      3:`①과 ②의 계산이 끝났다면 <b>두 부분곱을 같은 자리에 맞춰 더해요.</b><br>
         ②의 결과가 한 칸 왼쪽에 놓이는 것은 <b>십의 자리</b>를 계산했기 때문이에요.`
    };
    const title = hint.querySelector('.hint-title');
    const main = hint.querySelector('#hintMain');
    if(title) title.textContent = titles[group];
    if(main) main.innerHTML = bodies[group];

    hint.querySelectorAll('.hint-step').forEach(btn=>{
      btn.classList.toggle('active', Number(btn.dataset.hintStep)===group);
    });

    document.querySelectorAll('.row-label-side').forEach(el=>{
      el.classList.toggle('active', Number(el.dataset.group)===group);
    });
    document.querySelectorAll('.hl-target[data-group="1"], .hl-target[data-group="2"]').forEach(el=>{
      el.classList.toggle('hl-active', Number(el.dataset.group)===group);
    });
    const any = group===1 || group===2;
    document.querySelectorAll('.hl-target[data-group="both"]').forEach(el=>{
      el.classList.toggle('hl-active', any);
    });
    document.querySelectorAll('.carry-cell').forEach(el=>{
      el.classList.toggle('is-current', Number(el.dataset.hintGroup)===group);
    });

    // 넓이 모델(SVG Area Model) 조각 하이라이트 동기화
    if(level === 1 || level === 2){
      document.querySelectorAll('.area-rect').forEach(el=>{
        const key = el.dataset.key;
        const isGroup1 = (key === 'tens-ones' || key === 'ones-ones');
        const isGroup2 = (key === 'tens-tens' || key === 'ones-tens');
        const isHl = (group === 1 && isGroup1) || (group === 2 && isGroup2);
        el.classList.toggle('active', isHl);
        const rectEl = el.querySelector('rect');
        const textEl = el.querySelector('text');
        if(rectEl){
          rectEl.setAttribute('stroke', isHl ? 'var(--ones)' : '#fff');
          rectEl.setAttribute('stroke-width', isHl ? '3.5' : '2');
        }
        if(textEl){
          textEl.setAttribute('font-weight', isHl ? 'bold' : 'normal');
        }
      });
    }

    hint.classList.remove('auto-focus-hint');
    void hint.offsetWidth;
    hint.classList.add('auto-focus-hint');

    if(level !== 3) manipSetGroup(group, problem);  // 3단계는 수모형 연동 X
  }

  function showNoAnswerHint(text){
    explain.className = 'explain show';
    explain.innerHTML = `<div class="no-answer-hint">💡 <b>힌트</b><br>${text}</div>`;
  }

  function checkAnswer(){
    if(checked) return;

    if(level === 3){
      const d1 = problem.b1;
      const d2 = Math.floor(problem.b/10);
      const prod1 = problem.a * d1;
      const prod2 = problem.a * d2;
      const digits1 = String(prod1).split('').map(Number);
      const digits2 = String(prod2).split('').map(Number);
      // 각 부분곱(곱해지는 수 전체 × 한 자리 숫자)의 올림을 계산합니다.
      // carryA = 일의 자리 계산에서 십의 자리로 올라가는 수
      // carryB = 십의 자리 계산에서 백의 자리로 올라가는 수
      const aTens = Math.floor(problem.a / 10);
      const aOnes = problem.a % 10;

      const onesProd1 = aOnes * d1;
      const carry1a = Math.floor(onesProd1 / 10);
      const tensCalc1 = aTens * d1 + carry1a;
      const carry1b = Math.floor(tensCalc1 / 10);

      const onesProd2 = aOnes * d2;
      const carry2a = Math.floor(onesProd2 / 10);
      const tensCalc2 = aTens * d2 + carry2a;
      const carry2b = Math.floor(tensCalc2 / 10);

      let allCorrect = true;

      function checkCarry(rowKey, expected){
        const input = document.querySelector(`input[data-carry="${rowKey}"]`);
        if(!input) return;
        const cell = input.closest('td');
        const raw = input.value.trim();
        const val = raw === '' ? 0 : parseInt(raw, 10);
        const ok = val === expected;
        cell.classList.remove('correct','wrong');
        cell.classList.add(ok ? 'correct' : 'wrong');
        if(!ok) allCorrect = false;
      }

      function checkDigits(rowKey, digits){
        digits.forEach((d, idx)=>{
          const input = document.querySelector(`input[data-digit="${rowKey}"][data-idx="${idx}"]`);
          const cell = input.closest('td');
          const val = parseInt(input.value, 10);
          const ok = val === d;
          cell.classList.remove('correct','wrong');
          cell.classList.add(ok ? 'correct' : 'wrong');
          if(!ok) allCorrect = false;
        });
      }

      checkCarry('c1a', carry1a);
      checkCarry('c1b', carry1b);
      checkDigits('r1', digits1);
      checkCarry('c2a', carry2a);
      checkCarry('c2b', carry2b);
      checkDigits('r2', digits2);

      const sumInputV = document.getElementById('sumInput');
      const sumValV = parseInt(sumInputV.value, 10);
      const sumOkV = sumValV === problem.total;
      sumInputV.style.borderColor = sumOkV ? 'var(--correct)' : 'var(--wrong)';
      if(!sumOkV) allCorrect = false;

      checked = true;
      attempts++;
      btnNext.disabled = false;

      if(allCorrect){
        score++; streak++;
        lastCorrect = true;
        feedback.textContent = PRAISE[rand(0,PRAISE.length-1)];
        feedback.className = 'feedback good';
      } else {
        streak = 0;
        lastCorrect = false;
        feedback.textContent = NUDGE[rand(0,NUDGE.length-1)];
        feedback.className = 'feedback bad';
        explain.className = 'explain show';
        showNoAnswerHint(`빨간 칸이 있는 자리의 힌트를 다시 살펴보세요.<br>
          <b>①</b> 곱해지는 수 전체와 곱하는 수의 일의 자리 숫자를 계산하고, 그 줄에서 생긴 올림은 <b>그 줄의 다음 자리</b>에 더해요.<br>
          <b>②</b> 곱해지는 수 전체와 곱하는 수의 십의 자리 숫자를 계산해요.`);
      }
      updateStats();
      updateNextButtonLabel();
      return;
    }

    // level 1 & 2 scaffolded (area model)
    const keys = ['tens-tens'];
    if(problem.b1>0) keys.push('tens-ones');
    if(problem.a1>0) keys.push('ones-tens');
    if(problem.a1>0 && problem.b1>0) keys.push('ones-ones');

    const answerMap = { 'tens-tens':problem.p1, 'tens-ones':problem.p2, 'ones-tens':problem.p3, 'ones-ones':problem.p4 };
    let allCorrect = true;
    keys.forEach(k=>{
      const input = document.querySelector(`input[data-key="${k}"]`);
      const row = document.querySelector(`.partial-row[data-key="${k}"]`);
      const val = parseInt(input.value, 10);
      const ok = val === answerMap[k];
      row.classList.remove('correct','wrong');
      row.classList.add(ok ? 'correct' : 'wrong');
      if(!ok) allCorrect = false;
    });

    const sumInput = document.getElementById('sumInput');
    const sumVal = parseInt(sumInput.value, 10);
    const sumOk = sumVal === problem.total;
    sumInput.style.borderColor = sumOk ? 'var(--correct)' : 'var(--wrong)';
    if(!sumOk) allCorrect = false;

    checked = true;
    attempts++;
    btnNext.disabled = false;

    if(allCorrect){
      score++; streak++;
      lastCorrect = true;
      feedback.textContent = PRAISE[rand(0,PRAISE.length-1)];
      feedback.className = 'feedback good';
    } else {
      streak = 0;
      lastCorrect = false;
      feedback.textContent = NUDGE[rand(0,NUDGE.length-1)];
      feedback.className = 'feedback bad';
      explain.className = 'explain show';
      showNoAnswerHint(`빨간색 칸을 하나씩 다시 확인해 보세요.<br>
        <b>일의 자리부터</b> 계산했는지, 각 계산 결과에서 <b>10개가 한 묶음</b>이 되는 경우를 놓치지 않았는지 살펴보세요.`);
    }
    updateStats();
    updateNextButtonLabel();
  }

  // ── 종합 테스트용 메모장(그림판): 문제마다 scaffoldArea가 새로 그려지므로
  // 매번 새 canvas를 잡아 초기화한다. pointer capture를 써서 캔버스 밖으로
  // 나가도 그리기가 끊기지 않게 하고, window에 리스너를 남기지 않는다.
  function initScratchpad(){
    const canvas = document.getElementById('scratchCanvas');
    const clearBtn = document.getElementById('btnClearPad');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');

    function fillWhite(){
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    fillWhite();
    ctx.strokeStyle = '#25324A';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let drawing = false;

    function getPos(e){
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
    }

    canvas.addEventListener('pointerdown', (e)=>{
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', (e)=>{
      if(!drawing) return;
      const p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      e.preventDefault();
    });
    canvas.addEventListener('pointerup', ()=>{ drawing = false; });
    canvas.addEventListener('pointercancel', ()=>{ drawing = false; });

    if(clearBtn) clearBtn.addEventListener('click', fillWhite);
  }

  function updateStats(){
    statScore.textContent = score;
    statStreak.textContent = streak;
  }

  // ── 자기 진단 → 적응형 연습 ──
  function startPractice(startLevel){
    assessScreen.style.display = 'none';
    statsBar.style.display = 'flex';
    card.style.display = 'block';
    resultBlock.style.display = 'none';
    activateLevel(startLevel);
  }

  function activateLevel(lv){
    level = lv;
    btnCheck.disabled = false;
    levelIndicator.textContent = `지금 단계: ${LEVEL_NAME[lv]}`;
    if(lv === 3) manipHidePanel();  // 3단계(세로셈)에서는 수모형 불필요
    else manipShowPanel();
    renderProblem();
  }

  // "확인"을 누른 뒤 다음 버튼 문구를 상황에 맞게 바꿔, 무엇이 일어날지 미리 알려준다
  function updateNextButtonLabel(){
    if(lastCorrect){
      btnNext.textContent = (level < 3) ? '잘했어요! 다음 단계로 →' : '통과! 종합 테스트로 →';
    } else {
      btnNext.textContent = '다시 도전하기';
    }
  }

  // "다음 문제" 클릭 시: 맞혔으면 다음 단계(또는 종합 테스트)로, 틀렸으면 같은 단계에서 재도전
  function advancePractice(){
    btnNext.textContent = '다음 문제';
    if(lastCorrect){
      if(level < 3){
        activateLevel(level + 1);
      } else {
        startTest();
      }
    } else {
      renderProblem();
    }
  }

  // ── 4단계: 1~3단계가 섞인 종합 테스트 ──
  function startTest(){
    level = 4;
    statsBar.style.display = 'none';
    resultBlock.style.display = 'none';
    manipHidePanel();
    levelIndicator.textContent = '종합 테스트 · 1~3단계 문제가 섞여 나와요';
    testIndex = 0;
    testResults = [];
    btnCheck.disabled = false;
    nextTestQuestion();
  }

  function nextTestQuestion(){
    if(testIndex >= TEST_TOTAL){
      showTestReview();
      return;
    }
    testIndex++;
    checked = false;
    btnNext.disabled = true;
    feedback.textContent = '';
    feedback.className = 'feedback';
    explain.className = 'explain';
    explain.innerHTML = '';

    const subLv = rand(1,3);
    testProblem = genProblem(subLv);

    problemRow.innerHTML = `<span class="factor-a">${testProblem.a}</span><span class="op">×</span><span class="factor-b">${testProblem.b}</span>`;
    gridWrap.innerHTML = '';
    gridWrap.style.display = 'none';
    hintWrap.innerHTML = `<div class="timer">종합 테스트 · ${testIndex} / ${TEST_TOTAL}번째 문제</div>`;
    scaffoldArea.innerHTML = `
      <div class="answer-only">
        <input type="number" inputmode="numeric" id="testAnswerInput" placeholder="?" />
      </div>
      <div class="scratchpad-wrap">
        <div class="scratchpad-header">
          <span>✏️ 메모장 · 손으로 자유롭게 계산해보세요</span>
          <button type="button" class="btn-clear-pad" id="btnClearPad">지우기</button>
        </div>
        <canvas id="scratchCanvas" width="600" height="520"></canvas>
      </div>`;
    const input = document.getElementById('testAnswerInput');
    if(input) input.focus();
    initScratchpad();
  }

  function checkTestAnswer(){
    if(checked) return;
    const input = document.getElementById('testAnswerInput');
    const val = parseInt(input.value, 10);
    const ok = val === testProblem.total;
    input.style.borderColor = ok ? 'var(--correct)' : 'var(--wrong)';

    testResults.push({
      a: testProblem.a, b: testProblem.b, total: testProblem.total,
      userAnswer: isNaN(val) ? null : val, correct: ok
    });

    checked = true;
    btnNext.disabled = false;

    if(ok){
      feedback.textContent = PRAISE[rand(0,PRAISE.length-1)];
      feedback.className = 'feedback good';
    } else {
      feedback.textContent = NUDGE[rand(0,NUDGE.length-1)];
      feedback.className = 'feedback bad';
      explain.className = 'explain show';
      showNoAnswerHint(`답을 바로 보여주지 않을게요.<br>
        <b>일의 자리부터</b> 계산하고, 두 자리 수와 곱하는 경우에는 <b>부분곱을 나누어 생각</b>해 보세요.`);
    }
  }

  function showTestReview(){
    const correctCount = testResults.filter(r=>r.correct).length;
    const rate = Math.round((correctCount/TEST_TOTAL)*100);

    problemRow.innerHTML = `<span style="font-size:22px;color:var(--sub);">종합 테스트 결과</span>`;
    gridWrap.innerHTML = '';
    gridWrap.style.display = 'none';
    hintWrap.innerHTML = '';
    feedback.textContent = '';
    feedback.className = 'feedback';
    explain.className = 'explain';
    explain.innerHTML = '';

    const rows = testResults.map((r,i)=>{
      const ua = (r.userAnswer===null) ? '미입력' : fmt(r.userAnswer);
      return `<div class="partial-row ${r.correct ? 'correct' : 'wrong'}">
        <span class="label">${i+1}번</span>
        <span class="expr">${r.a} × ${r.b} = ${fmt(r.total)}</span>
        <span>${r.correct ? '✅' : `❌ (내 답: ${ua})`}</span>
      </div>`;
    }).join('');

    scaffoldArea.innerHTML = `
      <div class="partials">${rows}</div>
      <div class="sum-row"><span>맞은 문제 ${correctCount} / ${TEST_TOTAL} (정답률 ${rate}%)</span></div>`;

    btnCheck.disabled = true;
    btnNext.disabled = true;
    levelIndicator.textContent = '';

    numInput.value = '';
    nameInputField.value = '';
    updateSubmitEnabled();
    submitStatus.textContent = '';
    submitStatus.className = 'submit-status';
    resultBlock.style.display = 'block';
  }

  assessScreen.querySelectorAll('.assess-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const startLevel = parseInt(btn.dataset.startLevel, 10);
      startPractice(startLevel);
    });
  });

  // clicking a "① 일의 자리..." / "② 십의 자리..." hint highlights the matching part of the
  // PROBLEM itself (the "71 / ×57" digits above the line) — not the answer boxes below it.
  // NOTE: the hint-step buttons live inside #gridWrap, which is a SIBLING of #scaffoldArea,
  // not a child of it — so this listener must be on their common ancestor (#card),
  // otherwise clicks on the ①/②/③ buttons never bubble to a listener on scaffoldArea.
  card.addEventListener('click',(e)=>{
    const stepBtn = e.target.closest('.hint-step');
    if(stepBtn){
      activateHintGroup(Number(stepBtn.dataset.hintStep));
      return;
    }

    const label = e.target.closest('.row-label-side');
    if(label){
      activateHintGroup(Number(label.dataset.group));
      return;
    }

    // 넓이 모델(SVG Area Model) 조각 클릭 시 해당 부분곱 입력칸으로 포커스 및 힌트 연동
    const areaRect = e.target.closest('.area-rect');
    if(areaRect){
      const key = areaRect.dataset.key;
      const targetGroup = (key === 'ones-ones' || key === 'tens-ones') ? 1 : 2;
      activateHintGroup(targetGroup);
      const targetInput = document.querySelector(`input[data-key="${key}"]`);
      if(targetInput) targetInput.focus();
      return;
    }
  });

  scaffoldArea.addEventListener('focusin',(e)=>{
    const input = e.target.closest('input[data-hint-group]');
    if(!input) return;
    activateHintGroup(Number(input.dataset.hintGroup));

    document.querySelectorAll('.vtable td').forEach(td=>td.classList.remove('input-current'));
    input.closest('td')?.classList.add('input-current');
  });

  scaffoldArea.addEventListener('focusout',(e)=>{
    const input = e.target.closest('input[data-hint-group]');
    if(!input) return;
    input.closest('td')?.classList.remove('input-current');
  });

  scaffoldArea.addEventListener('click',(e)=>{
    const row = e.target.closest('.partial-row');
    if(!row) return;
    const key = row.dataset.key || '';
    activateHintGroup((key === 'ones-ones' || key === 'tens-ones') ? 1 : 2);
  });

  btnCheck.addEventListener('click', ()=>{
    if(level === 4) checkTestAnswer();
    else checkAnswer();
  });
  btnNext.addEventListener('click', ()=>{
    if(level === 4) nextTestQuestion();
    else advancePractice();
  });
  btnReset.addEventListener('click', ()=>{
    if(level === 4) startTest();
    else renderProblem();
  });

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      if(level === 4){
        if(!checked) checkTestAnswer();
        else nextTestQuestion();
      } else {
        if(!checked) checkAnswer();
        else advancePractice();
      }
      return;
    }

    // ── 숨겨진 테스트(QA)용 단축키 — 학생용 화면엔 안내 없음 ──
    // Ctrl+Shift+4 : 자기진단/연습 다 건너뛰고 4단계 종합 테스트를 바로 시작
    if(e.ctrlKey && e.shiftKey && e.key === '4'){
      e.preventDefault();
      assessScreen.style.display = 'none';
      card.style.display = 'block';
      startTest();
      return;
    }
    // Ctrl+Shift+S : 테스트까지 전부 건너뛰고, 10문제 전부 정답 처리한 뒤
    //                바로 "번호/이름 입력 + 제출" 화면으로 이동 (Supabase 연결 확인용)
    if(e.ctrlKey && e.shiftKey && (e.key === 'S' || e.key === 's')){
      e.preventDefault();
      assessScreen.style.display = 'none';
      statsBar.style.display = 'none';
      card.style.display = 'block';
      level = 4;
      testResults = Array.from({length: TEST_TOTAL}, ()=>{
        const p = genProblem(rand(1,3));
        return { a:p.a, b:p.b, total:p.total, userAnswer:p.total, correct:true };
      });
      showTestReview();
    }
  });
})();
</script>
</body>
</html>
