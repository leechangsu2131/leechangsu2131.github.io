<style>
:root{--bg:#eaf6fd;--card:#fff;--ink:#1f2d3d;--muted:#5b6b7b;--line:#cfe3f1;--brand:#2f8fd8;--brand-d:#1d6fb0;--ok:#2e9e5b;--sel:#fff3c4;--selb:#f0a500;--box:#f4f9fc;--err:#d6453d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:17px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}
.top{background:linear-gradient(135deg,#2f8fd8,#46b8a0);color:#fff;padding:18px 16px 16px}
.top .in{max-width:820px;margin:0 auto}
.top small{opacity:.9;display:block}
.top h1{margin:2px 0 0;font-size:1.35rem;line-height:1.3}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin:16px 0}
label.f{display:block;margin:12px 0 4px;font-weight:700}

.btn{border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;padding:12px 22px;font-size:1.05rem;cursor:pointer;min-height:48px}

.hint{color:var(--muted);font-size:.92rem}
.err{color:var(--err);font-weight:700}
.bar{position:sticky;top:0;z-index:5;background:rgba(234,246,253,.95);backdrop-filter:blur(4px);border-bottom:2px solid var(--line);padding:8px 16px}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:700}

.q{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0}
.q.done{border-color:#9fd8b4}
.qh{display:flex;gap:12px;align-items:flex-start}
.qn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:grid;place-items:center}
.q.done .qn{background:var(--ok)}
.stem{font-weight:600;margin-top:3px}
.stem b{color:var(--err);text-decoration:underline}
.pass{background:var(--box);border-left:5px solid var(--brand);border-radius:8px;padding:8px 14px;margin:10px 0}
.pass p{margin:2px 0}
.box{border:2px dashed #8bb4cf;border-radius:10px;padding:8px 14px;margin:10px 0;background:#fff}
.box .bt{font-weight:800;text-align:center;margin-bottom:2px}
.box p{margin:2px 0}
.qimg{display:block;max-width:100%;margin:10px auto;border-radius:10px}
.cap{text-align:center;color:var(--muted);font-size:.9rem;margin-top:-4px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 14px;margin:6px 0;border:2px solid var(--line);border-radius:12px;background:#fff;min-height:48px;cursor:pointer}
.opt .no{flex:none;font-weight:800;color:var(--brand-d)}
.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.on .no{color:#a06a00}
.symrow{display:flex;gap:10px;flex-wrap:wrap}
.symrow .opt{width:auto;min-width:74px;justify-content:center;font-size:1.3rem;margin:6px 0}
.oxrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.oxrow:last-child{border-bottom:0}
.oxb{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid #c9d6df;background:#fff;font-size:1.6rem;font-weight:800;color:#c9d6df;cursor:pointer}
.oxb.on{border-color:var(--err);color:var(--err);background:#fff0ef}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.ans .lb{font-weight:700}
.ans input.t{width:7.5em;text-align:center;font-size:1.2rem}

.cmp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1.3rem;font-weight:700;margin:8px 0}
.ldiv{display:inline-flex;align-items:flex-end;font-size:1.2em;margin:0 6px;vertical-align:middle}
.ldiv i{font-style:normal;padding-right:4px}
.ldiv b{font-weight:500;border-left:2px solid #333;border-top:2px solid #333;padding:2px 8px 0;border-top-left-radius:6px}
.match{position:relative;display:flex;justify-content:space-between;gap:0;margin:10px 0;max-width:420px}
.match .col{display:flex;flex-direction:column;gap:14px;z-index:2}
.match .opt{width:112px;justify-content:center;margin:0;font-weight:700;font-size:1.1rem}

.match .opt.c0{border-color:#e0583f;background:#ffeae5}
.match .opt.c1{border-color:#2f8fd8;background:#e3f2fd}
.match .opt.c2{border-color:#2e9e5b;background:#e5f6ec}
.match .opt.pick{border-color:var(--selb);background:var(--sel)}

.dg .g{background:#c9c9c9}

.stat{display:flex;gap:8px;align-items:center;margin:8px 0}

.d.ok{background:var(--ok)}.d.no{background:var(--err)}.d.wait{background:#aaa}
[hidden]{display:none!important}
</style>
</head>

타고 한참을 가야 했습니다. 마을 사람들은 바다에서 고기를 잡거나 밭에서 채소를 기르며 살았고, 육지에 나갈 일은 거의 없었습니다.", "**〈오늘날〉** 오늘날 초록섬과 육지를 잇는 큰 다리가 놓였고, 섬 안에는 도로와 항구, 등대가 생겼습니다. 섬에는 버스와 여객선이 다니고, 자가용이 있는 집도 많습니다. 육지에서 구경하러 오는 사람들이 늘어 민박집과 음식점도 생겼습니다."]}, {"no": 8, "points": 12, "type": "written", "inputs": 3, "labels": ["(1) 교통이 발달해서 초록섬에 좋아진 점", "(2) 교통이 발달해서 생길 수 있는 걱정되는 점", "(3) 걱정되는 점을 해결하는 방법"], "stem": "초록섬에 다리와 도로가 생겨 교통이 발달했습니다. 교통이 발달해서 좋아진 점과 걱정되는 점, 그 해결 방법을 쓰시오."}]};

function uuid(){ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); const b = new Uint8Array(16); crypto.getRandomValues(b); b[6]=b[6]&15|64; b[8]=b[8]&63|128; const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join(''); return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }

/* ---------- 응답 상태 ---------- */
function answered(q){
  const a = S.answers[q.no];
  switch(q.type){
    case 'choice': return Array.isArray(a) && a.length>0;
    case 'ox': return Array.isArray(a);
    case 'short': return Array.isArray(a) && a.some(v => String(v||'').trim()!=='');
    case 'symbol': return !!a;
    case 'match': return Array.isArray(a) && a.length===q.left.length;
    case 'written': return Array.isArray(a) && a.some(v => String(v||'').trim()!=='');
    case 'work': return !!a && (String(a.process||'').trim()!=='' || String(a.answer||'').trim()!=='');
  }
  return false;
}

/* ---------- 문항 그리기 ---------- */
function qHtml(q){
  const a = S.answers[q.no];
  let h = '<div class="qh"><div class="qn">'+q.no+'</div><div style="flex:1;min-width:0"><div class="stem">'+fmt(q.stem)+'</div>';
  if(q.image) h += '<img class="qimg" src="'+q.image+'" alt="문제 그림">' + (q.caption?'<div class="cap">'+esc(q.caption)+'</div>':'');
  if(q.diagram) h += '<div class="dg" style="'+esc(q.diagram.style||'')+'">'+q.diagram.html.replace(/\{\{in:(\d+)\}\}/g,(m,i)=>'<input class="t" data-in="short" data-q="'+q.no+'" data-i="'+i+'" type="text" inputmode="'+KB(q)+'" autocomplete="off" maxlength="12" aria-label="빈칸 '+(+i+1)+'" value="'+esc((a&&a[i])||'')+'">')+'</div>';
  if(q.passage) h += '<div class="pass">'+q.passage.map(p=>'<p>'+fmt(p)+'</p>').join('')+'</div>';
  if(q.box) h += '<div class="box"><div class="bt">&lt;보 기&gt;</div>'+q.box.map(p=>'<p>'+fmt(p)+'</p>').join('')+'</div>';
  h += body(q,a) + padHtml(q) + '</div></div>';
  return h;
}
function body(q,a){
  const n = q.no;
  if(q.type==='choice'){
    const sym = q.labelStyle==='sym', sel = a||[];
    let hint = '';
    if(q.pick>1) hint = '<div class="hint">정답 '+q.pick+'개를 골라요.</div>';
    else if(q.pick===0) hint = '<div class="hint">알맞은 것을 모두 골라요.</div>';
    const lab = i => sym ? SYM[i] : CIRC[i];
    const btns = q.options.map((o,i)=>'<button class="opt'+(sel.includes(i+1)?' on':'')+'" data-act="opt" data-q="'+n+'" data-i="'+(i+1)+'"><span class="no">'+lab(i)+'</span>'+(sym?'':'<span>'+fmt(o)+'</span>')+'</button>').join('');
    return hint + (sym ? '<div class="symrow">'+btns+'</div>' : btns);
  }
  if(q.type==='ox'){
    return '<div class="hint">○표 할 것을 눌러요. 다시 누르면 취소돼요.</div>' + q.items.map((t,i)=>'<div class="oxrow"><span>'+fmt(t)+'</span><button class="oxb'+(a&&a[i]?' on':'')+'" data-act="ox" data-q="'+n+'" data-i="'+i+'" aria-label="○ 표시">○</button></div>').join('');
  }
  if(q.type==='short'){
    if(q.diagram) return '';
    return q.parts.map((p,i)=>'<div class="ans"><span class="lb">'+fmt(p.label)+'</span><input class="t'+(q.kb==='text'?' wide':'')+'" data-in="short" data-q="'+n+'" data-i="'+i+'" type="text" inputmode="'+KB(q)+'" autocomplete="off" maxlength="'+(q.kb==='text'?20:12)+'" value="'+esc((a&&a[i])||'')+'"></div>').join('');
  }
  if(q.type==='symbol'){
    return '<div class="cmp"><span>'+fmt(q.left)+'</span><span class="symrow">'+q.symbols.map(s=>'<button class="opt'+(a===s?' on':'')+'" data-act="sym" data-q="'+n+'" data-v="'+esc(s)+'"><span class="no">'+esc(s)+'</span></button>').join('')+'</span><span>'+fmt(q.right)+'</span></div>';
  }
  if(q.type==='match'){
    const pairs = a||[];
    const ci = (side,idx) => { const k = pairs.findIndex(p=>p[side]===idx); return k<0?'':' c'+(k%3); };
    const L = q.left.map((t,i)=>'<button class="opt'+ci(0,i)+(S._sel&&S._sel.q===n&&S._sel.l===i?' pick':'')+'" data-act="mL" data-q="'+n+'" data-i="'+i+'">'+fmt(t)+'</button>').join('');
    const R = q.right.map((t,i)=>'<button class="opt'+ci(1,i)+'" data-act="mR" data-q="'+n+'" data-i="'+i+'">'+fmt(t)+'</button>').join('');
    return '<div class="hint">왼쪽 식을 누르고, 오른쪽 식을 눌러 이어요. 다시 누르면 끊어져요.</div><div class="match" id="m'+n+'"><div class="col">'+L+'</div><svg></svg><div class="col">'+R+'</div></div>';
  }
  if(q.type==='written'){
    let h='';
    for(let i=0;i<q.inputs;i++) h += (q.labels&&q.labels[i]?'<div class="lbl">'+fmt(q.labels[i])+'</div>':(q.inputs>1?'<div class="lbl">'+CIRC[i]+'</div>':''))+'<textarea class="t" data-in="written" data-q="'+n+'" data-i="'+i+'" placeholder="여기에 써요">'+esc((a&&a[i])||'')+'</textarea>';
    return h;
  }
  if(q.type==='work'){
    const v = a||{};
    let h = '<div class="lbl">풀이 과정</div><textarea class="t" data-in="work" data-f="process" data-q="'+n+'" placeholder="풀이 과정을 써요">'+esc(v.process||'')+'</textarea><div class="lbl">답</div>';
    if(q.choices) h += '<div class="symrow">'+q.choices.map(c=>'<button class="opt'+(v.answer===c?' on':'')+'" data-act="wch" data-q="'+n+'" data-v="'+esc(c)+'"><span>'+esc(c)+'</span></button>').join('')+'</div>';
    else h += '<div class="ans"><input class="t" data-in="work" data-f="answer" data-q="'+n+'" type="text" inputmode="numeric" maxlength="12" value="'+esc(v.answer||'')+'">'+(q.unit?'<span class="lb">'+esc(q.unit)+'</span>':'')+'</div>';
    return h;
  }
  return '';
}
function renderQ(no){
  const q = TEST.questions.find(x=>x.no===no), el = $('#q'+no);
  el.innerHTML = qHtml(q);
  el.classList.toggle('done', answered(q));
  if(q.type==='match') drawLines(no);

/* ---------- 문항별 풀이 칸 (손글씨) ---------- */
const padOn = q => !!(TEST.scratchpad || q.pad);
function padHtml(q){
  if(!padOn(q)) return '';
  const n = q.no, st = S.pads[n]||[], open = !!S.padOpen[n];
  let h = '<div class="padt"><button class="btn ghost" data-act="padtoggle" data-q="'+n+'">'+(open?'풀이 칸 닫기':'✏️ 풀이 쓰기')+'</button>'+(st.length?'<span class="has">✓ 풀이가 저장돼요</span>':'')+'</div>';
  if(open){
    const pb = (v,l) => '<button data-act="padpen" data-q="'+n+'" data-v="'+v+'"'+(S.pen===v?' class="on"':'')+'>'+l+'</button>';
    h += '<div class="padbox"><div class="tools">'+pb('#222','연필')+pb('#d6453d','빨강')+pb('#2f8fd8','파랑')+pb('erase','지우개')+
      '<button data-act="padundo" data-q="'+n+'">되돌리기</button><button data-act="padclear" data-q="'+n+'">모두 지우기</button></div>'+
      '<canvas data-pad="'+n+'" width="'+PAD_W*2+'" height="'+PAD_H*2+'"></canvas></div>';
  }
  return h;
}
function strokePath(ctx, s){
  ctx.strokeStyle = s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(s.p[0], s.p[1]);
  if(s.p.length<=2) ctx.lineTo(s.p[0]+.01, s.p[1]);
  for(let i=2;i<s.p.length;i+=2) ctx.lineTo(s.p[i], s.p[i+1]);
  ctx.stroke();
}
function redrawPad(cv, no){
  const ctx = cv.getContext('2d'); ctx.setTransform(2,0,0,2,0,0); ctx.clearRect(0,0,PAD_W,PAD_H);
  (S.pads[no]||[]).forEach(s=>strokePath(ctx,s));
}
function padPNG(no){
  const c = document.createElement('canvas'); c.width = Math.round(PAD_W*PAD_EXPORT); c.height = Math.round(PAD_H*PAD_EXPORT);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.scale(PAD_EXPORT,PAD_EXPORT);
  (S.pads[no]||[]).forEach(s=>strokePath(ctx,s));
  const w = c.toDataURL('image/webp', 0.85);   // WebP 는 PNG 의 1/4 정도 크기. 지원하지 않는 브라우저는 PNG 로
  return w.startsWith('data:image/webp') ? w : c.toDataURL('image/png');
}
function refreshHas(no){
  const q = TEST.questions.find(x=>x.no===no), t = $('#q'+no+' .padt'); if(!t) return;
  let h = t.querySelector('.has');
  if((S.pads[no]||[]).length){ if(!h){ h = document.createElement('span'); h.className='has'; h.textContent='✓ 풀이가 저장돼요'; t.appendChild(h); } }
  else if(h) h.remove();
}
function initPad(no){
  const cv = document.querySelector('#q'+no+' canvas[data-pad]'); if(!cv) return;
  redrawPad(cv, no);
  let cur = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)*PAD_W/r.width*2)/2, Math.round((e.clientY-r.top)*PAD_H/r.height*2)/2]; };
  const eraseAt = (x,y) => { const a = S.pads[no]||[], k = a.filter(s=>{ for(let i=0;i<s.p.length;i+=2){ if(Math.hypot(s.p[i]-x,s.p[i+1]-y)<14) return false; } return true; }); if(k.length!==a.length){ S.pads[no] = k; redrawPad(cv,no); return true; } return false; };
  cv.addEventListener('pointerdown', e=>{
    if(e.button>0) return; e.preventDefault(); cv.setPointerCapture(e.pointerId);
    const [x,y] = pos(e);
    if(S.pen==='erase'){ cur = {erase:true}; eraseAt(x,y); return; }
    cur = {c:S.pen, w:3, p:[x,y]}; (S.pads[no] = S.pads[no]||[]).push(cur); redrawPad(cv,no);
  });
  cv.addEventListener('pointermove', e=>{
    if(!cur) return; const [x,y] = pos(e);
    if(cur.erase){ eraseAt(x,y); return; }
    const n = cur.p.length; if(Math.hypot(x-cur.p[n-2], y-cur.p[n-1])<1.5) return;
    cur.p.push(x,y);
    const ctx = cv.getContext('2d'); ctx.setTransform(2,0,0,2,0,0); ctx.strokeStyle=cur.c; ctx.lineWidth=cur.w; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(cur.p[n-2],cur.p[n-1]); ctx.lineTo(x,y); ctx.stroke();
  });
  const end = () => { if(!cur) return; cur = null; refreshHas(no); save(); };
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>cv.addEventListener(t,end));
}
function renderAll(){
  $('#qs').innerHTML = TEST.questions.map(q=>'<section class="q" id="q'+q.no+'"></section>').join('');
  TEST.questions.forEach(q=>renderQ(q.no));

function progress(){

  $('#progTxt').textContent = n+' / '+t;
}
function touch(no){ const q=TEST.questions.find(x=>x.no===no); $('#q'+no).classList.toggle('done', answered(q)); progress(); save(); }

function drawLines(no){
  const root = $('#m'+no); if(!root) return;
  const q = TEST.questions.find(x=>x.no===no), pairs = S.answers[no]||[];
  const svg = $('svg',root), rb = root.getBoundingClientRect();
  const Ls = root.querySelectorAll('[data-act=mL]'), Rs = root.querySelectorAll('[data-act=mR]');
  const col = ['#e0583f','#2f8fd8','#2e9e5b'];
  svg.innerHTML = pairs.map((p,k)=>{
    const a = Ls[p[0]].getBoundingClientRect(), b = Rs[p[1]].getBoundingClientRect();
    return '<line x1="'+(a.right-rb.left)+'" y1="'+(a.top+a.height/2-rb.top)+'" x2="'+(b.left-rb.left)+'" y2="'+(b.top+b.height/2-rb.top)+'" stroke="'+col[k%3]+'" stroke-width="4" stroke-linecap="round"/>';
  }).join('');
}
addEventListener('resize', ()=>{ if(!$('#quiz').hidden) TEST.questions.filter(q=>q.type==='match').forEach(q=>drawLines(q.no)); });

/* ---------- 이벤트 ---------- */
$('#qs').addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const no = +b.dataset.q, q = TEST.questions.find(x=>x.no===no), act = b.dataset.act;
  if(act.startsWith('pad')){
    if(act==='padtoggle') S.padOpen[no] = !S.padOpen[no];
    else if(act==='padpen') S.pen = b.dataset.v;
    else if(act==='padundo') (S.pads[no]||[]).pop();
    else if(act==='padclear'){ if((S.pads[no]||[]).length && !confirm('이 문제의 풀이를 모두 지울까요?')) return; S.pads[no] = []; }
    renderQ(no); save();
    if(act==='padtoggle' && S.padOpen[no]){ const cv = document.querySelector('#q'+no+' canvas[data-pad]'); if(cv) cv.scrollIntoView({block:'center'}); }
    return;
  }
  if(act==='opt'){
    const i = +b.dataset.i; let sel = (S.answers[no]||[]).slice();
    if(q.pick===1) sel = [i];
    else if(sel.includes(i)) sel = sel.filter(x=>x!==i);
    else if(q.pick>1 && sel.length>=q.pick){ toast('정답은 '+q.pick+'개만 고를 수 있어요. 하나를 먼저 취소해요.'); return; }
    else sel.push(i);
    S.answers[no] = sel.sort((x,y)=>x-y);
  } else if(act==='ox'){
    const i = +b.dataset.i, v = S.answers[no] ? S.answers[no].slice() : q.items.map(()=>false);
    v[i] = !v[i]; S.answers[no] = v;
  } else if(act==='sym'){ S.answers[no] = b.dataset.v;
  } else if(act==='wch'){ S.answers[no] = Object.assign({}, S.answers[no], {answer:b.dataset.v});
  } else if(act==='mL'){
    const i = +b.dataset.i; let pairs = (S.answers[no]||[]).slice();
    const k = pairs.findIndex(p=>p[0]===i);
    if(k>=0){ pairs.splice(k,1); S.answers[no]=pairs; S._sel=null; }
    else S._sel = {q:no,l:i};
  } else if(act==='mR'){
    const i = +b.dataset.i; let pairs = (S.answers[no]||[]).slice();
    const k = pairs.findIndex(p=>p[1]===i);
    if(S._sel && S._sel.q===no){
      if(k>=0) pairs.splice(k,1);
      pairs.push([S._sel.l,i]); pairs.sort((x,y)=>x[0]-y[0]); S.answers[no]=pairs; S._sel=null;
    } else if(k>=0){ pairs.splice(k,1); S.answers[no]=pairs; }
  }
  renderQ(no); touch(no);
});
$('#qs').addEventListener('input', e=>{
  const el = e.target.closest('[data-in]'); if(!el) return;
  const no = +el.dataset.q, kind = el.dataset.in;
  if(kind==='short'){ const q=TEST.questions.find(x=>x.no===no); const v=(S.answers[no]||q.parts.map(()=> '')).slice(); v[+el.dataset.i]=el.value; S.answers[no]=v; }
  else if(kind==='written'){ const q=TEST.questions.find(x=>x.no===no); const v=(S.answers[no]||Array(q.inputs).fill('')).slice(); v[+el.dataset.i]=el.value; S.answers[no]=v; }
  else if(kind==='work'){ S.answers[no]=Object.assign({},S.answers[no],{[el.dataset.f]:el.value}); }
  touch(no);
});

let tmr = null, warned = {};
function fmtLeft(ms){ const s = Math.max(0, Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function tick(){
  if(!LIMIT || submitted) return;
  const left = new Date(S.startedAt).getTime() + LIMIT - Date.now(), el = $('#tm');
  el.textContent = '⏱ '+fmtLeft(left); el.classList.toggle('warn', left<=300000);

}

function b64blob(url){ const [h,b] = url.split(','), bin = atob(b), u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:h.slice(5,h.indexOf(';'))}); }
function setSend(cls, mark, msg, retry){

async function send(){
  const pl = D.payload, padNos = Object.keys(pl.pads||{});
  setSend('wait','…','선생님께 보내는 중…',false);
  if(!CFG.supabaseUrl || !CFG.supabaseAnonKey){ setSend('no','!','전송 설정이 없어요. 저장된 파일을 선생님께 보내 주세요.',false); return; }
  const base = CFG.supabaseUrl.replace(/\/$/,''), H = {apikey:CFG.supabaseAnonKey, Authorization:'Bearer '+CFG.supabaseAnonKey};
  try{
    if(!D.sent.sub){
      const r = await fetch(base+'/rest/v1/'+CFG.table, {method:'POST', headers:Object.assign({'Content-Type':'application/json', Prefer:'return=minimal'},H),
        body: JSON.stringify({id:pl.submission_id, test_id:pl.test_id, class_label:pl.class_label, student_no:pl.student_no, student_name:pl.student_name, answers:pl.answers,
          meta:{submitted_at:pl.submitted_at, started_at:pl.started_at, duration_sec:pl.duration_sec, time_limit_min:pl.time_limit_min, timed_out:pl.timed_out, pad_files:pl.pad_files, v:2}})});
      if(!r.ok) throw new Error('HTTP '+r.status);
      D.sent.sub = true; saveDone();
    }
    if(CFG.padBucket){
      let k = 0;
      for(const no of padNos){
        k++; if(D.sent.pads[no]) continue;
        setSend('wait','…','풀이 그림을 보내는 중… ('+k+'/'+padNos.length+')',false);
        const f = pl.pad_files.find(x=>String(x.no)===String(no));
        const r = await fetch(base+'/storage/v1/object/'+CFG.padBucket+'/'+f.path, {method:'POST', headers:Object.assign({'Content-Type':f.type,'cache-control':'max-age=3600'},H), body:b64blob(pl.pads[no])});
        if(!r.ok && r.status!==409){ const tx = await r.text().catch(()=> ''); if(!/Duplicate/i.test(tx)) throw new Error('PAD '+r.status); }
        D.sent.pads[no] = true; saveDone();
      }
    }
    setSend('ok','✓', padNos.length && CFG.padBucket ? '선생님께 전송했어요. (풀이 그림 '+padNos.length+'장 포함)' : '선생님께 전송했어요.', false);
    if(padNos.length && !CFG.padBucket) $('#sendTxt').textContent += ' 풀이 그림은 저장된 파일에만 들어 있어요.';
  }catch(err){
    setSend('no','!','전송이 안 됐어요. (인터넷을 확인해요)',true);
  }
}
function doSubmit(timedOut){
  if(submitted) return;
  submitted = true; clearInterval(tmr);
  const now = new Date(), startMs = new Date(S.startedAt).getTime();
  let dur = Math.round((now-startMs)/1000); if(LIMIT) dur = Math.min(dur, LIMIT/1000);
  const id = uuid(), pads = {}, files = [];
  TEST.questions.forEach(q=>{ const st = S.pads[q.no]||[]; if(padOn(q) && st.length){ const u = padPNG(q.no), ty = u.slice(5,u.indexOf(';')); pads[q.no] = u; files.push({no:q.no, type:ty, path:TEST.id+'/'+id+'/q'+q.no+'.'+(ty==='image/webp'?'webp':'png'), strokes:st.length}); } });
  D = {payload:{app:'unit-test', v:2, submission_id:id, test_id:TEST.id, title:TEST.title, class_label:CFG.classLabel||'', student_no:+S.no, student_name:S.name,
      started_at:S.startedAt, submitted_at:now.toISOString(), duration_sec:dur, time_limit_min:TEST.timeLimitMin||null, timed_out:!!timedOut, answers:S.answers, pads:pads, pad_files:files},
    sent:{sub:false, pads:{}}};
  saveDone();
  try{ localStorage.removeItem(KEY); }catch(e){}
  showDone(true);
}
function showDone(fresh){
  $('#quiz').hidden = true; $('#start').hidden = true; $('#done').hidden = false; scrollTo(0,0);
  const pl = D.payload;
  $('#doneTitle').textContent = pl.timed_out ? '시간이 끝나서 제출했어요 ⏱' : '제출했어요! 수고했어요 🎉';
  if(fresh) download(); else $('#fname').textContent = '';
  const allSent = D.sent.sub && (!CFG.padBucket || Object.keys(pl.pads||{}).every(n=>D.sent.pads[n]));
  if(allSent && !fresh) setSend('ok','✓','선생님께 전송했어요.',false); else send();
}
$('#btnRetry').onclick = send;
$('#btnFile').onclick = ()=>{ if(D) download(); };
$('#btnNext').onclick = ()=>{
  const pl = D && D.payload; const allSent = D && D.sent.sub && (!CFG.padBucket || Object.keys(pl.pads||{}).every(n=>D.sent.pads[n]));
  if(!confirm(allSent ? '이 기기에서 다른 친구가 새로 시작해요. 계속할까요?' : '아직 선생님께 전송이 끝나지 않았어요. 그래도 새로 시작할까요? (저장된 파일은 꼭 보관해요)')) return;
  try{ localStorage.removeItem(DKEY); localStorage.removeItem(KEY); }catch(e){}
  location.replace(location.href.split('?')[0]);
};
addEventListener('beforeunload', e=>{ if(!submitted && !$('#quiz').hidden && (Object.keys(S.answers).length || Object.keys(S.pads).length)){ e.preventDefault(); e.returnValue=''; } });

/* ---------- 처음 열 때: 제출 완료 / 풀던 중 / 새로 시작 ---------- */
(function boot(){
  if(/[?&]reset\b/.test(location.search)){ try{ localStorage.removeItem(DKEY); localStorage.removeItem(KEY); }catch(e){} }
  let d = null; try{ d = JSON.parse(localStorage.getItem(DKEY)||'null'); }catch(e){}
  if(d && d.payload){ D = d; submitted = true; showDone(false); return; }
  loadDraft();
  $('#inNo').value = S.no; $('#inName').value = S.name;
  if(S.started && S.startedAt){
    if(LIMIT && Date.now() >= new Date(S.startedAt).getTime()+LIMIT){ enterQuiz(); return; }   // 시간이 이미 지났으면 enterQuiz 의 첫 tick 이 자동 제출
    enterQuiz();
  }
})();
</script>
