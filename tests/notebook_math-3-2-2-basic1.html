<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수학 나눗셈 (기본1) 오답노트</title>
<style>
:root{--bg:#fff7ea;--card:#fff;--ink:#1f2d3d;--muted:#6a5b4b;--line:#f0dcc0;--brand:#e8890c;--brand-d:#b96a00;--ok:#2e9e5b;--okbg:#e5f6ec;--no:#d6453d;--nobg:#fdecea;--sel:#fff3c4;--selb:#f0a500;--box:#fff9ee;--blue:#2f8fd8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:17px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
.top{background:linear-gradient(135deg,#f5a524,#e8704c);color:#fff;padding:18px 16px 16px}
.top .in{max-width:820px;margin:0 auto}.top small{opacity:.92;display:block}.top h1{margin:2px 0 0;font-size:1.35rem;line-height:1.3}
.top a.back{display:inline-block;color:#fff;opacity:.92;text-decoration:none;font-size:.9rem;font-weight:700;margin-bottom:6px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin:16px 0}
.card h2{margin:0 0 8px;font-size:1.2rem}
.hint{color:var(--muted);font-size:.93rem}
.err{color:var(--no);font-weight:700}
.btn{border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;padding:11px 20px;font-size:1.02rem;cursor:pointer;min-height:46px}
.btn:active{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--brand-d);border:2px solid var(--brand)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.95rem}
.drop{border:3px dashed #e5c48e;border-radius:16px;padding:26px 14px;text-align:center;background:var(--box)}
.drop.on{background:var(--sel);border-color:var(--selb)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.pill{background:var(--box);border:2px solid var(--line);border-radius:14px;padding:6px 14px;font-weight:700}
.pill b{font-size:1.25rem;color:var(--brand-d)}
.tp{margin:10px 0}
.tp .nm{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.tp .bar{height:12px;background:#f3e6d0;border-radius:7px;overflow:hidden;margin-top:3px}
.tp .bar i{display:block;height:100%;background:var(--ok)}
.tp.weak .bar i{background:var(--no)}
.tp.weak .nm span:last-child{color:var(--no)}
.adv{border-left:5px solid var(--brand);background:var(--box);border-radius:8px;padding:8px 14px;margin:10px 0}
.adv p{margin:3px 0}
.q{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0}
.q.bad{border-color:#f1b3ad}
.qh{display:flex;gap:12px;align-items:flex-start}
.qn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--no);color:#fff;font-weight:800;display:grid;place-items:center}
.qn.ok{background:var(--ok)}.qn.mid{background:var(--selb)}
.tag{display:inline-block;font-size:.85rem;background:var(--box);border:1px solid var(--line);border-radius:10px;padding:0 8px;margin:0 6px 4px 0;color:var(--muted)}
.stem{font-weight:600;margin-top:3px}
.stem b{color:var(--no);text-decoration:underline}
.pass{background:var(--box);border-left:5px solid var(--brand);border-radius:8px;padding:8px 14px;margin:10px 0}
.pass p{margin:2px 0}
.box{border:2px dashed #d9b77c;border-radius:10px;padding:8px 14px;margin:10px 0;background:#fff}
.box .bt{font-weight:800;text-align:center}.box p{margin:2px 0}
.qimg{display:block;max-width:100%;margin:10px auto;border-radius:10px}
.cap{text-align:center;color:var(--muted);font-size:.9rem;margin-top:-4px}
.ol{margin:6px 0}
.ol div{padding:6px 12px;margin:4px 0;border:2px solid var(--line);border-radius:10px;display:flex;gap:8px;align-items:flex-start}
.ol .no{flex:none;font-weight:800;color:var(--brand-d)}
.ol .mine{border-color:#f1b3ad;background:var(--nobg)}
.ol .right{border-color:#9fd8b4;background:var(--okbg)}
.ol .mine.right{border-color:#9fd8b4;background:var(--okbg)}
.ol em{margin-left:auto;font-style:normal;font-size:.85rem;font-weight:700;white-space:nowrap}
.ans2{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.ans2>div{flex:1;min-width:200px;border-radius:12px;padding:8px 12px}
.ans2 .m{background:var(--nobg);border:2px solid #f1b3ad}.ans2 .r{background:var(--okbg);border:2px solid #9fd8b4}
.ans2 small{display:block;font-weight:700;color:var(--muted)}
.rem{background:#eef6fd;border-left:5px solid var(--blue);border-radius:8px;padding:8px 14px;margin:10px 0}
.rem small{font-weight:800;color:#1d6fb0}
.ldiv{display:inline-flex;align-items:flex-end;font-size:1.2em;margin:0 6px;vertical-align:middle}
.ldiv i{font-style:normal;padding-right:4px}
.ldiv b{font-weight:500;border-left:2px solid #333;border-top:2px solid #333;padding:2px 8px 0;border-top-left-radius:6px}
.dg{position:relative;display:grid;margin:12px 0;font-size:1.15rem;font-weight:700;justify-content:start;align-items:stretch}
.dg .c{border:1.5px solid #333;background:#fff;display:flex;align-items:center;justify-content:center;min-height:38px;padding:0 6px}
.dg .g{background:#c9c9c9}
.dg .blank{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#fff8e1;border:1.5px dashed #999;font-weight:800}
.dg .dgo{border:1.5px solid #333;border-radius:50%;padding:4px 14px;display:flex;align-items:center;justify-content:center;background:#fff;min-width:46px}
.dg .ah{display:flex;align-items:center;height:100%}.dg .ah i{flex:1;height:0;border-top:2px solid #333}
.dg .ah::after{content:"";border:6px solid transparent;border-left:10px solid #333;border-right:0}
.dg .av{display:flex;flex-direction:column;align-items:center;height:100%}.dg .av i{flex:1;width:0;border-left:2px solid #333}
.dg .av::after{content:"";border:6px solid transparent;border-top:10px solid #333;border-bottom:0}
.prac{margin-top:12px}
.pq{border:3px solid var(--brand);border-radius:14px;padding:12px 14px;background:#fffdf7;margin-top:10px}
.pq .ttl{font-weight:800;color:var(--brand-d);margin-bottom:4px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:9px 14px;margin:6px 0;border:2px solid var(--line);border-radius:12px;background:#fff;min-height:46px;cursor:pointer}
.opt .no{flex:none;font-weight:800;color:var(--brand-d)}
.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.right{background:var(--okbg);border-color:#9fd8b4}
.opt.wrong{background:var(--nobg);border-color:#f1b3ad}
.symrow{display:flex;gap:10px;flex-wrap:wrap}.symrow .opt{width:auto;min-width:74px;justify-content:center;font-size:1.3rem}
.cmp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1.3rem;font-weight:700;margin:8px 0}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.ans .lb{font-weight:700}
input.t,textarea.t{border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;font-size:1.1rem}
input.t{width:7.5em;text-align:center}textarea.t{width:100%;min-height:80px}
input.t:focus,textarea.t:focus{outline:none;border-color:var(--brand)}
.oxrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.oxb{flex:none;width:50px;height:50px;border-radius:50%;border:3px solid #d8cdbb;background:#fff;font-size:1.5rem;font-weight:800;color:#d8cdbb;cursor:pointer}
.oxb.on{border-color:var(--no);color:var(--no);background:var(--nobg)}
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:600}
.fb.ok{background:var(--okbg);border:2px solid #9fd8b4}.fb.no{background:var(--nobg);border:2px solid #f1b3ad}.fb.nt{background:#eef6fd;border:2px solid #b8d6ee}
.fb p{margin:3px 0;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.streak{font-weight:700;color:var(--ok)}
details>summary{cursor:pointer;font-weight:800;padding:6px 0}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#243b53;color:#fff;border-radius:12px;padding:10px 18px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
[hidden]{display:none!important}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 4px}
.sgrid .cell{border-radius:12px;padding:6px 2px;text-align:center;border:2px solid var(--line);background:var(--box)}
.sgrid .cell b{display:block;font-size:.82rem;color:var(--muted)}.sgrid .cell span{font-size:1.3rem;font-weight:800}.sgrid .cell small{display:block;font-size:.72rem;color:var(--muted)}
.sgrid .ok{background:var(--okbg);border-color:#a9dfc0}.sgrid .ok span{color:var(--ok)}
.sgrid .no{background:var(--nobg);border-color:#f1b3ad}.sgrid .no span{color:var(--no)}
.sgrid .half{background:#fff3c4;border-color:#f0c96a}.sgrid .half span{color:#e8890c}
</style>
</head>

<div class="top"><div class="in"><a class="back" href="index.html">← 단원평가로</a> · <a class="back" href="../education.html">교육 도구</a><small id="meta"></small><h1 id="ttl"></h1></div></div>
<div class="wrap">

<div id="load" class="card">
  <h2>내 기록 불러오기</h2>
  <p class="hint" style="margin-top:0">시험을 낼 때 선생님께 제출한 내 답안을 불러와서, 이 자리에서 채점하고 오답노트를 만들어요.</p>
  <div class="ans"><label class="lb" for="lkNo">번호</label><input id="lkNo" class="t" type="number" inputmode="numeric" min="1" max="60" style="width:6em">
    <label class="lb" for="lkName">이름</label><input id="lkName" class="t" type="text" maxlength="12" autocomplete="off" style="width:9em"></div>
  <div class="row"><button id="btnLookup" class="btn">내 기록 불러오기</button></div>
  <p id="lkMsg" class="err" hidden></p>
  <hr style="border:0;border-top:2px dashed var(--line);margin:18px 0">
  <p class="hint" style="margin:0 0 8px">인터넷이 안 되거나 위 방법이 안 되면, 시험을 낼 때 기기에 저장된 답안 파일(<b>.json</b>)로도 불러올 수 있어요. 파일은 이 기기 안에서만 쓰여요.</p>
  <label id="drop" class="drop"><input id="file" type="file" accept=".json,application/json" hidden>
    <div style="font-size:2rem">📄</div><div><b>여기를 눌러 파일을 고르거나, 끌어다 놓아요</b></div><div class="hint" id="fhint"></div></label>
  <p id="loadErr" class="err" hidden></p>
</div>

<div id="res" hidden>
  <div class="card">
    <h2 id="who"></h2>
    <div class="sum" id="sum"></div>
    <p class="hint" id="sumNote" style="margin:8px 0 0"></p>
    <div id="sgrid" class="sgrid" hidden></div>
    <p class="hint" id="sgridLeg" hidden>○ 정답 · △ 부분 점수 · × 오답 · – 안 풀었어요 (선생님이 기록한 채점 결과)</p>
  </div>
  <div class="card" id="advCard">
    <h2>내가 약한 부분과 공부 조언</h2>
    <div id="topics"></div>
    <div id="adv"></div>
  </div>
  <h2 style="margin:20px 4px 0" id="wrongH"></h2>
  <div id="wrongList"></div>
  <details class="card" id="moreCard"><summary>더 연습하고 싶은 문제 고르기</summary><div id="moreList"></div></details>
  <div class="row"><button class="btn ghost sm" id="btnOther">다른 답안 파일 불러오기</button></div>
</div>
</div>
<div id="toast" class="toast"></div>

/* ---------- 채점 (정답과 부분점수 규칙은 시험지와 같음) ---------- */
// 풀이 과정 점수(work)는 자동으로 채점할 수 없으므로 분모에서 뺀다
const gp = q => q.points - (q.type==='work' ? q.processPts : 0);
function hasAns(q,a){
  switch(q.type){
    case 'choice': return Array.isArray(a)&&a.length>0;
    case 'ox': return Array.isArray(a);
    case 'short': case 'written': return Array.isArray(a)&&a.some(v=>norm(v)!=='');
    case 'symbol': return !!a;
    case 'match': return Array.isArray(a)&&a.length>0;
    case 'work': return !!a&&(norm(a.process)!==''||norm(a.answer)!=='');
  }
  return false;
}
const sameSet = (a,b) => a.length===b.length && [...a].sort().every((v,i)=>v===[...b].sort()[i]);
// v: 정답 | 부분 | 오답 | 미응답 | 확인(서술형 등 선생님이 채점)
function grade(q,a){
  if(!hasAns(q,a)) return {v:'미응답', got:0};
  if(q.type==='choice') return sameSet(a,q.answer) ? {v:'정답',got:q.points} : {v:'오답',got:0};
  if(q.type==='ox') return (a.length===q.answer.length && a.every((x,i)=>!!x===q.answer[i])) ? {v:'정답',got:q.points} : {v:'오답',got:0};
  if(q.type==='symbol') return a===q.answer ? {v:'정답',got:q.points} : {v:'오답',got:0};
  if(q.type==='match'){ const k=p=>p.join('-'); return sameSet(a.map(k), q.answer.map(k)) ? {v:'정답',got:q.points} : {v:'오답',got:0}; }
  if(q.type==='short'){
    const okp = q.parts.map((p,i)=>eqAns(a[i],p.answer));
    if(okp.every(Boolean)) return {v:'정답',got:q.points};
    if(q.partial && okp.some(Boolean)) return {v:'부분', got:q.parts.reduce((s,p,i)=>s+(okp[i]?p.pts:0),0)};
    return {v:'오답',got:0};
  }
  if(q.type==='work') return eqAns(a.answer,q.answer) ? {v:'정답', got:q.answerPts, note:'풀이 과정은 선생님이 확인해요.'} : {v:'오답',got:0};
  if(q.type==='written') return {v:'확인',got:0};
  return {v:'확인',got:0};
}

function optLabel(q,i){ return lab(q,i); }
function choiceText(q,arr){ return (arr||[]).map(i=>optLabel(q,i-1)+(q.labelStyle==='sym'?'':' '+q.options[i-1])).join(', ')||'(안 풀었어요)'; }
function mineText(q,a){
  if(!hasAns(q,a)) return '(안 풀었어요)';
  switch(q.type){
    case 'choice': return esc(choiceText(q,a));
    case 'ox': return q.items.map((t,i)=>'('+(i+1)+') '+(a[i]?'○':'×')).join('  ');
    case 'short': return q.parts.map((p,i)=>fmt(p.label)+' <b>'+esc(a[i]||'(빈칸)')+'</b>').join('<br>');
    case 'symbol': return fmt(q.left)+' <b>'+esc(a)+'</b> '+fmt(q.right);
    case 'match': return a.map(p=>fmt(q.left[p[0]])+' ─ '+fmt(q.right[p[1]])).join('<br>');
    case 'written': return a.map(t=>esc(t)).join('<br>');
    case 'work': return '풀이: '+esc(a.process||'(없음)')+'<br>답: <b>'+esc(a.answer||'(없음)')+'</b>';
  }
  return '';
}
function rightText(q){
  switch(q.type){
    case 'choice': return esc(choiceText(q,q.answer));
    case 'ox': return q.items.map((t,i)=>'('+(i+1)+') '+(q.answer[i]?'○':'×')).join('  ');
    case 'short': return q.parts.map(p=>fmt(p.label)+' <b>'+esc(p.answer)+'</b>').join('<br>');
    case 'symbol': return fmt(q.left)+' <b>'+esc(q.answer)+'</b> '+fmt(q.right);
    case 'match': return q.answer.map(p=>fmt(q.left[p[0]])+' ─ '+fmt(q.right[p[1]])).join('<br>');
    case 'written': return '<small>모범 답안 예</small>'+esc(q.sample||'');
    case 'work': return (q.sample?esc(q.sample)+'<br>':'')+'답: <b>'+esc(q.answer)+(q.unit?' '+esc(q.unit):'')+'</b>';
  }
  return '';
}

  if(q.diagram){
    const vals = q.type==='short' ? q.parts.map((p,i)=>(a&&a[i])||'') : [];
    h += '<div class="dg" style="'+esc(q.diagram.style||'')+'">'+q.diagram.html.replace(/\{\{in:(\d+)\}\}/g,(m,i)=>'<span class="blank">'+esc(vals[i]||'')+'</span>')+'</div>';
  }
  if(q.passage) h += '<div class="pass">'+q.passage.map(p=>'<p>'+fmt(p)+'</p>').join('')+'</div>';
  if(q.box) h += '<div class="box"><div class="bt">&lt;보 기&gt;</div>'+q.box.map(p=>'<p>'+fmt(p)+'</p>').join('')+'</div>';
  if(q.type==='choice' && withMarks){

  }

}

function pkey(){ return 'ut-nb:'+TEST.id+':'+STU.no+':'+STU.name; }

function saveProg(){ try{ localStorage.setItem(pkey(), JSON.stringify(PR)); }catch(e){} }

function showResult(sub){
  STU = {no:sub.student_no, name:sub.student_name};
  const ans = sub.answers||{};
  RES = TEST.questions.map(q=>Object.assign({q, a:ans[q.no]}, grade(q, ans[q.no])));
  P = {}; loadProg();
  const auto = RES.filter(r=>r.v!=='확인'), right = auto.filter(r=>r.v==='정답').length;
  const got = RES.reduce((s,r)=>s+r.got,0), full = auto.reduce((s,r)=>s+gp(r.q),0);
  $('#who').textContent = STU.no+'번 '+STU.name+' 의 오답노트';
  $('#sum').innerHTML = '<span class="pill">맞은 문제 <b>'+right+'</b> / '+auto.length+'</span><span class="pill">자동 채점 점수 <b>'+got+'</b> / '+full+'점</span>'+(sub.timed_out?'<span class="pill">시간이 끝나서 제출</span>':'');
  const SC = sub.score && sub.score.status==='ok' ? sub.score.items : null;
  const sg = $('#sgrid'); sg.hidden = !SC; $('#sgridLeg').hidden = !SC; sg.textContent = '';
  if(SC){
    let st=0, sm=0; SC.forEach(i=>{ st+=Number(i.score)||0; sm+=i.points; });
    $('#sum').insertAdjacentHTML('afterbegin','<span class="pill">선생님 채점 점수 <b>'+(Math.round(st*10)/10)+'</b> / '+sm+'점</span>');
    const mk={'정답':['ok','○'],'부분':['half','△'],'오답':['no','×'],'미응답':['','–'],'미채점':['','?']};
    SC.forEach(i=>{ const m=mk[i.verdict]||['','?']; const c=document.createElement('div'); c.className='cell '+m[0];
      const b=document.createElement('b'); b.textContent=i.no+'번'; const x=document.createElement('span'); x.textContent=m[1]; const y=document.createElement('small'); y.textContent=(Number(i.score)||0)+'/'+i.points;
      c.append(b,x,y); sg.appendChild(c); });
  }
  const manual = RES.filter(r=>r.v==='확인'||r.note);
  $('#sumNote').textContent = SC ? '위 점수는 선생님 기록이에요. 아래 "자동 채점"은 오답노트가 내 답을 다시 확인한 것이라 서술형·풀이 점수는 빠져 있어요.' : manual.length ? '서술형 문제와 풀이 과정 점수는 선생님이 채점해요. 아래에서는 모범 답안과 비교해 스스로 확인해 봐요.' : '';
  // 평가 요소별 정리
  const T = {};
  RES.filter(r=>r.v!=='확인').forEach(r=>{ const k=r.q.topic||'기타'; (T[k]=T[k]||{topic:k,pts:0,got:0,wrong:[],pages:new Set()}); const t=T[k]; t.pts+=gp(r.q); t.got+=r.got; if(r.v!=='정답'){ t.wrong.push(r); if(r.q.page) t.pages.add(r.q.page); } });
  const tl = Object.values(T).sort((a,b)=>(b.pts-b.got)-(a.pts-a.got) || a.topic.localeCompare(b.topic));
  $('#topics').innerHTML = tl.map(t=>{ const pc=Math.round(100*t.got/t.pts);
    return '<div class="tp'+(t.wrong.length?' weak':'')+'"><div class="nm"><span>'+esc(t.topic)+'</span><span>'+(t.wrong.length?'다시 보기':'잘했어요 ✓')+' · '+pc+'%</span></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>'; }).join('');
  const weak = tl.filter(t=>t.wrong.length);
  let adv = '';
  if(!weak.length) adv = '<div class="adv"><p><b>틀린 문제가 없어요! 🎉</b> 정말 잘했어요. 아래 "더 연습하고 싶은 문제"에서 숫자를 바꿔 한 번 더 도전해 봐요.</p></div>';
  else{
    const first = weak[0];
    adv = '<div class="adv"><p><b>가장 먼저 복습하면 좋은 부분</b>: '+esc(first.topic)+(first.pages.size?' (교과서 '+[...first.pages].join(', ')+')':'')+'</p><p>틀린 문제의 연습 문제를 풀어 보고, 같은 유형을 연속으로 2번 맞히면 이해한 거예요.</p></div>';
    adv += weak.map(t=>'<div class="adv"><p><b>'+esc(t.topic)+'</b>'+(t.pages.size?' · '+[...t.pages].join(', '):'')+'</p>'+t.wrong.map(r=>'<p>'+r.q.no+'번: '+esc(r.q.remedial||'교과서를 다시 읽고 선생님께 물어봐요.')+'</p>').join('')+'</div>').join('');
  }
  $('#adv').innerHTML = adv;
  // 틀린 문제 카드
  const wrong = RES.filter(r=>r.v!=='정답');
  $('#wrongH').textContent = wrong.length ? '다시 볼 문제 ('+wrong.length+'개)' : '';
  $('#wrongList').innerHTML = wrong.map(r=>'<section class="q bad" id="q'+r.q.no+'"></section>').join('');
  wrong.forEach(r=>renderCard(r.q.no));
  $('#moreList').innerHTML = RES.filter(r=>r.v==='정답').map(r=>'<section class="q" id="q'+r.q.no+'"></section>').join('') || '<p class="hint">모든 문제가 오답노트에 있어요.</p>';
  RES.filter(r=>r.v==='정답').forEach(r=>renderCard(r.q.no));
  $('#moreCard').hidden = !RES.some(r=>r.v==='정답');
  $('#load').hidden = true; $('#res').hidden = false; scrollTo(0,0);
}
const VTXT = {'정답':'맞았어요','부분':'부분 점수','오답':'틀렸어요','미응답':'안 풀었어요','확인':'선생님이 채점해요'};
function renderCard(no){
  const r = RES.find(x=>x.q.no===no), q = r.q, el = $('#q'+no); if(!el) return;
  const cls = r.v==='정답'?'ok':r.v==='부분'||r.v==='확인'?'mid':'';
  const pr = PR[no]||{streak:0};
  let h = '<div class="qh"><div class="qn '+cls+'">'+no+'</div><div style="flex:1;min-width:0">'
    +'<span class="tag">'+VTXT[r.v]+(r.v==='부분'?' ('+r.got+'/'+q.points+'점)':'')+'</span>'+(q.topic?'<span class="tag">'+esc(q.topic)+'</span>':'')+(q.page?'<span class="tag">교과서 '+esc(q.page)+'</span>':'')
    +qBody(q, r.a, true);
  if(q.type!=='choice') h += '<div class="ans2"><div class="m"><small>내 답</small>'+mineText(q,r.a)+'</div><div class="r"><small>정답</small>'+rightText(q)+'</div></div>';
  if(r.note) h += '<p class="hint">'+esc(r.note)+'</p>';
  if(r.v!=='정답' && q.remedial) h += '<div class="rem"><small>이렇게 공부해요</small><br>'+esc(q.remedial)+'</div>';
  h += '<div class="prac" id="pr'+no+'"></div>';
  h += '<div class="row mrow"><button class="btn sm" data-act="prac" data-q="'+no+'">'+(VARIANTS[no]?'✏️ 숫자를 바꿔서 연습하기':'✏️ 다시 풀어 보기')+'</button>'+(pr.streak>=2?'<span class="streak">🎓 연속 '+pr.streak+'번 맞혔어요!</span>':pr.streak?'<span class="streak">연속 '+pr.streak+'번 맞힘</span>':'')+'</div>';
  h += '</div></div>';
  el.innerHTML = h;
  if(P[no]) pracRender(no);
}

/* ---------- 연습 문제 ---------- */
function shuffleVariant(q){
  const v = Object.assign({}, q);
  if(q.type==='choice' && q.labelStyle!=='sym'){
    const perm = R.shuffle(q.options.map((_,i)=>i));
    v.options = perm.map(i=>q.options[i]); v.answer = q.answer.map(o=>perm.indexOf(o-1)+1).sort((a,b)=>a-b);
    v.expl = '같은 문제를 보기 순서만 바꾸었어요. '+(q.remedial||'');
  } else v.expl = q.remedial||'';
  return v;
}
function newPractice(no){
  const q = qOf(no), g = VARIANTS[no];
  const pq = g ? g() : shuffleVariant(q);
  pq.fromVariant = !!g; pq.src = q;
  P[no] = {pq, sel:[], vals:[], sym:null, ox:[], txt:'', checked:false, ok:null};
}
function pracRender(no){
  const s = P[no], pq = s.pq, box = $('#pr'+no); if(!box) return;
  const dis = s.checked;
  let h = '<div class="pq"><div class="ttl">'+(pq.fromVariant?'새 숫자로 연습':'다시 풀어 보기')+'</div><div class="stem">'+fmt(pq.stem)+'</div>';
  if(pq.image) h += '<img class="qimg" src="'+pq.image+'" alt="문제 그림">';
  if(pq.passage) h += '<div class="pass">'+pq.passage.map(p=>'<p>'+fmt(p)+'</p>').join('')+'</div>';
  if(pq.box) h += '<div class="box"><div class="bt">&lt;보 기&gt;</div>'+pq.box.map(p=>'<p>'+fmt(p)+'</p>').join('')+'</div>';
  const t = pq.type;
  if(t==='short'){
    h += pq.parts.map((p,i)=>'<div class="ans"><span class="lb">'+fmt(p.label)+'</span><input class="t" data-pi="'+i+'" data-q="'+no+'" inputmode="numeric" autocomplete="off" maxlength="12" value="'+esc(s.vals[i]||'')+'"'+(dis?' disabled':'')+'>'+(pq.unit?'<span class="lb">'+esc(pq.unit)+'</span>':'')+'</div>').join('');
  } else if(t==='choice'){
    h += pq.pick>1?'<div class="hint">정답 '+pq.pick+'개를 골라요.</div>':pq.pick===0?'<div class="hint">알맞은 것을 모두 골라요.</div>':'';
    const sym = pq.labelStyle==='sym';
    h += (sym?'<div class="symrow">':'')+pq.options.map((o,i)=>{ let c='opt'; const on=s.sel.includes(i+1);
      if(dis){ if(pq.answer.includes(i+1)) c+=' right'; else if(on) c+=' wrong'; } else if(on) c+=' on';
      return '<button class="'+c+'" data-act="pc" data-q="'+no+'" data-i="'+(i+1)+'"'+(dis?' disabled':'')+'><span class="no">'+lab(pq,i)+'</span>'+(sym?'':'<span>'+fmt(o)+'</span>')+'</button>'; }).join('')+(sym?'</div>':'');
  } else if(t==='symbol'){
    h += '<div class="cmp"><span>'+fmt(pq.left)+'</span><span class="symrow">'+pq.symbols.map(x=>'<button class="opt'+(s.sym===x?' on':'')+(dis&&x===pq.answer?' right':dis&&s.sym===x?' wrong':'')+'" data-act="ps" data-q="'+no+'" data-v="'+esc(x)+'"'+(dis?' disabled':'')+'><span class="no">'+esc(x)+'</span></button>').join('')+'</span><span>'+fmt(pq.right)+'</span></div>';
  } else if(t==='ox'){
    h += pq.items.map((x,i)=>'<div class="oxrow"><span>'+fmt(x)+'</span><button class="oxb'+(s.ox[i]?' on':'')+'" data-act="po" data-q="'+no+'" data-i="'+i+'"'+(dis?' disabled':'')+'>○</button></div>').join('');
  } else if(t==='written'){
    h += '<textarea class="t" data-pt="1" data-q="'+no+'" placeholder="내 생각을 써 봐요"'+(dis?' disabled':'')+'>'+esc(s.txt)+'</textarea>';
  } else {
    h += '<p class="hint">이 문제는 선생님과 함께 다시 풀어 봐요.</p>';
  }
  if(!dis && ['short','choice','symbol','ox','written'].includes(t)) h += '<div class="row"><button class="btn sm" data-act="pcheck" data-q="'+no+'">확인하기</button></div>';
  if(dis){
    if(s.ok===true) h += '<div class="fb ok">정답이에요! 👏'+(pq.expl?'<p>'+fmt(pq.expl)+'</p>':'')+'</div>';
    else if(s.ok===false) h += '<div class="fb no">아쉬워요. 정답은 이거예요.<p>'+pracCorrect(pq)+'</p>'+(pq.expl?'<p>'+fmt(pq.expl)+'</p>':'')+'</div>';
    else h += '<div class="fb nt">모범 답안과 비교해 봐요.<p>'+esc((pq.src&&pq.src.sample)||pq.sample||'')+'</p></div>';
    h += '<div class="row"><button class="btn sm" data-act="prac" data-q="'+no+'">'+(pq.fromVariant?'🔄 다른 숫자로 또 풀기':'🔄 다시 풀기')+'</button><button class="btn ghost sm" data-act="pclose" data-q="'+no+'">닫기</button></div>';
  }
  h += '</div>';
  box.innerHTML = h;
}
function pracCorrect(pq){
  if(pq.type==='short') return pq.parts.map(p=>fmt(p.label)+' <b>'+esc(p.answer)+'</b>').join('<br>');
  if(pq.type==='choice') return esc(pq.answer.map(i=>lab(pq,i-1)+(pq.labelStyle==='sym'?'':' '+pq.options[i-1])).join(', '));
  if(pq.type==='symbol') return fmt(pq.left)+' <b>'+esc(pq.answer)+'</b> '+fmt(pq.right);
  if(pq.type==='ox') return pq.items.map((x,i)=>'('+(i+1)+') '+(pq.answer[i]?'○':'×')).join('  ');
  return '';
}
function pracCheck(no){
  const s = P[no], pq = s.pq; let ok = null;
  if(pq.type==='short'){ if(!pq.parts.some((p,i)=>norm(s.vals[i])!=='')){ toast('답을 먼저 써 봐요.'); return; } ok = pq.parts.every((p,i)=>eqAns(s.vals[i],p.answer)); }
  else if(pq.type==='choice'){ if(!s.sel.length){ toast('먼저 하나를 골라 봐요.'); return; } ok = sameSet(s.sel, pq.answer); }
  else if(pq.type==='symbol'){ if(!s.sym){ toast('먼저 하나를 골라 봐요.'); return; } ok = s.sym===pq.answer; }
  else if(pq.type==='ox'){ ok = pq.items.every((x,i)=>!!s.ox[i]===!!pq.answer[i]); }
  else if(pq.type==='written'){ if(!norm(s.txt)){ toast('먼저 써 봐요.'); return; } ok = null; }
  s.checked = true; s.ok = ok;
  const pr = PR[no] = PR[no]||{streak:0};
  if(ok===true) pr.streak++; else if(ok===false) pr.streak = 0;
  saveProg(); pracRender(no);
  if(ok===true && pr.streak===2) toast('🎓 연속 2번 맞혔어요! 이 유형은 이제 잘해요.');
  renderStreak(no);
}
function renderStreak(no){ const row = $('#q'+no+' .mrow'); if(!row) return; let sp=row.querySelector('.streak'); const st=(PR[no]||{}).streak||0;
  if(!st){ if(sp) sp.remove(); return; } if(!sp){ sp=document.createElement('span'); sp.className='streak'; row.appendChild(sp); } sp.textContent = st>=2?'🎓 연속 '+st+'번 맞혔어요!':'연속 '+st+'번 맞힘'; }

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const no = +b.dataset.q, act = b.dataset.act;
  if(act==='prac'){ newPractice(no); pracRender(no); $('#pr'+no).scrollIntoView({block:'nearest',behavior:'smooth'}); return; }
  const s = P[no]; if(!s) return;
  if(act==='pclose'){ delete P[no]; $('#pr'+no).innerHTML=''; return; }
  if(act==='pcheck'){ pracCheck(no); return; }
  if(s.checked) return;
  const pq = s.pq;
  if(act==='pc'){ const i=+b.dataset.i;
    if(pq.pick===1) s.sel=[i]; else if(s.sel.includes(i)) s.sel=s.sel.filter(x=>x!==i);
    else if(pq.pick>1 && s.sel.length>=pq.pick){ toast('정답은 '+pq.pick+'개만 고를 수 있어요.'); return; } else s.sel.push(i); }
  else if(act==='ps') s.sym = b.dataset.v;
  else if(act==='po'){ const i=+b.dataset.i; s.ox[i]=!s.ox[i]; }
  pracRender(no);
});
document.addEventListener('input', e=>{
  const el = e.target; const no = +el.dataset.q; if(!P[no]) return;
  if(el.dataset.pi!==undefined) P[no].vals[+el.dataset.pi] = el.value;
  else if(el.dataset.pt) P[no].txt = el.value;
});
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.dataset && e.target.dataset.pi!==undefined){ pracCheck(+e.target.dataset.q); } });

/* ---------- 서버(Supabase)에서 내 기록 불러오기 ---------- */
// 서버는 '시험 번호 + 번호 + 이름'이 맞고, 선생님이 이 시험의 오답노트를 공개했을 때만 내 최근 제출 한 건을 돌려준다.
try{ const m = JSON.parse(localStorage.getItem('ut-nb-me')||'null'); if(m){ $('#lkNo').value=m.no||''; $('#lkName').value=m.name||''; } }catch(e){}
async function lookup(){
  const msg = $('#lkMsg'); msg.hidden = true;
  const no = parseInt($('#lkNo').value,10), name = $('#lkName').value.trim();
  if(!(no>=1&&no<=60) || !name){ msg.textContent='번호와 이름을 모두 써 주세요.'; msg.hidden=false; return; }
  if(!CFG || !CFG.supabaseUrl || !CFG.supabaseAnonKey){ msg.textContent='이 파일에는 서버 연결이 없어요. 아래에서 답안 파일로 불러와 봐요.'; msg.hidden=false; return; }
  const btn = $('#btnLookup'); btn.disabled = true; btn.textContent = '불러오는 중…';
  try{
    const r = await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/unit_test_my_submission', {method:'POST',
      headers:{apikey:CFG.supabaseAnonKey, Authorization:'Bearer '+CFG.supabaseAnonKey, 'Content-Type':'application/json'},
      body: JSON.stringify({p_test_id:TEST.id, p_student_no:no, p_student_name:name})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    if(d.status==='ok'){
      try{ localStorage.setItem('ut-nb-me', JSON.stringify({no,name})); }catch(e){}
      let score=null;
      try{ const r2 = await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/unit_test_my_score', {method:'POST',
        headers:{apikey:CFG.supabaseAnonKey, Authorization:'Bearer '+CFG.supabaseAnonKey, 'Content-Type':'application/json'},
        body: JSON.stringify({p_test_id:TEST.id, p_student_no:no, p_student_name:name})}); if(r2.ok) score = await r2.json(); }catch(e){}
      showResult({test_id:TEST.id, student_no:d.student_no, student_name:d.student_name, answers:d.answers||{}, timed_out:!!(d.meta&&d.meta.timed_out), score});
    } else if(d.status==='not_released'){ msg.textContent='아직 오답노트를 열 수 없어요. 선생님이 열어 주실 때까지 기다려 봐요.'; msg.hidden=false; }
    else { msg.textContent='번호 '+no+', 이름 '+name+' 의 제출 기록을 찾지 못했어요. 번호와 이름이 시험 때와 똑같은지 확인해 봐요.'; msg.hidden=false; }
  }catch(err){ msg.textContent='서버에서 불러오지 못했어요. 인터넷을 확인하거나 아래 답안 파일로 불러와 봐요.'; msg.hidden=false; }
  btn.disabled = false; btn.textContent = '내 기록 불러오기';
}
$('#btnLookup').onclick = lookup;
$('#lkName').addEventListener('keydown', e=>{ if(e.key==='Enter') lookup(); });

/* ---------- 파일 불러오기 ---------- */
function readFile(f){
  const err = $('#loadErr'); err.hidden = true;
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let sub; try{ sub = JSON.parse(rd.result); }catch(e){ err.textContent='파일을 읽을 수 없어요. 시험을 낼 때 저장된 .json 파일이 맞는지 확인해 봐요.'; err.hidden=false; return; }
    if(!sub || !sub.answers || sub.student_no==null){ err.textContent='이 파일은 답안 파일이 아닌 것 같아요.'; err.hidden=false; return; }
    if(sub.test_id!==TEST.id){ err.textContent='이 파일은 다른 시험('+(sub.title||sub.test_id)+')의 답안이에요. "'+TEST.title+'" 시험의 답안 파일을 골라 봐요.'; err.hidden=false; return; }
    showResult(sub);
  };
  rd.readAsText(f);
}
$('#file').addEventListener('change', e=>readFile(e.target.files[0]));
const drop = $('#drop');
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{ e.preventDefault(); drop.classList.add('on'); }));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{ e.preventDefault(); drop.classList.remove('on'); }));
drop.addEventListener('drop', e=>readFile(e.dataTransfer.files[0]));
$('#btnOther').onclick = ()=>{ $('#res').hidden = true; $('#load').hidden = false; $('#file').value=''; scrollTo(0,0); };
</script>
