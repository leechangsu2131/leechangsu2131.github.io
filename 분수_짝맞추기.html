<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%83%8F</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>분수 짝 맞추기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F8FC;--ink:#25324A;--sub:#6B7690;--blue:#3D5A80;--blue-soft:#DCE6F2;--org:#E8873A;--org-soft:#FBE6D2;--ok:#4C8C5C;--ok-soft:#E1F0E3;--bad:#C0503F;--bad-soft:#FAE4E0;--line:#D7E3EE}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Gowun Batang",serif;min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{max-width:900px;margin:0 auto;padding:14px 12px 30px}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:30px;margin:0;color:var(--blue);text-align:center}
.sub{text-align:center;color:var(--sub);font-size:14px;margin:2px 0 14px}
.box{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:0 3px 14px rgba(61,90,128,.08);margin-bottom:12px}
.t{font-family:"Jua",sans-serif;font-size:21px;color:var(--blue);margin-bottom:8px}
.btn{font-family:"Jua",sans-serif;font-size:19px;padding:12px 22px;border-radius:14px;border:0;background:var(--blue);color:#fff;cursor:pointer}
.btn.org{background:var(--org)}.btn.ghost{background:var(--blue-soft);color:var(--blue)}.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;font-size:16px}
.who input{height:44px;border:2px solid var(--blue);border-radius:10px;font-size:17px;padding:0 10px;font-family:inherit;-webkit-user-select:text;user-select:text}
.who .num{width:80px;text-align:center}.who .nm{width:170px}.who .code{width:120px;text-align:center;font-family:"Jua",sans-serif;font-size:24px;letter-spacing:4px}
.mode{display:block;width:100%;text-align:left;margin:0 0 10px;padding:14px 18px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;color:var(--ink)}
.mode:hover{border-color:var(--blue);background:var(--blue-soft)}
.mode b{display:block;font-family:"Jua",sans-serif;font-weight:400;font-size:20px;color:var(--blue)}
.mode span{font-size:14px;color:var(--sub)}
.msg{font-size:15px;margin-top:8px;min-height:20px}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.hint{font-size:13.5px;color:var(--sub);margin-top:6px;line-height:1.6}

.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;font-family:"Jua",sans-serif}
.fr .n{border-bottom:3px solid currentColor;padding:0 6px}.fr .d{padding:0 6px}
.mx{display:inline-flex;align-items:center;vertical-align:middle;font-family:"Jua",sans-serif}.mx b{font-weight:400;font-size:1.15em;margin-right:2px}
.bd{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:10px;max-width:560px;margin:8px auto}
.cdb{aspect-ratio:3/4;border-radius:14px;border:3px solid var(--blue);background:var(--org);color:#fff;font-family:"Jua",sans-serif;font-size:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .15s}
.cdb:active{transform:scale(.96)}
.cdb.up{background:#fff;color:var(--ink);border-color:var(--org);font-size:28px}
.cdb.sel{background:var(--org-soft);box-shadow:0 0 0 5px #F4C79B;transform:scale(1.04)}.cdb.m0{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);cursor:default}
.cdb.m1{background:var(--org-soft);border-color:var(--org);color:#b4560f;cursor:default}
.cdb.ms{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);cursor:default}
.cdb .fr{font-size:26px}.cdb .mx{font-size:24px}.bd.big .cdb{font-size:44px}.bd.big .fr{font-size:40px}.bd.big .mx{font-size:36px}.bd.big{max-width:600px;gap:14px}.bd.big .cdb{aspect-ratio:3/4}
.cdb{flex-direction:column;gap:4px}.cdb.k1{border-color:#D6453D;box-shadow:0 0 0 4px #F7C9C5}.cdb.k2{border-color:#E0A21B;box-shadow:0 0 0 4px #F8E4A8}.cdb.k3{border-color:#3E9A5B;box-shadow:0 0 0 4px #BFE3C9}.cdb.k4{border-color:#3C7DD9;box-shadow:0 0 0 4px #C3D9F6}
.mb{display:flex;flex-direction:column;gap:2px;margin-top:4px}.mr{display:flex;gap:1px}.mr i{display:block;width:12px;height:10px;border:1.5px solid var(--blue);background:#fff}.mr i.on{background:var(--org);border-color:#c76a22}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}.pkb{height:10px;border-radius:99px;background:#E7EEF5;margin:8px auto 0;max-width:560px;overflow:hidden}.pkb i{display:block;height:100%;background:linear-gradient(90deg,#8CC8A0,#4C8C5C)}
.bn{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:"Jua",sans-serif;font-size:18px;color:var(--blue);margin-bottom:4px}
.bn .sc b{color:var(--org);font-size:22px;font-weight:400}
.bn .turn{padding:4px 14px;border-radius:99px;background:var(--org-soft);color:#b4560f}
.fb{text-align:center;font-family:"Jua",sans-serif;font-size:18px;min-height:26px;color:var(--blue)}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.res{text-align:center}.res .big{font-family:"Jua",sans-serif;font-size:36px;color:var(--org)}
.rl{text-align:left;font-size:15px;line-height:1.9;margin-top:10px;max-height:220px;overflow:auto}
@media (max-height:520px) and (orientation:landscape){.app{padding:4px}h1,.sub{display:none}.bd{gap:6px;max-width:none;grid-template-columns:repeat(var(--cols,4),1fr);margin:4px 0}.cdb{font-size:20px;aspect-ratio:auto;height:calc(50vh - 44px);width:100%}.cdb .fr{font-size:18px}.cdb .mx{font-size:17px}.bn{font-size:14px;margin:0}.fb{min-height:18px;font-size:14px}}
</style>
</head>
<body>
<div class="app">
  <h1>🃏 분수 짝 맞추기</h1><p class="sub">가분수 카드와 값이 같은 대분수 카드를 찾아 짝을 맞춰요</p>
  <div id="main"></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rand(0,a.length-1)];
const SUPA_HOST='erzdvlcbjneabxqwnwfy.supabase.co', SUPA_KEY='sb_publishable_29w26VjvhHwI5O6iKOXTwA_sSTKUhfz', SUPA_URL='https://'+SUPA_HOST;
const ROSTER=['강시우','김가을','김동규','김주안','박민서','박서우','박현규','백다온','오지윤','이서우','이예나','이윤슬','정두영','조주아','천선율','한예기','황보검','최윤채','박선우'];
const LVS={'쉬움':{pairs:3,dmin:3,dmax:5,wmax:1,show:4500,peek:25000,re:3,hint:0,cols:3,label:'🌱 쉬움'},'보통':{pairs:5,dmin:3,dmax:7,wmax:2,show:3000,peek:30000,re:2,hint:0,cols:5,label:'🌿 보통'},'어려움':{pairs:8,dmin:3,dmax:9,wmax:3,show:1700,peek:40000,re:1,hint:0,cols:4,label:'🌳 어려움'}};
let lvName='쉬움', visMode=false, barMode=false; const LV=()=>LVS[lvName];
const MOCK=new URLSearchParams(location.search).get('mock')==='1';
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const mx=(w,n,d)=>`<span class="mx"><b>${w}</b>${fr(n,d)}</span>`;
const gcd=(a,b)=>b?gcd(b,a%b):a;
const face=c=>c.k==='i'?fr(c.n,c.d):mx(c.w,c.q,c.d);
const txt=c=>c.k==='i'?`${c.n}/${c.d}`:`${c.w}과 ${c.q}/${c.d}`;
function Net(code,onMsg,onStatus){
  const sid=Math.random().toString(36).slice(2,8), H={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY};
  let last=0, alive=false, fails=0, bc=null, timer=null;
  const base=SUPA_URL+'/rest/v1/battle_msgs';
  async function poll(){
    if(!alive) return;
    try{
      const r=await fetch(base+'?room=eq.'+code+'&id=gt.'+last+'&order=id.asc&limit=50&select=id,body',{headers:H,cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const rows=await r.json(); fails=0;
      for(const x of rows){ last=Math.max(last,x.id); if(x.body&&x.body._s!==sid) onMsg(x.body); }
    }catch(e){ fails++; if(fails>=12){ alive=false; onStatus('closed','연결 끊김'); return; } }
    if(alive) timer=setTimeout(poll,700);
  }
  this.open=async function(){
    if(MOCK){ bc=new BroadcastChannel('fracbattle-'+code); bc.onmessage=e=>onMsg(e.data); setTimeout(()=>onStatus('ok'),50); return; }
    try{
      const r=await fetch(base+'?room=eq.'+code+'&order=id.desc&limit=1&select=id',{headers:H,cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const rows=await r.json(); last=rows.length?rows[0].id:0; alive=true; onStatus('ok'); poll();
    }catch(e){ onStatus('error',String(e&&e.message||e)); }
  };
  let q=Promise.resolve();
  this.send=function(o){
    if(bc){ bc.postMessage(o); return; }
    const body=Object.assign({_s:sid},o);
    q=q.then(async()=>{ for(let k=0;k<3;k++){ try{ const r=await fetch(base,{method:'POST',headers:Object.assign({'Content-Type':'application/json','Prefer':'return=minimal'},H),body:JSON.stringify({room:code,body}),keepalive:true}); if(r.ok) return; }catch(e){} await new Promise(z=>setTimeout(z,400)); } });
  };
  this.close=()=>{ alive=false; clearTimeout(timer); try{ if(bc) bc.close(); }catch(e){} };
}


let mode=null, me=[null,null], net=null, code='', names=['',''], S=null, recorded=false, myIdx=0, tmr=null, t0=0;
const main=$('main');
function resolveStudent(p){ const n=parseInt(p.num,10), ok=(n>=1&&n<=ROSTER.length&&ROSTER[n-1]===p.name);
  return {recordName:ok?ROSTER[n-1]:'미분류',note:ok?'':`[확인필요 · 학생 입력: 번호 ${p.num} / 이름 ${p.name}] `}; }
function makeDeck(){
  const used=new Set(), pairs=[]; let guard=0;
  while(pairs.length<LV().pairs&&guard++<500){ const d=rand(LV().dmin,LV().dmax), w=rand(1,LV().wmax), q=rand(1,d-1), n=w*d+q, g=gcd(n,d), key=(n/g)+'/'+(d/g);
    if(used.has(key)) continue; used.add(key); pairs.push({d,w,q,n}); }
  const deck=[]; pairs.forEach((p,i)=>{ deck.push({pair:i,k:'i',n:p.n,d:p.d}); deck.push({pair:i,k:'m',w:p.w,q:p.q,d:p.d}); });
  for(let i=deck.length-1;i>0;i--){ const j=rand(0,i); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  return deck;
}
function home(){
  mode=null; S=null; clearTimeout(tmr); if(net){ net.close(); net=null; }
  main.innerHTML=`<div class="box"><div class="t" style="font-size:17px;margin-top:0">난이도</div><div class="row" id="lvs" style="margin-bottom:10px">${Object.keys(LVS).map(k=>`<button class="btn ${k===lvName?'org':'ghost'}" data-lv="${k}" style="font-size:17px;padding:10px 16px">${LVS[k].label}</button>`).join('')}</div><div class="t" style="font-size:17px;margin-top:6px">선택</div><div style="margin-bottom:6px;font-size:16.5px;line-height:2.1"><label style="cursor:pointer;display:block"><input type="checkbox" id="cbBar" ${barMode?'checked':''} style="width:22px;height:22px;vertical-align:middle"> 📊 분수 막대 보이기 <span style="color:var(--sub);font-size:14px">(카드에 막대 그림이 함께 나와요)</span></label><label style="cursor:pointer;display:block"><input type="checkbox" id="cbVis" ${visMode?'checked':''} style="width:22px;height:22px;vertical-align:middle"> 👀 모든 카드 보며 하기 <span style="color:var(--sub);font-size:14px">(기억이 아니라 계산으로 찾는 모드)</span></label></div><div class="hint" id="lvh"></div><div class="t">누구와 할까요?</div>
    <button class="mode" id="mSolo"><b>🙋 혼자서</b><span>가장 적게 뒤집어서 모든 짝을 찾아 보세요.</span></button>
    <button class="mode" id="mLocal"><b>🤝 한 기기로 둘이서</b><span>번갈아 두 장씩 뒤집어요. 짝을 맞히면 한 번 더!</span></button>
    <button class="mode" id="mHost"><b>📱 방 만들기 (두 기기)</b><span>방 번호가 나와요. 친구가 그 번호로 들어오면 시작해요.</span></button>
    <button class="mode" id="mGuest"><b>📲 방 번호로 들어가기 (두 기기)</b><span>친구가 알려 준 4자리 번호를 입력해요.</span></button>
    <div class="hint">짝 맞추기 방법: 카드 두 장을 뒤집어 <b>값이 같은 가분수와 대분수</b>이면 짝이에요.</div></div>`;
  const lvDesc=()=>{ const L=LV(); $('lvh').textContent=visMode?`카드 ${L.pairs*2}장 · 모든 카드가 계속 보여요. 계산해서 값이 같은 두 장을 찾아 눌러요.`:`카드 ${L.pairs*2}장 · 처음에 ${L.peek/1000}초 동안 모두 보여 줘요(계산할 시간) · 다시 보기 ${L.re}번 · 틀리면 ${(L.show/1000)}초 동안 보여 줘요`; }; lvDesc();
  $('lvs').onclick=e=>{ const b=e.target.closest('[data-lv]'); if(!b) return; lvName=b.dataset.lv; document.querySelectorAll('#lvs .btn').forEach(x=>{ x.className='btn '+(x.dataset.lv===lvName?'org':'ghost'); }); lvDesc(); };
  $('cbBar').onchange=e=>{ barMode=e.target.checked; }; $('cbVis').onchange=e=>{ visMode=e.target.checked; lvDesc(); };
  $('mSolo').onclick=()=>gate('solo'); $('mLocal').onclick=()=>gate('local'); $('mHost').onclick=()=>gate('host'); $('mGuest').onclick=()=>gate('guest');
}
function whoRow(i,label){ return `<div class="who"><b>${label}</b><label>번호</label><input type="number" class="num" id="n${i}" min="1" max="19" inputmode="numeric"><label>이름</label><input type="text" class="nm" id="m${i}" placeholder="이름"></div>`; }
function gate(md){
  mode=md; recorded=false;
  main.innerHTML=`<div class="box"><div class="t">${md==='local'?'두 사람의 번호와 이름':'내 번호와 이름'}</div>
    ${md==='local'?whoRow(0,'🅰 첫째')+whoRow(1,'🅱 둘째'):whoRow(0,'나')}
    ${md==='guest'?'<div class="who"><b>방 번호</b><input type="text" class="code" id="code" maxlength="4" inputmode="numeric" placeholder="0000"></div>':''}
    <div class="row"><button class="btn org" id="go">${md==='host'?'방 만들기':md==='guest'?'들어가기':'시작 🃏'}</button><button class="btn ghost" id="back">← 뒤로</button></div><div class="msg" id="gmsg"></div></div>`;
  $('back').onclick=home;
  $('go').onclick=()=>{
    const ps=(md==='local'?[0,1]:[0]).map(i=>({num:$('n'+i).value.trim(),name:$('m'+i).value.trim()}));
    if(ps.some(p=>!p.num||!p.name)){ $('gmsg').className='msg err'; $('gmsg').textContent='번호와 이름을 모두 써 주세요.'; return; }
    ps.forEach((p,i)=>{ me[i]=Object.assign(p,resolveStudent(p)); });
    if(md==='solo'){ names=[me[0].name,'']; myIdx=0; startGame(makeDeck()); }
    else if(md==='local'){ names=[me[0].name,me[1].name]; myIdx=0; startGame(makeDeck()); }
    else if(md==='host'){ names=[me[0].name,'']; myIdx=0; code=String(rand(1000,9999)); connect(true); }
    else { code=$('code').value.trim(); if(!/^\d{4}$/.test(code)){ $('gmsg').className='msg err'; $('gmsg').textContent='방 번호 4자리를 써 주세요.'; return; } names=['',me[0].name]; myIdx=1; connect(false); }
  };
}
function connect(isHost){
  main.innerHTML=`<div class="box res"><div class="t">${isHost?'방 번호':'방에 들어가는 중'}</div>${isHost?`<div class="big" style="letter-spacing:6px">${code}</div><div class="msg" id="cmsg">연결 중...</div><div class="hint">친구가 “방 번호로 들어가기”에서 이 번호를 쓰면 시작해요.</div>`:`<div class="msg" id="cmsg">연결 중...</div>`}<div style="margin-top:10px"><button class="btn ghost" id="back">← 그만두기</button></div></div>`;
  $('back').onclick=home;
  const cm=t=>{ const e=$('cmsg'); if(e) e.textContent=t; };
  net=new Net(code,onNet,(s,why)=>{
    if(s==='error') cm('❌ 연결할 수 없어요. ('+(why||'')+') 한 기기 모드를 이용하세요.');
    else if(s==='closed'){ if(S&&!S.over) bye('연결이 끊어졌어요.'); }
    else if(s==='ok'){ cm(isHost?'친구를 기다리는 중...':'방을 찾는 중...'); if(!isHost){ const tj=()=>{ if(mode!=='guest'||S) return; net.send({t:'join',name:me[0].name}); setTimeout(tj,1500); }; tj(); setTimeout(()=>{ if(!S) cm('방을 찾지 못했어요. 번호를 다시 확인해 보세요.'); },9000); } }
  });
  net.open();
}
function bye(m){ clearTimeout(tmr); if(S) S.over=true; main.innerHTML=`<div class="box res"><div class="t">${m}</div><div class="hint">지금까지의 결과는 기록하지 않아요.</div><button class="btn" id="back">처음으로</button></div>`; $('back').onclick=home; }
addEventListener('pagehide',()=>{ if(net&&(mode==='host'||mode==='guest')) net.send({t:'bye'}); });

function startGame(deck){
  clearTimeout(tmr); recorded=false; t0=Date.now();
  initS(deck);
  if(mode==='host') net.send({t:'start',names,deck,lv:lvName,vis:visMode,bars:barMode});
  draw(); peek();
}
function flip(idx,p){
  if(!S||S.over||S.locked||S.owner[idx]>=0||S.open.includes(idx)||p!==S.turn) return;
  S.open.push(idx);
  if(S.open.length===2){
    const [a,b]=S.open, A=S.deck[a], B=S.deck[b]; S.tries[p]++;
    const hit=A.pair===B.pair;
    S.log.push({a:txt(A),b:txt(B),hit,p});
    if(hit){ S.owner[a]=S.owner[b]=p; S.score[p]++; S.open=[]; S.hs=[]; S.msg='⭕ 짝을 찾았어요! 한 번 더!'; S.cls='ok'; if(S.score[0]+S.score[1]===S.pairs){ S.over=true; draw(); return finish(); } }
    else { S.locked=true; S.msg='❌ 값이 달라요. 잘 기억해 두세요!'; S.cls='bad';
      draw(); tmr=setTimeout(()=>{ S.open=[]; S.hs=[]; S.locked=false; if(mode!=='solo') S.turn=1-S.turn; S.msg=''; S.cls=''; draw(); },S.vis?1600:LV().show); return; }
  } else { S.msg=''; S.cls=''; }
  draw();
}
function onNet(m){
  if(!m) return;
  if(mode==='host'){
    if(m.t==='join'&&!names[1]){ names[1]=m.name||'친구'; startGame(makeDeck()); }
    else if(m.t==='flip'){ if(S&&S.peeking) S.q.push({i:m.i,p:1}); else flip(m.i,1); }
    else if(m.t==='bye'&&S&&!S.over) bye('상대가 나갔어요.');
  } else if(mode==='guest'){
    if(m.t==='start'){ if(S) return; names=m.names; visMode=!!m.vis; barMode=!!m.bars; startGame0(m.deck,m.lv); }
    else if(m.t==='flip'){ if(S&&S.peeking) S.q.push({i:m.i,p:0}); else flip(m.i,0); }
    else if(m.t==='bye'&&S&&!S.over) bye('상대가 나갔어요.');
  }
}
function initS(deck){ S={vis:visMode,bars:barMode,deck,pairs:deck.length/2,lv:lvName,open:[],owner:Array(deck.length).fill(-1),turn:0,score:[0,0],tries:[0,0],locked:false,over:false,msg:'',cls:'',log:[],peeking:false,hn:0,hu:0,hs:[],mk:Array(deck.length).fill(0),re:(mode==='solo'||mode==='local')?LV().re:0,res:0,left:0,q:[]}; }
let tick=null;
function peek(re){ if(S.vis){ S.msg='👀 같은 값의 카드 두 장을 찾아 눌러 보세요!'; S.cls=''; draw(); return; } let ms=re?Math.max(6000,Math.round(LV().peek/3)):LV().peek; if(mode==='host'&&!re) ms+=2500; const ov=+new URLSearchParams(location.search).get('peek'); if(ov) ms=ov;
  clearTimeout(tmr); clearInterval(tick);
  S.peeking=true; S.locked=true; S.open=S.deck.map((c,i)=>i); S.msg=re?'👀 다시 볼 수 있어요':'👀 카드를 보고 짝을 계산해 보세요! 카드를 누르면 색깔 표시를 할 수 있어요.'; S.cls=''; S.end=Date.now()+ms; S.dur=ms; draw();
  tick=setInterval(()=>{ const f=document.getElementById('pk'); if(f) f.style.width=Math.max(0,(S.end-Date.now())/S.dur*100)+'%'; },200);
  tmr=setTimeout(endPeek,ms); }
function endPeek(){ if(!S||!S.peeking) return; clearTimeout(tmr); clearInterval(tick); S.peeking=false; S.locked=false; S.open=[]; S.msg='이제 짝을 찾아 보세요!'; S.cls=''; draw();
  const q=S.q; S.q=[]; q.forEach(m=>flip(m.i,m.p)); }
function startGame0(deck,lv){ clearTimeout(tmr); recorded=false; t0=Date.now(); lvName=lv||lvName; initS(deck); draw(); peek(); }

function barOf(c){ const v=c.k==='i'?c.n:c.w*c.d+c.q, W=Math.ceil(v/c.d); let h='<span class="mb">'; for(let w=0;w<W;w++){ h+='<span class="mr">'; for(let x=0;x<c.d;x++) h+=`<i class="${w*c.d+x<v?'on':''}"></i>`; h+='</span>'; } return h+'</span>'; }
function draw(){
  if(!S) return;
  const two=mode!=='solo', mine=(mode==='host'||mode==='guest')?(S.turn===myIdx):true;
  const who=two?`<span class="turn">${S.over?'끝!':(mode==='local'?names[S.turn]+' 차례':(mine?'내 차례! 두 장을 뒤집어요':names[S.turn]+' 차례'))}</span>`:`<span class="turn">뒤집은 횟수 ${S.tries[0]}</span>`;
  const sc=two?`<span class="sc">${names[0]} <b>${S.score[0]}</b> : <b>${S.score[1]}</b> ${names[1]}</span>`:`<span class="sc">찾은 짝 <b>${S.score[0]}</b> / ${S.pairs}</span>`;
  let h=`<div class="bn">${sc}${who}</div><div class="bd${LV().cols<=3?' big':''}" style="--cols:${LV().cols}">`;
  S.deck.forEach((c,i)=>{ const own=S.owner[i], sel=S.open.includes(i), up=S.vis||sel||own>=0; let cls='cdb'; if(S.vis&&sel&&own<0) cls+=' sel'; if(own>=0) cls+=(two?' m'+own:' ms'); else if(up&&!(S.vis&&!sel)) cls+=' up'; else if(S.vis) cls+=' up';
    if(S.peeking&&S.mk[i]) cls+=' k'+S.mk[i];
    const bar=(S.bars&&up&&own<0)?barOf(c):'';
    h+=`<button class="${cls}" data-i="${i}">${up?face(c)+bar:'?'}</button>`; });
  h+=`</div>`;
  if(S.peeking) h+=`<div class="pkb"><i id="pk" style="width:${Math.max(0,(S.end-Date.now())/S.dur*100)}%"></i></div>${(mode==='solo'||mode==='local')?'<div class="ctl"><button class="btn org" id="pdone">다 봤어요 ✋ 시작</button></div>':''}`;
  else if(!S.vis&&!S.over&&S.re>0&&S.open.length===0&&(mode==='solo'||mode==='local')) h+=`<div class="ctl"><button class="btn ghost" id="repk" style="font-size:16px;padding:8px 14px">👀 카드 다시 보기 (${S.re}번 남음)</button></div>`;
  if(!S.over&&!S.peeking&&S.open.length===1&&S.hn>0&&((mode!=='host'&&mode!=='guest')||S.turn===myIdx)) h+=`<div class="ctl"><button class="btn ghost" id="hint" style="font-size:16px;padding:8px 14px">💡 이 카드를 그림으로 보기 (${S.hn}번 남음)</button></div>`;
  h+=`<div class="fb ${S.cls}">${S.msg||'&nbsp;'}</div>`;
  main.innerHTML=h;
}
main.addEventListener('click',e=>{
  if(e.target.id==='pdone'){ endPeek(); return; }
  if(e.target.id==='hint'){ if(S&&S.hn>0&&S.open.length===1){ S.hn--; S.hu++; S.hs.push(S.open[0]); draw(); } return; }
  if(e.target.id==='repk'){ if(S&&S.re>0&&!S.locked&&!S.over){ S.re--; S.res++; peek(true); } return; }
  const b=e.target.closest('.cdb'); if(b&&S&&S.peeking){ const i=+b.dataset.i; S.mk[i]=(S.mk[i]+1)%5; draw(); return; }
  if(false){}
  b0(e);
});
function b0(e){
  const b=e.target.closest('.cdb'); if(!b||!S||S.over) return; const i=+b.dataset.i;
  const p=(mode==='host'||mode==='guest')?myIdx:S.turn;
  if((mode==='host'||mode==='guest')&&S.turn!==myIdx) return;
  if(S.locked||S.owner[i]>=0||S.open.includes(i)) return;
  flip(i,p); if(mode==='host'||mode==='guest') net.send({t:'flip',i});
}
function finish(){
  clearTimeout(tmr); const sec=Math.round((Date.now()-t0)/1000);
  const w=mode==='solo'?-1:(S.score[0]>S.score[1]?0:(S.score[1]>S.score[0]?1:-1));
  const head=mode==='solo'?`🎉 모두 찾았어요! (${S.tries[0]}번 뒤집음)`:(w<0?'무승부!':((mode==='local')?`🏆 ${names[w]} 승리!`:(w===myIdx?'🏆 내가 이겼어요!':'👏 멋진 대결이었어요')));
  const row=p=>`${names[p]}: 짝 <b>${S.score[p]}</b>개 · 뒤집기 ${S.tries[p]}번`;
  const rl=S.log.map((l,i)=>`<div>${i+1}) ${l.a} ↔ ${l.b} ${l.hit?'⭕':'❌'}${mode==='solo'?'':' ('+names[l.p]+')'}</div>`).join('');
  main.innerHTML=`<div class="box res"><div class="big">${head}</div><div style="font-size:18px;line-height:2">${mode==='solo'?`걸린 시간 ${sec}초`:row(0)+'<br>'+row(1)}</div><div class="rl">${rl}</div><div class="msg" id="smsg">기록을 저장하는 중...</div><div class="row" style="justify-content:center;margin-top:10px">${(mode==='solo'||mode==='local')?'<button class="btn org" id="again">다시 하기 🃏</button>':''}<button class="btn ghost" id="home">처음으로</button></div></div>`;
  $('home').onclick=home; if($('again')) $('again').onclick=()=>startGame(makeDeck());
  saveAll(sec,w);
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function boardPost(st,xp,src){ if(!st||st.recordName==='미분류'||xp<=0) return; try{ fetch(SUPA_URL+'/rest/v1/class_board_events',{method:'POST',keepalive:true,headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({num:parseInt(st.num,10),name:st.recordName,xp:Math.min(200,xp),src:src})}).catch(()=>{}); }catch(e){} }
function addXP(p,xp){ try{ const k='fracProf:'+p.num+':'+p.name; const o=JSON.parse(localStorage.getItem(k)||'null')||{xp:0,badges:[],lvl:1,att:0,cor:0}; o.xp=(o.xp||0)+xp; localStorage.setItem(k,JSON.stringify(o)); }catch(e){} }
async function saveAll(sec,w){
  if(recorded) return; recorded=true;
  const idx=(mode==='local')?[0,1]:[(mode==='guest')?1:0]; let ok=0;
  for(const p of idx){ const st=me[mode==='local'?p:0], o=1-p;
    const eff=Math.round(S.pairs/Math.max(S.pairs,S.tries[p])*100), pos=eff>=60?'긍정✅':(eff>=35?'중립📋':'관찰필요🔍');
    const res=mode==='solo'?'혼자 하기':(w<0?'무승부':(w===p?'승':'패'));
    const rec={'기록제목':'분수 짝 맞추기 기록','날짜':todayStr(),'분야':'학습능력','긍정도':pos,'출처':'학생직접제출','과목':'수학',
      '내용':`${st.note}분수 짝 맞추기[${S.lv}${S.vis?', 카드 보임':', 카드 가림'}${S.res?', 다시 보기 '+S.res+'번':''}${S.bars?', 막대 보임':''}](가분수↔대분수 같은 값 찾기): ${res}${mode==='solo'||mode==='host'||mode==='guest'&&false?'':''}. 찾은 짝 ${S.score[p]}/${S.pairs}, 뒤집은 횟수 ${S.tries[p]}번${mode==='solo'?', 걸린 시간 '+sec+'초':', 상대 '+names[o]}.`,'🧑‍🎓 이름':st.recordName};
    { const _xp=10+S.score[p]*3+(res==='승'?15:0); addXP(st,_xp); boardPost(st,_xp,'pairs'); }
    try{ const r=await fetch(SUPA_URL+'/rest/v1/class-manage',{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(rec)}); if(r.ok) ok++; }catch(e){}
  }
  const m=$('smsg'); if(m){ m.className='msg '+(ok===idx.length?'ok':'err'); m.textContent= ok===idx.length?'✅ 기록이 선생님께 전달되었어요. (경험치도 올랐어요)':'기록 저장에 실패했어요. 인터넷을 확인해 주세요.'; }
}
window.__pm={get S(){return S;},get mode(){return mode;}};
home();
})();
</script>
