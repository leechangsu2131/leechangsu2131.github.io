  {l:'가운데 ①',plan:'물 묻히고 비누 문지르기',para:1,opts:[['먼저 손에 물을 묻히고 비누를 문질러요.'],['마지막으로 손에 물을 묻히고 비누를 문질러요.','u'],['먼저 손에 물만 묻혀요.','c']]},
  {l:'가운데 ②',plan:'손바닥과 손등 닦기',para:1,opts:[['다음으로 손바닥과 손등을 닦아요.'],['먼저 손바닥과 손등을 닦아요.','u'],['다음으로 손톱을 깎아요.','c']]},
  {l:'가운데 ③',plan:'흐르는 물에 헹구기',para:1,opts:[['마지막으로 흐르는 물에 손을 헹궈요.'],['먼저 흐르는 물에 손을 헹궈요.','u'],['마지막으로 비누를 문질러요.','c']]},
  {l:'끝',plan:'정리: 순서대로 씻으면 손이 깨끗해져요',para:2,opts:[['순서대로 씻으면 손이 깨끗해져요.'],['손을 씻으면 배가 불러요.','w'],['먼저 순서대로 씻어요.','u']]}]}
];
/* ---------- 탭 ---------- */
var names=['1 처음 문장','2 끝 문장','3 이어 주는 말','4 계획표→글'];
$('tabs').innerHTML=names.map(function(n,i){return '<button class="tab" role="tab" data-i="'+(i+1)+'" aria-selected="'+(i===0)+'">'+n+'</button>'}).join('');
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.onclick=function(){
  var n=+b.getAttribute('data-i');
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.setAttribute('aria-selected',t===b)});
  for(var i=1;i<=4;i++)$('p'+i).hidden=(i!==n);
}});
/* ---------- 문장틀 채우기 (1·2) ---------- */
function fillModule(pane,title,guide,rounds){
  var st={r:0,f:0,fills:{},act:0,order:{},bad:{}};
  var el=$(pane);
  el.innerHTML='<div class="card"><h2 id="'+pane+'t"></h2><p class="guide">'+guide+'</p><div class="ref" id="'+pane+'ref"></div><div class="frames" id="'+pane+'fr"></div><div class="sent" id="'+pane+'s"></div><div class="chips" id="'+pane+'c"></div><div class="actions"><button class="btn" id="'+pane+'ck">확인</button><button class="btn ghost" id="'+pane+'rs">다시 하기</button></div><div class="msg" id="'+pane+'m"></div><div><button class="btn next" id="'+pane+'nx" hidden>다음 연습으로 ▶</button></div></div>';
  function F(){return rounds[st.r].frames[st.f]}
  function reset(){st.fills={};st.act=0;st.bad={};st.order={};F().blanks.forEach(function(b,i){st.order[i]=shuffle(b.map(function(_,k){return k}))});$(pane+'nx').hidden=true;$(pane+'m').className='msg';render()}
  function render(){
    var R=rounds[st.r];
    $(pane+'t').textContent=title+' '+(st.r+1)+' / '+rounds.length+' · '+R.name;
    $(pane+'ref').textContent=R.ref;
    $(pane+'fr').innerHTML=R.frames.map(function(f,i){return '<button class="fr'+(i===st.f?' on':'')+'" data-f="'+i+'">'+(i===0?'틀 하나':'틀 둘')+'</button>'}).join('');
    var h='';
    F().parts.forEach(function(p){
      if(typeof p==='string')h+='<span>'+p+'</span>';
      else{var fi=st.fills[p],cls='slot'+(fi!==undefined?' fill':'')+(st.act===p?' act':'')+(st.bad[p]?' bad':'');
        h+='<button class="'+cls+'" data-b="'+p+'">'+(fi!==undefined?F().blanks[p][fi][0]:'&nbsp;')+'</button>'}
    });
    $(pane+'s').innerHTML=h;
    var b=st.act,ch='';
    st.order[b].forEach(function(k){ch+='<button class="chip'+(st.fills[b]===k?' sel':'')+'" data-k="'+k+'">'+F().blanks[b][k][0]+'</button>'});
    $(pane+'c').innerHTML=ch;
    Array.prototype.forEach.call($(pane+'fr').querySelectorAll('.fr'),function(x){x.onclick=function(){st.f=+x.getAttribute('data-f');reset()}});
    Array.prototype.forEach.call($(pane+'s').querySelectorAll('.slot'),function(x){x.onclick=function(){st.act=+x.getAttribute('data-b');render()}});
    Array.prototype.forEach.call($(pane+'c').querySelectorAll('.chip'),function(x){x.onclick=function(){
      st.fills[st.act]=+x.getAttribute('data-k');delete st.bad[st.act];
      var n=F().blanks.length,nx=st.act;for(var i=0;i<n;i++){if(st.fills[i]===undefined){nx=i;break}}
      st.act=nx;$(pane+'m').className='msg';render()}});
  }
  $(pane+'ck').onclick=function(){
    var n=F().blanks.length,m=$(pane+'m');
    for(var i=0;i<n;i++)if(st.fills[i]===undefined){msg(m,false,'빈 곳을 모두 채워요. 점선 칸을 눌러 말을 골라요.');return}
    st.bad={};var first=null;
    for(var j=0;j<n;j++)if(st.fills[j]!==0){st.bad[j]=1;if(first===null)first=j}
    if(first===null){
      var s='';F().parts.forEach(function(p){s+=typeof p==='string'?p:F().blanks[p][0][0]});
      render();msg(m,true,'잘했어요! “'+s+'” 이 문장이 글의 '+(pane==='p1'?'처음':'끝')+'에 들어가요.');
      if(st.r<rounds.length-1)$(pane+'nx').hidden=false;else msg(m,true,'잘했어요! “'+s+'” 모두 해냈어요!');
      return;
    }
    var code=F().blanks[first][st.fills[first]][1];
    render();msg(m,false,'다시 생각해 봐요. '+HINT[code]+' (틀린 칸이 빨갛게 보여요.)');
  };
  $(pane+'rs').onclick=reset;
  $(pane+'nx').onclick=function(){st.r++;st.f=0;reset()};
  reset();
}
fillModule('p1','처음 문장 쓰기','틀 하나나 틀 둘을 고르고, 점선 칸을 눌러 알맞은 말을 골라요. 처음에는 “이 글이 무엇을 알려 주는지” 써요.',P1);
fillModule('p2','끝 문장 쓰기','가운데에서 말한 방법을 한 번 더 정리해요. 가운데에 없던 새 내용은 쓰지 않아요.',P2);
/* ---------- 이어 주는 말 (3) ---------- */
(function(){
  var el=$('p3'),order,idx,solved;
  el.innerHTML='<div class="card"><h2>이어 주는 말 고르기</h2><p class="guide">앞 문장과 뒤 문장을 읽고 알맞은 말을 골라요. 앞과 뒤가 <b>비슷한지, 반대인지, 이유가 되는지</b> 생각해 봐요.</p><p class="score" id="p3s"></p><div class="q3" id="p3q"></div><div class="words" id="p3w"></div><div class="msg" id="p3m"></div><div class="actions"><button class="btn next" id="p3n" hidden>다음 문제 ▶</button><button class="btn ghost" id="p3r">처음부터 다시 하기</button></div></div>';
  function start(){order=shuffle(P3.map(function(_,i){return i}));idx=0;solved=0;show()}
  function show(){
    var q=P3[order[idx]];
    $('p3s').textContent='문제 '+(idx+1)+' / '+P3.length+' · 맞힌 문제 '+solved;
    $('p3q').innerHTML='<span>'+q[0]+'</span><span class="gp" id="p3g">&nbsp;</span><span>'+q[1]+'</span>';
    $('p3w').innerHTML=['그리고','그러나','그래서'].map(function(w){return '<button class="wd3" data-w="'+w+'">'+w+'</button>'}).join('');
    $('p3m').className='msg';$('p3n').hidden=true;
    Array.prototype.forEach.call($('p3w').querySelectorAll('.wd3'),function(b){b.onclick=function(){pick(b,q)}});
  }
  function pick(b,q){
    var w=b.getAttribute('data-w'),m=$('p3m');
    if(w===q[2]){
      b.className='wd3 good';$('p3g').textContent=w;$('p3g').className='gp ok';solved++;
      $('p3s').textContent='문제 '+(idx+1)+' / '+P3.length+' · 맞힌 문제 '+solved;
      Array.prototype.forEach.call($('p3w').querySelectorAll('.wd3'),function(x){x.onclick=null});
      if(idx<P3.length-1){msg(m,true,'맞아요! '+EXPL[w]);$('p3n').hidden=false}
      else msg(m,true,'맞아요! '+EXPL[w]+' 모든 문제를 풀었어요!');
    }else{b.className='wd3 bad';msg(m,false,'다시 생각해 봐요. '+q[3])}
  }
  $('p3n').onclick=function(){idx++;show()};
  $('p3r').onclick=start;
  start();
})();
/* ---------- 계획표를 글로 옮기기 (4) ---------- */
(function(){
  var el=$('p4'),r=0,done={},ord={};
  el.innerHTML='<div class="card"><h2 id="p4t"></h2><p class="guide">색 띠에 쓴 계획을 글의 문장으로 바꿔요. 띠마다 알맞은 문장을 하나 골라요. 순서 말(먼저, 다음으로, 끝으로)도 살펴봐요.</p><div id="p4r"></div><div class="prev" id="p4p" hidden></div><div class="msg" id="p4m"></div><div class="actions"><button class="btn ghost" id="p4x">다시 하기</button></div><div><button class="btn next" id="p4n" hidden>다음 연습으로 ▶</button></div></div>';
  function reset(){done={};ord={};P4[r].rows.forEach(function(row,i){ord[i]=shuffle(row.opts.map(function(_,k){return k}))});$('p4m').className='msg';$('p4n').hidden=true;render()}
  function render(){
    var R=P4[r];
    $('p4t').textContent='계획표를 글로 옮기기 '+(r+1)+' / '+P4.length+' · '+R.name;
    var h='';
    R.rows.forEach(function(row,i){
      h+='<div class="row"><div class="strip s'+row.para+'"><b>'+row.l+'</b><span>'+row.plan+'</span></div>';
      if(done[i]!==undefined)h+='<div class="done4">'+row.opts[done[i]][0]+'</div>';
      else{h+='<div class="opts">';ord[i].forEach(function(k){h+='<button class="o4" data-i="'+i+'" data-k="'+k+'">'+row.opts[k][0]+'</button>'});h+='</div><div class="hint" id="p4h'+i+'"></div>'}
      h+='</div>';
    });
    $('p4r').innerHTML=h;
    var ps=[[],[],[]];R.rows.forEach(function(row,i){if(done[i]!==undefined)ps[row.para].push(row.opts[done[i]][0])});
    var pv='';ps.forEach(function(p){if(p.length)pv+='<p><span class="bl"></span>'+p.join(' ')+'</p>'});
    $('p4p').hidden=!pv;$('p4p').innerHTML=pv?'<div style="font-weight:800;color:var(--sub);margin-bottom:6px">내가 만든 글</div>'+pv:'';
    Array.prototype.forEach.call($('p4r').querySelectorAll('.o4'),function(b){b.onclick=function(){pick(b)}});
  }
  function pick(b){
    var i=+b.getAttribute('data-i'),k=+b.getAttribute('data-k'),row=P4[r].rows[i];
    if(k===0){
      done[i]=0;render();
      if(Object.keys(done).length===P4[r].rows.length){
        msg($('p4m'),true,'계획표가 글이 되었어요! 띠 하나가 문장 하나가 되었어요.');
        if(r<P4.length-1)$('p4n').hidden=false;
      }
    }else{b.className='o4 bad';$('p4h'+i).textContent='다시 생각해 봐요. '+HINT[row.opts[k][1]]}
  }
  $('p4x').onclick=reset;
  $('p4n').onclick=function(){r++;reset()};
  reset();
})();
window.__practice={P1:P1,P2:P2,P3:P3,P4:P4};
})();
