<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%90%B8</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>분수 징검다리</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F8FC;--ink:#25324A;--sub:#6B7690;--blue:#3D5A80;--blue-soft:#DCE6F2;--org:#E8873A;--org-soft:#FBE6D2;--ok:#4C8C5C;--ok-soft:#E1F0E3;--bad:#C0503F;--bad-soft:#FAE4E0;--line:#D7E3EE}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Gowun Batang",serif;min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{max-width:900px;margin:0 auto;padding:12px 12px 30px}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:30px;margin:0;color:var(--blue);text-align:center}
.sub{text-align:center;color:var(--sub);font-size:14px;margin:2px 0 10px}
.box{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px 18px;box-shadow:0 3px 14px rgba(61,90,128,.08);margin-bottom:10px}
.btn{font-family:"Jua",sans-serif;font-size:19px;padding:11px 20px;border-radius:14px;border:0;background:var(--blue);color:#fff;cursor:pointer}
.btn.org{background:var(--org)}.btn.ghost{background:var(--blue-soft);color:var(--blue)}.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.t{font-family:"Jua",sans-serif;font-size:17px;color:var(--blue);margin:8px 0 4px}
.opt{display:block;font-size:16px;margin:4px 0;cursor:pointer}.opt input{width:22px;height:22px;vertical-align:middle;margin-right:6px}.opt small{color:var(--sub);font-size:13px}
.hint{font-size:13.5px;color:var(--sub);margin-top:6px;line-height:1.6}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;font-family:"Jua",sans-serif}
.fr .n{border-bottom:3px solid currentColor;padding:0 6px}.fr .d{padding:0 6px}
.mx{display:inline-flex;align-items:center;vertical-align:middle;font-family:"Jua",sans-serif}.mx b{font-weight:400;font-size:1.15em;margin-right:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:"Jua",sans-serif;color:var(--blue);font-size:17px;margin-bottom:6px}
.top b{color:var(--org);font-weight:400;font-size:21px}
.river{background:linear-gradient(#BFE0F5,#9ACCEB);border-radius:18px;padding:34px 8px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:2px;position:relative;margin-bottom:10px;min-height:96px}
.bank{font-size:30px;flex:0 0 auto}
.st{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative}
.st .stone{width:100%;max-width:46px;height:20px;border-radius:50%;background:#B9B2A6;border:2px solid #8E877B}
.st.done .stone{background:#8CC8A0;border-color:#4C8C5C}
.st .fg{position:absolute;top:-34px;font-size:30px;transition:all .3s}
.st.cur .stone{background:#E8DCC8;border-color:#E8873A}
.splash{animation:spl .6s}@keyframes spl{0%{transform:translateY(0)}40%{transform:translateY(12px) rotate(20deg)}100%{transform:none}}
.q{background:var(--org-soft);border:2.5px solid var(--org);border-radius:18px;padding:12px 16px;font-family:"Jua",sans-serif;font-size:22px;text-align:center;line-height:1.7}
.q .big{font-size:26px;color:#b4560f}
.ch{display:grid;gap:10px;margin-top:10px}
.cb{font-family:"Jua",sans-serif;font-size:28px;padding:14px 8px;border-radius:16px;border:3px solid var(--blue);background:#fff;color:var(--ink);cursor:pointer;min-height:76px}
.cb:active{background:var(--blue-soft)}.cb.ok{background:var(--ok-soft);border-color:var(--ok)}.cb.no{background:var(--bad-soft);border-color:var(--bad);animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{text-align:center;font-family:"Jua",sans-serif;font-size:19px;min-height:28px;margin-top:8px;color:var(--blue)}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.tm{height:8px;border-radius:99px;background:#E7EEF5;margin-top:8px;overflow:hidden}.tm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#F4B26B,#E8873A)}
.mb{display:inline-flex;flex-direction:column;gap:2px;margin:4px 6px;vertical-align:middle}.mr{display:flex;gap:1px}.mr i{display:block;width:14px;height:12px;border:1.5px solid var(--blue);background:#fff}.mr i.on{background:var(--org);border-color:#c76a22}
.hp{margin-top:8px;padding:8px 12px;border-radius:14px;background:var(--blue-soft);text-align:center;font-size:16px}
.grp{display:inline-flex;flex-wrap:wrap;gap:1px;border:2.5px solid var(--org);border-radius:10px;padding:2px 4px;margin:3px;background:#fff;font-size:20px}
.res{text-align:center}.res .big{font-family:"Jua",sans-serif;font-size:34px;color:var(--org)}.stars{font-size:36px;letter-spacing:4px}
@media (max-height:520px) and (orientation:landscape){.app{padding:4px 8px}h1,.sub{display:none}.river{padding:26px 6px 6px;min-height:60px;margin-bottom:4px}.q{font-size:16px;padding:6px 10px}.q .big{font-size:19px}.cb{font-size:20px;padding:6px;min-height:46px}.ch{gap:6px;margin-top:5px}.fb{min-height:16px;font-size:14px;margin-top:2px}.box{padding:6px 10px}.top{margin-bottom:2px;font-size:14px}.btn{padding:7px 14px;font-size:16px}}
</style>
</head>
<body>
<div class="app">
  <h1>🐸 분수 징검다리</h1><p class="sub">문제를 맞히면 한 칸씩 건너가요 · 기록 없이 마음껏 도전해요</p>
  <div id="main"></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rand(0,a.length-1)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rand(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const mx=(w,n,d)=>`<span class="mx"><b>${w}</b>${fr(n,d)}</span>`;
const gcd=(a,b)=>b?gcd(b,a%b):a;
const QS=new URLSearchParams(location.search), TL=QS.get('tl');
// 값 표현: {n,d}(진·가분수) 또는 {w,q,d}(대분수)
const num=c=>c.w!==undefined?c.w*c.d+c.q:c.n;
const face=c=>c.w!==undefined?mx(c.w,c.q,c.d):fr(c.n,c.d);
const key=c=>c.w!==undefined?`m${c.w}.${c.q}/${c.d}`:`f${c.n}/${c.d}`;
const asMixed=(n,d)=>n%d===0||n<d?{n,d}:{w:Math.floor(n/d),q:n%d,d};
const asImp=(n,d)=>({n,d});
function barOf(c){ const v=num(c), W=Math.max(1,Math.ceil(v/c.d)); let h='<span class="mb">'; for(let w=0;w<W;w++){ h+='<span class="mr">'; for(let x=0;x<c.d;x++) h+=`<i class="${w*c.d+x<v?'on':''}"></i>`; h+='</span>'; } return h+'</span>'; }
const ITEMS=['🍪','🍓','🍎','🍬','🍊'], INAME=['쿠키','딸기','사과','사탕','귤'];
const TYPES={cmp:'크기 비교',same:'같은 값 찾기',line:'수직선 읽기',of:'분수만큼 구하기'};
let opt={len:10,hard:false,types:{cmp:true,same:true,line:true,of:true},time:0,hints:3};
let G=null, Q=null, tmr=null, tk=null;
const main=$('main');
function loadBest(){ try{ return JSON.parse(localStorage.getItem('fracBridge')||'{}'); }catch(e){ return {}; } }
function saveBest(k,v){ try{ const o=loadBest(); o[k]=Math.max(o[k]||0,v); localStorage.setItem('fracBridge',JSON.stringify(o)); }catch(e){} }
const dens=()=>opt.hard?[3,4,5,6,7,8,9,10]:[2,3,4,5];
/* ── 문제 만들기 ── */
function genQ(type){
  const D=dens();
  if(type==='cmp'){ const d=pick(D); let a,b; do{ a=rand(1,(opt.hard?3:2)*d-1); b=rand(1,(opt.hard?3:2)*d-1); }while(a===b);
    const f=n=>(n>d&&n%d!==0&&Math.random()<.5)?asMixed(n,d):asImp(n,d); const A=f(a), B=f(b);
    return {type,kind:'cmp',q:'어느 분수가 <span class="big">더 큰가요?</span>',ch:[A,B],ok:a>b?0:1,hintHtml:`${barOf(A)} 와 ${barOf(B)}`}; }
  if(type==='same'){ const d=pick(D); let w=rand(1,opt.hard?3:2), q=rand(1,d-1); const n=w*d+q; const toMixed=Math.random()<.5;
    const ref=toMixed?asImp(n,d):{w,q,d}; const right=toMixed?{w,q,d}:asImp(n,d);
    const wrongs=[]; const cand=[{dq:1},{dq:-1},{dw:1},{dw:-1},{dq:2},{dq:-2}]; shuffle(cand).forEach(c=>{ if(wrongs.length>=2) return; let w2=w+(c.dw||0), q2=q+(c.dq||0); if(q2<1||q2>=d||w2<1) return; if(w2===w&&q2===q) return; const x=toMixed?{w:w2,q:q2,d}:asImp(w2*d+q2,d); if(!wrongs.some(y=>key(y)===key(x))) wrongs.push(x); });
    if(wrongs.length<2) return genQ(type);
    const ch=shuffle([right,...wrongs]); return {type,kind:'same',q:`${face(ref)} 와(과) <span class="big">값이 같은 분수는?</span>`,ch,ok:ch.findIndex(c=>key(c)===key(right)),hintHtml:`${barOf(ref)} (이 분수의 그림이에요)`}; }
  if(type==='line'){ const d=pick(opt.hard?[3,4,5,6]:[2,3,4,5]), W=opt.hard?3:2, n=rand(1,W*d-1); if(n%d===0) return genQ(type);
    const right=asMixed(n,d), cands=[n-1,n+1,n+d,n-d,n+2,n-2].filter(x=>x>0&&x<W*d&&x%d!==0&&x!==n); const ws=shuffle([...new Set(cands)]).slice(0,3); if(ws.length<3) return genQ(type);
    const ch=shuffle([right,...ws.map(x=>asMixed(x,d))]); return {type,kind:'line',d,W,n,q:'<span class="big">▼가 가리키는 분수</span>는 얼마일까요?',ch,ok:ch.findIndex(c=>key(c)===key(right)),hintHtml:`눈금 한 칸은 ${fr(1,d)} 이에요. 0에서 1까지 ${d}칸으로 나뉘어 있어요.`}; }
  // of
  const d=pick(opt.hard?[3,4,5,6,8]:[2,3,4,5]), per=rand(2,opt.hard?6:4), a=rand(1,d-1), total=d*per, it=rand(0,ITEMS.length-1), ans=a*per;
  let ws=new Set(); [ans+per,ans-per,ans+1,ans-1,per,total-ans].forEach(x=>{ if(x>0&&x<total&&x!==ans) ws.add(x); }); ws=shuffle([...ws]).slice(0,3); if(ws.length<3) return genQ(type);
  const ch=shuffle([ans,...ws]); const g=Array.from({length:d},()=>`<span class="grp">${ITEMS[it].repeat(per)}</span>`).join('');
  return {type,kind:'of',q:`${INAME[it]} <span class="big">${total}개</span>의 ${fr(a,d)} 만큼은 <span class="big">몇 개</span>일까요?`,ch,ok:ch.indexOf(ans),hintHtml:`${total}개를 ${d}묶음으로 똑같이 나누면 이렇게 돼요 ${g}`}; }
function numLine(Qn){ const {d,W,n}=Qn, w=Math.min(820,Math.max(300,W*d*46)), pad=22, step=(w-pad*2)/(W*d); let s=`<svg viewBox="0 0 ${w} 84" style="width:100%;max-width:${w}px"><line x1="${pad}" y1="46" x2="${w-pad}" y2="46" stroke="#3D5A80" stroke-width="3"/>`;
  for(let i=0;i<=W*d;i++){ const x=pad+i*step, big=i%d===0; s+=`<line x1="${x}" y1="${46-(big?13:8)}" x2="${x}" y2="${46+(big?13:8)}" stroke="#3D5A80" stroke-width="${big?3:2}"/>`; if(big) s+=`<text x="${x}" y="74" text-anchor="middle" font-family="Jua" font-size="20" fill="#25324A">${i/d}</text>`; }
  const mx_=pad+n*step; s+=`<polygon points="${mx_-9},12 ${mx_+9},12 ${mx_},32" fill="#E8873A"/></svg>`; return s; }
/* ── 화면 ── */
function home(){
  G=null; Q=null; clearTimeout(tmr); clearInterval(tk); const b=loadBest();
  const chip=(grp,val,label,cur)=>`<button class="btn ${cur?'org':'ghost'}" data-g="${grp}" data-v="${val}" style="font-size:16px;padding:9px 14px">${label}</button>`;
  main.innerHTML=`<div class="box">
   <div class="t">강의 길이</div><div class="row">${chip('len',6,'🌱 짧은 강 (6칸)',opt.len===6)}${chip('len',10,'🌿 보통 강 (10칸)',opt.len===10)}${chip('len',14,'🌳 긴 강 (14칸)',opt.len===14)}</div>
   <div class="t">분수</div><div class="row">${chip('hard',0,'🌱 쉬운 분수만',!opt.hard)}${chip('hard',1,'🌳 어려운 분수도 함께',opt.hard)}</div>
   <div class="t">문제 종류 (하나 이상)</div>${Object.keys(TYPES).map(k=>`<label class="opt"><input type="checkbox" data-t="${k}" ${opt.types[k]?'checked':''}> ${TYPES[k]}</label>`).join('')}
   <div class="t">제한 시간</div><div class="row">${chip('time',0,'없음',opt.time===0)}${chip('time',30,'30초',opt.time===30)}${chip('time',15,'15초',opt.time===15)}</div>
   <div class="t">그림 힌트</div><div class="row">${chip('hints',3,'💡 3번 쓸 수 있어요',opt.hints===3)}${chip('hints',0,'없음',opt.hints===0)}</div>
   <div class="row" style="margin-top:14px"><button class="btn org" id="go" style="font-size:22px">출발! 🐸</button>${b.stars?`<span style="font-size:15px;color:var(--sub)">최고 기록 ⭐${b.stars}</span>`:''}</div><div class="msg hint" id="msg"></div></div>`;
  main.onclick=null;
  main.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{ const g=x.dataset.g, v=+x.dataset.v; opt[g]=(g==='hard')?!!v:v; home(); });
  main.querySelectorAll('[data-t]').forEach(x=>x.onchange=()=>{ opt.types[x.dataset.t]=x.checked; });
  $('go').onclick=()=>{ if(!Object.values(opt.types).some(Boolean)){ $('msg').textContent='문제 종류를 하나 이상 골라 주세요.'; return; } start(); };
}
function start(){ G={pos:0,wrong:0,hintLeft:opt.hints,hintUsed:0,total:opt.len,qn:0,last:null}; next(); }
function next(){
  if(G.pos>=G.total) return end();
  const ts=Object.keys(opt.types).filter(k=>opt.types[k]); let t=pick(ts); if(ts.length>1&&G.last===t) t=pick(ts.filter(x=>x!==t)); G.last=t;
  Q=genQ(t); Q.done=false; Q.hint=false; Q.fb=''; Q.fbc=''; Q.bad=[]; Q.end=null; draw();
  clearTimeout(tmr); clearInterval(tk);
  if(opt.time){ const ms=(TL?+TL:opt.time)*1000; Q.end=Date.now()+ms; Q.dur=ms; tmr=setTimeout(timeout,ms); tk=setInterval(()=>{ const f=document.getElementById('tmb'); if(f) f.style.width=Math.max(0,(Q.end-Date.now())/Q.dur*100)+'%'; },200); }
}
function riverHTML(splash){ let h='<div class="river"><span class="bank">🌳</span>'; for(let i=0;i<G.total;i++){ const cur=i===G.pos-1; h+=`<div class="st${i<G.pos?' done':''}${cur?' cur':''}"><div class="stone"></div>${(G.pos>0&&i===G.pos-1)?`<span class="fg ${splash?'splash':''}">🐸</span>`:''}</div>`; }
  h+=`<span class="bank">🏠</span>${G.pos===0?`<span class="fg" style="position:absolute;left:6px;top:0;font-size:30px;${splash?'':''}" class="${splash?'splash':''}">🐸</span>`:''}</div>`; return h; }
function draw(splash){
  const gridCols=Q.kind==='cmp'?2:(Q.kind==='of'?2:2);
  let h=`<div class="top"><span>돌 <b>${G.pos}</b> / ${G.total}</span><span>${opt.hints?`💡 ${G.hintLeft}번 남음`:''}</span></div>${riverHTML(splash)}<div class="box"><div class="q">${Q.q}${Q.kind==='line'?`<div style="margin-top:4px">${numLine(Q)}</div>`:''}</div>`;
  h+=`<div class="ch" style="grid-template-columns:repeat(${gridCols},1fr)">${Q.ch.map((c,i)=>`<button class="cb${Q.bad.includes(i)?' no':''}${Q.right&&i===Q.ok?' ok':''}" data-i="${i}" ${Q.done?'disabled':''}>${Q.kind==='of'?c+'개':face(c)}</button>`).join('')}</div>`;
  if(Q.hint) h+=`<div class="hp">💡 ${Q.hintHtml}</div>`;
  if(opt.time&&!Q.done) h+=`<div class="tm"><i id="tmb" style="width:${Math.max(0,(Q.end-Date.now())/Q.dur*100)}%"></i></div>`;
  h+=`<div class="row" style="justify-content:center;margin-top:8px">${(opt.hints&&!Q.done&&!Q.hint&&G.hintLeft>0)?'<button class="btn ghost" id="hb" style="font-size:16px;padding:8px 14px">💡 그림 힌트 보기</button>':''}<button class="btn ghost" id="qb" style="font-size:15px;padding:8px 12px">그만하기</button></div><div class="fb ${Q.fbc}">${Q.fb||'&nbsp;'}</div></div>`;
  main.innerHTML=h;
}
main.addEventListener('click',e=>{
  if(!G||!Q) return;
  if(e.target.id==='qb'){ clearTimeout(tmr); clearInterval(tk); home(); return; }
  if(e.target.id==='hb'){ if(G.hintLeft>0&&!Q.hint){ G.hintLeft--; G.hintUsed++; Q.hint=true; draw(); } return; }
  const b=e.target.closest('.cb'); if(!b||Q.done||b.disabled) return; const i=+b.dataset.i;
  
  if(i===Q.ok){ Q.done=true; Q.right=true; clearTimeout(tmr); clearInterval(tk); G.pos++; Q.fb=['🎉 폴짝! 한 칸 건넜어요','👍 잘했어요! 다음 돌로!','🐸 개굴! 정답이에요'][rand(0,2)]; Q.fbc='ok'; draw(); setTimeout(next,Q.kind==='cmp'?900:900); }
  else { G.wrong++; Q.bad.push(i); Q.done=true; clearTimeout(tmr); clearInterval(tk); Q.fb='💦 풍덩! 새 문제로 다시 건너 볼까요?'; Q.fbc='bad'; draw(true); setTimeout(()=>{ if(G&&G.pos<G.total) next(); },1500); }
});
function timeout(){ if(!G||!Q||Q.done) return; G.wrong++; Q.done=true; clearInterval(tk); Q.fb='⏰ 시간이 지났어요. 새 문제로 다시 건너 봐요!'; Q.fbc='bad'; draw(true); setTimeout(()=>{ if(G&&G.pos<G.total){ next(); } },1400); }
function end(){
  clearTimeout(tmr); clearInterval(tk);
  const w=G.wrong, st=w<=Math.ceil(G.total/6)?3:(w<=Math.ceil(G.total/2)?2:1); saveBest('stars',st);
  const msg=st===3?'멋진 개구리 대장이에요! 👑':st===2?'잘 건너왔어요! 😊':'끝까지 건넌 것만으로도 대단해요! 💪';
  main.innerHTML=`<div class="box res"><div class="big">${msg}</div><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><div style="font-size:17px;margin:6px 0">돌 ${G.total}칸 · 풍덩 ${G.wrong}번${G.hintUsed?` · 그림 힌트 ${G.hintUsed}번`:''}</div><div class="row" style="justify-content:center;margin-top:8px"><button class="btn org" id="again">한 번 더 🐸</button><button class="btn ghost" id="hm">설정 바꾸기</button></div></div>`;
  $('again').onclick=start; $('hm').onclick=home;
}
window.__br={get Q(){return Q;},get G(){return G;},get opt(){return opt;}};
home();
})();
</script>
</body>
</html>
