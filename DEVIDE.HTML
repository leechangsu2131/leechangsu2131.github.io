<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>나눗셈 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAF8FF;
    --panel:#FFFFFF;
    --ink:#25324A;
    --sub:#6B7690;
    --tens:#3D5A80;
    --tens-soft:#DCE6F2;
    --ones:#E8873A;
    --ones-soft:#FBE6D2;
    --correct:#4C8C5C;
    --correct-soft:#E1F0E3;
    --wrong:#C0503F;
    --wrong-soft:#FAE4E0;
    --line:#D6E8F3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 8%, rgba(255,241,142,.9) 0 28px, transparent 29px),
      radial-gradient(circle at 92% 12%, rgba(255,255,255,.9) 0 34px, transparent 35px),
      linear-gradient(180deg,#CFF3FF 0%,#EAF9FF 48%,#E8F8D8 100%);
    color:var(--ink);
    font-family:"Gowun Batang", serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:22px 16px 70px;
    position:relative;
    overflow-x:hidden;
  }
  .app{ width:100%; max-width:760px; position:relative; }

  header{ text-align:center; margin-bottom:22px; }
  h1{
    font-family:"Jua", sans-serif;
    font-weight:400;
    font-size:30px;
    margin:0 0 4px;
    color:var(--tens);
    letter-spacing:0.5px;
  }
  .subtitle{ color:var(--sub); font-size:14.5px; margin:0; }

  .stats{ display:flex; justify-content:center; gap:10px; margin:16px 0 20px; }
  .chip{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 16px;
    font-size:13.5px;
    color:var(--sub);
    display:flex; align-items:center; gap:6px;
  }
  .chip b{ color:var(--ink); font-family:"Jua",sans-serif; font-weight:400; font-size:15px;}

  .tabs{
    display:flex; gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    margin-bottom:20px;
  }
  .tab{
    flex:1; text-align:center;
    padding:10px 6px;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;
    color:var(--sub);
    transition:background .15s, color .15s;
    user-select:none;
  }
  .tab .tnum{ font-family:"Jua",sans-serif; display:block; font-size:11.5px; margin-bottom:2px; opacity:.7;}
  .tab.active{ background:var(--tens); color:#fff; }
  .tab.active .tnum{ opacity:.85; }

  .card{
    background:rgba(255,255,255,.94);
    border:2px solid rgba(255,255,255,.9);
    border-radius:24px;
    padding:24px 22px 26px;
    box-shadow:0 10px 30px rgba(73,145,180,.12);
  }

  .problem-row{
    display:flex; align-items:baseline; justify-content:center; gap:14px;
    font-family:"Jua", sans-serif;
    font-size:40px;
    margin-bottom:22px;
    color:var(--ink);
  }
  .problem-row .op{ color:var(--sub); font-size:30px; }
  .factor-a{ color:var(--tens); }
  .factor-b{ color:var(--ones); }

  .partials{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .partial-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
    font-size:16px;
    gap:8px;
  }
  .partial-row .label{ color:var(--sub); font-size:14px; white-space:nowrap; }
  .partial-row .expr{ font-family:"Jua",sans-serif; font-size:17px; white-space:nowrap; }
  .partial-row .inputs{ display:flex; align-items:center; gap:6px; }
  .partial-row input{
    width:64px;
    text-align:center;
    font-family:"Jua", sans-serif;
    font-size:18px;
    padding:8px 4px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .partial-row input:focus{ outline:none; border-color:var(--tens); }
  .partial-row input::placeholder{ font-size:13px; }
  .partial-row.correct{ background:var(--correct-soft); border-color:var(--correct); }
  .partial-row.wrong{ background:var(--wrong-soft); border-color:var(--wrong); }
  .rmark{ font-family:"Jua",sans-serif; color:var(--sub); font-size:15px; }

  .algo-intro{
    background:var(--tens-soft); border-radius:12px; padding:12px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:10px; line-height:1.5; font-size:14.5px;
  }
  .algo-intro .algo-text{ flex:1; }
  .algo-intro .algo-check-btn{ font-size:13.5px; padding:9px 16px; flex-shrink:0; }
  .algo-intro .algo-check-btn:disabled{ opacity:.35; }

  .meaning-box{
    background:var(--ones-soft); border-radius:12px; padding:10px 14px;
    margin-bottom:16px; font-size:13.5px; color:var(--ink); line-height:1.5;
    display:none;
  }
  .meaning-box.show{ display:block; }
  .viz-blocks{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .viz-bundle{
    display:grid; grid-template-columns:repeat(5, 6px); grid-template-rows:repeat(2, 6px);
    gap:2px; padding:4px;
    border:1.5px solid var(--tens); border-radius:7px; background:#fff;
  }
  .viz-bundle .viz-dot{ width:6px; height:6px; border-radius:50%; background:var(--tens); }
  .viz-loose-dot{ width:15px; height:15px; border-radius:50%; background:var(--ones); }
  .viz-share-arrow{ font-size:12.5px; color:var(--sub); margin:8px 0 6px; }
  .viz-baskets{ display:flex; gap:6px; flex-wrap:wrap; }
  .viz-basket{
    width:38px; height:34px; border:2px dashed var(--tens); border-radius:8px;
    background:rgba(255,255,255,.5);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; color:var(--tens); opacity:.5;
  }

  /* 어림하기 힌트: 84 → 80 → "8에는 4가 몇 번 들어갈까?"를 눈으로 이해하도록 구성 */
  .estimate-viz{ margin-top:10px; padding:12px; border:1.5px solid #D9EAF7; border-radius:14px; background:linear-gradient(180deg,#F9FDFF,#FFFFFF); }
  .estimate-number-row{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; font-family:"Jua",sans-serif; font-size:20px; color:var(--ink); }
  .estimate-original,.estimate-zero{ padding:5px 10px; border-radius:10px; }
  .estimate-original{ background:#F4F8FC; }
  .estimate-zero{ background:#EAF5FF; color:#1772A8; }
  .estimate-arrow{ color:#7AA8C5; font-size:18px; }
  .estimate-caption{ text-align:center; font-size:12.5px; margin-top:5px; color:var(--sub); }
  .estimate-caption b{ color:#1772A8; }
  .visual-title{ text-align:center; margin:10px 0 7px; font-size:14px; font-weight:700; color:var(--ink); }
  .first-digit-division{ padding:9px 8px 10px; border-radius:12px; background:#F2FAFF; border:1px solid #CDE8F7; }
  .first-div-expr{ text-align:center; font-family:"Jua",sans-serif; font-size:24px; color:#244F73; margin-bottom:7px; }
  .counter-row{ display:flex; justify-content:center; gap:5px; flex-wrap:wrap; }
  .counter{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#7CC4EE; border:2px solid #4AA6DA; color:#fff; font-family:"Jua",sans-serif; font-size:14px; box-shadow:0 2px 0 rgba(40,110,150,.12); }
  .grouping-arrow{ text-align:center; font-size:12.5px; color:#4B7895; margin:6px 0; }
  .quotient-groups{ display:flex; justify-content:center; gap:7px; flex-wrap:wrap; }
  .q-group{ min-width:78px; padding:6px 6px 7px; border:2px solid #7FC9A0; border-radius:11px; background:#F7FFF9; text-align:center; }
  .q-group-title{ font-size:11px; color:#4B8061; margin-bottom:4px; font-weight:700; }
  .q-group .counter{ width:23px; height:23px; font-size:11px; margin:1px; background:#78C89B; border-color:#55AA79; }
  .group-result{ margin-top:4px; font-family:"Jua",sans-serif; font-size:13px; color:#2E7650; }
  .leftover-box{ margin:7px auto 0; width:max-content; max-width:100%; padding:5px 9px; border-radius:9px; background:#FFF4DF; color:#9A6411; font-size:12px; }
  .estimate-result{ text-align:center; margin-top:9px; font-size:14px; color:var(--ink); }
  .estimate-result b{ display:inline-block; padding:5px 10px; border-radius:9px; background:#EAF7EE; color:#347A50; }
  .connect-note{ margin-top:7px; padding:7px 9px; border-radius:9px; background:#EEF7FF; color:#45677E; font-size:12px; text-align:center; line-height:1.45; }
  .connect-note b{ color:#1772A8; }
  /* 나눗셈이 실제로 "몇 번 들어가는지" 보이는 힌트 */
  .estimate-viz{ overflow:hidden; }
  .entry-flow{
    display:flex; align-items:center; justify-content:center; gap:7px;
    margin:8px 0 4px; flex-wrap:wrap;
  }
  .entry-card{
    padding:6px 10px; border-radius:12px; background:#fff;
    border:2px solid #BFE3F5; font-family:"Jua",sans-serif;
    font-size:18px; color:#245274;
  }
  .entry-card.zero{
    background:#F4FBFF; border-color:#7FC8EA;
  }
  .entry-card.zero b{ color:#E58B45; }
  .entry-arrow{ font-size:18px; color:#76A9C3; font-weight:700; }
  .in-box{
    display:flex; align-items:center; justify-content:center; gap:8px;
    flex-wrap:wrap; margin:8px 0 5px;
  }
  .in-question{
    padding:5px 10px; border-radius:12px; background:#FFF4D9;
    border:2px solid #F2C66D; color:#8A5D0A; font-family:"Jua",sans-serif;
    font-size:15px;
  }
  .in-answer{
    padding:5px 10px; border-radius:12px; background:#EAF7EE;
    border:2px solid #8CCCA2; color:#347A50; font-family:"Jua",sans-serif;
    font-size:15px;
  }
  .remainder-mini{
    display:flex; align-items:center; justify-content:center; gap:7px;
    margin-top:8px; padding:6px 9px; border-radius:11px;
    background:#FFF7EC; border:1px solid #F1D7A8; color:#8A641E; font-size:12px;
  }
  .mini-dots{ display:flex; gap:3px; }
  .mini-dot{
    width:17px; height:17px; border-radius:50%; background:#F0B45C;
    border:2px solid #D99532;
  }
  .divide-groups{
    display:flex; justify-content:center; gap:6px; flex-wrap:wrap;
    margin-top:7px;
  }
  .divide-group{
    min-width:76px; padding:5px 6px 6px; border-radius:11px;
    background:#F8FFFA; border:2px solid #8CCCA2; text-align:center;
  }
  .divide-group .g-label{font-size:10.5px;color:#4D7D5B;font-weight:700;margin-bottom:3px;}
  .ten-stick{
    display:inline-flex; flex-direction:column; gap:1px; vertical-align:middle;
    width:14px; margin:1px 2px; padding:2px; border-radius:4px;
    background:#E5F4FF; border:1px solid #75B9E1;
  }
  .ten-stick i{display:block;height:3px;border-radius:1px;background:#58A9D8;}
  .group-number{
    display:block; margin-top:3px; font-family:"Jua",sans-serif;
    font-size:13px; color:#347A50;
  }
  .ten-source,.divide-arrow,.share-groups{ display:none; }

  .dtable{ border-collapse:collapse; margin:0 auto 10px; }
  .dtable col.divcol{ width:34px; }
  .dtable col.digitcol{ width:54px; }
  .dtable td{ text-align:center; height:42px; padding:2px; vertical-align:middle; }
  .dtable td.divisor-cell{ font-family:"Jua",sans-serif; font-size:26px; color:var(--tens); }
  .dtable td.dividend-cell{ font-family:"Jua",sans-serif; font-size:26px; color:var(--ink); border-top:3px solid var(--ink); }
  .dtable td.bracket-col{ border-left:3px solid var(--ink); }
  .dtable-hr{ border-top:2px solid var(--ink); margin:0 6px; }
  .dcell{
    width:40px; height:34px; text-align:center;
    font-family:"Jua",sans-serif; font-size:18px;
    border-radius:8px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink);
  }
  .dcell:disabled{ background:#F1EEE5; color:var(--sub); }
  .dcell:focus{ outline:none; border-color:var(--tens); }
  .dcell.wide{ width:88px; }
  .dcell.correct{ border-color:var(--correct)!important; background:var(--correct-soft)!important; }
  .dcell.wrong{ border-color:var(--wrong)!important; background:var(--wrong-soft)!important; }

  .sum-row{
    display:flex; align-items:center; justify-content:center; gap:10px;
    border-top:2px dashed var(--line);
    padding-top:16px; margin-bottom:10px;
    font-family:"Jua", sans-serif; font-size:20px;
    flex-wrap:wrap;
  }
  .sum-row input{
    width:80px; text-align:center;
    font-family:"Jua", sans-serif; font-size:22px;
    padding:10px 6px; border-radius:10px;
    border:2px solid var(--line);
  }
  .sum-row input:focus{ outline:none; border-color:var(--tens); }
  .sum-row input::placeholder{ font-size:13px; }

  .actions{ display:flex; gap:10px; justify-content:center; margin-top:6px; }
  button{
    font-family:"Jua", sans-serif; font-size:15.5px;
    border:none; border-radius:12px; padding:12px 22px;
    cursor:pointer; transition:transform .08s, opacity .15s;
  }
  button:active{ transform:scale(0.97); }
  .btn-check{ background:var(--tens); color:#fff; }
  .btn-next{ background:var(--ink); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--sub); border:1.5px solid var(--line); }
  button:disabled{ opacity:.4; cursor:default; }

  .feedback{ text-align:center; margin-top:16px; font-size:15px; min-height:24px; color:var(--sub); }
  .feedback.good{ color:var(--correct); font-family:"Jua",sans-serif; }
  .feedback.bad{ color:var(--wrong); font-family:"Jua",sans-serif; }

  .explain{
    margin-top:14px; background:var(--tens-soft); border-radius:12px;
    padding:12px 16px; font-size:14.5px; color:var(--ink); line-height:1.7;
    display:none;
  }
  .explain.show{ display:block; }

  footer{ text-align:center; color:var(--sub); font-size:12.5px; margin-top:26px; line-height:1.7; }

  .ld-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .ld-stage{
    position:relative;
    width:100%;
    max-width:420px;
    margin:0 auto;
    touch-action:none;
  }
  .ld-stage svg{ display:block; width:100%; height:auto; }
  .ld-stage canvas{
    display:block;
    width:100%;
    height:420px;
    touch-action:none;
    cursor:crosshair;
    border:1.5px dashed var(--line);
    border-radius:14px;
    background:#fff;
  }
  .ld-tools{ display:flex; gap:8px; }
  .ld-tools button{ font-size:13.5px; padding:8px 16px; }
  .ld-steps{
    width:100%;
    display:flex; flex-direction:column; gap:8px;
  }
  .ld-steps .step{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 12px;
    font-size:13.5px;
    color:var(--sub);
  }
  .ld-steps .step b{ color:var(--ink); }

  @media (max-width:420px){
    h1{ font-size:25px; }
    .problem-row{ font-size:32px; }
    .card{ padding:18px 14px 20px; }
    .partial-row{ flex-wrap:wrap; }
  }

  .bright-estimate{background:linear-gradient(180deg,#F9FDFF,#F0FAFF);border:2px solid #B9E4F7;box-shadow:0 5px 0 rgba(93,174,215,.10);}
  .visual-title{text-align:center;font-family:"Jua",sans-serif;font-size:15px;color:#2E6F91;margin:12px 0 9px;}
  .ten-source{background:#FFFDF0;border:2px dashed #F4C95D;border-radius:14px;padding:9px 8px;}
  .source-label{text-align:center;font-family:"Jua",sans-serif;color:#8A6A16;font-size:12px;margin-bottom:7px;}
  .ten-source-row{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;}
  .ten-bundle-big{width:42px;height:42px;border:2px solid #F3B83F;border-radius:9px;background:#FFF7D8;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
  .ten-label{font-family:"Jua",sans-serif;font-size:12px;color:#D48619;line-height:1;}
  .ten-dots{font-size:5px;letter-spacing:1px;color:#4EA7D8;white-space:nowrap;line-height:1;margin-top:3px;}
  .divide-arrow{text-align:center;font-family:"Jua",sans-serif;color:#4B9AC2;font-size:13px;margin:7px 0;}
  .share-groups{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;}
  .share-group{width:74px;min-height:78px;border:2px solid #8CC9E8;border-radius:13px;background:#fff;text-align:center;padding:5px 4px;box-shadow:0 3px 0 rgba(91,170,211,.10);}
  .group-title{font-size:10px;color:#6B7690;margin-bottom:4px;}
  .group-inside{display:flex;justify-content:center;gap:3px;min-height:24px;}
  .mini-ten{display:inline-flex;align-items:center;justify-content:center;width:27px;height:22px;border-radius:6px;background:#DDF3FF;border:1px solid #6EBBE0;font-family:"Jua",sans-serif;font-size:11px;color:#287AA5;}
  .group-value{font-family:"Jua",sans-serif;font-size:12px;color:#347E55;margin-top:4px;}
  .estimate-result{text-align:center;margin-top:9px;padding:8px;border-radius:12px;background:#E7F8E9;color:#32724A;font-family:"Jua",sans-serif;font-size:17px;}
  .connect-note{text-align:center;margin-top:7px;font-size:11.5px;color:#53657A;}
  .connect-note b{color:#347AA0;}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>나눗셈 연습</h1>
    <p class="subtitle">3학년 2학기 · 자릿값으로 나눗셈을 익혀요</p>
  </header>

  <div class="stats">
    <div class="chip">맞힌 문제 <b id="statScore">0</b></div>
    <div class="chip">연속 정답 <b id="statStreak">0</b></div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab" data-level="1"><span class="tnum">1단계</span>(몇십)÷(몇)</div>
    <div class="tab" data-level="2"><span class="tnum">2단계</span>나머지 없음</div>
    <div class="tab" data-level="3"><span class="tnum">3단계</span>나머지 있음</div>
    <div class="tab" data-level="4"><span class="tnum">4단계</span>세로 나눗셈</div>
    <div class="tab" data-level="5"><span class="tnum">5단계</span>스스로 풀어보기</div>
  </div>

  <div class="card">
    <div class="problem-row" id="problemRow"></div>

    <div id="scaffoldArea"></div>

    <div class="actions">
      <button class="btn-check" id="btnCheck">확인</button>
      <button class="btn-next" id="btnNext" disabled>다음 문제</button>
      <button class="btn-ghost" id="btnReset">다시 풀기</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="explain" id="explain"></div>
  </div>

  <footer>화천초등학교 3학년 2반 · 나눗셈 연습</footer>
</div>

<script>
(function(){
  const tabsEl = document.getElementById('tabs');
  const problemRow = document.getElementById('problemRow');
  const scaffoldArea = document.getElementById('scaffoldArea');
  const btnCheck = document.getElementById('btnCheck');
  const btnNext = document.getElementById('btnNext');
  const btnReset = document.getElementById('btnReset');
  const feedback = document.getElementById('feedback');
  const explain = document.getElementById('explain');
  const statScore = document.getElementById('statScore');
  const statStreak = document.getElementById('statStreak');

  let level = 1;
  let score = 0;
  let streak = 0;
  let problem = null;
  let checked = false;

  const PRAISE = ["참 잘했어요!","정확해요!","실력이 늘고 있어요!","완벽해요!","멋져요!","최고예요!"];
  const NUDGE = ["다시 한 번 살펴볼까요?","괜찮아요, 자리를 다시 나눠볼까요?","조금만 더 생각해봐요.","천천히 다시 계산해볼까요?"];

  function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function genProblem(lv){
    if(lv === 1){
      let d, q, n;
      let tries = 0;
      do{
        d = rand(2,9);
        q = rand(1,9);
        n = d*q;
        tries++;
      } while(n > 9 && tries < 200);
      const N = n*10;
      return { level:1, d, q, n, N, total:q*10 };
    } else if(lv === 2){
      // pick a genuine ones-digit (1-9) that divides evenly, so the split matches N's real place values
      let d, Qt, onesDigit, N;
      let tries = 0;
      do{
        d = rand(2,9);
        Qt = rand(1,3);
        onesDigit = rand(1,9);
        N = Qt*d*10 + onesDigit;
        tries++;
      } while((onesDigit % d !== 0 || N > 99 || N < 10) && tries < 500);
      const Qo = onesDigit / d;
      const partA = Qt*d*10, partB = onesDigit;
      return { level:2, d, Qt, Qo, N, partA, partB, total:Qt*10+Qo };
    } else if(lv === 3){
      // pick a genuine ones-digit (0-9) whose division by d leaves a nonzero remainder,
      // so partA is still exactly N's real tens value and partB is exactly N's real ones digit
      let d, Qt, onesDigit, Qo, r, N;
      let tries = 0;
      do{
        d = rand(2,9);
        Qt = rand(1,3);
        onesDigit = rand(0,9);
        Qo = Math.floor(onesDigit/d);
        r = onesDigit % d;
        N = Qt*d*10 + onesDigit;
        tries++;
      } while((r === 0 || N > 99 || N < 10) && tries < 500);
      const partA = Qt*d*10, partB = onesDigit;
      return { level:3, d, Qt, Qo, r, N, partA, partB, totalQ:Qt*10+Qo, totalR:r };
    } else if(lv === 4){
      // level 4: full long-division practice — any 2-digit dividend with a 2-digit quotient,
      // so the "estimate the biggest digit" step always happens exactly twice (tens, then ones)
      const { d, N, totalQ, totalR } = genLongDivisionBase();

      const firstDigit = Math.floor(N/10);
      const onesDigit = N % 10;
      const q1 = Math.floor(firstDigit/d);
      const product1 = q1*d;
      const remainder1 = firstDigit - product1;
      const bringDown = remainder1*10 + onesDigit;
      const q2 = Math.floor(bringDown/d);
      const product2 = q2*d;
      const remainder2 = bringDown - product2;

      return {
        level:4, d, N, firstDigit, onesDigit,
        q1, product1, remainder1, bringDown, q2, product2, remainder2,
        totalQ, totalR
      };
    } else {
      // level 5: same shape of problem as level 4, but no step breakdown — this is the
      // "work it out yourself" stage, so only the final answer is graded
      const { d, N, totalQ, totalR } = genLongDivisionBase();
      return { level:5, d, N, totalQ, totalR };
    }
  }

  // shared generator for a 2-digit dividend ÷ 1-digit divisor with a 2-digit quotient
  function genLongDivisionBase(){
    let d, Q, r, N;
    let tries = 0;
    do{
      d = rand(2,9);
      Q = rand(10, Math.max(10, Math.floor(99/d)));
      r = rand(0, d-1);
      N = Q*d + r;
      tries++;
    } while((N > 99 || N < 10) && tries < 500);
    return { d, N, totalQ:Q, totalR:r };
  }

  // is `guess` really the largest whole number where d*guess <= target?
  function judgeEstimate(target, d, guess){
    if(isNaN(guess)) return 'invalid';
    if(d*guess > target) return 'toobig';
    if(d*(guess+1) <= target) return 'toosmall';
    return 'ok';
  }

  function estimateHint(verdict, d, target, correctGuess){
    if(verdict === 'toobig') return `어림한 수가 너무 컸어요 (${d}×그 수가 ${target}보다 커져요). 정답은 ${correctGuess}예요.<br>`;
    if(verdict === 'toosmall') return `더 큰 수도 가능했어요 — ${d}×(한 개 더 큰 수)도 ${target} 이하예요. 정답은 ${correctGuess}예요.<br>`;
    if(verdict === 'invalid') return `숫자를 입력해주세요. 정답은 ${correctGuess}예요.<br>`;
    return '';
  }

  // a concrete "bundle of 10": 10 little dots grouped inside one bordered box, so a
  // ten-bar isn't just an abstract rectangle — it visibly contains 10 things
  function tenBundle(){
    let dots = '';
    for(let i=0;i<10;i++) dots += '<span class="viz-dot"></span>';
    return `<div class="viz-bundle" title="10">${dots}</div>`;
  }

  // small place-value picture: `tens` bundles-of-10 + `ones` loose single dots, so a
  // number's actual size is visible, not just its digits
  function blockViz(tens, ones){
    let html = '<div class="viz-blocks">';
    for(let i=0;i<tens;i++) html += tenBundle();
    for(let i=0;i<ones;i++) html += '<div class="viz-loose-dot" title="1"></div>';
    html += '</div>';
    return html;
  }

  // 첫 번째 어림하기 전용 그림.
  // 예: 84 ÷ 4 → 84의 일의 자리 4를 0으로 생각 → 80 → "8에는 4가 몇 번 들어갈까?"
  // 핵심은 실제 84를 나누는 것이 아니라, 십의 자리 숫자끼리 먼저 생각하는 과정을 보여주는 것.
  function estimateViz(firstDigit, onesDigit, divisor){
    const q = Math.floor(firstDigit / divisor);
    const r = firstDigit % divisor;
    const original = `${firstDigit}${onesDigit}`;

    // "8에는 5가 몇 번 들어갈까?"를 실제 묶음으로 보여준다.
    // 각 그룹은 divisor개의 1짜리 칸을 하나의 '들어감'으로 표현하고,
    // 남는 칸은 별도로 표시한다.
    const groups = Array.from({length:q}, (_,g)=>{
      const inside = Array.from({length:divisor}, () =>
        '<span class="counter" style="width:20px;height:20px;font-size:10px;">●</span>'
      ).join('');
      return `<div class="divide-group">
        <div class="g-label">${g+1}번 들어감</div>
        <div>${inside}</div>
        <span class="group-number">${divisor}개</span>
      </div>`;
    }).join('');

    const remainderDots = r
      ? Array.from({length:r}, () => '<span class="mini-dot"></span>').join('')
      : '';

    return `<div class="estimate-viz bright-estimate">
      <div class="entry-flow">
        <span class="entry-card">${original}</span>
        <span class="entry-arrow">→</span>
        <span class="entry-card zero">${firstDigit}<b>0</b></span>
      </div>

      <div class="estimate-caption">
        <b>일의 자리 ${onesDigit}</b>은 0으로 생각하고, 십의 자리 숫자 ${firstDigit}만 먼저 살펴봐요.
      </div>

      <div class="in-box">
        <span class="in-question">${firstDigit}에는 ${divisor}가 몇 번 들어갈까요?</span>
        <span class="in-answer">한 번 들어갈 때 ${divisor}개씩!</span>
      </div>

      <div class="first-digit-division">
        <div class="first-div-expr">${firstDigit} ÷ ${divisor}</div>
        <div class="counter-row">
          ${Array.from({length:firstDigit}, (_,i)=>
            `<span class="counter">${i+1}</span>`).join('')}
        </div>
        <div class="grouping-arrow">↓ ${divisor}개씩 묶어 보면</div>
        <div class="divide-groups">
          ${groups || '<div class="divide-group"><div class="g-label">아직 한 번도 못 들어가요</div></div>'}
        </div>
        ${r
          ? `<div class="remainder-mini">
               <span>남는 수</span><span class="mini-dots">${remainderDots}</span>
               <b>${r}</b>개가 남아요.
             </div>`
          : `<div class="remainder-mini">남는 수가 없어요.</div>`}
      </div>

      <div class="estimate-result">
        <b>${firstDigit} ÷ ${divisor} = ${q} … ${r}</b>
      </div>

      <div class="connect-note">
        💡 그래서 <b>${original} ÷ ${divisor}</b>의 세로셈에서는
        <b>${firstDigit}에 ${divisor}가 ${q}번</b> 들어간다고 생각하고
        몫의 십의 자리에 <b>${q}</b>를 써요.
        ${r ? `<br>그리고 <b>${r}</b>이 남았으니 다음 자리 숫자를 내려와서 계속 나눠요.` : ''}
      </div>
    </div>`;
  }

  function shareSetupViz(tens, ones, divisor){
    const number = tens * 10 + ones;
    const q = Math.floor(number / divisor);
    const r = number % divisor;

    // 두 자리 수를 실제로 divisor개의 같은 그룹에 나누어 보는 그림.
    // 정답을 단순히 숫자로 던지는 대신, 한 그룹에 들어가는 양과
    // 마지막에 남는 수를 함께 보여준다.
    let groups = '';
    for(let g=0; g<divisor; g++){
      const bars = Array.from({length:q}, () =>
        `<span class="ten-stick">${Array.from({length:10},()=>'<i></i>').join('')}</span>`
      ).join('');
      groups += `<div class="divide-group">
        <div class="g-label">${g+1}번째 묶음</div>
        <div>${bars || '<span style="font-size:12px;color:#999;">없음</span>'}</div>
        <span class="group-number">${q}개씩</span>
      </div>`;
    }

    const remainderDots = r
      ? Array.from({length:r}, () => '<span class="mini-dot"></span>').join('')
      : '';

    return `<div class="viz-share">
      <div class="estimate-caption"><b>${number}</b>를 ${divisor}묶음으로 똑같이 나눠 볼까요?</div>
      <div class="divide-groups">${groups}</div>
      ${r
        ? `<div class="remainder-mini">
             <span>나누고 남는 수</span><span class="mini-dots">${remainderDots}</span>
             <b>${r}</b>개
           </div>`
        : `<div class="remainder-mini">똑같이 나누어 <b>남는 수가 없어요.</b></div>`}
    </div>`;
  }

  // freehand drawing on the canvas for level 5's blank scratch space
  function setupCanvas(){
    const canvas = document.getElementById('ldCanvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let drawing = false, lastX = 0, lastY = 0;

    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
      const cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
      return { x:(cx-rect.left)*(canvas.width/rect.width), y:(cy-rect.top)*(canvas.height/rect.height) };
    }
    function start(e){ drawing = true; const p = pos(e); lastX = p.x; lastY = p.y; e.preventDefault(); }
    function move(e){
      if(!drawing) return;
      const p = pos(e);
      ctx.strokeStyle = '#25324A';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lastX = p.x; lastY = p.y;
      e.preventDefault();
    }
    function end(){ drawing = false; }

    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);

    const clearBtn = document.getElementById('btnClearCanvas');
    if(clearBtn){
      clearBtn.addEventListener('click', ()=> ctx.clearRect(0,0,canvas.width,canvas.height));
    }
  }

  // Sequential, locked long-division practice, laid out in a real <table> so the quotient,
  // dividend, and every working row share the exact same 십/일 columns (guaranteed by the
  // browser's table layout, not by manual positioning). Only one step is unlocked at a time,
  // and the instruction banner only ever describes that one step, so nothing further down the
  // algorithm is ever visible before the student has earned it.
  function initAlgoSteps(stepList){
    let currentIndex = 0;
    const instructionText = document.getElementById('algoInstructionText');
    const checkBtn = document.getElementById('algoCheckBtn');
    const meaningBox = document.getElementById('meaningBox');

    function activateStep(idx){
      currentIndex = idx;
      const step = stepList[idx];
      instructionText.textContent = step.text;
      if(meaningBox){
        if(step.meaning){
          meaningBox.innerHTML = step.meaning;
          meaningBox.classList.add('show');
        } else {
          meaningBox.classList.remove('show');
          meaningBox.innerHTML = '';
        }
      }
      step.cells.forEach(id=>{ document.getElementById(id).disabled = false; });
      document.getElementById(step.cells[0]).focus();
    }

    function checkCurrentStep(){
      const step = stepList[currentIndex];
      let allOk = true;
      step.cells.forEach((id, i)=>{
        const input = document.getElementById(id);
        const val = parseInt(input.value, 10);
        const ok = step.estimate
          ? judgeEstimate(step.target, problem.d, val) === 'ok'
          : val === step.expected[i];
        input.classList.remove('correct','wrong');
        input.classList.add(ok ? 'correct' : 'wrong');
        if(!ok) allOk = false;
      });
      if(!allOk) return;

      step.cells.forEach(id=>{ document.getElementById(id).disabled = true; });
      if(currentIndex < stepList.length - 1){
        activateStep(currentIndex + 1);
      } else {
        instructionText.textContent = '모두 완료했어요! 몫과 나머지를 아래에 써보세요.';
        checkBtn.disabled = true;
        const sumQ = document.getElementById('sumQ');
        const sumR = document.getElementById('sumR');
        sumQ.disabled = false;
        sumR.disabled = false;
        document.querySelector('.algo-final-btn').disabled = false;
        sumQ.focus();
      }
    }

    checkBtn.addEventListener('click', checkCurrentStep);
    document.querySelector('.dtable').addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && e.target.tagName === 'INPUT' && !e.target.disabled){
        e.preventDefault();
        checkCurrentStep();
      }
    });

    document.querySelector('.algo-final-btn').addEventListener('click', ()=>{
      const sumQ = document.getElementById('sumQ');
      const sumR = document.getElementById('sumR');
      const ok = parseInt(sumQ.value,10) === problem.totalQ && parseInt(sumR.value,10) === problem.totalR;
      sumQ.style.borderColor = ok ? 'var(--correct)' : 'var(--wrong)';
      sumR.style.borderColor = ok ? 'var(--correct)' : 'var(--wrong)';
      const explainHtml = ok ? '' : `표에서 구한 몫과 나머지를 그대로 옮겨 적어보세요: <b>${problem.totalQ}…${problem.totalR}</b>`;
      finishProblem(ok, explainHtml);
    });

    activateStep(0);
  }

  function partialRow(key, expr, label, withRemainder){
    if(withRemainder){
      return `<div class="partial-row" data-key="${key}">
        <span class="label">${label}</span>
        <span class="expr">${expr} =</span>
        <div class="inputs">
          <input type="number" inputmode="numeric" data-key="${key}-q" placeholder="몫" />
          <span class="rmark">…</span>
          <input type="number" inputmode="numeric" data-key="${key}-r" placeholder="나머지" style="width:78px" />
        </div>
      </div>`;
    }
    return `<div class="partial-row" data-key="${key}">
      <span class="label">${label}</span>
      <span class="expr">${expr} =</span>
      <div class="inputs"><input type="number" inputmode="numeric" data-key="${key}" /></div>
    </div>`;
  }

  function checkAnswer(){
    if(checked) return;
    if(level === 4) return; // level 4 uses its own per-step locked flow, see initAlgoSteps()
    let allCorrect = true;

    if(level === 1){
      const baseInput = document.querySelector('input[data-key="base"]');
      const baseRow = document.querySelector('.partial-row[data-key="base"]');
      const baseOk = parseInt(baseInput.value,10) === problem.q;
      baseRow.classList.remove('correct','wrong');
      baseRow.classList.add(baseOk ? 'correct' : 'wrong');
      if(!baseOk) allCorrect = false;

      const sumInput = document.getElementById('sumInput');
      const sumOk = parseInt(sumInput.value,10) === problem.total;
      sumInput.style.borderColor = sumOk ? 'var(--correct)' : 'var(--wrong)';
      if(!sumOk) allCorrect = false;

    } else if(level === 2){
      const tensInput = document.querySelector('input[data-key="tens"]');
      const tensRow = document.querySelector('.partial-row[data-key="tens"]');
      const tensOk = parseInt(tensInput.value,10) === problem.Qt*10;
      tensRow.classList.remove('correct','wrong');
      tensRow.classList.add(tensOk ? 'correct' : 'wrong');
      if(!tensOk) allCorrect = false;

      const onesInput = document.querySelector('input[data-key="ones"]');
      const onesRow = document.querySelector('.partial-row[data-key="ones"]');
      const onesOk = parseInt(onesInput.value,10) === problem.Qo;
      onesRow.classList.remove('correct','wrong');
      onesRow.classList.add(onesOk ? 'correct' : 'wrong');
      if(!onesOk) allCorrect = false;

      const sumInput = document.getElementById('sumInput');
      const sumOk = parseInt(sumInput.value,10) === problem.total;
      sumInput.style.borderColor = sumOk ? 'var(--correct)' : 'var(--wrong)';
      if(!sumOk) allCorrect = false;

    } else if(level === 3){
      const tensInput = document.querySelector('input[data-key="tens"]');
      const tensRow = document.querySelector('.partial-row[data-key="tens"]');
      const tensOk = parseInt(tensInput.value,10) === problem.Qt*10;
      tensRow.classList.remove('correct','wrong');
      tensRow.classList.add(tensOk ? 'correct' : 'wrong');
      if(!tensOk) allCorrect = false;

      const restQInput = document.querySelector('input[data-key="rest-q"]');
      const restRInput = document.querySelector('input[data-key="rest-r"]');
      const restRow = document.querySelector('.partial-row[data-key="rest"]');
      const restOk = parseInt(restQInput.value,10) === problem.Qo && parseInt(restRInput.value,10) === problem.r;
      restRow.classList.remove('correct','wrong');
      restRow.classList.add(restOk ? 'correct' : 'wrong');
      if(!restOk) allCorrect = false;

      const sumQ = document.getElementById('sumQ');
      const sumR = document.getElementById('sumR');
      const sumOk = parseInt(sumQ.value,10) === problem.totalQ && parseInt(sumR.value,10) === problem.totalR;
      sumQ.style.borderColor = sumOk ? 'var(--correct)' : 'var(--wrong)';
      sumR.style.borderColor = sumOk ? 'var(--correct)' : 'var(--wrong)';
      if(!sumOk) allCorrect = false;
    } else if(level === 5){
      const sumQ = document.getElementById('sumQ');
      const sumR = document.getElementById('sumR');
      const sumOk = parseInt(sumQ.value,10) === problem.totalQ && parseInt(sumR.value,10) === problem.totalR;
      sumQ.style.borderColor = sumOk ? 'var(--correct)' : 'var(--wrong)';
      sumR.style.borderColor = sumOk ? 'var(--correct)' : 'var(--wrong)';
      if(!sumOk) allCorrect = false;
    }

    let explainHtml = '';
    if(!allCorrect){
      if(level === 1){
        explainHtml = `${problem.n}÷${problem.d}=${problem.q} 이니까, ${problem.N}÷${problem.d}=${problem.q}×10=<b>${problem.total}</b>이에요.`;
      } else if(level === 2){
        explainHtml = `${problem.partA}÷${problem.d}=${problem.Qt*10}, ${problem.partB}÷${problem.d}=${problem.Qo}<br>
          두 몫을 더하면 ${problem.N}÷${problem.d}=<b>${problem.total}</b>이에요.`;
      } else if(level === 3){
        explainHtml = `${problem.partA}÷${problem.d}=${problem.Qt*10} (나머지 없음)<br>
          ${problem.partB}÷${problem.d}=${problem.Qo}…${problem.r}<br>
          몫을 더하고 나머지는 그대로: ${problem.N}÷${problem.d}=<b>${problem.totalQ}…${problem.totalR}</b>이에요.`;
      } else if(level === 5){
        explainHtml = `정답은 <b>${problem.totalQ}…${problem.totalR}</b>이에요. 4단계에서 연습한 순서(어림→곱하기→빼기→내려쓰기)대로 다시 한 번 써보세요.`;
      }
    }
    finishProblem(allCorrect, explainHtml);
  }

  // shared scoring/feedback tail used by checkAnswer (levels 1-3) and the level-4 step engine
  function finishProblem(allCorrect, explainHtml){
    checked = true;
    btnNext.disabled = false;

    if(allCorrect){
      score++; streak++;
      feedback.textContent = PRAISE[rand(0,PRAISE.length-1)];
      feedback.className = 'feedback good';
      explain.className = 'explain';
      explain.innerHTML = '';
    } else {
      streak = 0;
      feedback.textContent = NUDGE[rand(0,NUDGE.length-1)];
      feedback.className = 'feedback bad';
      if(explainHtml){
        explain.className = 'explain show';
        explain.innerHTML = explainHtml;
      }
    }
    updateStats();
  }

  function updateStats(){
    statScore.textContent = score;
    statStreak.textContent = streak;
  }

  function setLevel(lv){
    level = lv;
    [...tabsEl.children].forEach(t=>{
      t.classList.toggle('active', parseInt(t.dataset.level,10) === lv);
    });
    btnCheck.style.display = (lv === 4) ? 'none' : '';
    renderProblem();
  }

  tabsEl.addEventListener('click', (e)=>{
    const tab = e.target.closest('.tab');
    if(!tab) return;
    setLevel(parseInt(tab.dataset.level,10));
  });

  btnCheck.addEventListener('click', checkAnswer);
  btnNext.addEventListener('click', renderProblem);
  btnReset.addEventListener('click', renderProblem);

  document.addEventListener('keydown', (e)=>{
    if(e.key !== 'Enter') return;
    if(checked){ renderProblem(); return; }
    if(level !== 4) checkAnswer();
  });

  setLevel(1);
})();
</script>
</body>
</html>
