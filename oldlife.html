td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}

textarea{width:100%;min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:10px}
.ico{flex:none}
