<body>
<div class="app">
  <h1>⚽ 분수 손가락 축구</h1><p class="sub">바둑돌을 튕기고, 멈춘 칸의 분수를 바꿔 써서 골대까지 가요</p>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rand(0,a.length-1)];
const SUPA_HOST='erzdvlcbjneabxqwnwfy.supabase.co', SUPA_KEY='sb_publishable_29w26VjvhHwI5O6iKOXTwA_sSTKUhfz', SUPA_URL='https://'+SUPA_HOST;
const ROSTER=['강시우','김가을','김동규','김주안','박민서','박서우','박현규','백다온','오지윤','이서우','이예나','이윤슬','정두영','조주아','천선율','한예기','황보검','최윤채','박선우'];
const QS=new URLSearchParams(location.search), MOCK=QS.get('mock')==='1', FAST=QS.get('fast')==='1';
/* ── 놀이판 ── */
const W=800,H=500,COLS=8,ROWS=5,R=24,PADX=50,PADY=30,CW=900,CH=560,GOALS=[16,23];
const START=[{x:50,y:250},{x:750,y:250}];
const BOOK=['7/5','1 2/3','13/10','1 3/5','8/5','2 3/4','10/3','2 1/3',
 '6/5','14/3','9/4','7/2','3 1/2','1 3/10','2 1/2','11/9',
 'G','3 1/3','9/5','1 2/7','1 2/5','3/2','2 1/5','G',
 '2 2/9','5/4','1 1/2','8/6','2 1/4','5/3','1 2/6','5/2',
 '11/5','1 1/4','20/9','1 4/5','7/3','1 2/9','9/7','7/4'];
function parseCell(s){ if(s==='G') return {k:'g'}; let m=s.match(/^(\d+) (\d+)\/(\d+)$/); if(m) return {k:'m',w:+m[1],q:+m[2],d:+m[3]}; m=s.match(/^(\d+)\/(\d+)$/); return {k:'i',n:+m[1],d:+m[2]}; }
const DENS={easy:[2,3,4,5],all:[2,3,4,5,6,7,8,9,10]};
function genCell(dens){ const d=pick(dens); if(Math.random()<.5){ let n; do{ n=rand(d+1,3*d-1); }while(n%d===0); return {k:'i',n,d}; } return {k:'m',w:rand(1,3),q:rand(1,d-1),d}; }
function makeBoard(kind){
  if(kind==='book') return BOOK.map(parseCell);
  const cells=[],seen=new Set(); let g=0;
  for(let i=0;i<COLS*ROWS;i++){ if(GOALS.includes(i)){ cells.push({k:'g'}); continue; }
    let c; do{ c=genCell(DENS[kind]); g++; }while(seen.has(txt(c))&&g<5000); seen.add(txt(c)); cells.push(c); }
  return cells; }
const txt=c=>c.k==='m'?`${c.w}과 ${c.q}/${c.d}`:`${c.n}/${c.d}`;
const fr=(n,d)=>`<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const mx=(w,n,d)=>`<span class="mx"><b>${w}</b>${fr(n,d)}</span>`;
const face=c=>c.k==='m'?mx(c.w,c.q,c.d):fr(c.n,c.d);
const expected=c=>c.k==='m'?{n:c.w*c.d+c.q,d:c.d}:{w:Math.floor(c.n/c.d),q:c.n%c.d,d:c.d};
const ansText=c=>{ const e=expected(c); return c.k==='m'?`${c.w}과 ${c.q}/${c.d} = ${e.n}/${e.d}`:`${c.n}/${c.d} = ${e.w}과 ${e.q}/${e.d}`; };
const cellAt=(x,y)=>Math.min(ROWS-1,Math.max(0,Math.floor(y/100)))*COLS+Math.min(COLS-1,Math.max(0,Math.floor(x/100)));
/* ── 튕기기 물리 (헤드리스 계산 → 궤적 재생) ── */
const K_DAMP=4.4, C_FRIC=35, REST=.92, VMAX=2800, OVER=.85, PULLMAX=150, PULLMIN=18;
function simulate(st0,who,vx,vy){
  const s=st0.map(p=>({x:p.x,y:p.y,vx:0,vy:0,gone:-1}));
  s[who].vx=vx; s[who].vy=vy;
  const DT=1/120, frames=[], push=()=>frames.push([Math.round(s[0].x),Math.round(s[0].y),Math.round(s[1].x),Math.round(s[1].y)]);
  push(); let goal=false;
  for(let step=1;step<=840;step++){
    let moving=false;
    s.forEach(o=>{ if(o.gone>=0) return; const sp=Math.hypot(o.vx,o.vy); if(sp<=0) return;
      let ns=sp*Math.exp(-K_DAMP*DT)-C_FRIC*DT; if(ns<10) ns=0; const f=ns/sp; o.vx*=f; o.vy*=f; o.x+=o.vx*DT; o.y+=o.vy*DT; if(ns>0) moving=true; });
    const a=s[0], b=s[1];
    if(a.gone<0&&b.gone<0){ const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
      if(d<2*R&&d>0){ const nx=dx/d, ny=dy/d, rv=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
        if(rv>0){ const j=(1+REST)*rv/2; a.vx-=j*nx; a.vy-=j*ny; b.vx+=j*nx; b.vy+=j*ny; }
        const ov=(2*R-d)/2; a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov; moving=true; } }
    s.forEach((o,i)=>{ if(o.gone>=0) return;
      if(o.x<0||o.x>W||o.y<0||o.y>H){ o.gone=frames.length+(step%4===0?0:0);
        if(i===who&&o.y>190&&o.y<310&&((who===0&&o.x>W)||(who===1&&o.x<0))) goal=true; o.vx=0; o.vy=0; } });
    if(step%4===0) push();
    if(!moving) break;
  }
  push();
  const f2=s.map((o,i)=>o.gone>=0?o.gone:-1);
  const fl=s[who];
  if(fl.gone<0&&((who===0&&fl.x>=W-100&&fl.y>=200&&fl.y<=300)||(who===1&&fl.x<=100&&fl.y>=200&&fl.y<=300))) goal=true;
  return {fr:frames,gone:f2,goal,end:s.map(o=>({x:o.x,y:o.y}))};
}
/* ── 네트워크(폴링) ── */
function Net(code,onMsg,onStatus){
  const sid=Math.random().toString(36).slice(2,8), HD={'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY};
  let last=0, alive=false, fails=0, bc=null, timer=null;
  const base=SUPA_URL+'/rest/v1/battle_msgs';
  async function poll(){
    if(!alive) return;
    try{
      const r=await fetch(base+'?room=eq.'+code+'&id=gt.'+last+'&order=id.asc&limit=50&select=id,body',{headers:HD,cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const rows=await r.json(); fails=0;
      for(const x of rows){ last=Math.max(last,x.id); if(x.body&&x.body._s!==sid) onMsg(x.body); }
    }catch(e){ fails++; if(fails>=12){ alive=false; onStatus('closed','연결 끊김'); return; } }
    if(alive) timer=setTimeout(poll,700);
  }
  this.open=async function(){
    if(MOCK){ bc=new BroadcastChannel('fracsoccer-'+code); bc.onmessage=e=>onMsg(e.data); setTimeout(()=>onStatus('ok'),50); return; }
    try{
      const r=await fetch(base+'?room=eq.'+code+'&order=id.desc&limit=1&select=id',{headers:HD,cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const rows=await r.json(); last=rows.length?rows[0].id:0; alive=true; onStatus('ok'); poll();
    }catch(e){ onStatus('error',String(e&&e.message||e)); }
  };
  let q=Promise.resolve();
  this.send=function(o){
    if(bc){ bc.postMessage(JSON.parse(JSON.stringify(o))); return; }
    const body=Object.assign({_s:sid},o);
    q=q.then(async()=>{ for(let k=0;k<3;k++){ try{ const r=await fetch(base,{method:'POST',headers:Object.assign({'Content-Type':'application/json','Prefer':'return=minimal'},HD),body:JSON.stringify({room:code,body}),keepalive:true}); if(r.ok) return; }catch(e){} await new Promise(z=>setTimeout(z,400)); } });
  };
  this.close=()=>{ alive=false; clearTimeout(timer); try{ if(bc) bc.close(); }catch(e){} };
}
/* ── 상태 ── */
const DEF={board:'book',win:'p3',check:'write',denW:false,two:true,cpu:'easy'};
let opt=Object.assign({},DEF);
let mode=null, me=[null,null], net=null, code='', names=['',''], S=null, recorded=false, myIdx=0, tmr=null, t0=Date.now(), seq=0, tEnd=0;
let anim=null, aim=null, ans=null, speakStage=0, waiting=false, pendingS=null, recvAt=0, tick=null, cells=null;
const main=$('main');
const mkStat=()=>({fl:0,att:0,ok:0,ok1:0,hint:0,goal:0,out:0,imp:[0,0],mix:[0,0]});
function resolveStudent(p){ const n=parseInt(p.num,10), ok=(n>=1&&n<=ROSTER.length&&ROSTER[n-1]===p.name);
  return {recordName:ok?ROSTER[n-1]:'미분류',note:ok?'':`[확인필요 · 학생 입력: 번호 ${p.num} / 이름 ${p.name}] `}; }

const BOARDLBL={book:'교과서 놀이판',easy:'새 판(쉬운 분모)',all:'새 판(모든 분모)'};
const optLabel=o=>`${BOARDLBL[o.board]} · ${WINLBL[o.win]} · ${o.check==='speak'?'말하고 친구가 확인':'직접 쓰기'}${o.denW?' · 분모도 쓰기':''}${o.two?' · 기회 2번':''}`;
/* ── 처음 화면 ── */
function chipRow(id,items,cur){ return `<div class="row" id="${id}" style="margin-bottom:4px">${items.map(([v,l])=>`<button class="chip ${v===cur?'on':''}" data-v="${v}">${l}</button>`).join('')}</div>`; }
function home(){

    <div class="t2">이기는 방법</div>${chipRow('oWin',[['p3','⚽ 먼저 3점'],['p5','⚽ 먼저 5점'],['t3','⏱ 3분'],['t5','⏱ 5분']],opt.win)}
    <div class="t2">분수 바꾸기 확인</div>${chipRow('oCheck',[['write','✏️ 직접 써서 자동 확인'],['speak','🗣 말하고 친구가 확인']],opt.check)}

function fieldsOf(c){ const l=c.k==='m'?['n']:['w','q']; if(S.opt.denW) l.push('d'); return l; }

addEventListener('keydown',e=>{

function hintHTML(c,level){

/* 캔버스 그리기 */
function drawFrac(x,y,c){

function stonePos(){ const a=animPos(); if(a){ if(a.done&&mode==='guest'&&pendingS){ const s=pendingS; pendingS=null; if(s.seq>S.seq) applyState(s); else anim=null; return {pos:S.st.map(q=>({x:q.x,y:q.y})),flying:false}; } return {pos:a.pos,flying:!a.done}; }

function drawStone(o,white,glow){ if(o.hide) return; const x=o.x, y=o.y;

function draw(){
  if(!ctx||!S) return; const cx=ctx; cx.clearRect(0,0,CW,CH);

function cvXY(e){ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*CW-PADX,y:(e.clientY-r.top)/r.height*CH-PADY}; }
function pDown(e){ if(!S||S.over||S.phase!=='aim'||anim||waiting||!myTurn()) return; const p=cvXY(e); aim={sx:p.x,sy:p.y,cx:p.x,cy:p.y}; try{ canvas.setPointerCapture(e.pointerId); }catch(_){} e.preventDefault(); }

function pUp(e){ if(!aim) return; const dx=aim.sx-aim.cx, dy=aim.sy-aim.cy, d=Math.hypot(dx,dy); aim=null; if(!S||S.phase!=='aim'||!myTurn()) return;

/* ── 결과·기록 ── */

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
