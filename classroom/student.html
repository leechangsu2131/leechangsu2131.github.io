<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>수업 참여</title>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#1c1c22;--line:#34343d;--ink:#f5f5f7;--sub:#a1a1aa;--blue:#64d2ff;--purple:#bf5af2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Apple SD Gothic Neo",sans-serif}.wrap{max-width:540px;margin:7vh auto;padding:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px}h1{margin:0 0 6px;font-size:28px}.sub,.hint{color:var(--sub);font-size:14px}.form{display:grid;gap:12px;margin-top:20px}label{display:grid;gap:5px;font-size:14px}input{font:inherit;color:var(--ink);background:#111116;border:1px solid var(--line);border-radius:11px;padding:12px}button{font:inherit;border:0;border-radius:12px;padding:13px;background:#fff;color:#111;font-weight:750;cursor:pointer}.status{min-height:22px;color:#ff9f0a;margin-top:10px}.notice{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:12px;color:#ddd;font-size:13px}.tag{color:var(--blue);font-weight:700}.room-link{padding:10px 12px;border:1px solid #64d2ff55;background:#14222a;border-radius:11px;color:#9be2ff;font-size:14px}.mock-badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#2a1b4e;color:#d8b4fe;border:1px solid #7c3aed;margin-left:6px}
</style></head><body><main class="wrap"><section class="card">
  <div class="tag">📚 우리 반 수업 <span id="mockBadge" class="mock-badge" hidden>🧪 모의실험</span></div>
  <h1>수업에 참여해요</h1>
  <p class="sub">번호와 이름을 입력하면 수업 페이지로 이동합니다.</p>
  <form id="form" class="form">
    <!-- ## [수업 코드는 HC302로 항상 통일] -->
    <div id="roomLink" class="room-link">우리 반 수업방 · <b>HC302</b></div>
    <input type="hidden" id="room" value="HC302">

    <label>내 번호<input id="no" inputmode="numeric" maxlength="4" placeholder="예: 3" required autofocus></label>
    <label>이름<input id="name" maxlength="20" autocomplete="name" placeholder="예: 홍길동" required></label>
    <button id="submitBtn">수업 참여하기</button>
  </form>
  <div id="status" class="status" role="status"></div>
  <div class="notice">
    수업 중 선생님은 <b>이 홈페이지 탭 화면</b>을 볼 수 있습니다. 다른 앱이나 브라우저 탭의 화면·카메라·사진은 절대 공유되지 않습니다. 화면 공유 중에는 화면 아래쪽에 상태 표시가 나타나며 언제든 수업을 나갈 수 있습니다.
  </div>
</section></main>

<script>
(()=>{
  const U='https://erzdvlcbjneabxqwnwfy.supabase.co',K='sb_publishable_29w26VjvhHwI5O6iKOXTwA_sSTKUhfz';
  const $=x=>document.getElementById(x);
  const q=new URLSearchParams(location.search);
  const DEFAULT_ROOM='HC302';
  const room=(q.get('room')||DEFAULT_ROOM).trim().toUpperCase();
  const isMock=q.get('mock')==='1';

  $('room').value=room;
  $('roomLink').innerHTML='우리 반 수업방 · <b>'+room+'</b>'+(isMock?' <span style="font-size:12px;color:#d8b4fe">[모의실험]</span>':'');
  if(isMock){
    $('mockBadge').hidden=false;
  }

  function rpc(name,args){
    return fetch(U+'/rest/v1/rpc/'+name,{
      method:'POST',
      headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},
      body:JSON.stringify(args)
    }).then(async r=>{
      let t=await r.text();
      if(!r.ok){
        let m=t;
        try{m=JSON.parse(t).message||JSON.parse(t).hint||t}catch(_){}
        throw Error(m||r.statusText);
      }
      return t?JSON.parse(t):null;
    });
  }

  $('form').onsubmit=async e=>{
    e.preventDefault();
    const no=$('no').value.trim();
    const name=$('name').value.trim();

    $('status').textContent='우리 반 수업에 연결하고 있어요…';

    try{
      const token=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');
      let studentId;

      if(isMock){
        studentId='mock-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
        const joinMsg={
          type:'student_join',
          studentId,
          studentNo:no,
          studentName:name,
          time:Date.now()
        };
        try{
          const ch=new BroadcastChannel('classroom-mock-'+room);
          ch.postMessage(joinMsg);
        }catch(_){}
        try{
          localStorage.setItem('classroom_mock_bus',JSON.stringify({room:room,data:joinMsg,time:Date.now()}));
        }catch(_){}

        localStorage.setItem('homeClassroom',JSON.stringify({
          studentId,
          token,
          room,
          name,
          no,
          mock:true,
          joinedAt:Date.now()
        }));
      }else{
        const d=await rpc('classroom_student_join',{p_room:room,p_no:no,p_name:name,p_token:token});
        studentId=d.student_id;
        localStorage.setItem('homeClassroom',JSON.stringify({
          studentId:d.student_id,
          token,
          room:d.room_code||room,
          name,
          no:d.student_no||no,
          mock:false,
          joinedAt:Date.now()
        }));
      }

      const next=q.get('next')||'../education.html';
      const u=new URL(next,location.href);
      if(isMock)u.searchParams.set('mock','1');
      if(u.origin!==location.origin)throw Error('홈페이지 주소만 열 수 있어요.');
      location.href=u.href;
    }catch(err){
      $('status').textContent='참여하지 못했어요: '+(err.message||'연결 상태를 확인해 주세요.');
    }
  };
})();
</script>
<script>
(function(){
  var s=document.createElement('script');
  s.defer=true;
  if(location.protocol==='file:'){
    s.src='./monitor.js';
  }else{
    s.src='/classroom/monitor.js';
  }
  document.head.appendChild(s);
})();
</script>
</body></html>
