<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>수업 참여</title><style>
:root{color-scheme:dark;--bg:#101014;--panel:#1c1c22;--line:#34343d;--ink:#f5f5f7;--sub:#a1a1aa;--blue:#64d2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Apple SD Gothic Neo",sans-serif}.wrap{max-width:540px;margin:7vh auto;padding:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px}h1{margin:0 0 6px;font-size:28px}.sub,.hint{color:var(--sub);font-size:14px}.form{display:grid;gap:12px;margin-top:20px}label{display:grid;gap:5px;font-size:14px}input{font:inherit;color:var(--ink);background:#111116;border:1px solid var(--line);border-radius:11px;padding:12px}button{font:inherit;border:0;border-radius:12px;padding:13px;background:#fff;color:#111;font-weight:750;cursor:pointer}.status{min-height:22px;color:#ff9f0a;margin-top:10px}.notice{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:12px;color:#ddd;font-size:13px}.tag{color:var(--blue);font-weight:700}
</style></head><body><main class="wrap"><section class="card"><div class="tag">📚 우리 반 수업</div><h1>수업에 참여해요</h1><p class="sub">번호와 이름을 입력하면 수업 페이지로 이동합니다.</p><form id="form" class="form"><label>수업 코드<input id="room" maxlength="6" autocomplete="off" required></label><label>내 번호<input id="no" inputmode="numeric" maxlength="4" required></label><label>이름<input id="name" maxlength="20" autocomplete="name" required></label><button>수업 참여하기</button></form><div id="status" class="status" role="status"></div><div class="notice">수업 중 선생님은 <b>이 홈페이지 탭 화면</b>을 볼 수 있습니다. 다른 앱이나 브라우저 탭의 화면·카메라·사진은 공유되지 않습니다. 화면 공유 중에는 위쪽에 표시가 나타나며 언제든 이 기기에서 수업을 나갈 수 있습니다.</div></section></main>
<script>
(()=>{const U='https://erzdvlcbjneabxqwnwfy.supabase.co',K='sb_publishable_29w26VjvhHwI5O6iKOXTwA_sSTKUhfz';const $=x=>document.getElementById(x);const q=new URLSearchParams(location.search);$('room').value=(q.get('room')||'').toUpperCase();function rpc(name,args){return fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(args)}).then(async r=>{let t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null})}
$('form').onsubmit=async e=>{e.preventDefault();const room=$('room').value.trim().toUpperCase(),no=$('no').value.trim(),name=$('name').value.trim();$('status').textContent='수업에 연결하고 있어요…';try{const token=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');const d=await rpc('classroom_student_join',{p_room:room,p_no:no,p_name:name,p_token:token});localStorage.setItem('homeClassroom',JSON.stringify({studentId:d.student_id,token,room:d.room_code,name,no:d.student_no,joinedAt:Date.now()}));const next=q.get('next')||'../education.html';const u=new URL(next,location.href);if(u.origin!==location.origin)throw Error('홈페이지 주소만 열 수 있어요.');location.href=u.href}catch(err){$('status').textContent='참여하지 못했어요. '+(err.message.includes('수업 코드를')?'수업 코드를 확인해 주세요.':'입력한 내용을 확인하고 다시 시도해 주세요.')}};
})();
</script><script src="/classroom/monitor.js" defer></script></body></html>
