<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>분수 학급 순위표</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F8FC;--ink:#25324A;--sub:#6B7690;--blue:#3D5A80;--blue-soft:#DCE6F2;--org:#E8873A;--org-soft:#FBE6D2;--ok:#4C8C5C;--line:#D7E3EE}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Gowun Batang",serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
.app{max-width:760px;margin:0 auto;padding:14px 12px 30px}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:30px;margin:0;color:var(--blue);text-align:center}
.sub{text-align:center;color:var(--sub);font-size:14px;margin:2px 0 12px}
.box{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px 18px;box-shadow:0 3px 14px rgba(61,90,128,.08);margin-bottom:12px}
.btn{font-family:"Jua",sans-serif;font-size:17px;padding:9px 16px;border-radius:99px;border:2px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
.btn.on{background:var(--org);border-color:var(--org);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.t{font-family:"Jua",sans-serif;font-size:19px;color:var(--blue);margin-bottom:6px}
select{height:40px;border:2px solid var(--blue);border-radius:10px;font-size:16px;font-family:inherit;padding:0 8px;background:#fff}
.team{text-align:center}.team .big{font-family:"Jua",sans-serif;font-size:36px;color:var(--org)}
.bar{height:16px;border-radius:99px;background:#E7EEF5;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#F4B26B,#E8873A);transition:width .6s}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-size:18px}
.li:nth-child(odd){background:#F8FBFE}
.li.me{background:var(--org-soft);outline:2px solid var(--org)}
.rk{font-family:"Jua",sans-serif;width:44px;text-align:center;font-size:22px}
.nm{flex:1;font-family:"Jua",sans-serif}
.vl{font-family:"Jua",sans-serif;color:var(--org);font-size:20px}
.vl small{color:var(--sub);font-size:13px;margin-left:2px}
.hint{font-size:13.5px;color:var(--sub);line-height:1.7;margin-top:6px}
.msg{text-align:center;color:var(--sub);padding:20px}
</style>
</head>
<body>
<div class="app">
  <h1>🏅 분수 학급 순위표</h1><p class="sub">정확도가 아니라 <b>꾸준히 연습한 날</b>과 <b>함께 모은 경험치</b>를 칭찬해요</p>
  <div id="main"><div class="msg">불러오는 중...</div></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const SUPA_URL='https://erzdvlcbjneabxqwnwfy.supabase.co', SUPA_KEY='sb_publishable_29w26VjvhHwI5O6iKOXTwA_sSTKUhfz';
const ROSTER=['강시우','김가을','김동규','김주안','박민서','박서우','박현규','백다온','오지윤','이서우','이예나','이윤슬','정두영','조주아','천선율','한예기','황보검','최윤채','박선우'];
const GOAL_STEP=500;
let rows=null, tab='days', me=null; try{ me=localStorage.getItem('fracMe')||''; }catch(e){ me=''; }
const main=$('main');
const kstToday=()=>{ const d=new Date(Date.now()+9*3600*1000); return d.toISOString().slice(0,10); };
function agg(){
  const today=kstToday(), weekAgo=new Date(Date.parse(today)-6*86400000).toISOString().slice(0,10); const m=new Map();
  rows.forEach(r=>{ if(ROSTER[r.num-1]!==r.name) return; const k=r.num; let o=m.get(k); if(!o){ o={num:r.num,name:r.name,xp:0,days:new Set(),wdays:new Set(),n:0}; m.set(k,o); } o.xp+=r.xp; o.n++; o.days.add(r.day); if(r.day>=weekAgo) o.wdays.add(r.day); });
  return [...m.values()].map(o=>({num:o.num,name:o.name,xp:o.xp,days:o.days.size,wdays:o.wdays.size,n:o.n}));
}
function ranked(list,key,tie){ const s=list.slice().sort((a,b)=>b[key]-a[key]||b[tie]-a[tie]); let prev=null,rk=0; s.forEach((o,i)=>{ const sig=o[key]+'/'+o[tie]; if(sig!==prev){ rk=i+1; prev=sig; } o.rk=rk; }); return s; }
const TABS={days:{label:'🌟 꾸준왕',key:'days',tie:'xp',unit:'일',desc:'연습한 날짜가 많을수록 높아요 (최근 120일)'},xp:{label:'⭐ 경험치',key:'xp',tie:'days',unit:'XP',desc:'게임과 연습으로 모은 경험치 합계예요'},week:{label:'🔥 이번 주',key:'wdays',tie:'xp',unit:'일',desc:'최근 7일 동안 연습한 날수예요'}};
function render(){
  const list=agg(), total=list.reduce((s,o)=>s+o.xp,0), goal=Math.max(GOAL_STEP,Math.ceil((total+1)/GOAL_STEP)*GOAL_STEP), prevG=goal-GOAL_STEP;
  const T=TABS[tab], s=ranked(list,T.key,T.tie), mine=s.find(o=>me&&ROSTER[o.num-1]===me);
  main.innerHTML=`<div class="box team"><div class="t">🤝 우리 반 모두의 경험치</div><div class="big">${total.toLocaleString()} XP</div><div class="bar"><i style="width:${Math.round((total-prevG)/GOAL_STEP*100)}%"></i></div><div class="hint">다음 목표 ${goal.toLocaleString()} XP까지 ${ (goal-total).toLocaleString() } XP! · 함께한 친구 ${list.length}명</div></div>
  <div class="box"><div class="row" style="margin-bottom:10px">${Object.keys(TABS).map(k=>`<button class="btn ${k===tab?'on':''}" data-tab="${k}">${TABS[k].label}</button>`).join('')}</div>
   <div class="hint" style="margin:0 0 8px">${T.desc}</div>
   <div class="row" style="margin-bottom:8px"><label style="font-size:15px">나는</label><select id="me"><option value="">(선택 안 함)</option>${ROSTER.map(n=>`<option ${n===me?'selected':''}>${n}</option>`).join('')}</select>${mine?`<span style="font-family:Jua;color:var(--org);font-size:18px">내 순위 ${mine.rk}위!</span>`:''}</div>
   ${s.length?s.slice(0,10).map(o=>`<div class="li ${me&&ROSTER[o.num-1]===me?'me':''}"><span class="rk">${o.rk<=3?['🥇','🥈','🥉'][o.rk-1]:o.rk}</span><span class="nm">${o.name}</span><span class="vl">${o[T.key]}<small>${T.unit}</small></span></div>`).join(''):'<div class="msg">아직 기록이 없어요. 게임을 하고 오면 이름이 나타나요!</div>'}
   ${(mine&&mine.rk>10)?`<div class="li me"><span class="rk">${mine.rk}</span><span class="nm">${mine.name} (나)</span><span class="vl">${mine[T.key]}<small>${T.unit}</small></span></div>`:''}
   <div class="hint">순위는 열심히 꾸준히 한 친구가 높아져요. 맞힌 개수나 이긴 횟수는 순위에 들어가지 않아요. 새로 고치려면 아래 버튼을 눌러요.</div>
   <div class="row" style="margin-top:8px"><button class="btn" id="rf">🔄 새로 고침</button></div></div>`;
  main.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); });
  $('me').onchange=e=>{ me=e.target.value; try{ localStorage.setItem('fracMe',me); }catch(x){} render(); };
  $('rf').onclick=load;
}
async function load(){
  main.innerHTML='<div class="msg">불러오는 중...</div>';
  try{ const r=await fetch(SUPA_URL+'/rest/v1/class_board_events?select=num,name,xp,day&order=id.desc&limit=5000',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY},cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); rows=await r.json(); render(); }
  catch(e){ main.innerHTML='<div class="box"><div class="msg">❌ 불러오지 못했어요. 인터넷을 확인해 주세요.<br>('+(e.message||e)+')</div><div class="row" style="justify-content:center"><button class="btn" id="rf">다시 시도</button></div></div>'; $('rf').onclick=load; }
}
window.__lb={agg:()=>agg()};
if(new URLSearchParams(location.search).get('demo')==='1'){ rows=JSON.parse(decodeURIComponent(new URLSearchParams(location.search).get('rows')||'[]')); render(); } else load();
})();
</script>
</body>
</html>
