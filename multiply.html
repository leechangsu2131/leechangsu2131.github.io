<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>두 자리 수 곱셈 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7EF;
    --panel:#FFFFFF;
    --ink:#25324A;
    --sub:#6B7690;
    --tens:#3D5A80;
    --tens-soft:#DCE6F2;
    --ones:#E8873A;
    --ones-soft:#FBE6D2;
    --correct:#4C8C5C;
    --correct-soft:#E1F0E3;
    --wrong:#C0503F;
    --wrong-soft:#FAE4E0;
    --line:#E4DCC9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Gowun Batang", serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .app{ width:100%; max-width:620px; }

  header{ text-align:center; margin-bottom:22px; }
  h1{
    font-family:"Jua", sans-serif;
    font-weight:400;
    font-size:30px;
    margin:0 0 4px;
    color:var(--tens);
    letter-spacing:0.5px;
  }
  .subtitle{
    color:var(--sub);
    font-size:14.5px;
    margin:0;
  }

  .stats{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:16px 0 20px;
  }
  .chip{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 16px;
    font-size:13.5px;
    color:var(--sub);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chip b{ color:var(--ink); font-family:"Jua",sans-serif; font-weight:400; font-size:15px;}

  .tabs{
    display:flex;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px;
    margin-bottom:20px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 6px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    color:var(--sub);
    transition:background .15s, color .15s;
    user-select:none;
  }
  .tab .tnum{ font-family:"Jua",sans-serif; display:block; font-size:11.5px; margin-bottom:2px; opacity:.7;}
  .tab.active{ background:var(--tens); color:#fff; }
  .tab.active .tnum{ opacity:.85; }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px 22px 26px;
    box-shadow:0 2px 0 var(--line);
  }

  .problem-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:14px;
    font-family:"Jua", sans-serif;
    font-size:40px;
    margin-bottom:22px;
    color:var(--ink);
  }
  .problem-row .op{ color:var(--sub); font-size:30px; }
  .factor-a{ color:var(--tens); }
  .factor-b{ color:var(--ones); }

  /* Area model grid */
  .grid-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:22px;
  }
  svg text{ font-family:"Jua", sans-serif; }

  .partials{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .partial-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 14px;
    font-size:16px;
  }
  .partial-row .label{ color:var(--sub); font-size:14px; }
  .partial-row .expr{ font-family:"Jua",sans-serif; font-size:17px; }
  .partial-row input{
    width:84px;
    text-align:center;
    font-family:"Jua", sans-serif;
    font-size:18px;
    padding:8px 6px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .partial-row input:focus{ outline:none; border-color:var(--tens); }
  .partial-row.correct{ background:var(--correct-soft); border-color:var(--correct); }
  .partial-row.wrong{ background:var(--wrong-soft); border-color:var(--wrong); }

  .sum-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    border-top:2px dashed var(--line);
    padding-top:16px;
    margin-bottom:10px;
    font-family:"Jua", sans-serif;
    font-size:22px;
  }
  .sum-row input{
    width:120px;
    text-align:center;
    font-family:"Jua", sans-serif;
    font-size:24px;
    padding:10px 6px;
    border-radius:10px;
    border:2px solid var(--line);
  }
  .sum-row input:focus{ outline:none; border-color:var(--tens); }

  .vtable td.opnum{
    font-family:"Jua", sans-serif;
    font-size:26px;
    color:var(--tens);
    padding-top:4px;
  }
  .vtable td.opnum.multiplier{ color:var(--ones); }
  .vtable td.optimes{
    font-family:"Jua", sans-serif;
    font-size:22px;
    color:var(--ones);
  }
  .vtable-hr{ border-top:3px solid var(--ink); margin:2px 4px 0; }

  /* real <table> so column widths are guaranteed identical across every row by the browser */
  .vtable{
    border-collapse:collapse;
    margin:0 auto 18px;
    table-layout:fixed;
  }
  .vtable col{ width:44px; }
  .vtable td{
    text-align:center;
    vertical-align:middle;
    height:38px;
    padding:2px 1px;
  }
  .vtable td:not(:first-child){ border-left:1px dashed var(--line); }
  .vtable tr.vheader td{
    font-family:"Gowun Batang", serif;
    font-size:12.5px;
    color:var(--sub);
    height:20px;
    border-left:none !important;
  }
  .vtable col.labelcol{ width:150px; }
  .vtable td.row-label-side{
    font-size:13px;
    color:var(--sub);
    text-align:left;
    padding-left:12px;
    border-left:none !important;
    cursor:pointer;
    user-select:none;
    border-radius:8px;
    transition:background .12s, color .12s;
  }
  .vtable td.row-label-side:hover{ background:var(--paper); }
  .vtable td.row-label-side.active{ color:var(--tens); font-weight:bold; background:var(--tens-soft); }
  .vtable td.operand-tag{
    font-size:12px;
    font-family:"Jua", sans-serif;
    text-align:left;
    padding-left:12px;
    border-left:none !important;
    white-space:nowrap;
  }
  .vtable td.operand-tag.hl-a{ color:var(--tens); }
  .vtable td.operand-tag.hl-b{ color:var(--ones); }
  .vtable td.opnum.hl-target{ transition:background .15s, box-shadow .15s; border-radius:6px; }
  .vtable td.opnum.hl-target.hl-active{
    background:var(--tens-soft);
    box-shadow:0 0 0 2px var(--tens-soft);
  }
  .vtable td input{
    width:38px; height:34px;
    text-align:center;
    font-family:"Jua", sans-serif;
    font-size:18px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .vtable td input:focus{ outline:none; border-color:var(--tens); }
  .vtable td.wrong input{ border-color:var(--wrong) !important; background:var(--wrong-soft) !important; }
  .vtable td.correct input{ border-color:var(--correct) !important; background:var(--correct-soft) !important; }
  .vtable td.carry input{
    width:26px; height:26px;
    font-size:13px;
    border-radius:50%;
    border:1.5px dashed var(--ones);
    color:var(--ones);
    background:var(--ones-soft);
  }

  .answer-only{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:18px;
  }
  .answer-only input{
    width:150px;
    text-align:center;
    font-family:"Jua", sans-serif;
    font-size:30px;
    padding:14px 8px;
    border-radius:14px;
    border:2px solid var(--line);
  }
  .answer-only input:focus{ outline:none; border-color:var(--tens); }
  .answer-only .eq{ font-family:"Jua",sans-serif; font-size:26px; color:var(--sub); }

  .actions{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:6px;
  }
  button{
    font-family:"Jua", sans-serif;
    font-size:15.5px;
    border:none;
    border-radius:12px;
    padding:12px 22px;
    cursor:pointer;
    transition:transform .08s, opacity .15s;
  }
  button:active{ transform:scale(0.97); }
  .btn-check{ background:var(--tens); color:#fff; }
  .btn-next{ background:var(--ink); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--sub); border:1.5px solid var(--line); }
  button:disabled{ opacity:.4; cursor:default; }

  .feedback{
    text-align:center;
    margin-top:16px;
    font-size:15px;
    min-height:24px;
    color:var(--sub);
  }
  .feedback.good{ color:var(--correct); font-family:"Jua",sans-serif; }
  .feedback.bad{ color:var(--wrong); font-family:"Jua",sans-serif; }

  .explain{
    margin-top:14px;
    background:var(--tens-soft);
    border-radius:12px;
    padding:12px 16px;
    font-size:14.5px;
    color:var(--ink);
    line-height:1.7;
    display:none;
  }
  .explain.show{ display:block; }

  .timer{
    text-align:center;
    color:var(--sub);
    font-size:13.5px;
    margin-bottom:14px;
  }

  footer{
    text-align:center;
    color:var(--sub);
    font-size:12.5px;
    margin-top:26px;
    line-height:1.7;
  }

  @media (max-width:420px){
    h1{ font-size:25px; }
    .problem-row{ font-size:32px; }
    .card{ padding:18px 14px 20px; }
    .answer-only input{ width:120px; font-size:26px; }
    .tab{ font-size:12px; padding:9px 3px; }
    .tab .tnum{ font-size:10.5px; }
  }

  /* 학생 정보 & 결과 제출 */
  .who-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .who-card label{
    font-size:13.5px;
    color:var(--sub);
    white-space:nowrap;
  }
  .who-card input{
    font-family:"Gowun Batang", serif;
    font-size:15px;
    padding:9px 10px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .who-card input:focus{ outline:none; border-color:var(--tens); }
  .who-card input.who-num{ width:64px; flex:none; text-align:center; }
  .who-card input.who-name{ flex:1; min-width:140px; }

  .submit-bar{
    display:flex;
    justify-content:center;
    margin:18px 0 6px;
  }
  .btn-submit{
    font-family:"Jua", sans-serif;
    font-size:15.5px;
    border:none;
    border-radius:12px;
    padding:13px 26px;
    cursor:pointer;
    background:var(--correct);
    color:#fff;
    transition:transform .08s, opacity .15s;
  }
  .btn-submit:active{ transform:scale(0.97); }
  .btn-submit:disabled{ opacity:.45; cursor:default; }

  .submit-status{
    text-align:center;
    margin-top:10px;
    font-size:14px;
    min-height:20px;
  }
  .submit-status.ok{ color:var(--correct); }
  .submit-status.err{ color:var(--wrong); }
  .submit-status.pending{ color:var(--sub); }

  /* 종합 테스트용 메모장(그림판) */
  .scratchpad-wrap{
    margin:16px auto 4px;
  }
  .scratchpad-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .scratchpad-header span{
    font-size:13px;
    color:var(--sub);
  }
  .btn-clear-pad{
    font-family:"Gowun Batang", serif;
    font-size:12.5px;
    padding:6px 12px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--sub);
    cursor:pointer;
  }
  .btn-clear-pad:active{ transform:scale(0.96); }
  #scratchCanvas{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:600/520;
    border:1.5px dashed var(--line);
    border-radius:14px;
    background:#fff;
    touch-action:none;
    cursor:crosshair;
  }

  /* 안내 가이드 */
  /* 자기 진단 화면 */
  .assess-box{
    background:var(--panel);
    border:1.5px solid var(--line);
    border-radius:18px;
    padding:20px 18px;
    text-align:center;
  }
  .assess-title{
    font-family:"Jua", sans-serif;
    font-size:16px;
    color:var(--ink);
    margin-bottom:6px;
  }
  .assess-q{
    font-size:14px;
    color:var(--sub);
    margin-bottom:16px;
  }
  .assess-btn{
    display:flex;
    flex-direction:column;
    width:100%;
    font-family:"Gowun Batang", serif;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    margin-bottom:10px;
    cursor:pointer;
    text-align:left;
    transition:border-color .15s, transform .08s;
  }
  .assess-btn:last-child{ margin-bottom:0; }
  .assess-btn:active{ transform:scale(0.98); }
  .assess-btn:hover{ border-color:var(--tens); }
  .assess-btn-main{
    font-family:"Jua", sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  .assess-btn-sub{
    font-size:12.5px;
    color:var(--sub);
    margin-top:2px;
  }

  /* 현재 단계 표시 (자동 진행, 클릭 불가) */
  .level-indicator{
    text-align:center;
    font-size:12.5px;
    color:var(--sub);
    margin-bottom:6px;
  }

  /* 종합 테스트 후 결과 제출 영역 */
  .result-block{
    margin-top:4px;
  }
  .result-title{
    font-family:"Jua", sans-serif;
    font-size:14.5px;
    color:var(--ink);
    text-align:center;
    margin-bottom:12px;
  }

  /* ── 3학년용 즉시 힌트 / 현재 할 일 ── */
  .learning-hint{
    margin:0 auto 18px;
    border:2px solid #D7E8F7;
    border-radius:18px;
    background:linear-gradient(135deg,#F5FBFF,#F8FFF9);
    padding:16px 16px 14px;
  }
  .hint-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .hint-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:78px;
    padding:5px 10px;
    border-radius:999px;
    background:#E4F2FF;
    color:var(--tens);
    font-family:"Jua",sans-serif;
    font-size:14px;
  }
  .hint-title{
    font-family:"Jua",sans-serif;
    font-size:18px;
    color:var(--ink);
  }
  .hint-main{
    background:#fff;
    border-radius:12px;
    padding:11px 13px;
    font-size:15px;
    line-height:1.65;
    border:1px solid #E1ECF4;
  }
  .hint-main b{ font-family:"Jua",sans-serif; }
  .hint-main .hl-a{ color:var(--tens); font-weight:bold; font-family:"Jua",sans-serif; }
  .hint-main .hl-b{ color:var(--ones); font-weight:bold; font-family:"Jua",sans-serif; }
  .hint-main .hint-sub{ color:var(--sub); font-weight:normal; font-family:inherit; font-size:13px; }
  .hint-steps{
    display:flex;
    gap:7px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .hint-step{
    border:1.5px solid #DCE7EF;
    background:#fff;
    border-radius:10px;
    padding:7px 9px;
    font-family:"Jua",sans-serif;
    font-size:13px;
    color:var(--sub);
    cursor:pointer;
  }
  .hint-step.active{
    background:var(--tens-soft);
    border-color:#A9C8E6;
    color:var(--tens);
  }
  .hint-note{
    margin-top:8px;
    font-size:12.5px;
    color:var(--sub);
  }
  .auto-focus-hint{
    animation:hintPulse .45s ease;
  }
  @keyframes hintPulse{
    0%{ box-shadow:0 0 0 0 rgba(61,90,128,.25); }
    100%{ box-shadow:0 0 0 8px rgba(61,90,128,0); }
  }
  .carry-concept{
    margin-top:8px;
    padding:7px 9px;
    border-radius:9px;
    background:#FFF9ED;
    border:1px solid #F0DFC0;
    font-size:12.5px;
    line-height:1.55;
  }
  .carry-help{
    font-family:"Jua",sans-serif;
    font-size:10px;
    color:var(--ones);
    line-height:1.1;
    margin-bottom:3px;
    white-space:nowrap;
  }
  .carry-cell{
    position:relative;
  }
  .carry-cell input{
    margin:auto;
    display:block;
  }
  .carry-caption{
    display:block;
    text-align:center;
    font-size:11px;
    color:var(--ones);
    margin-top:2px;
    white-space:nowrap;
  }
  .vtable td.carry.is-current{
    background:var(--ones-soft);
    border-radius:10px;
  }
  .vtable td.input-current input{
    border-color:var(--tens);
    box-shadow:0 0 0 3px rgba(61,90,128,.10);
  }
  .vtable td.row-label-side{
    font-family:"Jua",sans-serif;
    font-size:13.5px;
  }
  .vtable td.row-label-side.active{
    position:relative;
  }
  .no-answer-hint{
    margin-top:12px;
    padding:10px 13px;
    border-radius:11px;
    background:#FFF9ED;
    border:1px solid #F0DFC0;
    font-size:14px;
    line-height:1.65;
    color:var(--ink);
  }
  .no-answer-hint b{ font-family:"Jua",sans-serif; color:var(--ones); }


/* ===== 수모형 조작판 (오버레이) ===== */
.bt-open-row{ display:flex; justify-content:center; margin:2px 0 12px; }
.bt-open-btn{ background:#fff; color:var(--tens); border:1.5px solid var(--tens); font-size:14px; padding:9px 18px; }
#btOverlay{ --bs:1; --hundreds:#8B5FBF; --hundreds-soft:#EDE3F7; display:none; position:fixed; inset:0; z-index:1000; background:rgba(37,50,74,.55); align-items:center; justify-content:center; padding:10px; }
#btOverlay.open{ display:flex; }
#btOverlay .bt-panel{ width:100%; max-width:980px; height:min(94dvh,760px); background:#fff; border-radius:18px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.3); }
#btOverlay .bt-head{ flex:none; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding:8px 14px; border-bottom:1.5px solid var(--line); }
#btOverlay .bt-head h2{ font-family:"Jua",sans-serif; font-weight:400; font-size:18px; margin:0; color:var(--tens); }
#btOverlay .bt-guide{ flex:none; padding:6px 14px; font-size:13px; color:var(--ink); background:var(--tens-soft); }
#btOverlay .btb-head-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
#btOverlay .btb-status{ font-size:12.5px; color:var(--sub); text-align:right; }
#btOverlay .btb-status b{ color:var(--ink); }
#btOverlay .btb-toggle{ min-height:34px; padding:4px 10px; border-radius:18px; border:1.5px solid var(--line); background:#fff; color:var(--ink); font-size:12px; font-family:inherit; cursor:pointer; touch-action:manipulation; }
#btOverlay .btb-toggle[aria-pressed="true"]{ background:var(--tens-soft); border-color:#A9C8E6; color:var(--tens); }
#btOverlay .bt-close{ background:var(--ink); color:#fff; font-size:13px; padding:7px 14px; border-radius:18px; }
#btOverlay .btb-main{ flex:1 1 auto; display:flex; gap:10px; padding:10px 12px 6px; min-height:0; }
#btOverlay .btb-tray{ flex:none; width:calc(96px + (var(--bs,1) - 1) * 100px); display:flex; flex-direction:column; align-items:center; gap:12px; padding:12px 6px; border:1.5px solid var(--line); border-radius:12px; background:#FAF7EE; overflow-y:auto; }
#btOverlay .btb-tray-label{ font-size:11px; color:var(--sub); text-align:center; }
#btOverlay .manip-tray-item{ display:flex; flex-direction:column; align-items:center; gap:4px; cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; padding:6px 3px; border-radius:9px; width:100%; }
#btOverlay .manip-tray-item:hover{ background:#fff; }
#btOverlay .manip-tray-item span{ font-size:12px; color:var(--sub); }
#btOverlay .manip-tray-sample{ position:static !important; cursor:grab; }
.manip-tray-ghost{ opacity:.85; box-shadow:0 4px 10px rgba(0,0,0,.3); --bs:1; }
#btOverlay .btb-canvas-wrap{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
#btOverlay .manip-canvas{ position:relative; flex:1 1 auto; min-height:200px; border:1.5px dashed var(--line); border-radius:12px; background:#fff; overflow-x:hidden; overflow-y:auto; }
#btOverlay .manip-empty-hint{ position:absolute; top:44%; left:50%; transform:translateX(-50%); font-size:13px; color:var(--sub); text-align:center; width:80%; }
#btOverlay .manip-block.btb-block{ position:absolute; margin:0; cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; transition:left .1s ease-out, top .1s ease-out, box-shadow .15s, border-color .15s, background .15s; }
#btOverlay .manip-block.btb-block.manip-dragging{ cursor:grabbing; z-index:50; box-shadow:0 4px 10px rgba(0,0,0,.3); transform:scale(1.15); transition:box-shadow .15s; }
#btOverlay .manip-block.btb-block.manip-selected{ border-color:#D9A400 !important; background:#FFF3C4 !important; box-shadow:0 0 0 3px #D9A400; }
.manip-rod{ height:calc(22px * var(--bs,1)); width:calc(78px * var(--bs,1)); border:2px solid var(--tens); background:repeating-linear-gradient(90deg, var(--tens-soft) 0 8px, #fff 8px 10px); border-radius:5px; flex:none; }
.manip-unit{ height:calc(22px * var(--bs,1)); width:calc(22px * var(--bs,1)); border:2px solid var(--correct); background:var(--correct-soft); border-radius:5px; flex:none; }
.manip-hundred{ height:calc(84px * var(--bs,1)); width:calc(84px * var(--bs,1)); border:2px solid var(--hundreds); background:repeating-linear-gradient(0deg, var(--hundreds-soft) 0 7px, #fff 7px 9px), repeating-linear-gradient(90deg, var(--hundreds-soft) 0 7px, transparent 7px 9px); border-radius:6px; flex:none; }
#btOverlay .manip-frame{ position:absolute; border:2px dashed #B8C7D9; border-radius:12px; background:rgba(220,230,242,.28); pointer-events:none; }
#btOverlay .manip-frame-ok{ border-color:var(--correct); background:rgba(225,240,227,.5); }
#btOverlay .manip-frame-head{ padding:3px 8px; font-size:12px; color:var(--sub); background:rgba(255,255,255,.75); border-radius:10px 10px 0 0; white-space:nowrap; overflow:hidden; }
#btOverlay .manip-frame-head b{ color:var(--ink); margin-right:6px; }
#btOverlay .manip-frame-val{ display:none; font-weight:bold; color:var(--tens); }
#btOverlay .show-values .manip-frame-val{ display:inline; }
#btOverlay .manip-stock-label{ position:absolute; left:0; right:0; text-align:center; font-size:11px; color:var(--sub); border-top:1.5px dotted var(--line); padding-top:2px; pointer-events:none; }
#btOverlay .manip-selbox{ position:absolute; border:1.5px dashed var(--tens); background:rgba(61,90,128,.08); pointer-events:none; }
#btOverlay .btb-controls{ flex:none; display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px 10px; border-top:1.5px solid var(--line); background:#fff; overflow-y:auto; max-height:34%; }
#btOverlay .btb-group{ display:flex; gap:6px; padding:4px 8px 4px 4px; border-right:1.5px solid var(--line); }
#btOverlay .btb-group:last-child{ border-right:none; }
#btOverlay .btb-controls button{ display:flex; flex-direction:column; align-items:center; gap:2px; min-width:56px; min-height:46px; padding:5px 8px; border-radius:10px; border:1.5px solid var(--line); background:#fff; cursor:pointer; font-size:11px; font-family:inherit; color:var(--ink); touch-action:manipulation; }
#btOverlay .btb-controls button .ic{ font-size:17px; line-height:1; }
#btOverlay .btb-controls button:disabled{ opacity:.35; cursor:not-allowed; }
#btOverlay .btb-controls button.primary{ background:var(--tens); color:#fff; border-color:var(--tens); }
#btOverlay .btb-controls button.warn{ background:#FBEFE9; border-color:#E6B79A; }
#btOverlay .btb-widget{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 8px; border:1.5px solid var(--line); border-radius:10px; background:#fff; }
#btOverlay .btb-widget .ic{ font-size:17px; line-height:1; }
#btOverlay .btb-widget .lbl{ font-size:11px; color:var(--ink); }
#btOverlay .btb-widget-row{ display:flex; align-items:center; gap:4px; }
#btOverlay .btb-widget-row input{ width:56px; min-height:32px; border:1.5px solid var(--line); border-radius:8px; padding:2px 6px; font-size:14px; text-align:center; font-family:"Jua",sans-serif; }
#btOverlay .btb-controls .btb-widget-row button{ flex-direction:row; min-width:36px; min-height:32px; padding:2px 8px; font-size:12px; }
#btOverlay .btb-count{ min-width:34px; text-align:center; font-size:13px; font-weight:bold; }
#btOverlay .bt-only-div, #btOverlay .bt-only-mul{ display:none; }
#btOverlay.mode-div .bt-only-div{ display:flex; }
#btOverlay.mode-mul .bt-only-mul{ display:flex; }
@media (max-width:640px), (orientation:portrait){
  #btOverlay{ padding:0; }
  #btOverlay .bt-panel{ height:100dvh; border-radius:0; max-width:none; }
  #btOverlay .btb-main{ flex-direction:column; }
  #btOverlay .btb-tray{ width:auto; flex-direction:row; justify-content:space-around; align-items:flex-end; overflow-y:visible; padding:6px; }
  #btOverlay .btb-tray-label{ display:none; }
  #btOverlay .manip-canvas{ min-height:200px; }
  #btOverlay .btb-controls{ max-height:30%; }
  #btOverlay .manip-frame-head{ font-size:10px; padding:2px 4px; }
  #btOverlay .manip-canvas{ min-height:150px; }
}
