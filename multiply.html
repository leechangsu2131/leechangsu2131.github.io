<body>
<div class="app">
  <header>
    <h1>두 자리 수 곱셈 연습</h1>
    <p class="subtitle">3학년 2학기 · 부분곱으로 차근차근 곱셈을 익혀요</p>
  </header>

  <div class="assess-box" id="assessScreen">
    <div class="assess-title">🙋 시작하기 전에 하나만 물어볼게요</div>
    <div class="assess-q">두 자리 수 곱셈, 지금 어느 정도 할 수 있을 것 같아요?</div>
    <button class="assess-btn" data-start-level="1">
      <span class="assess-btn-main">아직 어려워요</span>
      <span class="assess-btn-sub">몇십 곱하기부터 차근차근</span>
    </button>
    <button class="assess-btn" data-start-level="2">
      <span class="assess-btn-main">두 자리끼리도 할 수 있어요</span>
      <span class="assess-btn-sub">부분곱은 자신 있어요</span>
    </button>
    <button class="assess-btn" data-start-level="3">
      <span class="assess-btn-main">받아올림도 자신 있어요</span>
      <span class="assess-btn-sub">세로셈까지 문제없어요</span>
    </button>
  </div>

  <div class="stats" id="statsBar" style="display:none;">
    <div class="chip">맞힌 문제 <b id="statScore">0</b></div>
    <div class="chip">연속 정답 <b id="statStreak">0</b></div>
  </div>

  <div class="card" id="card" style="display:none;">
    <div class="level-indicator" id="levelIndicator"></div>
    <div class="problem-row" id="problemRow"></div>

    <div class="grid-wrap" id="gridWrap"></div>

    <div id="scaffoldArea"></div>

    <div class="bt-open-row"><button type="button" class="bt-open-btn" id="btOpen">🧱 수모형으로 해보기</button></div>

    <div class="actions">
      <button class="btn-check" id="btnCheck">확인</button>
      <button class="btn-next" id="btnNext" disabled>다음 문제</button>
      <button class="btn-ghost" id="btnReset">다시 풀기</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="explain" id="explain"></div>
  </div>

  <div class="result-block" id="resultBlock" style="display:none;">
    <div class="result-title">🎉 종합 테스트가 끝났어요! 번호와 이름을 쓰고 제출해주세요.</div>
    <div class="who-card">
      <label for="numInput">번호</label>
      <input type="number" id="numInput" inputmode="numeric" min="1" max="19" placeholder="예: 3" class="who-num" />
      <label for="nameInputField">이름</label>
      <input type="text" id="nameInputField" placeholder="본인 이름을 정확히 입력하세요" class="who-name" />
    </div>
    <div class="submit-bar" id="submitBar">
      <button class="btn-submit" id="btnSubmit" disabled>내 결과 선생님께 제출하기</button>
    </div>
    <div class="submit-status" id="submitStatus"></div>
  </div>


<div id="btOverlay" aria-hidden="true">
 <div class="bt-panel" role="dialog" aria-label="수모형 조작판">
  <div class="bt-head">
   <h2>🧱 수모형 조작판</h2>
   <div class="btb-head-right">
    <div class="btb-status" id="btStatus"></div>
    <button type="button" class="btb-toggle" id="btValueToggle" aria-pressed="false" title="모형이 나타내는 수를 숫자로 보기 (처음엔 꺼져 있어요)">🔢 숫자로 보기</button>
    <button type="button" class="btb-toggle" id="btSizeToggle" aria-pressed="false">🔍 크게</button>
    <button type="button" class="bt-close" id="btClose">닫기 ✕</button>
   </div>
  </div>
  <div class="bt-guide" id="btGuide"></div>
  <div class="btb-main">
   <div class="btb-tray">
    <div class="btb-tray-label">끌어다 놓기</div>
    <div class="manip-tray-item" id="btTrayOne" data-tray-type="one"><div class="manip-block manip-unit manip-tray-sample"></div><span>낱개</span></div>
    <div class="manip-tray-item" id="btTrayTen" data-tray-type="ten"><div class="manip-block manip-rod manip-tray-sample"></div><span>십</span></div>
    <div class="manip-tray-item" id="btTrayHundred" data-tray-type="hundred"><div class="manip-block manip-hundred manip-tray-sample"></div><span>백</span></div>
   </div>
   <div class="btb-canvas-wrap"><div class="manip-canvas" id="btBoard"></div></div>
  </div>
  <div class="btb-controls">
   <div class="btb-group">
    <button type="button" class="primary" id="btSetup"><span class="ic">🎯</span><span id="btSetupLbl">문제 수 놓기</span></button>
   </div>
   <div class="btb-group">
    <button type="button" id="btAddOne5"><span class="ic">🟩</span>+5</button>
    <button type="button" id="btAddTen5"><span class="ic">🟦</span>+5</button>
   </div>
   <div class="btb-group">
    <button type="button" id="btSelOnes"><span class="ic">🟩</span>전체선택</button>
    <button type="button" id="btSelTens"><span class="ic">🟦</span>전체선택</button>
    <button type="button" id="btArrange"><span class="ic">🧹</span>정리</button>
   </div>
   <div class="btb-group">
    <button type="button" class="primary" id="btJoin" disabled><span class="ic">🔗</span>합치기</button>
    <button type="button" class="primary" id="btBreak" disabled><span class="ic">✂️</span>쪼개기</button>
    <button type="button" id="btDup" disabled><span class="ic">📋</span>복사</button>
   </div>
   <div class="btb-group">
    <button type="button" id="btDel" disabled><span class="ic">🗑️</span>지우기</button>
    <button type="button" id="btClearSel"><span class="ic">🚫</span>선택해제</button>
   </div>
   <div class="btb-group bt-only-mul">
    <div class="btb-widget"><span class="ic">✖️</span><span class="lbl">묶음 반복</span>
     <div class="btb-widget-row"><input type="number" id="btRepeatN" min="2" max="20" value="2" inputmode="numeric"><button type="button" id="btRepeat" disabled>반복</button></div></div>
   </div>
   <div class="btb-group bt-only-div">
    <div class="btb-widget"><span class="ic">🍱</span><span class="lbl">나눗셈 틀</span>
     <div class="btb-widget-row"><button type="button" id="btFrMinus" aria-label="틀 줄이기">−</button><span class="btb-count" id="btFrCount">없음</span><button type="button" id="btFrPlus" aria-label="틀 늘리기">+</button></div></div>
   </div>
   <div class="btb-group">
    <button type="button" id="btUndo" disabled><span class="ic">↩️</span>되돌리기</button>
    <button type="button" class="warn" id="btReset"><span class="ic">🧽</span>비우기</button>
   </div>
  </div>
 </div>
</div>

  <footer>화천초등학교 3학년 2반 · 두 자리 수 곱셈 연습</footer>
</div>

<script>
(function(){
  const assessScreen = document.getElementById('assessScreen');
  const statsBar = document.getElementById('statsBar');
  const card = document.getElementById('card');
  const levelIndicator = document.getElementById('levelIndicator');
  const resultBlock = document.getElementById('resultBlock');
  const problemRow = document.getElementById('problemRow');
  const gridWrap = document.getElementById('gridWrap');
  const scaffoldArea = document.getElementById('scaffoldArea');
  const btnCheck = document.getElementById('btnCheck');
  const btnNext = document.getElementById('btnNext');
  const btnReset = document.getElementById('btnReset');
  const feedback = document.getElementById('feedback');
  const explain = document.getElementById('explain');
  const statScore = document.getElementById('statScore');
  const statStreak = document.getElementById('statStreak');
  const numInput = document.getElementById('numInput');
  const nameInputField = document.getElementById('nameInputField');
  const btnSubmit = document.getElementById('btnSubmit');
  const submitStatus = document.getElementById('submitStatus');
  const submitBar = document.getElementById('submitBar');

  let level = 1;
  let score = 0;
  let streak = 0;
  let attempts = 0;
  let problem = null;
  window.__btGet = function(){ return problem; };
  let checked = false;
  let lastCorrect = false;   // 방금 문제를 맞혔는지 (자동 다음 단계 판단용)

  const LEVEL_NAME = { 1:'1단계 · (두 자리 수)×(몇십)', 2:'2단계 · (두 자리 수)×(두 자리 수)', 3:'3단계 · 세로셈·받아올림' };

  // ── 학생 명단 (번호 순서 = DB 등록 기준 이름) ──
  const ROSTER = [
    '강시우','김가을','김동규','김주안','박민서','박서우','박현규','백다온',
    '오지윤','이서우','이예나','이윤슬','정두영','조주아','천선율','한예기',
    '황보검','최윤채','박선우'
  ];

  function updateSubmitEnabled(){
    btnSubmit.disabled = !(numInput.value.trim() && nameInputField.value.trim());
  }
  numInput.addEventListener('input', updateSubmitEnabled);
  nameInputField.addEventListener('input', updateSubmitEnabled);

  // ── 4단계 종합 테스트 모드 상태 ──
  const TEST_TOTAL = 10;
  let testIndex = 0;
  let testProblem = null;
  let testResults = [];

  // ── Supabase 저장 설정 ──
  const SUPABASE_URL = 'https://erzdvlcbjneabxqwnwfy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_29w26VjvhHwI5O6iKOXTwA_sSTKUhfz';
  const LEVEL_LABEL = { 1:'1단계((두자리)×(몇십))', 2:'2단계((두자리)×(두자리))', 3:'3단계(세로셈·받아올림)' };

  function todayStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  // 번호+이름이 명단과 정확히 일치하는지 확인. 불일치 시 이름 필드는 '미분류'로
  // 저장하고, 학생이 실제 입력한 값은 내용 앞부분에 그대로 남겨 나중에 한 번에
  // 모아 확인할 수 있게 한다 ('🧑‍🎓 이름' = '미분류' 로 검색하면 전부 모임).
  function resolveStudent(){
    const numRaw = numInput.value.trim();
    const nameRaw = nameInputField.value.trim();
    const num = parseInt(numRaw, 10);
    const matched = (num >= 1 && num <= ROSTER.length && ROSTER[num-1] === nameRaw);
    return {
      valid: !!(numRaw && nameRaw),
      matched,
      recordName: matched ? ROSTER[num-1] : '미분류',
      noteIfMismatch: matched ? '' : `[확인필요 · 학생 입력: 번호 ${numRaw || '?'} / 이름 ${nameRaw || '?'}] `
    };
  }

  async function submitResult(){
    const who = resolveStudent();
    if(!who.valid){
      submitStatus.textContent = '먼저 내 번호와 이름을 입력해주세요.';
      submitStatus.className = 'submit-status err';
      return;
    }

    let record;
    if(level === 4){
      if(testResults.length < TEST_TOTAL){
        submitStatus.textContent = '4단계 테스트를 끝까지 풀고 제출해주세요.';
        submitStatus.className = 'submit-status err';
        return;
      }
      const correctCount = testResults.filter(r=>r.correct).length;
      const rate = Math.round((correctCount/TEST_TOTAL)*100);
      const 긍정도 = rate >= 80 ? '긍정✅' : (rate >= 50 ? '중립📋' : '관찰필요🔍');
      const detail = testResults.map((r,i)=>{
        const ua = (r.userAnswer===null || isNaN(r.userAnswer)) ? '미입력' : r.userAnswer;
        return `${i+1})${r.a}×${r.b}=${r.total} ${r.correct ? '정답' : `오답(입력:${ua})`}`;
      }).join(', ');
      record = {
        '기록제목': '두 자리수 곱셈 종합 테스트(4단계) 결과',
        '날짜': todayStr(),
        '분야': '학습능력',
        '긍정도': 긍정도,
        '출처': '학생직접제출',
        '과목': '수학',
        '내용': `${who.noteIfMismatch}1~3단계 문제가 섞인 종합 테스트 ${TEST_TOTAL}문제 중 ${correctCount}문제 정답(정답률 ${rate}%). 세부: ${detail}.${practiceSummary()}`,
        '🧑‍🎓 이름': who.recordName
      };
    } else {
      if(attempts === 0){
        submitStatus.textContent = '문제를 최소 1개 이상 풀고 제출해주세요.';
        submitStatus.className = 'submit-status err';
        return;
      }
      const rate = Math.round((score/attempts)*100);
      const 긍정도 = rate >= 80 ? '긍정✅' : (rate >= 50 ? '중립📋' : '관찰필요🔍');
      record = {
        '기록제목': '두 자리수 곱셈 연습 결과',
        '날짜': todayStr(),
        '분야': '학습능력',
        '긍정도': 긍정도,
        '출처': '학생직접제출',
        '과목': '수학',
        '내용': `${who.noteIfMismatch}${LEVEL_LABEL[level]} 기준, 총 ${attempts}문제 중 ${score}문제를 맞혀 정답률 ${rate}%를 기록함. 최고 연속 정답 ${streak}회.${practiceSummary()}`,
        '🧑‍🎓 이름': who.recordName
      };
    }

    btnSubmit.disabled = true;
    submitStatus.textContent = '제출 중...';
    submitStatus.className = 'submit-status pending';

    try{
      if(navigator.onLine === false){
        throw new Error('오프라인(navigator.onLine=false)');
      }
      const res = await fetch(`${SUPABASE_URL}/rest/v1/class-manage`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(record)
      });
      if(!res.ok){
        let bodyText = '';
        try{ bodyText = await res.text(); }catch(e){}
        throw new Error(`HTTP ${res.status} ${bodyText}`.trim());
      }
      submitStatus.textContent = who.matched
        ? `제출 완료! 결과가 선생님께 전달되었어요.`
        : `제출 완료! (번호·이름이 명단과 달라 '미분류'로 저장했어요. 선생님께 확인을 부탁드리세요.)`;
      submitStatus.className = 'submit-status ok';
    } catch(err){
      submitStatus.textContent = `제출에 실패했어요. 인터넷 연결을 확인하고 다시 눌러주세요. (오류: ${err.message})`;
      submitStatus.className = 'submit-status err';
    } finally {
      updateSubmitEnabled();
    }
  }

  btnSubmit.addEventListener('click', submitResult);

  const PRAISE = ["참 잘했어요!","정확해요!","실력이 늘고 있어요!","완벽해요!","멋져요!","최고예요!"];
  const NUDGE = ["다시 한 번 살펴볼까요?","괜찮아요, 부분곱을 다시 확인해요.","조금만 더 생각해봐요.","천천히 다시 계산해볼까요?"];

  function rand(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function genProblem(lv){
    let a, b;
    if(lv === 1){
      a = rand(12, 89);
      b = rand(2, 9) * 10; // 몇십
    } else if(lv === 2){
      a = rand(11, 99);
      b = rand(11, 99);
    } else {
      // level 3 (vertical + carrying) needs a meaningful two-row split, so b must not be a multiple of ten
      do {
        a = rand(11, 99);
        b = rand(11, 99);
      } while (b % 10 === 0);
    }
    const a10 = Math.floor(a/10)*10, a1 = a%10;
    const b10 = Math.floor(b/10)*10, b1 = b%10;
    return {
      a, b, a10, a1, b10, b1,
      p1: a10*b10, // tens x tens
      p2: a10*b1,  // tens x ones
      p3: a1*b10,  // ones x tens
      p4: a1*b1,   // ones x ones
      vOnes: a*b1, // full a x ones digit of b (vertical algorithm, row 1)
      vTens: a*b10, // full a x tens value of b (vertical algorithm, row 2)
      total: a*b
    };
  }

  function fmt(n){ return n.toLocaleString('ko-KR'); }

  function drawGrid(p){
    // scaled (not literal) widths so both digits stay legible
    const wTens = 118, wOnes = p.b1 > 0 ? 58 : 0;
    const hTens = 92, hOnes = p.a1 > 0 ? 50 : 0;
    const gap = 3;
    const totalW = wTens + (wOnes ? gap+wOnes : 0);
    const totalH = hTens + (hOnes ? gap+hOnes : 0);
    const svgW = totalW + 70, svgH = totalH + 46;
    const ox = 56, oy = 10;

    function rect(x,y,w,h,fill,label,sub){
      if(w<=0||h<=0) return '';
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${fill}" stroke="#fff" stroke-width="2"/>
        <text x="${x+w/2}" y="${y+h/2+6}" font-size="16" text-anchor="middle" fill="#25324A">${label}</text>`;
    }

    let svg = `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}">`;
    // top axis labels (b10 / b1)
    svg += `<text x="${ox+wTens/2}" y="${oy-2}" font-size="14" text-anchor="middle" fill="#E8873A">${p.b10}</text>`;
    if(wOnes) svg += `<text x="${ox+wTens+gap+wOnes/2}" y="${oy-2}" font-size="14" text-anchor="middle" fill="#E8873A">${p.b1}</text>`;
    // left axis labels (a10 / a1)
    svg += `<text x="${ox-10}" y="${oy+hTens/2+5}" font-size="14" text-anchor="end" fill="#3D5A80">${p.a10}</text>`;
    if(hOnes) svg += `<text x="${ox-10}" y="${oy+hTens+gap+hOnes/2+5}" font-size="14" text-anchor="end" fill="#3D5A80">${p.a1}</text>`;

    svg += rect(ox, oy, wTens, hTens, '#DCE6F2', fmt(p.p1));
    if(wOnes) svg += rect(ox+wTens+gap, oy, wOnes, hTens, '#F2E3CE', fmt(p.p2));
    if(hOnes) svg += rect(ox, oy+hTens+gap, wTens, hOnes, '#F2E3CE', fmt(p.p3));
    if(wOnes && hOnes) svg += rect(ox+wTens+gap, oy+hTens+gap, wOnes, hOnes, '#FBE6D2', fmt(p.p4));
    svg += `</svg>`;
    return svg;
  }

  function renderProblem(){
    problem = genProblem(level);
    if(window.__btNewProblem) window.__btNewProblem();
    checked = false;
    btnNext.disabled = true;
    feedback.textContent = '';
    feedback.className = 'feedback';
    explain.className = 'explain';
    explain.innerHTML = '';

    problemRow.innerHTML = `<span class="factor-a">${problem.a}</span><span class="op">×</span><span class="factor-b">${problem.b}</span>`;

    if(level === 3){
      const d1 = problem.b1;               // ones digit of b
      const d2 = Math.floor(problem.b/10);  // tens digit of b
      const prod1 = problem.a * d1;
      const prod2 = problem.a * d2;

      const digits1 = String(prod1).split('');
      const digits2 = String(prod2).split('');
      const colEnd1 = 4, colStart1 = colEnd1 - (digits1.length - 1);
      const colEnd2 = 3, colStart2 = colEnd2 - (digits2.length - 1);

      gridWrap.innerHTML = buildLearningHint(1, problem);
      scaffoldArea.innerHTML = buildVerticalGrid({d1, d2, a: problem.a, b: problem.b, total: problem.total, digits1, digits2, colStart1, colEnd1, colStart2, colEnd2});
      activateHintGroup(1);
      const firstInput = scaffoldArea.querySelector('input[data-digit="r1"]:last-of-type');
      if(firstInput) setTimeout(()=>firstInput.focus(), 0);
    } else {
      gridWrap.innerHTML = `<div class="learning-hint" id="learningHint" data-current-group="1">
        <div class="hint-top">
          <span class="hint-badge">먼저 생각해요</span>
          <span class="hint-title">일의 자리부터!</span>
        </div>
        <div class="hint-main" id="hintMain">먼저 <b>일의 자리</b>가 어떤 수인지 찾아보세요. 그다음 같은 자리를 서로 곱해 보세요. <b>답은 직접 계산</b>해요.</div>
        <div class="hint-steps">
          <button type="button" class="hint-step active" data-hint-step="1">① 일의 자리</button>
          <button type="button" class="hint-step" data-hint-step="2">② 십의 자리</button>
          <button type="button" class="hint-step" data-hint-step="3">③ 모두 더하기</button>
        </div>
        <div class="hint-note">💡 계산칸을 누르면 그 계산에 맞는 힌트가 나타나요.</div>
      </div>`;

      let rows = '';
      rows += partialRow('tens-tens', `${problem.a10} × ${problem.b10}`, '십 × 십');
      if(problem.b1 > 0) rows += partialRow('tens-ones', `${problem.a10} × ${problem.b1}`, '십 × 일');
      if(problem.a1 > 0) rows += partialRow('ones-tens', `${problem.a1} × ${problem.b10}`, '일 × 십');
      if(problem.a1 > 0 && problem.b1 > 0) rows += partialRow('ones-ones', `${problem.a1} × ${problem.b1}`, '일 × 일');

      scaffoldArea.innerHTML = `
        <div class="partials">${rows}</div>
        <div class="sum-row">
          <span>합계 =</span>
          <input type="number" inputmode="numeric" id="sumInput" placeholder="?" data-hint-group="3" />
        </div>`;
    }
  }

  function partialRow(key, expr, label){
    return `<div class="partial-row" data-key="${key}">
      <span class="label">${label}</span>
      <span class="expr">${expr} =</span>
      <input type="number" inputmode="numeric" data-key="${key}" data-hint-group="${key.includes('ones') ? '1' : '2'}" />
    </div>`;
  }

  // Builds ONE grid (header + both carry/digit rows) so every box shares the exact
  // same 4 fixed-width columns (천/백/십/일) as the header — no separate grids to drift apart.
  // Real <table> row of 4 <td>s: cells inside [colStart, colEnd] get an input (carry or digit),
  // everything else is a blank <td>. Because every row is a row of the SAME <table>, the browser
  // guarantees each column lines up under the same header column on every row — no manual math.
  function buildVerticalGrid(p){
    // 각 부분곱은 '곱해지는 수 전체 × 한 자리 숫자'로 계산합니다.
    // 따라서 한 줄 안에서는 최대 두 번의 올림이 생길 수 있습니다.
    // ①번 줄: 일의 자리 계산에서 생긴 올림 → 십의 자리 위(col 3)
    //         십의 자리 계산에서 생긴 올림 → 백의 자리 위(col 2)
    // ②번 줄: 일의 자리 계산에서 생긴 올림 → 십의 자리 위(col 2)
    //         십의 자리 계산에서 생긴 올림 → 백의 자리 위(col 1)
    function tdRange(colStart, colEnd, kind, key){
      let tds = '';
      for(let c=1;c<=4;c++){
        if(c < colStart || c > colEnd){
          tds += `<td></td>`;
        } else if(kind === 'carry'){
          const group = key.startsWith('c1') ? '1' : '2';
          tds += `<td class="carry carry-cell" data-hint-group="${group}">
            <div class="carry-help">올림</div>
            <input type="text" inputmode="numeric" maxlength="1" data-carry="${key}" data-hint-group="${group}" aria-label="받아올림 숫자" />
            <span class="carry-caption">작은 수</span>
          </td>`;
        } else {
          const idx = c - colStart;
          const group = key === 'r1' ? '1' : (key === 'r2' ? '2' : '3');
          tds += `<td><input type="text" inputmode="numeric" maxlength="1" data-digit="${key}" data-idx="${idx}" data-hint-group="${group}" /></td>`;
        }
      }
      return tds;
    }

    // ①/② 각 줄에 서로 다른 두 개의 올림 칸을 서로 다른 열에 정확히 배치한다.
    // (기존 tdRange는 하나의 key를 여러 열에 그대로 복제해버려 같은 id가 두 번 생기고,
    //  두 번째 올림 칸(c1b/c2b)은 아예 그려지지 않던 문제가 있었다.)
    function carryCellHtml(key, group){
      return `<td class="carry carry-cell" data-hint-group="${group}">
        <div class="carry-help">올림</div>
        <input type="text" inputmode="numeric" maxlength="1" data-carry="${key}" data-hint-group="${group}" aria-label="받아올림 숫자" />
        <span class="carry-caption">작은 수</span>
      </td>`;
    }
    function tdCarryPair(colNear, keyNear, colFar, keyFar, group){
      let tds = '';
      for(let c=1;c<=4;c++){
        if(c === colFar) tds += carryCellHtml(keyFar, group);
        else if(c === colNear) tds += carryCellHtml(keyNear, group);
        else tds += `<td></td>`;
      }
      return tds;
    }

    const digitsA = String(p.a).split('');
    const digitsB = String(p.b).split('');
    const colStartA = 4 - (digitsA.length - 1);
    const colStartB = 4 - (digitsB.length - 1);

    function tdOperand(digits, colStart){
      let tds = '';
      for(let c=1;c<=4;c++){
        const idx = c - colStart;
        if(idx >= 0 && idx < digits.length){
          tds += `<td class="opnum hl-target" data-group="both">${digits[idx]}</td>`;
        } else {
          tds += `<td></td>`;
        }
      }
      return tds;
    }

    function tdMultiplierRow(digits, colStart){
      let tds = '';
      for(let c=1;c<=4;c++){
        const idx = c - colStart;
        if(c === colStart - 1){
          tds += `<td class="optimes">×</td>`;
        } else if(idx >= 0 && idx < digits.length){
          const grp = (idx === digits.length - 1) ? '1' : '2';
          tds += `<td class="opnum multiplier hl-target" data-group="${grp}">${digits[idx]}</td>`;
        } else {
          tds += `<td></td>`;
        }
      }
      return tds;
    }

    // 표 안, 두 수 바로 옆에도 "곱해지는 수 / 곱하는 수"를 같은 색으로 다시 알려준다 —
    // 힌트 글 속 색과 표 위의 색이 항상 같은 뜻이 되도록.
    let html = `<table class="vtable"><colgroup><col><col><col><col><col class="labelcol"></colgroup><tbody>`;
    html += `<tr>${tdOperand(digitsA, colStartA)}<td class="operand-tag hl-a">곱해지는 수</td></tr>`;
    html += `<tr>${tdMultiplierRow(digitsB, colStartB)}<td class="operand-tag hl-b">곱하는 수</td></tr>`;
    html += `<tr><td colspan="4"><div class="vtable-hr"></div></td><td></td></tr>`;
    html += `<tr class="vheader"><td>천</td><td>백</td><td>십</td><td>일</td><td></td></tr>`;

    html += `<tr>
      ${tdCarryPair(3, 'c1a', 2, 'c1b', '1')}
      <td rowspan="2" class="row-label-side" data-group="1">
        ① <b>곱하는 수의 일의 자리</b>로 계산해요
      </td>
    </tr>`;
    html += `<tr>${tdRange(p.colStart1, p.colEnd1, 'digit', 'r1')}</tr>`;

    html += `<tr>
      ${tdCarryPair(2, 'c2a', 1, 'c2b', '2')}
      <td rowspan="2" class="row-label-side" data-group="2">
        ② <b>곱하는 수의 십의 자리</b>로 계산해요
      </td>
    </tr>`;
    html += `<tr>${tdRange(p.colStart2, p.colEnd2, 'digit', 'r2')}</tr>`;

    // ③ 두 줄 더하기 — 별도 텍스트칸이 아니라, 같은 표 안에 줄을 긋고 자리 맞춰 적게 한다.
    const totalDigits = String(p.total).split('').map(Number);
    const colStartSum = 4 - (totalDigits.length - 1);
    html += `<tr><td colspan="4"><div class="vtable-hr"></div></td><td></td></tr>`;
    html += `<tr>
      ${tdCarryPair(2, 'sc2', 1, 'sc1', '3')}
      <td rowspan="2" class="row-label-side" data-group="3">
        ③ 두 줄을 <b>같은 자리에 맞춰</b> 더해요
      </td>
    </tr>`;
    html += `<tr>${tdRange(colStartSum, 4, 'digit', 'rs')}</tr>`;

    html += `</tbody></table>`;
    return html;
  }

  function buildLearningHint(group, p){
    const titles = {
      1:'① 곱하는 수의 일의 자리로 계산해요',
      2:'② 곱하는 수의 십의 자리로 계산해요',
      3:'③ 두 줄을 더해요'
    };
    const bodies = hintBodies(p);
    return `<div class="learning-hint" id="learningHint" data-current-group="${group}">
      <div class="hint-top">
        <span class="hint-badge">지금 할 일</span>
        <span class="hint-title">${titles[group]}</span>
      </div>
      <div class="hint-main" id="hintMain">${bodies[group]}</div>
      <div class="hint-steps">
        <button type="button" class="hint-step ${group===1?'active':''}" data-hint-step="1">① × 일의 자리</button>
        <button type="button" class="hint-step ${group===2?'active':''}" data-hint-step="2">② × 십의 자리</button>
        <button type="button" class="hint-step ${group===3?'active':''}" data-hint-step="3">③ 두 줄 더하기</button>
      </div>
      <div class="hint-note">💡 입력칸을 누르면 그 자리의 힌트가 자동으로 바뀌어요.</div>
    </div>`;
  }

  // 곱해지는 수(a)는 항상 파란색(hl-a), 곱하는 수(b)의 해당 자리 숫자는 항상 주황색(hl-b)으로
  // 표시해서, 세로셈 표의 색과 힌트 글 속 색이 항상 같은 뜻을 가리키도록 한다.
  // 정답(부분곱 결과)은 여전히 보여주지 않고, 주어진 숫자(a, a의 자릿수, b의 자릿수)만 사용한다.
  function hintBodies(p){
    const aTensDigit = p.a10/10, aOnesDigit = p.a1;
    const bOnesDigit = p.b1, bTensDigit = p.b10/10;
    const A = n => `<span class="hl-a">${n}</span>`;
    const B = n => `<span class="hl-b">${n}</span>`;
    return {
      1:`${A('곱해지는 수 '+p.a)} 전체에 ${B('곱하는 수의 일의 자리 숫자 '+bOnesDigit)}을 곱해요.<br>
         이 한 줄 안에서 순서대로 두 번 계산해요.<br>
         <b>1) 일의 자리끼리</b>: ${A(aOnesDigit)} × ${B(bOnesDigit)}을 계산해요.
         그 결과의 <b>일의 자리 숫자</b>는 표의 일의 자리 답 칸에 쓰고,
         10 이상이면 <b>십의 자리 숫자</b>는 왼쪽의 작은 올림 칸에 적어요.<br>
         <b>2) 십의 자리끼리</b>: ${A(aTensDigit)} × ${B(bOnesDigit)}을 계산한 뒤,
         <span class="hint-sub">방금 1)에서 올림 칸에 적어둔 숫자가 있다면 그 값에 더해요.</span>
         그렇게 나온 합의 <b>일의 자리 숫자</b>를 표의 십의 자리 답 칸에 쓰고,
         그 합이 다시 10 이상이면 그 합의 십의 자리 숫자를 더 왼쪽 올림 칸에 적어요.`,
      2:`${A('곱해지는 수 '+p.a)} 전체에 ${B('곱하는 수의 십의 자리 숫자 '+bTensDigit)}을 곱해요.<br>
         이번 줄도 순서대로 두 번 계산해요.<br>
         <b>1) 일의 자리끼리</b>: ${A(aOnesDigit)} × ${B(bTensDigit)}을 계산해요.
         결과의 <b>일의 자리 숫자</b>를 이 줄의 첫 답 칸(십의 자리 위치)에 쓰고,
         10 이상이면 십의 자리 숫자는 왼쪽 올림 칸에 적어요.<br>
         <b>2) 십의 자리끼리</b>: ${A(aTensDigit)} × ${B(bTensDigit)}을 계산한 뒤,
         <span class="hint-sub">1)에서 생긴 올림이 있다면 더해요.</span>
         그 합의 일의 자리 숫자를 다음 답 칸에 쓰고, 10 이상이면 남은 숫자는 더 왼쪽 올림 칸에 적어요.<br>
         이 줄은 ${B('십의 자리')}를 계산했으니 결과 전체가 <b>한 칸 왼쪽</b>에서 시작해요.`,
      3:`①과 ②를 모두 채웠다면, 아래에 그어진 줄 아래 칸에 <b>두 줄을 같은 자리끼리 더해서</b> 적어요.<br>
         한 자리를 더한 값이 10 이상이면, 그 자리 답 칸에는 일의 자리 숫자만 쓰고
         십의 자리 숫자는 <b>왼쪽 칸 위의 작은 올림 칸</b>에 적은 뒤 그 칸을 계산할 때 함께 더해요.`
    };
  }

  function activateHintGroup(group){
    const hint = document.getElementById('learningHint');
    if(!hint) return;
    hint.dataset.currentGroup = String(group);

    const titles = {
      1:'① 곱하는 수의 일의 자리로 계산해요',
      2:'② 곱하는 수의 십의 자리로 계산해요',
      3:'③ 두 줄을 더해요'
    };
    const bodies = hintBodies(problem);
    const title = hint.querySelector('.hint-title');
    const main = hint.querySelector('#hintMain');
    if(title) title.textContent = titles[group];
    if(main) main.innerHTML = bodies[group];

    hint.querySelectorAll('.hint-step').forEach(btn=>{
      btn.classList.toggle('active', Number(btn.dataset.hintStep)===group);
    });

    document.querySelectorAll('.row-label-side').forEach(el=>{
      el.classList.toggle('active', Number(el.dataset.group)===group);
    });
    document.querySelectorAll('.hl-target[data-group="1"], .hl-target[data-group="2"]').forEach(el=>{
      el.classList.toggle('hl-active', Number(el.dataset.group)===group);
    });
    const any = group===1 || group===2;
    document.querySelectorAll('.hl-target[data-group="both"]').forEach(el=>{
      el.classList.toggle('hl-active', any);
    });
    document.querySelectorAll('.carry-cell').forEach(el=>{
      el.classList.toggle('is-current', Number(el.dataset.hintGroup)===group);
    });

    hint.classList.remove('auto-focus-hint');
    void hint.offsetWidth;
    hint.classList.add('auto-focus-hint');
  }

  function showNoAnswerHint(text){
    explain.className = 'explain show';
    explain.innerHTML = `<div class="no-answer-hint">💡 <b>힌트</b><br>${text}</div>`;
  }

  function checkAnswer(){
    if(checked) return;

    if(level === 3){
      const d1 = problem.b1;
      const d2 = Math.floor(problem.b/10);
      const prod1 = problem.a * d1;
      const prod2 = problem.a * d2;
      const digits1 = String(prod1).split('').map(Number);
      const digits2 = String(prod2).split('').map(Number);
      // 각 부분곱(곱해지는 수 전체 × 한 자리 숫자)의 올림을 계산합니다.
      // carryA = 일의 자리 계산에서 십의 자리로 올라가는 수
      // carryB = 십의 자리 계산에서 백의 자리로 올라가는 수
      const aTens = Math.floor(problem.a / 10);
      const aOnes = problem.a % 10;

      const onesProd1 = aOnes * d1;
      const carry1a = Math.floor(onesProd1 / 10);
      const tensCalc1 = aTens * d1 + carry1a;
      const carry1b = Math.floor(tensCalc1 / 10);

      const onesProd2 = aOnes * d2;
      const carry2a = Math.floor(onesProd2 / 10);
      const tensCalc2 = aTens * d2 + carry2a;
      const carry2b = Math.floor(tensCalc2 / 10);

      let allCorrect = true;

      function checkCarry(rowKey, expected){
        const input = document.querySelector(`input[data-carry="${rowKey}"]`);
        if(!input) return;
        const cell = input.closest('td');
        const raw = input.value.trim();
        const val = raw === '' ? 0 : parseInt(raw, 10);
        const ok = val === expected;
        cell.classList.remove('correct','wrong');
        cell.classList.add(ok ? 'correct' : 'wrong');
        if(!ok){ allCorrect = false; pracKind('올림 칸'); }
      }

      function checkDigits(rowKey, digits){
        digits.forEach((d, idx)=>{
          const input = document.querySelector(`input[data-digit="${rowKey}"][data-idx="${idx}"]`);
          if(!input) return;
          const cell = input.closest('td');
          const val = parseInt(input.value, 10);
          const ok = val === d;
          cell.classList.remove('correct','wrong');
          cell.classList.add(ok ? 'correct' : 'wrong');
          if(!ok){ allCorrect = false; pracKind(rowKey === 'rs' ? '두 줄 더하기(합계)' : '부분곱 계산'); }
        });
      }

      checkCarry('c1a', carry1a);
      checkCarry('c1b', carry1b);
      checkDigits('r1', digits1);
      checkCarry('c2a', carry2a);
      checkCarry('c2b', carry2b);
      checkDigits('r2', digits2);

      // ③ 두 줄 더하기: 같은 표 안의 덧셈 올림(sc1/sc2)과 합계 자리(rs)를 채점한다.
      const colEnd1 = 4, colStart1 = colEnd1 - (digits1.length - 1);
      const colEnd2 = 3, colStart2 = colEnd2 - (digits2.length - 1);
      function valAt(digits, colStart, colEnd, col){
        if(col < colStart || col > colEnd) return 0;
        return digits[col - colStart];
      }
      let carryIn = 0;
      const additionCarryAbove = {};
      for(let col = 4; col >= 1; col--){
        const v1 = valAt(digits1, colStart1, colEnd1, col);
        const v2 = valAt(digits2, colStart2, colEnd2, col);
        const s = v1 + v2 + carryIn;
        const carryOut = Math.floor(s / 10);
        additionCarryAbove[col - 1] = carryOut;
        carryIn = carryOut;
      }
      checkCarry('sc2', additionCarryAbove[2] || 0);
      checkCarry('sc1', additionCarryAbove[1] || 0);

      const totalDigits = String(problem.total).split('').map(Number);
      checkDigits('rs', totalDigits);

      checked = true;
      attempts++;
      pracRecord(level, allCorrect);
      btnNext.disabled = false;

      if(allCorrect){
        score++; streak++;
        lastCorrect = true;
        feedback.textContent = PRAISE[rand(0,PRAISE.length-1)];
        feedback.className = 'feedback good';
      } else {
        streak = 0;
        lastCorrect = false;
        feedback.textContent = NUDGE[rand(0,NUDGE.length-1)];
        feedback.className = 'feedback bad';
        explain.className = 'explain show';
        showNoAnswerHint(`빨간 칸이 있는 자리의 힌트를 다시 살펴보세요.<br>
          <b>①</b> 곱해지는 수 전체와 곱하는 수의 일의 자리 숫자를 계산하고, 그 줄에서 생긴 올림은 <b>그 줄의 다음 자리</b>에 더해요.<br>
          <b>②</b> 곱해지는 수 전체와 곱하는 수의 십의 자리 숫자를 계산해요.`);
      }
      updateStats();
      updateNextButtonLabel();
      return;
    }

    // level 1 & 2 scaffolded (area model)
    const keys = ['tens-tens'];
    if(problem.b1>0) keys.push('tens-ones');
    if(problem.a1>0) keys.push('ones-tens');
    if(problem.a1>0 && problem.b1>0) keys.push('ones-ones');

    const answerMap = { 'tens-tens':problem.p1, 'tens-ones':problem.p2, 'ones-tens':problem.p3, 'ones-ones':problem.p4 };
    let allCorrect = true;
    keys.forEach(k=>{
      const input = document.querySelector(`input[data-key="${k}"]`);
      const row = document.querySelector(`.partial-row[data-key="${k}"]`);
      const val = parseInt(input.value, 10);
      const ok = val === answerMap[k];
      row.classList.remove('correct','wrong');
      row.classList.add(ok ? 'correct' : 'wrong');
      if(!ok) allCorrect = false;
    });

    const sumInput = document.getElementById('sumInput');
    const sumVal = parseInt(sumInput.value, 10);
    const sumOk = sumVal === problem.total;
    sumInput.style.borderColor = sumOk ? 'var(--correct)' : 'var(--wrong)';
    if(!sumOk) allCorrect = false;

    checked = true;
    attempts++;
    pracRecord(level, allCorrect);
    if(!allCorrect) pracKind('부분곱·합계');
    btnNext.disabled = false;

    if(allCorrect){
      score++; streak++;
      lastCorrect = true;
      feedback.textContent = PRAISE[rand(0,PRAISE.length-1)];
      feedback.className = 'feedback good';
    } else {
      streak = 0;
      lastCorrect = false;
      feedback.textContent = NUDGE[rand(0,NUDGE.length-1)];
      feedback.className = 'feedback bad';
      explain.className = 'explain show';
      showNoAnswerHint(`빨간색 칸을 하나씩 다시 확인해 보세요.<br>
        <b>일의 자리부터</b> 계산했는지, 각 계산 결과에서 <b>10개가 한 묶음</b>이 되는 경우를 놓치지 않았는지 살펴보세요.`);
    }
    updateStats();
    updateNextButtonLabel();
  }

  // ── 종합 테스트용 메모장(그림판): 문제마다 scaffoldArea가 새로 그려지므로
  // 매번 새 canvas를 잡아 초기화한다. pointer capture를 써서 캔버스 밖으로
  // 나가도 그리기가 끊기지 않게 하고, window에 리스너를 남기지 않는다.
  function initScratchpad(){
    const canvas = document.getElementById('scratchCanvas');
    const clearBtn = document.getElementById('btnClearPad');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');

    function fillWhite(){
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    fillWhite();
    ctx.strokeStyle = '#25324A';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    let drawing = false;

    function getPos(e){
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
    }

    canvas.addEventListener('pointerdown', (e)=>{
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', (e)=>{
      if(!drawing) return;
      const p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      e.preventDefault();
    });
    canvas.addEventListener('pointerup', ()=>{ drawing = false; });
    canvas.addEventListener('pointercancel', ()=>{ drawing = false; });

    if(clearBtn) clearBtn.addEventListener('click', fillWhite);
  }

  function updateStats(){
    statScore.textContent = score;
    statStreak.textContent = streak;
  }


  // ── 연습 기록(교사용): 제출 기록의 '내용' 글에만 덧붙임. 서버 구조는 바꾸지 않는다 ──
  const prac = {start:0, tries:{}, wrong:{}, kinds:{}, back:0};
  function pracReset(startLevel){ prac.start = startLevel; prac.tries = {}; prac.wrong = {}; prac.kinds = {}; prac.back = 0; }
  function pracRecord(lv, ok){ prac.tries[lv] = (prac.tries[lv]||0) + 1; if(!ok) prac.wrong[lv] = (prac.wrong[lv]||0) + 1; }
  function pracKind(name){ prac.kinds[name] = (prac.kinds[name]||0) + 1; }
  function practiceSummary(){
    const lv = Object.keys(prac.tries).map(Number).sort((a,b)=>a-b);
    if(!lv.length) return '';
    const parts = [`연습 기록: ${prac.start}단계에서 시작`];
    const w = lv.filter(k=>prac.wrong[k]).map(k=>`${k}단계 ${prac.wrong[k]}번`);
    parts.push(w.length ? '최종 답 오답 ' + w.join(', ') : '연습 중 최종 답 오답 없음');
    const kinds = Object.entries(prac.kinds).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} ${v}번`);
    if(kinds.length) parts.push('칸 확인에서 막힌 계산: ' + kinds.join(', '));
    if(prac.back) parts.push(`스스로 풀기 실패로 앞 단계 복귀 ${prac.back}번`);
    return ' ' + parts.join(' / ') + '.';
  }

  // ── 자기 진단 → 적응형 연습 ──
  function startPractice(startLevel){
    pracReset(startLevel);
    assessScreen.style.display = 'none';
    statsBar.style.display = 'flex';
    card.style.display = 'block';
    resultBlock.style.display = 'none';
    activateLevel(startLevel);
  }

  function activateLevel(lv){
    level = lv;
    var _bo = document.getElementById('btOpen'); if(_bo) _bo.style.display = '';
    btnCheck.disabled = false;
    levelIndicator.textContent = `지금 단계: ${LEVEL_NAME[lv]}`;
    renderProblem();
  }

  // "확인"을 누른 뒤 다음 버튼 문구를 상황에 맞게 바꿔, 무엇이 일어날지 미리 알려준다
  function updateNextButtonLabel(){
    if(lastCorrect){
      btnNext.textContent = (level < 3) ? '잘했어요! 다음 단계로 →' : '통과! 종합 테스트로 →';
    } else {
      btnNext.textContent = '다시 도전하기';
    }
  }

  // "다음 문제" 클릭 시: 맞혔으면 다음 단계(또는 종합 테스트)로, 틀렸으면 같은 단계에서 재도전
  function advancePractice(){
    btnNext.textContent = '다음 문제';
    if(lastCorrect){
      if(level < 3){
        activateLevel(level + 1);
      } else {
        startTest();
      }
    } else {
      renderProblem();
    }
  }

  // ── 4단계: 1~3단계가 섞인 종합 테스트 ──
  function startTest(){
    level = 4;
    var _bo = document.getElementById('btOpen'); if(_bo) _bo.style.display = 'none';
    statsBar.style.display = 'none';
    resultBlock.style.display = 'none';
    levelIndicator.textContent = '종합 테스트 · 1~3단계 문제가 섞여 나와요';
    testIndex = 0;
    testResults = [];
    btnCheck.disabled = false;
    nextTestQuestion();
  }

  function nextTestQuestion(){
    if(testIndex >= TEST_TOTAL){
      showTestReview();
      return;
    }
    testIndex++;
    checked = false;
    btnNext.disabled = true;
    feedback.textContent = '';
    feedback.className = 'feedback';
    explain.className = 'explain';
    explain.innerHTML = '';

    const subLv = rand(1,3);
    testProblem = genProblem(subLv);

    problemRow.innerHTML = `<span class="factor-a">${testProblem.a}</span><span class="op">×</span><span class="factor-b">${testProblem.b}</span>`;
    gridWrap.innerHTML = `<div class="timer">종합 테스트 · ${testIndex} / ${TEST_TOTAL}번째 문제</div>`;
    scaffoldArea.innerHTML = `
      <div class="answer-only">
        <input type="number" inputmode="numeric" id="testAnswerInput" placeholder="?" />
      </div>
      <div class="scratchpad-wrap">
        <div class="scratchpad-header">
          <span>✏️ 메모장 · 손으로 자유롭게 계산해보세요</span>
          <button type="button" class="btn-clear-pad" id="btnClearPad">지우기</button>
        </div>
        <canvas id="scratchCanvas" width="600" height="520"></canvas>
      </div>`;
    const input = document.getElementById('testAnswerInput');
    if(input) input.focus();
    initScratchpad();
  }

  function checkTestAnswer(){
    if(checked) return;
    const input = document.getElementById('testAnswerInput');
    const val = parseInt(input.value, 10);
    const ok = val === testProblem.total;
    input.style.borderColor = ok ? 'var(--correct)' : 'var(--wrong)';

    testResults.push({
      a: testProblem.a, b: testProblem.b, total: testProblem.total,
      userAnswer: isNaN(val) ? null : val, correct: ok
    });

    checked = true;
    btnNext.disabled = false;

    if(ok){
      feedback.textContent = PRAISE[rand(0,PRAISE.length-1)];
      feedback.className = 'feedback good';
    } else {
      feedback.textContent = NUDGE[rand(0,NUDGE.length-1)];
      feedback.className = 'feedback bad';
      explain.className = 'explain show';
      showNoAnswerHint(`답을 바로 보여주지 않을게요.<br>
        <b>일의 자리부터</b> 계산하고, 두 자리 수와 곱하는 경우에는 <b>부분곱을 나누어 생각</b>해 보세요.`);
    }
  }

  function showTestReview(){
    const correctCount = testResults.filter(r=>r.correct).length;
    const rate = Math.round((correctCount/TEST_TOTAL)*100);

    problemRow.innerHTML = `<span style="font-size:22px;color:var(--sub);">종합 테스트 결과</span>`;
    gridWrap.innerHTML = '';
    feedback.textContent = '';
    feedback.className = 'feedback';
    explain.className = 'explain';
    explain.innerHTML = '';

    const rows = testResults.map((r,i)=>{
      const ua = (r.userAnswer===null) ? '미입력' : fmt(r.userAnswer);
      return `<div class="partial-row ${r.correct ? 'correct' : 'wrong'}">
        <span class="label">${i+1}번</span>
        <span class="expr">${r.a} × ${r.b} = ${fmt(r.total)}</span>
        <span>${r.correct ? '✅' : `❌ (내 답: ${ua})`}</span>
      </div>`;
    }).join('');

    scaffoldArea.innerHTML = `
      <div class="partials">${rows}</div>
      <div class="sum-row"><span>맞은 문제 ${correctCount} / ${TEST_TOTAL} (정답률 ${rate}%)</span></div>`;

    btnCheck.disabled = true;
    btnNext.disabled = true;
    levelIndicator.textContent = '';

    numInput.value = '';
    nameInputField.value = '';
    updateSubmitEnabled();
    submitStatus.textContent = '';
    submitStatus.className = 'submit-status';
    resultBlock.style.display = 'block';
  }

  assessScreen.querySelectorAll('.assess-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const startLevel = parseInt(btn.dataset.startLevel, 10);
      startPractice(startLevel);
    });
  });

  // clicking a "① 일의 자리..." / "② 십의 자리..." hint highlights the matching part of the
  // PROBLEM itself (the "71 / ×57" digits above the line) — not the answer boxes below it.
  scaffoldArea.addEventListener('click',(e)=>{
    const stepBtn = e.target.closest('.hint-step');
    if(stepBtn){
      activateHintGroup(Number(stepBtn.dataset.hintStep));
      return;
    }

    const label = e.target.closest('.row-label-side');
    if(label){
      activateHintGroup(Number(label.dataset.group));
    }
  });

  scaffoldArea.addEventListener('focusin',(e)=>{
    const input = e.target.closest('input[data-hint-group]');
    if(!input) return;
    activateHintGroup(Number(input.dataset.hintGroup));

    document.querySelectorAll('.vtable td').forEach(td=>td.classList.remove('input-current'));
    input.closest('td')?.classList.add('input-current');
  });

  scaffoldArea.addEventListener('focusout',(e)=>{
    const input = e.target.closest('input[data-hint-group]');
    if(!input) return;
    input.closest('td')?.classList.remove('input-current');
  });

  scaffoldArea.addEventListener('click',(e)=>{
    const row = e.target.closest('.partial-row');
    if(!row) return;
    const key = row.dataset.key || '';
    activateHintGroup(key.includes('ones') ? 1 : 2);
  });

  // 칸을 모두 채운 뒤 칸 밖을 누르면 "확인"을 누른 것으로 본다(칸 사이 이동·버튼 클릭은 제외)
  function requiredFilled(){
    // 3단계(세로셈)는 올림 칸을 비워 둘 수 있어 성급한 채점이 될 수 있으므로 자동 확인하지 않고 "확인"을 누르게 둔다
    if(level === 1 || level === 2){
      const ks = [...scaffoldArea.querySelectorAll('input[data-key]')];
      const sum = document.getElementById('sumInput');
      return ks.length > 0 && ks.every(i=>i.value.trim() !== '') && !!sum && sum.value.trim() !== '';
    }
    return false;
  }
  document.addEventListener('focusout', (e)=>{
    if(checked || level === 4 || btnCheck.disabled || card.style.display === 'none' || window.__btOpen) return;
    const t = e.target;
    if(!t || t.tagName !== 'INPUT' || !scaffoldArea.contains(t)) return;
    const to = e.relatedTarget;
    if(to && (to.tagName === 'INPUT' || to.tagName === 'BUTTON')) return;
    if(!document.hasFocus() || !requiredFilled()) return;
    setTimeout(()=>{ if(!checked && requiredFilled()) checkAnswer(); }, 0);
  });

  btnCheck.addEventListener('click', ()=>{
    if(level === 4) checkTestAnswer();
    else checkAnswer();
  });
  btnNext.addEventListener('click', ()=>{
    if(level === 4) nextTestQuestion();
    else advancePractice();
  });
  btnReset.addEventListener('click', ()=>{
    if(level === 4) startTest();
    else renderProblem();
  });

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      if(level === 4){
        if(!checked) checkTestAnswer();
        else nextTestQuestion();
      } else {
        if(!checked) checkAnswer();
        else advancePractice();
      }
      return;
    }

    // ── 숨겨진 테스트(QA)용 단축키 — 학생용 화면엔 안내 없음 ──
    // Ctrl+Shift+4 : 자기진단/연습 다 건너뛰고 4단계 종합 테스트를 바로 시작
    if(e.ctrlKey && e.shiftKey && e.key === '4'){
      e.preventDefault();
      assessScreen.style.display = 'none';
      card.style.display = 'block';
      startTest();
      return;
    }
    // Ctrl+Shift+S : 테스트까지 전부 건너뛰고, 10문제 전부 정답 처리한 뒤
    //                바로 "번호/이름 입력 + 제출" 화면으로 이동 (Supabase 연결 확인용)
    if(e.ctrlKey && e.shiftKey && (e.key === 'S' || e.key === 's')){
      e.preventDefault();
      assessScreen.style.display = 'none';
      statsBar.style.display = 'none';
      card.style.display = 'block';
      level = 4;
      testResults = Array.from({length: TEST_TOTAL}, ()=>{
        const p = genProblem(rand(1,3));
        return { a:p.a, b:p.b, total:p.total, userAnswer:p.total, correct:true };
      });
      showTestReview();
    }
  });
})();
</script>

<script>
(function(){
function createBaseTenBoard(container){
  let changeCb = null;
  // 자리값 단계: 일(one) → 십(ten) → 백(hundred). 인덱스가 1 크면 그 다음 자리.
  const TIERS = ['one', 'ten', 'hundred'];
  const TIER_CLASS = { one:'manip-unit', ten:'manip-rod', hundred:'manip-hundred' };
  const TIER_LABEL  = { one:'낱개', ten:'십 모형', hundred:'백 모형' };
  const CLICK_MOVE_THRESHOLD = 6; // px — 이보다 적게 움직이면 "드래그"가 아니라 "탭(선택)"으로 본다

  const state = { blocks: [], frames: 0 }; // frames: 나눗셈 도우미 "틀" 개수(0이면 없음)
  // blocks: {id, type:'one'|'ten'|'hundred', x, y, selected} — x,y는 컨테이너 기준 %
  let drag = null;      // {id, ids[], orig{id:{x,y}}, startClientX, startClientY, copyUndo}
  let boxSelect = null; // {startXPct, startYPct} — 배경 드래그로 여러 개 선택할 때
  let history = [];     // 되돌리기용 스냅샷

  function uid(){ return 'b' + Math.random().toString(36).slice(2, 9); }
  // 틀(나눗셈 도우미)이 있으면 판의 위쪽 2%~68%는 틀 영역, 그 아래(72%~)는 "보관 구역"이다.
  // 새로 만드는 모형은 보관 구역에 나오고, 학생이 그걸 틀로 옮겨 담는다.
  const FRAME_TOP = 2, FRAME_AREA_H = 66, STOCK_TOP = 72;
  function randomPos(){
    if(state.frames) return { x: 3 + Math.random()*68, y: STOCK_TOP + 2 + Math.random()*12 };
    return { x: 3 + Math.random()*68, y: 3 + Math.random()*58 };
  }

  // 틀 n개를 판 위쪽에 격자로 배치한 좌표(%). 4개까지는 한 줄, 그 이상은 두 줄.
  function frameRects(){
    const n = state.frames;
    if(!n) return [];
    const cols = n <= 4 ? n : Math.ceil(n/2);
    const rows = Math.ceil(n/cols);
    const pad = 1.5, gap = 1.5;
    const w = (100 - 2*pad - (cols-1)*gap) / cols;
    const h = (FRAME_AREA_H - (rows-1)*gap) / rows;
    return Array.from({ length:n }, (_, i)=>{
      const c = i % cols, r = Math.floor(i/cols);
      return { x: pad + c*(w+gap), y: FRAME_TOP + r*(h+gap), w, h };
    });
  }
  // 모형이 어느 틀 안에 있는지는 "모형의 중심이 틀 안에 있는가"로 판단한다(보여주기용 계산일 뿐,
  // 모형 상태를 바꾸지 않는다 — 가까우면 자동으로 뭉치던 예전 방식과 다르다).
  function frameIndexOf(b, rects, rect){
    const s = sizeOf(b.type);
    const cx = b.x + (s.w/2 / (rect.width||300)) * 100;
    const cy = b.y + (s.h/2 / (rect.height||260)) * 100;
    for(let i=0;i<rects.length;i++){
      const r = rects[i];
      if(cx >= r.x && cx <= r.x+r.w && cy >= r.y && cy <= r.y+r.h) return i;
    }
    return -1;
  }
  function frameSummary(){
    const rects = frameRects();
    const rect = container.getBoundingClientRect();
    const mk = ()=>({ hundreds:0, tens:0, ones:0, value:0 });
    const perFrame = rects.map(mk), outside = mk();
    state.blocks.forEach(b=>{
      const i = rects.length ? frameIndexOf(b, rects, rect) : -1;
      const t = i >= 0 ? perFrame[i] : outside;
      if(b.type === 'hundred'){ t.hundreds++; t.value += 100; }
      else if(b.type === 'ten'){ t.tens++; t.value += 10; }
      else { t.ones++; t.value += 1; }
    });
    const allEqual = perFrame.length > 1 && perFrame[0].value > 0 && perFrame.every(p=>p.value === perFrame[0].value);
    return { n: rects.length, perFrame, outside, allEqual };
  }
  function frameLabel(p){
    const parts = [];
    if(p.hundreds) parts.push('백 '+p.hundreds);
    parts.push('십 '+p.tens, '낱 '+p.ones);
    // 합계 숫자는 컨테이너에 .show-values 클래스가 있을 때만 보인다(기본은 숨김 — 학생이 먼저 세어 보게)
    return parts.join(' · ') + '<span class="manip-frame-val"> = '+p.value+'</span>';
  }
  // 드래그 중에 화면을 다시 그리지 않고도 틀 안의 개수 표시만 실시간으로 바꾼다.
  function refreshFrameLabels(){
    if(!state.frames) return;
    const sum = frameSummary();
    container.querySelectorAll('.manip-frame').forEach(el=>{
      const i = Number(el.dataset.frame);
      el.classList.toggle('manip-frame-ok', sum.allEqual);
      const span = el.querySelector('.manip-frame-sum');
      if(span && sum.perFrame[i]) span.innerHTML = frameLabel(sum.perFrame[i]);
    });
  }

  function render(){
    const blocksHtml = state.blocks.map(b =>
      `<div class="manip-block ${TIER_CLASS[b.type]} btb-block${b.selected ? ' manip-selected' : ''}" data-id="${b.id}" style="left:${b.x}%; top:${b.y}%;"></div>`
    ).join('');
    const boxHtml = boxSelect
      ? `<div class="manip-selbox" style="left:${Math.min(boxSelect.startXPct,boxSelect.curXPct)}%; top:${Math.min(boxSelect.startYPct,boxSelect.curYPct)}%; width:${Math.abs(boxSelect.curXPct-boxSelect.startXPct)}%; height:${Math.abs(boxSelect.curYPct-boxSelect.startYPct)}%;"></div>`
      : '';
    let framesHtml = '';
    if(state.frames){
      const sum = frameSummary();
      framesHtml = frameRects().map((r, i)=>
        `<div class="manip-frame${sum.allEqual ? ' manip-frame-ok' : ''}" data-frame="${i}" style="left:${r.x}%; top:${r.y}%; width:${r.w}%; height:${r.h}%;"><div class="manip-frame-head"><b>묶음 ${i+1}</b><span class="manip-frame-sum">${frameLabel(sum.perFrame[i])}</span></div></div>`
      ).join('') + `<div class="manip-stock-label" style="top:${STOCK_TOP}%;">보관 구역 — 여기 모형을 위의 틀로 옮겨 담아요</div>`;
    }
    const emptyHtml = (!state.blocks.length && !state.frames) ? `<span class="manip-empty-hint">모형이 없어요. 아래 + 버튼으로 만들어보세요.</span>` : '';
    container.innerHTML = framesHtml + emptyHtml + blocksHtml + boxHtml;
    notify();
  }

  // 화면을 다시 그리지 않고도(드래그 직후 등) 바깥에 "상태가 바뀌었다"고 알릴 때 쓴다.
  function notify(){ if(changeCb) changeCb(getCounts(), getSelectionInfo(), frameSummary()); }

  const HISTORY_LIMIT = 100; // 되돌리기 기록은 최근 100단계까지만 (드래그까지 기록하니 무한정 쌓이지 않게)
  function pushHistory(snapshot){
    history.push(snapshot);
    if(history.length > HISTORY_LIMIT) history.shift();
  }
  function saveHistory(){ pushHistory(state.blocks.map(b=>({...b}))); }

  function addBlocks(type, count){
    if(count > 0) saveHistory();
    for(let i=0;i<count;i++){
      const pos = randomPos();
      state.blocks.push({ id: uid(), type, x: pos.x, y: pos.y, selected:false });
    }
    render();
  }

  function getCounts(){
    return {
      hundreds: state.blocks.filter(b=>b.type==='hundred').length,
      tens: state.blocks.filter(b=>b.type==='ten').length,
      ones: state.blocks.filter(b=>b.type==='one').length
    };
  }

  // 지금 선택된 것들에 대해 "합치기"/"쪼개기" 버튼을 활성화할지 판단할 정보.
  function getSelectionInfo(){
    const selected = state.blocks.filter(b=>b.selected);
    const types = new Set(selected.map(b=>b.type));
    const sameType = types.size === 1 ? [...types][0] : null;
    const canJoin = !!sameType && TIERS.indexOf(sameType) < TIERS.length-1 && selected.length >= 10;
    const canBreak = selected.length === 1 && TIERS.indexOf(selected[0].type) > 0;
    return { count: selected.length, canJoin, canBreak, canDuplicate: selected.length > 0, joinCount: sameType ? Math.floor(selected.length/10) : 0 };
  }

  function clearSelection(){
    state.blocks.forEach(b=>{ b.selected = false; });
    render();
  }

  // 낱개가 많을 때 하나씩 탭하기 번거로우니, 종류별로 한 번에 다 선택한다.
  // (다른 종류 선택은 지워서 항상 "한 종류만 선택된" 깔끔한 상태로 만든다.)
  function selectAllOfType(type){
    state.blocks.forEach(b=>{ b.selected = (b.type === type); });
    render();
  }

  function selectAll(){
    state.blocks.forEach(b=>{ b.selected = true; });
    render();
  }

  // 키보드 단축키(데스크톱용, 필요할 때만 켠다): Delete/Backspace 지우기 · Ctrl/⌘+Z 되돌리기 ·
  // Ctrl/⌘+A 전체 선택 · Ctrl/⌘+D 복사 · Esc 선택 해제. 글자 입력칸에 커서가 있으면 무시한다.
  let keyboardOn = false;
  function enableKeyboardShortcuts(){
    if(keyboardOn) return;
    keyboardOn = true;
    window.addEventListener('keydown', (e)=>{
      if(!window.__btOpen) return;
      const t = e.target;
      if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
      const mod = e.ctrlKey || e.metaKey;
      const k = e.key;
      if(k === 'Delete' || k === 'Backspace'){ if(deleteSelected()) e.preventDefault(); }
      else if(mod && (k === 'z' || k === 'Z')){ if(undo()) e.preventDefault(); }
      else if(mod && (k === 'a' || k === 'A')){ selectAll(); e.preventDefault(); }
      else if(mod && (k === 'd' || k === 'D')){ if(duplicateSelected()) e.preventDefault(); }
      else if(k === 'Escape'){ clearSelection(); }
    });
  }

  // 잘못 만든 모형을 지운다 (선택된 것들 전부).
  function deleteSelected(){
    const selected = state.blocks.filter(b=>b.selected);
    if(!selected.length) return false;
    saveHistory();
    const ids = selected.map(b=>b.id);
    state.blocks = state.blocks.filter(b=>!ids.includes(b.id));
    render();
    return true;
  }

  // 자유롭게 옮기다 겹치거나 흩어진 모형을, 종류별(백→십→낱개 순)로 줄맞춰
  // 가지런히 정리한다. 세어보기 쉽게 만드는 게 목적이라 선택 상태는 그대로 둔다.
  const ARRANGE_ORDER = ['hundred', 'ten', 'one'];
  const ARRANGE_SIZE = { hundred:{w:84,h:84}, ten:{w:78,h:22}, one:{w:22,h:22} };
  // 화면에서 "크게 보기"를 켜면 CSS 변수 --bs(block scale)로 모형 크기를 키운다.
  // 정리/트레이 놓기 계산도 같은 배율을 써야 칸이 안 겹친다.
  function blockScale(){
    try{
      const v = parseFloat(getComputedStyle(container).getPropertyValue('--bs'));
      return (isNaN(v) || v <= 0) ? 1 : v;
    }catch(e){ return 1; }
  }
  function sizeOf(type){
    const b = ARRANGE_SIZE[type] || { w:22, h:22 };
    const k = blockScale();
    return { w:b.w*k, h:b.h*k };
  }
  // 한 무리의 모형(group)을 (leftPx, topPx)에서 시작해 종류별(백→십→낱개)로 줄맞춰 깐다.
  // widthPx는 그 무리가 쓸 수 있는 가로 폭. 칸 수는 폭에 맞춰 알아서 계산(줄바꿈).
  function layoutGroup(group, leftPx, topPx, widthPx, cw, ch){
    const pad = 6;
    let yPx = topPx;
    ARRANGE_ORDER.forEach(type=>{
      const g = group.filter(b=>b.type===type);
      if(!g.length) return;
      const size = sizeOf(type);
      const cols = Math.max(1, Math.floor((widthPx - pad) / (size.w + 4)));
      g.forEach((b, i)=>{
        const col = i % cols, row = Math.floor(i / cols);
        b.x = ((leftPx + pad + col*(size.w+4)) / cw) * 100;
        b.y = ((yPx + row*(size.h+4)) / ch) * 100;
      });
      yPx += Math.ceil(g.length / cols) * (size.h+4) + 10;
    });
  }

  // 틀이 없으면 판 전체에, 있으면 "각 틀 안의 모형은 그 틀 안에서, 틀 밖(보관 구역) 모형은
  // 보관 구역에서" 가지런히 정리한다 — 정리가 모형을 다른 틀로 옮겨버리지 않게.
  function arrange(){
    if(!state.blocks.length) return;
    saveHistory();
    const rect = container.getBoundingClientRect();
    const cw = rect.width || 300, ch = rect.height || 260;
    if(!state.frames){
      layoutGroup(state.blocks, 0, 6, cw, cw, ch);
    } else {
      const rects = frameRects();
      const groups = rects.map(()=>[]), outside = [];
      state.blocks.forEach(b=>{
        const i = frameIndexOf(b, rects, rect);
        (i >= 0 ? groups[i] : outside).push(b);
      });
      rects.forEach((r, i)=>{
        layoutGroup(groups[i], r.x/100*cw, r.y/100*ch + 26, r.w/100*cw, cw, ch); // 26px = 틀 머리글 높이
      });
      layoutGroup(outside, 0, STOCK_TOP/100*ch + 22, cw, cw, ch);
    }
    render();
  }

  // 선택된 것 중 10개씩 묶어서 다음 자리 모형으로 합친다(여러 묶음이면 한 번에 여러 개).
  // 합쳐진 새 모형은 합쳐진 10개가 있던 자리(평균 위치)에 나타난다 — 멀리 엉뚱한 곳에 생기지 않게.
  function joinSelected(){
    const selected = state.blocks.filter(b=>b.selected);
    const info = getSelectionInfo();
    if(!info.canJoin) return false;
    saveHistory();
    const type = selected[0].type;
    const tierIdx = TIERS.indexOf(type);
    const groups = Math.floor(selected.length / 10);
    const usedBlocks = selected.slice(0, groups*10);
    const used = usedBlocks.map(b=>b.id);
    state.blocks = state.blocks.filter(b=>!used.includes(b.id));
    for(let g=0; g<groups; g++){
      const chunk = usedBlocks.slice(g*10, g*10+10);
      const cx = chunk.reduce((sum,b)=>sum+b.x, 0) / chunk.length;
      const cy = chunk.reduce((sum,b)=>sum+b.y, 0) / chunk.length;
      state.blocks.push({ id: uid(), type: TIERS[tierIdx+1], x: Math.max(0, Math.min(MAX_POS, cx)), y: Math.max(0, Math.min(MAX_POS, cy)), selected:false });
    }
    render();
    return true;
  }

  // 선택된 것(딱 1개, 십 모형이나 백 모형) 하나를 10개 이전 자리로 쪼갠다.
  // 쪼개진 10개는 원래 그 모형이 있던 자리 근처에 가지런히 모여 나타나고(낱개는 5×2,
  // 십 모형은 2×5), 바로 한 덩어리로 끌어 옮길 수 있게 전부 선택된 상태가 된다.
  function breakSelected(){
    const selected = state.blocks.filter(b=>b.selected);
    const info = getSelectionInfo();
    if(!info.canBreak) return false;
    saveHistory();
    const target = selected[0];
    const tierIdx = TIERS.indexOf(target.type);
    const childType = TIERS[tierIdx-1];
    state.blocks = state.blocks.filter(b=>b.id!==target.id);
    state.blocks.forEach(b=>{ b.selected = false; });
    const rect = container.getBoundingClientRect();
    const cw = rect.width || 300, ch = rect.height || 260;
    const size = sizeOf(childType);
    const cols = childType === 'ten' ? 2 : 5;
    const rows = Math.ceil(10 / cols);
    const wPct = (cols*(size.w+4) / cw) * 100, hPct = (rows*(size.h+4) / ch) * 100;
    const x0 = Math.max(0, Math.min(target.x, 100 - wPct - 1));
    const y0 = Math.max(0, Math.min(target.y, 100 - hPct - 1));
    for(let i=0;i<10;i++){
      const col = i % cols, row = Math.floor(i / cols);
      state.blocks.push({
        id: uid(), type: childType, selected:true,
        x: x0 + (col*(size.w+4) / cw) * 100,
        y: y0 + (row*(size.h+4) / ch) * 100
      });
    }
    render();
    return true;
  }

  // ── 나눗셈 도우미: 틀 ──
  // n개의 "묶음 틀"을 판 위쪽에 깔아준다. 모형을 틀로 옮겨 담으면 틀마다 몇 개가 들어갔는지
  // 실시간으로 보이고, 모든 틀이 같은 값이면 초록색으로 바뀐다(똑같이 나눴다는 뜻).
  // 틀은 보기용 영역일 뿐 모형 상태를 바꾸지 않는다. 되돌리기 기록에도 안 들어간다.
  function setFrames(n){
    n = Math.max(0, Math.min(10, Math.floor(Number(n)) || 0));
    if(n === state.frames) return;
    state.frames = n;
    render();
  }
  function getFrames(){ return state.frames; }

  // ── 수 직접 넣기 (덧셈·뺄셈·나눗셈에서 처음 수를 빨리 만들 때) ──
  // 예: 347 → 백 3, 십 4, 낱개 7. 새 모형은 한 곳에 종류별로 가지런히 놓인다.
  // (정답을 대신 만들어 주는 게 아니라 "문제의 처음 수"를 놓는 용도다.)
  function addNumber(n){
    n = Math.floor(Number(n));
    if(!(n > 0) || n > 999) return false;
    saveHistory();
    const fresh = [];
    [['hundred', Math.floor(n/100)], ['ten', Math.floor(n/10)%10], ['one', n%10]].forEach(([type, cnt])=>{
      for(let i=0;i<cnt;i++){
        const b = { id: uid(), type, x:0, y:0, selected:false };
        state.blocks.push(b); fresh.push(b);
      }
    });
    const rect = container.getBoundingClientRect();
    const cw = rect.width || 300, ch = rect.height || 260;
    const top = state.frames ? (STOCK_TOP/100*ch + 22) : 6;
    layoutGroup(fresh, 0, top, cw, cw, ch);
    render();
    return true;
  }

  // ── 같은 묶음을 여러 번 (곱셈: 같은 수를 n번 모은다) ──
  // 선택된 덩어리를 times개가 되도록 복제해서 오른쪽(모자라면 아래)으로 나란히 놓는다.
  // 원본+복제본이 전부 선택된 상태가 되어 바로 "합치기"로 이어갈 수 있다.
  function repeatSelected(times){
    times = Math.floor(Number(times));
    const sel = state.blocks.filter(b=>b.selected);
    if(!sel.length || !(times >= 2) || times > 20) return false;
    saveHistory();
    const rect = container.getBoundingClientRect();
    const cw = rect.width || 300, ch = rect.height || 260;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    sel.forEach(b=>{
      const s = sizeOf(b.type);
      const bx = b.x/100*cw, by = b.y/100*ch;
      minX = Math.min(minX, bx); minY = Math.min(minY, by);
      maxX = Math.max(maxX, bx + s.w); maxY = Math.max(maxY, by + s.h);
    });
    const gap = 16, gw = maxX - minX, gh = maxY - minY;
    const perRow = Math.max(1, Math.floor((cw - minX + gap) / (gw + gap)));
    for(let k=1; k<times; k++){
      const dx = (k % perRow) * (gw + gap), dy = Math.floor(k / perRow) * (gh + gap);
      sel.forEach(b=>{
        state.blocks.push({ id: uid(), type:b.type, selected:true, x: b.x + dx/cw*100, y: b.y + dy/ch*100 });
      });
    }
    render();
    return true;
  }

  function undo(){
    if(!history.length) return false;
    state.blocks = history.pop();
    render();
    return true;
  }

  function clear(){ state.blocks = []; history = []; render(); }
  function historyLength(){ return history.length; }

  const MAX_POS = 92; // 블록 왼쪽·위쪽 좌표의 최대값(%) — 이보다 오른쪽/아래로는 안 나가게

  // 지금 누른 블록이 "이미 선택된 것"이면 선택된 것 전부가 한 덩어리로 같이 움직인다.
  // 선택 안 된 블록을 누르면 그 블록 하나만 움직인다(선택은 그대로).
  function dragGroupFor(id){
    const pressed = state.blocks.find(b=>b.id===id);
    if(pressed && pressed.selected){
      return state.blocks.filter(b=>b.selected).map(b=>b.id);
    }
    return [id];
  }

  function moveTo(clientX, clientY){
    if(!drag) return;
    const rect = container.getBoundingClientRect();
    let dx = ((clientX - drag.startClientX) / rect.width) * 100;
    let dy = ((clientY - drag.startClientY) / rect.height) * 100;
    // 덩어리가 판 밖으로 삐져나가지 않게, 가장자리에 닿으면 덩어리 "전체"가 멈춘다.
    // (블록마다 따로 자르면 가장자리에서 모양이 찌그러진다)
    const origs = drag.ids.map(i => drag.orig[i]);
    const minX = Math.min(...origs.map(o=>o.x)), maxX = Math.max(...origs.map(o=>o.x));
    const minY = Math.min(...origs.map(o=>o.y)), maxY = Math.max(...origs.map(o=>o.y));
    dx = Math.max(-minX, Math.min(MAX_POS - maxX, dx));
    dy = Math.max(-minY, Math.min(MAX_POS - maxY, dy));
    drag.ids.forEach(i=>{
      const b = state.blocks.find(o=>o.id===i);
      if(!b) return;
      b.x = drag.orig[i].x + dx;
      b.y = drag.orig[i].y + dy;
      const el = container.querySelector('[data-id="'+i+'"]');
      if(el){ el.style.left = b.x+'%'; el.style.top = b.y+'%'; el.classList.add('manip-dragging'); }
    });
    refreshFrameLabels();
  }

  // blockEl 인자는 예전 호출부와의 호환용으로 남겨뒀다(이제 안 씀 — 시작 좌표 기준 이동량만 쓴다).
  function startDrag(id, clientX, clientY, blockEl, opts){
    const ids = dragGroupFor(id);
    const orig = {};
    ids.forEach(i=>{
      const b = state.blocks.find(o=>o.id===i);
      if(b) orig[i] = { x:b.x, y:b.y };
    });
    drag = {
      id,
      ids: ids.filter(i=>orig[i]),
      orig,
      startClientX: clientX,
      startClientY: clientY,
      copyUndo: !!(opts && opts.copyUndo),
      snapshot: state.blocks.map(b=>({...b})) // 움직이기 전 상태 — 진짜 움직였을 때만 되돌리기 기록에 넣는다
    };
  }

  // 블록 하나를 살짝 옆으로 어긋난 자리에 복제한다. 새로 만든 블록을 돌려준다.
  function duplicateBlock(b){
    const dup = { id: uid(), type:b.type, x: Math.max(0,Math.min(MAX_POS,b.x+4)), y: Math.max(0,Math.min(MAX_POS,b.y+4)), selected:false };
    state.blocks.push(dup);
    return dup;
  }

  // 선택된 것을 전부 복제한다("복사하기" 버튼용). 복제본이 새로 선택되고
  // 원본은 선택 해제되어, 방금 뭘 복사했는지 한눈에 보인다.
  function duplicateSelected(){
    const selected = state.blocks.filter(b=>b.selected);
    if(!selected.length) return false;
    saveHistory();
    selected.forEach(b=>{ b.selected = false; });
    selected.forEach(b=>{ duplicateBlock(b).selected = true; });
    render();
    return true;
  }

  // Ctrl(Mac은 ⌘)을 누른 채 블록을 끌면, 원본은 그대로 두고 복제본을 대신 끈다.
  // 누른 블록이 선택된 덩어리의 일부면 덩어리 전체를 복제해서 같이 끈다
  // (복제본들이 새 선택이 되고 원본은 선택 해제).
  function startCopyDrag(id, clientX, clientY){
    const src = state.blocks.find(b=>b.id===id);
    if(!src) return;
    saveHistory();
    let pressedDupId = null;
    if(src.selected){
      const group = state.blocks.filter(b=>b.selected);
      group.forEach(b=>{
        const dup = { id: uid(), type:b.type, x:b.x, y:b.y, selected:true };
        state.blocks.push(dup);
        if(b.id === id) pressedDupId = dup.id;
      });
      group.forEach(b=>{ b.selected = false; });
    } else {
      const dup = { id: uid(), type:src.type, x:src.x, y:src.y, selected:false };
      state.blocks.push(dup);
      pressedDupId = dup.id;
    }
    render();
    startDrag(pressedDupId, clientX, clientY, null, { copyUndo:true });
  }

  function endDrag(clientX, clientY){
    if(!drag) return;
    drag.ids.forEach(i=>{
      const el = container.querySelector('[data-id="'+i+'"]');
      if(el) el.classList.remove('manip-dragging');
    });
    const cx = (clientX == null) ? drag.startClientX : clientX;
    const cy = (clientY == null) ? drag.startClientY : clientY;
    const moveDist = Math.hypot(cx - drag.startClientX, cy - drag.startClientY);
    if(moveDist < CLICK_MOVE_THRESHOLD){
      if(drag.copyUndo){
        // Ctrl+클릭만 하고 안 움직였으면 복제를 취소한다(같은 자리에 겹친 복제본이 남지 않게)
        drag = null;
        undo();
        return;
      }
      // 거의 안 움직였으면 드래그가 아니라 "탭" — 누른 블록의 선택 상태만 토글한다
      const b = state.blocks.find(o=>o.id===drag.id);
      if(b){ b.selected = !b.selected; }
      render();
    } else if(!drag.copyUndo){
      // 진짜로 옮겼으면 "움직이기 전 상태"를 되돌리기 기록에 남긴다(복사 드래그는
      // 복사 시작 때 이미 기록했으니 건너뜀 — 한 번 되돌리면 복사 전으로 돌아간다)
      pushHistory(drag.snapshot);
      drag = null;
      notify();
      return;
    }
    drag = null;
  }

  // 배경(빈 곳)을 드래그하면 사각형으로 여러 블록을 한 번에 선택한다.
  function startBoxSelect(clientX, clientY){
    const rect = container.getBoundingClientRect();
    const xPct = ((clientX-rect.left)/rect.width)*100;
    const yPct = ((clientY-rect.top)/rect.height)*100;
    boxSelect = { startXPct:xPct, startYPct:yPct, curXPct:xPct, curYPct:yPct };
  }
  function moveBoxSelect(clientX, clientY){
    if(!boxSelect) return;
    const rect = container.getBoundingClientRect();
    boxSelect.curXPct = ((clientX-rect.left)/rect.width)*100;
    boxSelect.curYPct = ((clientY-rect.top)/rect.height)*100;
    render();
  }
  function endBoxSelect(){
    if(!boxSelect) return;
    const x1 = Math.min(boxSelect.startXPct, boxSelect.curXPct), x2 = Math.max(boxSelect.startXPct, boxSelect.curXPct);
    const y1 = Math.min(boxSelect.startYPct, boxSelect.curYPct), y2 = Math.max(boxSelect.startYPct, boxSelect.curYPct);
    if(Math.abs(x2-x1) > 1 || Math.abs(y2-y1) > 1){
      state.blocks.forEach(b=>{
        if(b.x >= x1 && b.x <= x2 && b.y >= y1 && b.y <= y2) b.selected = true;
      });
    } else {
      // 그냥 빈 곳을 클릭(드래그 없이)한 거면, 선택을 전부 해제한다
      state.blocks.forEach(b=>{ b.selected = false; });
    }
    boxSelect = null;
    render();
  }

  // ── 마우스 ──
  container.addEventListener('mousedown', (e)=>{
    const el = e.target.closest('.btb-block');
    if(el){
      if(e.ctrlKey || e.metaKey){ startCopyDrag(el.dataset.id, e.clientX, e.clientY); }
      else { startDrag(el.dataset.id, e.clientX, e.clientY, el); }
    }
    else { startBoxSelect(e.clientX, e.clientY); }
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e)=>{
    if(drag) moveTo(e.clientX, e.clientY);
    else if(boxSelect) moveBoxSelect(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', (e)=>{
    if(drag) endDrag(e.clientX, e.clientY);
    else if(boxSelect) endBoxSelect();
  });

  // ── 터치 ──
  // 배경(빈 곳)을 터치로 드래그하는 건 사각형 선택 대신 "화면 스크롤"로 남겨둔다
  // (모형이 많아 캔버스가 길어질 수 있어서). 터치에서 여러 개를 한 번에 고르고
  // 싶으면 "낱개/십모형 전체 선택" 버튼을 쓰면 된다. 블록 위에서 시작한
  // 드래그(모형 옮기기)는 그대로 preventDefault로 스크롤을 막는다.
  container.addEventListener('touchstart', (e)=>{
    const el = e.target.closest('.btb-block');
    if(!el) return;
    const t = e.touches[0];
    startDrag(el.dataset.id, t.clientX, t.clientY, el);
    e.preventDefault();
  }, { passive:false });
  window.addEventListener('touchmove', (e)=>{
    if(!drag) return;
    const t = e.touches[0];
    if(!t) return;
    moveTo(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive:false });
  window.addEventListener('touchend', (e)=>{
    if(!drag) return;
    const t = e.changedTouches && e.changedTouches[0];
    endDrag(t && t.clientX, t && t.clientY);
  });
  window.addEventListener('touchcancel', ()=>{ drag = null; });

  render();
  function onChangeSet(fn){ changeCb = fn; }

  // ── 트레이(모형 보관함)에서 끌어와서 새 모형 만들기 (Number Pieces 방식) ──
  // 호스트 페이지가 만든 "샘플 모형" 엘리먼트를 넘겨주면, 그걸 잡아 끌어서 판 위에
  // 놓는 순간 그 자리에 해당 종류의 새 모형이 하나 만들어진다. 판 밖에 놓으면
  // 아무 일도 일어나지 않는다(취소). 버튼으로 "+1개"를 누르면 무작위 자리에
  // 생기던 것과 달리, 학생이 원하는 자리에 바로 놓을 수 있다.
  function attachTraySource(sourceEl, type){
    function startSpawnDrag(startX, startY){
      const ghost = sourceEl.cloneNode(true);
      ghost.classList.add('manip-tray-ghost');
      ghost.style.position = 'fixed';
      ghost.style.pointerEvents = 'none';
      ghost.style.margin = '0';
      ghost.style.left = startX + 'px';
      ghost.style.top = startY + 'px';
      ghost.style.transform = 'translate(-50%,-50%)';
      ghost.style.zIndex = '9999';
      ghost.style.display = 'none'; // 실제로 끌기 시작하기 전까지는 안 보이게(그냥 탭일 수도 있으니)
      document.body.appendChild(ghost);

      function move(cx, cy){
        if(Math.hypot(cx-startX, cy-startY) >= CLICK_MOVE_THRESHOLD) ghost.style.display = '';
        ghost.style.left = cx + 'px';
        ghost.style.top = cy + 'px';
      }
      function cleanup(){
        ghost.remove();
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        document.removeEventListener('touchmove', onTouchMove);
        document.removeEventListener('touchend', onTouchEnd);
        document.removeEventListener('touchcancel', cleanup);
      }
      function finish(cx, cy){
        const moved = Math.hypot(cx-startX, cy-startY);
        const rect = container.getBoundingClientRect();
        const inside = cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom;
        cleanup();
        if(moved < CLICK_MOVE_THRESHOLD){
          // 거의 안 움직였으면 "끌기"가 아니라 "탭" — 무작위 자리에 1개 만든다
          addBlocks(type, 1);
          return;
        }
        if(!inside) return; // 판 밖에 놓으면 취소
        const size = sizeOf(type);
        // 손가락/커서가 모형의 한가운데를 잡고 있던 것처럼 중심 기준으로 놓는다
        const xPct = Math.max(0, Math.min(92, ((cx - rect.left - size.w/2) / rect.width) * 100));
        const yPct = Math.max(0, Math.min(92, ((cy - rect.top - size.h/2) / rect.height) * 100));
        saveHistory();
        state.blocks.push({ id: uid(), type, x:xPct, y:yPct, selected:false });
        render();
      }
      function onMouseMove(e){ move(e.clientX, e.clientY); }
      function onMouseUp(e){ finish(e.clientX, e.clientY); }
      function onTouchMove(e){ const t = e.touches[0]; if(t) move(t.clientX, t.clientY); e.preventDefault(); }
      function onTouchEnd(e){ const t = e.changedTouches[0]; finish(t.clientX, t.clientY); }

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
      document.addEventListener('touchmove', onTouchMove, { passive:false });
      document.addEventListener('touchend', onTouchEnd);
      document.addEventListener('touchcancel', cleanup);
    }

    sourceEl.addEventListener('mousedown', (e)=>{
      startSpawnDrag(e.clientX, e.clientY);
      e.preventDefault();
    });
    sourceEl.addEventListener('touchstart', (e)=>{
      const t = e.touches[0];
      startSpawnDrag(t.clientX, t.clientY);
      e.preventDefault();
    }, { passive:false });
  }

  return { addBlocks, getCounts, getSelectionInfo, joinSelected, breakSelected, clearSelection, selectAllOfType, deleteSelected, duplicateSelected, selectAll, enableKeyboardShortcuts, arrange, setFrames, getFrames, getFrameSummary: frameSummary, addNumber, repeatSelected, undo, clear, historyLength, render, onChangeSet, attachTraySource };
}
  var MODE = "mul";
  var GUIDE = "곱해지는 수를 모형으로 놓고, 곱하는 수만큼 묶음을 만들어 보세요. 낱개 10개는 합치기로 십 모형 1개가 돼요.";
  var $ = function(id){ return document.getElementById(id); };
  var overlay = $('btOverlay');
  overlay.classList.add('mode-' + MODE);
  $('btGuide').textContent = GUIDE;
  var board = createBaseTenBoard($('btBoard'));
  window.__btOpen = false;
  var showValue = false, lastC = {hundreds:0,tens:0,ones:0}, lastSel = {count:0}, lastFr = {n:0};
  function paint(){
    var c = lastC, sel = lastSel;
    var h = c.hundreds ? '백 ' + c.hundreds + '개 · ' : '';
    var v = showValue ? '  =  <b>' + (c.hundreds*100 + c.tens*10 + c.ones) + '</b>' : '';
    var fr = '';
    if(lastFr.n > 0){
      var o = lastFr.outside;
      fr = '  ·  보관 구역 ' + (o.hundreds ? '백 ' + o.hundreds + ' · ' : '') + '십 ' + o.tens + ' · 낱 ' + o.ones + (lastFr.allEqual ? '  ·  ✅ 모든 묶음이 같아요' : '');
    }
    $('btStatus').innerHTML = h + '십 ' + c.tens + '개 · 낱개 ' + c.ones + '개' + v + '  ·  <b>' + sel.count + '개 선택됨</b>' + fr;
  }
  board.onChangeSet(function(c, sel, fr){
    lastC = c; lastSel = sel; lastFr = fr || {n:0};
    paint();
    $('btJoin').disabled = !sel.canJoin;
    $('btJoin').innerHTML = (sel.canJoin && sel.joinCount > 1) ? '<span class="ic">🔗</span>합치기(' + sel.joinCount + ')' : '<span class="ic">🔗</span>합치기';
    $('btBreak').disabled = !sel.canBreak;
    $('btDup').disabled = !sel.canDuplicate;
    $('btDel').disabled = sel.count === 0;
    $('btRepeat').disabled = sel.count === 0;
    $('btUndo').disabled = board.historyLength() === 0;
  });
  $('btAddOne5').onclick = function(){ board.addBlocks('one', 5); };
  $('btAddTen5').onclick = function(){ board.addBlocks('ten', 5); };
  $('btSelOnes').onclick = function(){ board.selectAllOfType('one'); };
  $('btSelTens').onclick = function(){ board.selectAllOfType('ten'); };
  $('btArrange').onclick = function(){ board.arrange(); };
  $('btJoin').onclick = function(){ board.joinSelected(); };
  $('btBreak').onclick = function(){ board.breakSelected(); };
  $('btDup').onclick = function(){ board.duplicateSelected(); };
  $('btDel').onclick = function(){ board.deleteSelected(); };
  $('btClearSel').onclick = function(){ board.clearSelection(); };
  $('btUndo').onclick = function(){ board.undo(); };
  $('btReset').onclick = function(){ board.clear(); setupDone = false; };
  $('btRepeat').onclick = function(){ board.repeatSelected($('btRepeatN').value); };
  function frLabel(){ var n = board.getFrames(); $('btFrCount').textContent = n ? n + '개' : '없음'; }
  $('btFrPlus').onclick = function(){ board.setFrames(board.getFrames() + 1); frLabel(); };
  $('btFrMinus').onclick = function(){ board.setFrames(board.getFrames() - 1); frLabel(); };
  $('btValueToggle').onclick = function(e){
    showValue = !showValue;
    $('btBoard').classList.toggle('show-values', showValue);
    e.currentTarget.setAttribute('aria-pressed', String(showValue));
    paint();
  };
  $('btSizeToggle').onclick = function(e){
    var on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
    e.currentTarget.setAttribute('aria-pressed', String(on));
    overlay.style.setProperty('--bs', on ? '1.4' : '1');
  };
  board.enableKeyboardShortcuts();
  ['btTrayOne','btTrayTen','btTrayHundred'].forEach(function(id){
    var el = $(id); board.attachTraySource(el, el.dataset.trayType);
  });

  // ── 이 문제에 맞게 시작 상태 만들기 (정답이 아니라 "처음 수"만 놓는다) ──
  var setupDone = false;
  function currentSetup(){
    var p = window.__btGet && window.__btGet();
    if(!p) return null;
    if(MODE === 'div') return { number:p.N, frames:p.d, label:p.N + ' 놓기 · 틀 ' + p.d + '개' };
    return { number:p.a, frames:0, label:p.a + ' 놓기' };
  }
  function applySetup(){
    var s = currentSetup(); if(!s) return;
    board.clear();
    if(MODE === 'div'){ board.setFrames(s.frames); frLabel(); }
    board.addNumber(s.number);
    setupDone = true;
  }
  $('btSetup').onclick = applySetup;

  function open(){
    var s = currentSetup();
    if(s) $('btSetupLbl').textContent = s.label;
    if(!setupDone) applySetup();
    overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false');
    window.__btOpen = true; document.body.style.overflow = 'hidden';
    board.render();
  }
  function close(){
    overlay.classList.remove('open'); overlay.setAttribute('aria-hidden','true');
    window.__btOpen = false; document.body.style.overflow = '';
  }
  $('btClose').onclick = close;
  overlay.addEventListener('mousedown', function(e){ if(e.target === overlay) close(); });
  // 오버레이 안의 Enter가 앱의 "확인/다음 문제" 단축키로 새지 않게 막는다
  overlay.addEventListener('keydown', function(e){ if(e.key === 'Enter') e.stopPropagation(); });
  window.addEventListener('keydown', function(e){ if(e.key === 'Escape' && window.__btOpen){ close(); } });
  $('btOpen').onclick = open;
  // 문제가 바뀌면 다음에 열 때 새 문제로 다시 놓는다
  window.__btNewProblem = function(){ setupDone = false; };
})();
</script>

</style>
<div id="npad" aria-hidden="true"><div class="npad-row">
<button type="button" tabindex="-1" data-k="1">1</button><button type="button" tabindex="-1" data-k="2">2</button><button type="button" tabindex="-1" data-k="3">3</button><button type="button" tabindex="-1" data-k="4">4</button><button type="button" tabindex="-1" data-k="5">5</button><button type="button" tabindex="-1" data-k="6">6</button><button type="button" tabindex="-1" data-k="7">7</button><button type="button" tabindex="-1" data-k="8">8</button><button type="button" tabindex="-1" data-k="9">9</button><button type="button" tabindex="-1" data-k="0">0</button><button type="button" class="npad-fn" tabindex="-1" data-k="bs">⌫</button><button type="button" class="npad-ok" tabindex="-1" data-k="ok">↵</button>
</div></div>
<script>
/* 터치 기기 내장 숫자패드: OS 키보드가 화면을 가리지 않도록 함. ?pad=1 강제 켜기, ?pad=0 끄기 */
(function(){
  var q = location.search.match(/[?&]pad=(\d)/);
  var enabled = q ? q[1] === '1' : (window.matchMedia && matchMedia('(pointer: coarse)').matches);
  if(!enabled) return;
  var pad = document.getElementById('npad'), last = null;
  var SEL = 'input.dcell, input[type=number]';
  function eligible(el){ return el && el.tagName === 'INPUT' && el.matches(SEL) && el.id !== 'btRepeatN'; }
  function mark(root){ (root.querySelectorAll ? root.querySelectorAll(SEL) : []).forEach(function(el){ if(eligible(el)) el.setAttribute('inputmode','none'); }); }
  mark(document);
  new MutationObserver(function(ms){ ms.forEach(function(m){ m.addedNodes.forEach(function(n){ if(n.nodeType===1){ if(eligible(n)) n.setAttribute('inputmode','none'); mark(n); } }); }); }).observe(document.body,{childList:true,subtree:true});
  function layout(){
    var on = !!last && document.body.contains(last) && !window.__btOpen;
    document.body.classList.toggle('npad-on', on);
    document.body.style.paddingBottom = on ? (pad.offsetHeight + 12) + 'px' : '';
  }
  function reveal(el){
    if(!el || !pad.offsetHeight) return;
    var r = el.getBoundingClientRect(), limit = innerHeight - pad.offsetHeight - 8;
    if(r.bottom > limit || r.top < 0){ try{ el.scrollIntoView({block:'center'}); }catch(e){} }
  }
  document.addEventListener('focusin', function(e){
    var t = e.target;
    if(eligible(t)){ last = t; layout(); setTimeout(function(){ reveal(t); }, 30); }
    else if(t && t.tagName === 'INPUT' && t.type === 'text'){ last = null; layout(); }
  });
  window.addEventListener('resize', layout);
  setInterval(layout, 500);
  pad.addEventListener('mousedown', function(e){ e.preventDefault(); });
  pad.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var el = document.activeElement;
    if(!eligible(el)) el = last;
    if(!eligible(el) || !document.body.contains(el) || el.disabled) return;
    if(document.activeElement !== el) el.focus();
    var k = b.getAttribute('data-k');
    if(k === 'ok'){
      ['keydown','keyup'].forEach(function(t){ el.dispatchEvent(new KeyboardEvent(t,{key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true,cancelable:true})); });
      return;
    }
    var v = el.value;
    if(k === 'bs'){ v = v.slice(0,-1); }
    else {
      var ml = parseInt(el.getAttribute('maxlength'),10);
      if(ml === 1) v = k;
      else if(!(ml > 0 && v.length >= ml)) v += k;
    }
    el.value = v;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    if(el.id === 'numInput') el.dispatchEvent(new Event('change',{bubbles:true}));
  });
})();
</script>
<!--NUMPAD-END-->
</body>
</html>
