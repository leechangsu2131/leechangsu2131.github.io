<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%9D</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#eaf6fd;--card:#fff;--ink:#1f2d3d;--muted:#5b6b7b;--line:#cfe3f1;--brand:#2f8fd8;--brand-d:#1d6fb0;--ok:#2e9e5b;--sel:#fff3c4;--selb:#f0a500;--box:#f4f9fc;--err:#d6453d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:17px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}
.top{background:linear-gradient(135deg,#2f8fd8,#46b8a0);color:#fff;padding:18px 16px 16px}
.top .in{max-width:820px;margin:0 auto}
.top small{opacity:.9;display:block}
.top h1{margin:2px 0 0;font-size:1.35rem;line-height:1.3}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin:16px 0}
label.f{display:block;margin:12px 0 4px;font-weight:700}
input.t,textarea.t{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:1.05rem}
input.t:focus,textarea.t:focus{outline:none;border-color:var(--brand)}
textarea.t{min-height:92px;resize:vertical}
.btn{border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;padding:12px 22px;font-size:1.05rem;cursor:pointer;min-height:48px}
.btn:active{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--brand-d);border:2px solid var(--brand)}
.btn.big{width:100%;margin-top:18px}
.hint{color:var(--muted);font-size:.92rem}
.err{color:var(--err);font-weight:700}
.bar{position:sticky;top:0;z-index:5;background:rgba(234,246,253,.95);backdrop-filter:blur(4px);border-bottom:2px solid var(--line);padding:8px 16px}
.bar .in{max-width:820px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;font-weight:700}
.prog{flex:1;height:10px;background:#d8e9f4;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.q{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;margin:14px 0}
.q.done{border-color:#9fd8b4}
.qh{display:flex;gap:12px;align-items:flex-start}
.qn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;display:grid;place-items:center}
.q.done .qn{background:var(--ok)}
.stem{font-weight:600;margin-top:3px}
.stem b{color:var(--err);text-decoration:underline}
.pass{background:var(--box);border-left:5px solid var(--brand);border-radius:8px;padding:8px 14px;margin:10px 0}
.pass p{margin:2px 0}
.box{border:2px dashed #8bb4cf;border-radius:10px;padding:8px 14px;margin:10px 0;background:#fff}
.box .bt{font-weight:800;text-align:center;margin-bottom:2px}
.box p{margin:2px 0}
.qimg{display:block;max-width:100%;margin:10px auto;border-radius:10px}
.cap{text-align:center;color:var(--muted);font-size:.9rem;margin-top:-4px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 14px;margin:6px 0;border:2px solid var(--line);border-radius:12px;background:#fff;min-height:48px;cursor:pointer}
.opt .no{flex:none;font-weight:800;color:var(--brand-d)}
.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.on .no{color:#a06a00}
.symrow{display:flex;gap:10px;flex-wrap:wrap}
.symrow .opt{width:auto;min-width:74px;justify-content:center;font-size:1.3rem;margin:6px 0}
.oxrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.oxrow:last-child{border-bottom:0}
.oxb{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid #c9d6df;background:#fff;font-size:1.6rem;font-weight:800;color:#c9d6df;cursor:pointer}
.oxb.on{border-color:var(--err);color:var(--err);background:#fff0ef}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.ans .lb{font-weight:700}
.ans input.t{width:7.5em;text-align:center;font-size:1.2rem}
.cmp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1.3rem;font-weight:700;margin:8px 0}
.ldiv{display:inline-flex;align-items:flex-end;font-size:1.2em;margin:0 6px;vertical-align:middle}
.ldiv i{font-style:normal;padding-right:4px}
.ldiv b{font-weight:500;border-left:2px solid #333;border-top:2px solid #333;padding:2px 8px 0;border-top-left-radius:6px}
.match{position:relative;display:flex;justify-content:space-between;gap:0;margin:10px 0;max-width:420px}
.match .col{display:flex;flex-direction:column;gap:14px;z-index:2}
.match .opt{width:112px;justify-content:center;margin:0;font-weight:700;font-size:1.1rem}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.match .opt.c0{border-color:#e0583f;background:#ffeae5}
.match .opt.c1{border-color:#2f8fd8;background:#e3f2fd}
.match .opt.c2{border-color:#2e9e5b;background:#e5f6ec}
.match .opt.pick{border-color:var(--selb);background:var(--sel)}
.lbl{font-weight:700;margin:10px 0 2px}
.fix{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);border-top:2px solid var(--line);padding:10px 16px}
.fix .in{max-width:820px;margin:0 auto;display:flex;gap:10px}
.fix .btn{flex:1}
.ov{position:fixed;inset:0;background:rgba(20,40,60,.5);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.ov .md{background:#fff;border-radius:18px;padding:22px;max-width:420px;width:100%}
.ov .row{display:flex;gap:10px;margin-top:16px}.ov .row .btn{flex:1}
.pad{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#fff;border-top:3px solid var(--brand);display:none;flex-direction:column;height:52vh}
.pad.show{display:flex}
.pad .tools{display:flex;gap:8px;padding:8px 12px;align-items:center;flex-wrap:wrap;background:var(--box)}
.pad .tools button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer}
.pad .tools button.on{border-color:var(--selb);background:var(--sel)}
.pad canvas{flex:1;width:100%;touch-action:none;background:#fff;background-image:linear-gradient(#e8f1f7 1px,transparent 1px);background-size:100% 32px}
.padbtn{position:fixed;right:14px;bottom:84px;z-index:7;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#243b53;color:#fff;border-radius:12px;padding:10px 18px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.stat{display:flex;gap:8px;align-items:center;margin:8px 0}
.stat .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.8rem;font-weight:800}
.d.ok{background:var(--ok)}.d.no{background:var(--err)}.d.wait{background:#aaa}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="top"><div class="in"><small id="meta"></small><h1 id="ttl"></h1></div></div>

<div id="start" class="wrap">
  <div class="card">
    <h2 style="margin:0 0 4px">시작하기 전에</h2>
    <p class="hint" style="margin-top:0">번호와 이름을 정확히 쓰고 시작해요. 푸는 동안 답은 이 기기에 자동으로 저장돼요.</p>
    <label class="f" for="inNo">번호</label>
    <input id="inNo" class="t" type="number" inputmode="numeric" min="1" max="60" placeholder="예: 7" style="max-width:160px">
    <label class="f" for="inName">이름</label>
    <input id="inName" class="t" type="text" maxlength="12" placeholder="이름" autocomplete="off" style="max-width:260px">
    <p id="startErr" class="err" hidden></p>
    <button id="btnStart" class="btn big">시험 시작하기</button>
  </div>
</div>

<div id="quiz" hidden>
  <div class="bar"><div class="in"><span id="who"></span><div class="prog"><i id="progBar"></i></div><span id="progTxt"></span></div></div>
  <div class="wrap"><div id="qs"></div></div>
  <button id="padOpen" class="btn padbtn" hidden>✏️ 연습장</button>
  <div class="fix"><div class="in"><button id="btnSubmit" class="btn">제출하기</button></div></div>
  <div id="pad" class="pad">
    <div class="tools">
      <button data-pen="#222" class="on">연필</button><button data-pen="#d6453d">빨강</button><button data-pen="#2f8fd8">파랑</button>
      <button data-pen="erase">지우개</button><button id="padClear">모두 지우기</button><button id="padClose" style="margin-left:auto">닫기</button>
    </div>
    <canvas id="cv"></canvas>
  </div>
</div>

<div id="done" class="wrap" hidden>
  <div class="card">
    <h2 style="margin:0 0 6px">제출했어요! 수고했어요 🎉</h2>
    <div class="stat"><span class="d ok">✓</span><span>답안 파일을 이 기기에 저장했어요. <span id="fname" class="hint"></span></span></div>
    <div class="stat"><span id="sendDot" class="d wait">…</span><span id="sendTxt">선생님께 보내는 중…</span></div>
    <p id="sendHelp" class="hint" hidden>전송이 안 되면 저장된 파일을 선생님께 보내 주세요.</p>
    <div class="row" style="display:flex;gap:10px;margin-top:14px">
      <button id="btnRetry" class="btn ghost" hidden>다시 전송</button>
      <button id="btnFile" class="btn ghost">파일 다시 저장</button>
    </div>
  </div>
</div>

<div id="ovSubmit" class="ov"><div class="md">
  <h3 style="margin:0 0 8px">제출할까요?</h3>
  <p id="ovMsg" style="margin:0"></p>
  <div class="row"><button id="ovNo" class="btn ghost">더 풀어볼래요</button><button id="ovYes" class="btn">제출할래요</button></div>
</div></div>
<div id="toast" class="toast"></div>

<script>
const TEST = /*__TEST__*/null;
const CFG = /*__CONFIG__*/null;

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/\[\[ldiv (\d+) (\d+)\]\]/g,'<span class="ldiv"><i>$1</i><b>$2</b></span>');
const CIRC = '①②③④⑤⑥⑦⑧⑨⑩', SYM = '㉠㉡㉢㉣㉤㉥';
const KEY = 'ut-draft:' + TEST.id;

let S = {no:'', name:'', answers:{}, startedAt:null};
let submitted = false, payload = null;

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function loadDraft(){ try{ const d = JSON.parse(localStorage.getItem(KEY)||'null'); if(d) S = Object.assign(S, d); }catch(e){} }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }

/* ---------- 응답 상태 ---------- */
function answered(q){
  const a = S.answers[q.no];
  switch(q.type){
    case 'choice': return Array.isArray(a) && a.length>0;
    case 'ox': return Array.isArray(a);
    case 'short': return Array.isArray(a) && a.some(v => String(v||'').trim()!=='');
    case 'symbol': return !!a;
    case 'match': return Array.isArray(a) && a.length===q.left.length;
    case 'written': return Array.isArray(a) && a.some(v => String(v||'').trim()!=='');
    case 'work': return !!a && (String(a.process||'').trim()!=='' || String(a.answer||'').trim()!=='');
  }
  return false;
}

/* ---------- 문항 그리기 ---------- */
function qHtml(q){
  const a = S.answers[q.no];
  let h = '<div class="qh"><div class="qn">'+q.no+'</div><div style="flex:1;min-width:0"><div class="stem">'+fmt(q.stem)+'</div>';
  if(q.image) h += '<img class="qimg" src="'+q.image+'" alt="문제 그림">' + (q.caption?'<div class="cap">'+esc(q.caption)+'</div>':'');
  if(q.passage) h += '<div class="pass">'+q.passage.map(p=>'<p>'+fmt(p)+'</p>').join('')+'</div>';
  if(q.box) h += '<div class="box"><div class="bt">&lt;보 기&gt;</div>'+q.box.map(p=>'<p>'+fmt(p)+'</p>').join('')+'</div>';
  h += body(q,a) + '</div></div>';
  return h;
}
function body(q,a){
  const n = q.no;
  if(q.type==='choice'){
    const sym = q.labelStyle==='sym', sel = a||[];
    let hint = '';
    if(q.pick>1) hint = '<div class="hint">정답 '+q.pick+'개를 골라요.</div>';
    else if(q.pick===0) hint = '<div class="hint">알맞은 것을 모두 골라요.</div>';
    const lab = i => sym ? SYM[i] : CIRC[i];
    const btns = q.options.map((o,i)=>'<button class="opt'+(sel.includes(i+1)?' on':'')+'" data-act="opt" data-q="'+n+'" data-i="'+(i+1)+'"><span class="no">'+lab(i)+'</span>'+(sym?'':'<span>'+fmt(o)+'</span>')+'</button>').join('');
    return hint + (sym ? '<div class="symrow">'+btns+'</div>' : btns);
  }
  if(q.type==='ox'){
    return '<div class="hint">○표 할 것을 눌러요. 다시 누르면 취소돼요.</div>' + q.items.map((t,i)=>'<div class="oxrow"><span>'+fmt(t)+'</span><button class="oxb'+(a&&a[i]?' on':'')+'" data-act="ox" data-q="'+n+'" data-i="'+i+'" aria-label="○ 표시">○</button></div>').join('');
  }
  if(q.type==='short'){
    return q.parts.map((p,i)=>'<div class="ans"><span class="lb">'+fmt(p.label)+'</span><input class="t" data-in="short" data-q="'+n+'" data-i="'+i+'" type="text" inputmode="numeric" autocomplete="off" maxlength="12" value="'+esc((a&&a[i])||'')+'"></div>').join('');
  }
  if(q.type==='symbol'){
    return '<div class="cmp"><span>'+fmt(q.left)+'</span><span class="symrow">'+q.symbols.map(s=>'<button class="opt'+(a===s?' on':'')+'" data-act="sym" data-q="'+n+'" data-v="'+esc(s)+'"><span class="no">'+esc(s)+'</span></button>').join('')+'</span><span>'+fmt(q.right)+'</span></div>';
  }
  if(q.type==='match'){
    const pairs = a||[];
    const ci = (side,idx) => { const k = pairs.findIndex(p=>p[side]===idx); return k<0?'':' c'+(k%3); };
    const L = q.left.map((t,i)=>'<button class="opt'+ci(0,i)+(S._sel&&S._sel.q===n&&S._sel.l===i?' pick':'')+'" data-act="mL" data-q="'+n+'" data-i="'+i+'">'+fmt(t)+'</button>').join('');
    const R = q.right.map((t,i)=>'<button class="opt'+ci(1,i)+'" data-act="mR" data-q="'+n+'" data-i="'+i+'">'+fmt(t)+'</button>').join('');
    return '<div class="hint">왼쪽 식을 누르고, 오른쪽 식을 눌러 이어요. 다시 누르면 끊어져요.</div><div class="match" id="m'+n+'"><div class="col">'+L+'</div><svg></svg><div class="col">'+R+'</div></div>';
  }
  if(q.type==='written'){
    let h='';
    for(let i=0;i<q.inputs;i++) h += (q.inputs>1?'<div class="lbl">'+CIRC[i]+'</div>':'')+'<textarea class="t" data-in="written" data-q="'+n+'" data-i="'+i+'" placeholder="여기에 써요">'+esc((a&&a[i])||'')+'</textarea>';
    return h;
  }
  if(q.type==='work'){
    const v = a||{};
    let h = '<div class="lbl">풀이 과정</div><textarea class="t" data-in="work" data-f="process" data-q="'+n+'" placeholder="풀이 과정을 써요">'+esc(v.process||'')+'</textarea><div class="lbl">답</div>';
    if(q.choices) h += '<div class="symrow">'+q.choices.map(c=>'<button class="opt'+(v.answer===c?' on':'')+'" data-act="wch" data-q="'+n+'" data-v="'+esc(c)+'"><span>'+esc(c)+'</span></button>').join('')+'</div>';
    else h += '<div class="ans"><input class="t" data-in="work" data-f="answer" data-q="'+n+'" type="text" inputmode="numeric" maxlength="12" value="'+esc(v.answer||'')+'">'+(q.unit?'<span class="lb">'+esc(q.unit)+'</span>':'')+'</div>';
    return h;
  }
  return '';
}
function renderQ(no){
  const q = TEST.questions.find(x=>x.no===no), el = $('#q'+no);
  el.innerHTML = qHtml(q);
  el.classList.toggle('done', answered(q));
  if(q.type==='match') drawLines(no);
}
function renderAll(){
  $('#qs').innerHTML = TEST.questions.map(q=>'<section class="q" id="q'+q.no+'"></section>').join('');
  TEST.questions.forEach(q=>renderQ(q.no));
  progress();
}
function progress(){
  const n = TEST.questions.filter(answered).length, t = TEST.questions.length;
  $('#progBar').style.width = (100*n/t)+'%';
  $('#progTxt').textContent = n+' / '+t;
}
function touch(no){ const q=TEST.questions.find(x=>x.no===no); $('#q'+no).classList.toggle('done', answered(q)); progress(); save(); }

function drawLines(no){
  const root = $('#m'+no); if(!root) return;
  const q = TEST.questions.find(x=>x.no===no), pairs = S.answers[no]||[];
  const svg = $('svg',root), rb = root.getBoundingClientRect();
  const Ls = root.querySelectorAll('[data-act=mL]'), Rs = root.querySelectorAll('[data-act=mR]');
  const col = ['#e0583f','#2f8fd8','#2e9e5b'];
  svg.innerHTML = pairs.map((p,k)=>{
    const a = Ls[p[0]].getBoundingClientRect(), b = Rs[p[1]].getBoundingClientRect();
    return '<line x1="'+(a.right-rb.left)+'" y1="'+(a.top+a.height/2-rb.top)+'" x2="'+(b.left-rb.left)+'" y2="'+(b.top+b.height/2-rb.top)+'" stroke="'+col[k%3]+'" stroke-width="4" stroke-linecap="round"/>';
  }).join('');
}
addEventListener('resize', ()=>{ if(!$('#quiz').hidden) TEST.questions.filter(q=>q.type==='match').forEach(q=>drawLines(q.no)); });

/* ---------- 이벤트 ---------- */
$('#qs').addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const no = +b.dataset.q, q = TEST.questions.find(x=>x.no===no), act = b.dataset.act;
  if(act==='opt'){
    const i = +b.dataset.i; let sel = (S.answers[no]||[]).slice();
    if(q.pick===1) sel = [i];
    else if(sel.includes(i)) sel = sel.filter(x=>x!==i);
    else if(q.pick>1 && sel.length>=q.pick){ toast('정답은 '+q.pick+'개만 고를 수 있어요. 하나를 먼저 취소해요.'); return; }
    else sel.push(i);
    S.answers[no] = sel.sort((x,y)=>x-y);
  } else if(act==='ox'){
    const i = +b.dataset.i, v = S.answers[no] ? S.answers[no].slice() : q.items.map(()=>false);
    v[i] = !v[i]; S.answers[no] = v;
  } else if(act==='sym'){ S.answers[no] = b.dataset.v;
  } else if(act==='wch'){ S.answers[no] = Object.assign({}, S.answers[no], {answer:b.dataset.v});
  } else if(act==='mL'){
    const i = +b.dataset.i; let pairs = (S.answers[no]||[]).slice();
    const k = pairs.findIndex(p=>p[0]===i);
    if(k>=0){ pairs.splice(k,1); S.answers[no]=pairs; S._sel=null; }
    else S._sel = {q:no,l:i};
  } else if(act==='mR'){
    const i = +b.dataset.i; let pairs = (S.answers[no]||[]).slice();
    const k = pairs.findIndex(p=>p[1]===i);
    if(S._sel && S._sel.q===no){
      if(k>=0) pairs.splice(k,1);
      pairs.push([S._sel.l,i]); pairs.sort((x,y)=>x[0]-y[0]); S.answers[no]=pairs; S._sel=null;
    } else if(k>=0){ pairs.splice(k,1); S.answers[no]=pairs; }
  }
  renderQ(no); touch(no);
});
$('#qs').addEventListener('input', e=>{
  const el = e.target.closest('[data-in]'); if(!el) return;
  const no = +el.dataset.q, kind = el.dataset.in;
  if(kind==='short'){ const q=TEST.questions.find(x=>x.no===no); const v=(S.answers[no]||q.parts.map(()=> '')).slice(); v[+el.dataset.i]=el.value; S.answers[no]=v; }
  else if(kind==='written'){ const q=TEST.questions.find(x=>x.no===no); const v=(S.answers[no]||Array(q.inputs).fill('')).slice(); v[+el.dataset.i]=el.value; S.answers[no]=v; }
  else if(kind==='work'){ S.answers[no]=Object.assign({},S.answers[no],{[el.dataset.f]:el.value}); }
  touch(no);
});

/* ---------- 시작 ---------- */
$('#meta').textContent = TEST.grade+' · '+TEST.subject+' · '+TEST.unit+(TEST.range?' · '+TEST.range:'');
$('#ttl').textContent = TEST.title+' 단원평가';
loadDraft();
$('#inNo').value = S.no; $('#inName').value = S.name;
$('#btnStart').onclick = ()=>{
  const no = parseInt($('#inNo').value,10), name = $('#inName').value.trim();
  const er = $('#startErr');
  if(!(no>=1 && no<=60) || !name){ er.textContent='번호와 이름을 모두 써 주세요.'; er.hidden=false; return; }
  er.hidden = true;
  if(String(S.no)!==String(no) || S.name!==name){ if(S.no!=='' && Object.keys(S.answers).length && !confirm('이 기기에 다른 친구(번호 '+S.no+', '+S.name+')의 풀던 답이 있어요. 지우고 새로 시작할까요?')) return; S.answers={}; }
  S.no = no; S.name = name; S.startedAt = S.startedAt || new Date().toISOString(); save();
  $('#start').hidden = true; $('#quiz').hidden = false;
  $('#who').textContent = no+'번 '+name;
  renderAll(); scrollTo(0,0);
  if(TEST.scratchpad) $('#padOpen').hidden = false;
};

/* ---------- 제출 ---------- */
$('#btnSubmit').onclick = ()=>{
  const miss = TEST.questions.filter(q=>!answered(q)).map(q=>q.no);
  $('#ovMsg').innerHTML = miss.length ? '아직 안 푼 문제가 있어요: <b>'+miss.join(', ')+'번</b><br>그래도 제출할까요?' : '모두 풀었어요. 제출하면 고칠 수 없어요.';
  $('#ovSubmit').classList.add('show');
};
$('#ovNo').onclick = ()=>$('#ovSubmit').classList.remove('show');
$('#ovYes').onclick = ()=>{ $('#ovSubmit').classList.remove('show'); doSubmit(); };

function download(){
  const name = TEST.id+'_'+String(S.no).padStart(2,'0')+'번_'+S.name+'.json';
  const blob = new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  $('#fname').textContent = '('+name+')';
}
async function send(){
  const dot=$('#sendDot'), txt=$('#sendTxt');
  dot.className='d wait'; dot.textContent='…'; txt.textContent='선생님께 보내는 중…'; $('#btnRetry').hidden=true; $('#sendHelp').hidden=true;
  if(!CFG.supabaseUrl || !CFG.supabaseAnonKey){ dot.className='d no'; dot.textContent='!'; txt.textContent='전송 설정이 없어요. 저장된 파일을 선생님께 보내 주세요.'; return; }
  try{
    const r = await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/'+CFG.table, {
      method:'POST',
      headers:{apikey:CFG.supabaseAnonKey, Authorization:'Bearer '+CFG.supabaseAnonKey, 'Content-Type':'application/json', Prefer:'return=minimal'},
      body: JSON.stringify({test_id:payload.test_id, class_label:payload.class_label, student_no:payload.student_no, student_name:payload.student_name, answers:payload.answers, meta:{submitted_at:payload.submitted_at, started_at:payload.started_at, duration_sec:payload.duration_sec, v:1}})
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    dot.className='d ok'; dot.textContent='✓'; txt.textContent='선생님께 전송했어요.';
  }catch(err){
    dot.className='d no'; dot.textContent='!'; txt.textContent='전송이 안 됐어요. (인터넷을 확인해요)';
    $('#btnRetry').hidden=false; $('#sendHelp').hidden=false;
  }
}
function doSubmit(){
  const now = new Date();
  payload = {app:'unit-test', v:1, test_id:TEST.id, title:TEST.title, class_label:CFG.classLabel||'', student_no:+S.no, student_name:S.name,
    started_at:S.startedAt, submitted_at:now.toISOString(), duration_sec:Math.round((now-new Date(S.startedAt))/1000), answers:S.answers};
  submitted = true;
  try{ localStorage.removeItem(KEY); }catch(e){}
  $('#quiz').hidden = true; $('#done').hidden = false; $('#padOpen').hidden = true; $('#pad').classList.remove('show'); scrollTo(0,0);
  download(); send();
}
$('#btnRetry').onclick = send;
$('#btnFile').onclick = download;
addEventListener('beforeunload', e=>{ if(!submitted && !$('#quiz').hidden && Object.keys(S.answers).length){ e.preventDefault(); e.returnValue=''; } });

/* ---------- 연습장 ---------- */
(function(){
  const pad=$('#pad'), cv=$('#cv'), ctx=cv.getContext('2d'); let pen='#222', drawing=false, last=null;
  function fit(){ const r=cv.getBoundingClientRect(); if(!r.width) return; const img = cv.width? ctx.getImageData(0,0,cv.width,cv.height):null; cv.width=r.width; cv.height=r.height; if(img) ctx.putImageData(img,0,0); }
  $('#padOpen').onclick=()=>{ pad.classList.add('show'); fit(); };
  $('#padClose').onclick=()=>pad.classList.remove('show');
  $('#padClear').onclick=()=>ctx.clearRect(0,0,cv.width,cv.height);
  pad.querySelectorAll('[data-pen]').forEach(b=>b.onclick=()=>{ pen=b.dataset.pen; pad.querySelectorAll('[data-pen]').forEach(x=>x.classList.toggle('on',x===b)); });
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  cv.addEventListener('pointerdown',e=>{ drawing=true; last=pos(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pos(e); ctx.lineCap='round'; ctx.lineJoin='round';
    if(pen==='erase'){ ctx.globalCompositeOperation='destination-out'; ctx.lineWidth=22; } else { ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=pen; ctx.lineWidth=3; }
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>drawing=false));
})();
</script>
