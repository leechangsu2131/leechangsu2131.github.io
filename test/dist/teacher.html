<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단원평가 채점</title>
<style>
:root{--bg:#f3f7fa;--card:#fff;--ink:#1f2d3d;--muted:#617182;--line:#d6e2ea;--brand:#2f8fd8;--brand-d:#1d6fb0;--ok:#2e9e5b;--okb:#e2f5ea;--part:#fff1cf;--partc:#a86a00;--bad:#fde7e5;--badc:#c0392b;--pend:#e9ecf1;--sel:#fff3c4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{background:#1e3a52;color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0}
header select{padding:6px 10px;border-radius:8px;border:0;min-width:260px}
main{max-width:1280px;margin:0 auto;padding:16px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn.g{background:#fff;color:var(--brand-d)}
.btn.s{padding:3px 9px;font-size:.85rem}
input.t,select.t{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}
.muted{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;padding:9px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--brand-d);border-color:var(--brand)}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
th{background:#eef4f8;font-size:.85rem;position:sticky;top:0;z-index:1}
td.l,th.l{text-align:left}
.sc{cursor:pointer;min-width:34px;font-weight:700}
.sc.full{background:var(--okb);color:#1d7a43}.sc.part{background:var(--part);color:var(--partc)}.sc.zero{background:var(--bad);color:var(--badc)}.sc.pend{background:var(--pend);color:#555}.sc.blank{background:#fafafa;color:#aaa}
.tot{font-weight:800;background:#f7fbff}
.badge{display:inline-block;border-radius:10px;padding:0 8px;font-size:.78rem;font-weight:700;background:var(--part);color:var(--partc);margin-left:4px}
.badge.b{background:#e3f2fd;color:var(--brand-d)}
.wrapx{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:8px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qchips button{min-width:38px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;font-weight:700}
.qchips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.qchips button.has{box-shadow:inset 0 -3px 0 #e6a100}
.bars .b{display:grid;grid-template-columns:34px 1fr 64px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #edf2f6}
.bars .track{height:12px;background:#e9eff4;border-radius:6px;overflow:hidden}.bars .track i{display:block;height:100%;background:var(--ok)}
.bars .track i.low{background:#d6453d}.bars .track i.mid{background:#e6a100}
.bars small{display:block;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(20,40,60,.5);z-index:20;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.ov.show{display:flex}
.md{background:#fff;border-radius:14px;padding:18px 20px;max-width:760px;width:100%}
.qa{border-top:1px solid var(--line);padding:10px 0}
.qa:first-child{border-top:0}
.kv{display:grid;grid-template-columns:70px 1fr;gap:2px 10px;font-size:.93rem}
.kv b{color:var(--muted);font-weight:600}
.ctl{margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;cursor:pointer;font-weight:700}
.ctl button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ctl input{width:64px;padding:3px 6px;border:1px solid var(--line);border-radius:6px}
.ans{white-space:pre-wrap;background:#f8fbfd;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#243b53;color:#fff;border-radius:10px;padding:8px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
#msg.show{opacity:1}
.drop{border:2px dashed var(--line);border-radius:10px;padding:10px 14px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--brand);background:#eef7ff}
.mono{font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-weight:700}
@media print{header,.tabs,.noprint{display:none!important}.wrapx{max-height:none;overflow:visible}}
</style>
</head>
<body>
<header>
  <h1>단원평가 채점</h1>
  <select id="selTest"></select>
  <span id="cnt" class="muted" style="color:#bcd"></span>
</header>
<main>
  <div class="card noprint">
    <details id="loader" open>
      <summary>학생 답안 불러오기</summary>
      <div class="row" style="margin-top:10px;align-items:stretch">
        <div style="flex:1;min-width:300px">
          <div style="font-weight:700;margin-bottom:6px">① 학생 제출 파일(.json)</div>
          <div id="drop" class="drop">파일을 여기에 끌어다 놓거나 <label style="color:var(--brand-d);cursor:pointer;text-decoration:underline">선택<input id="fileIn" type="file" accept=".json,application/json" multiple hidden></label><br><span style="font-size:.85rem">여러 개를 한꺼번에 불러올 수 있어요</span></div>
        </div>
        <div style="flex:1;min-width:300px">
          <div style="font-weight:700;margin-bottom:6px">② Supabase에서 불러오기 <span id="sbState" class="muted" style="font-weight:400"></span></div>
          <div class="row">
            <input id="sbEmail" class="t" placeholder="교사 이메일" autocomplete="username" style="width:180px">
            <input id="sbPw" class="t" type="password" placeholder="비밀번호" autocomplete="current-password" style="width:130px">
            <button id="btnLogin" class="btn g">로그인</button>
            <button id="btnFetch" class="btn" disabled>불러오기</button>
          </div>
        </div>
      </div>
    </details>
  </div>

  <div class="tabs noprint" id="tabs">
    <button data-tab="matrix" class="on">결과표</button>
    <button data-tab="byq">문항별 채점</button>
    <button data-tab="stats">문항 분석</button>
    <button data-tab="export">내보내기</button>
  </div>
  <div id="view"></div>
</main>

<div id="ov" class="ov"><div class="md" id="md"></div></div>
<div id="msg"></div>

}

    case 'short': {
      const per = q.parts.map((p,i)=>sameVal((a||[])[i],p.answer));

function fmtAns(q,a){
  if(!isAnswered(q,a)) return '(무응답)';
  const lab = i => q.labelStyle==='sym'?SYM[i-1]:CIRC[i-1];
  switch(q.type){
    case 'choice': return a.map(i=>lab(i)+(q.labelStyle==='sym'||!q.options[i-1]?'':' '+plain(q.options[i-1]))).join(', ');
    case 'ox': return q.items.map((_,i)=>'('+(i+1)+') '+(a[i]?'○':'—')).join('  ');
    case 'short': return q.parts.map((p,i)=>(q.parts.length>1?'('+(i+1)+') ':'')+((a[i]||'').trim()||'—')).join('   ');
    case 'symbol': return a;
    case 'match': return a.map(p=>q.left[p[0]]+' ↔ '+q.right[p[1]]).join('\n');
    case 'written': return a.map((v,i)=>(q.inputs>1?CIRC[i]+' ':'')+(v||'—')).join('\n');
    case 'work': return '풀이: '+(a.process||'—')+'\n답: '+(a.answer||'—')+(q.unit&&a.answer?' '+q.unit:'');
  }
}
function fmtKey(q){
  const lab = i => q.labelStyle==='sym'?SYM[i-1]:CIRC[i-1];
  switch(q.type){
    case 'choice': return q.answer.map(i=>lab(i)+(q.labelStyle==='sym'?'':' '+plain(q.options[i-1]))).join(', ');
    case 'ox': return q.items.map((_,i)=>'('+(i+1)+') '+(q.answer[i]?'○':'—')).join('  ');
    case 'short': return q.parts.map((p,i)=>(q.parts.length>1?'('+(i+1)+') ':'')+p.answer).join('   ');
    case 'symbol': return q.answer;
    case 'match': return q.answer.map(p=>q.left[p[0]]+' ↔ '+q.right[p[1]]).join('\n');
    case 'written': return q.sample||'';
    case 'work': return '답: '+q.answer+(q.unit?' '+q.unit:'')+(q.sample?'\n'+q.sample:'');
  }
}

/* ---------- 데이터 ---------- */
function subKey(s){ return [s.test_id,s.student_no,s.submitted_at].join('|'); }
function normalize(o, src){
  if(!o || !o.test_id || o.student_no==null || !o.answers) return null;
  const meta = o.meta||{};
  const s = {src, id:o.id, test_id:o.test_id, student_no:+o.student_no, student_name:o.student_name||'', answers:o.answers,
    submitted_at:o.submitted_at||meta.submitted_at||o.created_at||'', duration:o.duration_sec??meta.duration_sec};
  s.key = subKey(s);
  s.synced = !!o.class_manage_synced_at || !!cmSynced()[s.key];
  const local = lsGet()[s.key];
  const remote = o.manual_scores && (Object.keys(o.manual_scores.m||{}).length||Object.keys(o.manual_scores.o||{}).length) ? o.manual_scores : null;
  s.manual = remote || local || {m:{},o:{}};
  s.manual.m = s.manual.m||{}; s.manual.o = s.manual.o||{};
  return s;
}
function addSubs(list, src){
  let n=0;
  list.forEach(o=>{ const s=normalize(o,src); if(!s) return; const i=subs.findIndex(x=>x.key===s.key); if(i>=0) subs[i]=s; else subs.push(s); n++; });
  return n;
}
function latest(){
  const m = new Map();
  subs.filter(s=>s.test_id===cur).forEach(s=>{
    const k=String(s.student_no), e=m.get(k);
    if(!e) m.set(k,{sub:s,n:1}); else { e.n++; if(s.submitted_at>e.sub.submitted_at) e.sub=s; }
  });
  return [...m.values()].sort((a,b)=>a.sub.student_no-b.sub.student_no).map(e=>Object.assign(e.sub,{redo:e.n-1}));
}
async function readFiles(files){
  let n=0;
  for(const f of files){
    try{ const j = JSON.parse(await f.text()); n += addSubs(Array.isArray(j)?j:[j],'file'); }catch(e){ msg(f.name+': 읽을 수 없는 파일이에요'); }
  }
  const first = subs.find(s=>TESTS.some(t=>t.id===s.test_id) && !subs.some(x=>x.test_id===cur));
  if(first){ cur=first.test_id; $('#selTest').value=cur; }
  msg(n+'건 불러왔어요'); render();
}

function csvEsc(v){ v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function saveCsv(name, rows){
  const blob = new Blob(['﻿'+rows.map(r=>r.map(csvEsc).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function exportScores(){

  L.forEach(s=>{ const T=studentTotal(s); rows.push([s.student_no,s.student_name,...t.questions.map(q=>{const g=gradeQ(s,q);return g.state==='pend'?'':num(g.score);}),num(T.score),T.pending]); });
  rows.push(['','배점',...t.questions.map(q=>q.points),t.questions.reduce((s,q)=>s+q.points,0),'']);
  saveCsv(t.id+'_점수.csv',rows);
}

/* ---------- class-manage(학생별 관찰기록)에 점수 요약 추가 ---------- */
const CM_NAME_KEY = '\u{1F9D1}‍\u{1F393} 이름';   // "🧑‍🎓 이름" 컬럼
const CM_LS = 'ut-cm-synced-v1';
function cmSynced(){ try{return JSON.parse(localStorage.getItem(CM_LS)||'{}');}catch(e){return {};} }
function cmMark(sub){ const m=cmSynced(); m[sub.key]=new Date().toISOString(); try{localStorage.setItem(CM_LS,JSON.stringify(m));}catch(e){} sub.synced=true; }
function cmLevel(score,max){ const p=score/max*100; return p>=(CFG.cmGood??90)?'긍정✅':p>=(CFG.cmMid??70)?'중립📋':'관찰필요🔍'; }
function cmRecord(sub){
  const t=test(), T=studentTotal(sub), max=t.questions.reduce((s,q)=>s+q.points,0);
  const weak = t.questions.map(q=>({q,g:gradeQ(sub,q)})).filter(x=>!x.g.pending&&x.g.score<x.q.points).sort((a,b)=>(b.q.points-b.g.score)-(a.q.points-a.g.score));
  const seen=new Set(), topics=[];
  weak.forEach(x=>{ const k=plain(x.q.topic||''); if(k&&!seen.has(k)){seen.add(k);topics.push(k+'('+x.q.no+'번)');} });
  const unitName = t.unit.replace(/^\d+\.\s*/,''), ttl = t.title.replace(/\s*\(\d+회\)/,'');
  const label = ttl.includes(unitName) ? t.unit.split('.')[0]+'단원 '+ttl : t.unit+' '+ttl;
  const body = t.subject+' '+label+' 단원평가 결과 '+num(T.score)+'점('+max+'점 만점)입니다. '
    + (topics.length ? '보충이 필요한 내용: '+topics.slice(0,4).join(', ')+(topics.length>4?' 등':'')+'.' : '모든 문항을 바르게 해결하였습니다.');
  const day = new Date(sub.submitted_at||Date.now()).toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
  return {sub, score:T.score, pending:T.pending, row:{'내용':body,'날짜':day,'분야':'교과학습','출처':'단원평가',[CM_NAME_KEY]:sub.student_name,'과목':t.subject,'긍정도':cmLevel(T.score,max),'기록제목':t.subject+' '+t.title.replace(/\s*\(\d+회\)/,'')+' 단원평가 '+num(T.score)+'점'}};
}

  const L=latest(); if(!L.length){ msg('불러온 답안이 없어요'); return; }
  const recs=L.map(cmRecord);
  $('#md').innerHTML='<div class="row" style="justify-content:space-between"><h3 style="margin:0">class-manage에 점수 요약 추가</h3><button class="btn g" id="mdClose">닫기</button></div>'
    +'<p class="muted" style="margin:6px 0">학생별 관찰기록에 한 줄씩 추가됩니다. 서술형 채점이 끝나지 않은 학생과 이미 추가한 학생은 기본으로 체크되지 않아요.</p>'
    +'<div class="wrapx" style="max-height:52vh"><table><thead><tr><th></th><th>번호</th><th class="l">이름</th><th>점수</th><th>긍정도</th><th class="l">추가될 내용</th></tr></thead><tbody>'
    +recs.map((r,i)=>{ const off=r.pending>0; return '<tr><td><input type="checkbox" class="cmck" data-i="'+i+'" '+((off||r.sub.synced)?'':'checked')+(off?' disabled':'')+'></td><td>'+r.sub.student_no+'</td><td class="l">'+esc(r.sub.student_name)+(r.sub.synced?'<span class="badge b">추가함</span>':'')+(off?'<span class="badge">미채점 '+r.pending+'</span>':'')+'</td><td class="mono">'+num(r.score)+'</td><td>'+esc(r.row['긍정도'])+'</td><td class="l" style="white-space:normal;min-width:260px">'+esc(r.row['내용'])+'</td></tr>'; }).join('')
    +'</tbody></table></div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="cmGo">선택한 학생 추가</button></div>';
  $('#ov').classList.add('show');
  $('#cmGo').onclick = async ()=>{
    const pick=[...document.querySelectorAll('.cmck:checked')].map(c=>recs[+c.dataset.i]);
    if(!pick.length){ msg('선택한 학생이 없어요'); return; }
    if(!sbOK()){ msg('Supabase 설정이 없어요'); return; }
    $('#cmGo').disabled=true;
    try{
      const r = await fetch(sbBase()+'/rest/v1/'+encodeURIComponent(CFG.classManageTable||'class-manage'),{method:'POST',
        headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+CFG.supabaseAnonKey,'Content-Type':'application/json',Prefer:'return=minimal'},
        body:JSON.stringify(pick.map(p=>p.row))});
      if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));
      for(const p of pick){
        cmMark(p.sub);
        if(p.sub.src==='supabase' && p.sub.id && token){ try{ await fetch(sbBase()+'/rest/v1/'+CFG.table+'?id=eq.'+p.sub.id,{method:'PATCH',headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({class_manage_synced_at:new Date().toISOString()})}); }catch(e){} }
      }
      msg(pick.length+'명을 class-manage에 추가했어요'); $('#ov').classList.remove('show'); render();
    }catch(e){ msg('추가 실패: '+e.message); $('#cmGo').disabled=false; }
  };
}

function viewExport(){
  return '<div class="card"><h3 style="margin-top:0">학생별 기록(class-manage)</h3><p class="muted" style="margin-top:0">채점이 끝난 뒤 학생별 점수 요약과 보충이 필요한 내용을 기존 관찰기록 시트에 한 줄씩 추가합니다. 추가하기 전에 내용을 미리 볼 수 있어요.</p><button class="btn" id="btnCM"'+(sbOK()?'':' disabled')+'>class-manage에 점수 요약 추가…</button></div>'
  + '<div class="card"><h3 style="margin-top:0">내보내기</h3><div class="row"><button class="btn" id="exScore">점수표 CSV (엑셀)</button><button class="btn g" id="exAns">학생 응답 전체 CSV</button><button class="btn g" onclick="print()">결과표 인쇄</button></div><p class="muted">CSV는 엑셀에서 바로 열려요. 서술형 채점 점수는 이 기기에 자동 저장되고, Supabase로 불러온 답안은 로그인 상태에서 서버에도 저장돼요.</p></div>';
}

function render(){
  const L = latest();
  $('#cnt').textContent = L.length ? '응시 '+L.length+'명' : '';
  $('#view').innerHTML = tab==='matrix'?viewMatrix(): tab==='byq'?viewByQ(): tab==='stats'?viewStats(): viewExport();
  if(tab==='export'){ $('#exScore').onclick=exportScores; $('#exAns').onclick=exportAnswers; $('#btnCM').onclick=openCM; }
}

/* ---------- 이벤트 ---------- */
$('#selTest').innerHTML = TESTS.map(t=>'<option value="'+t.id+'">'+esc(t.subject+' '+t.unit.split('. ')[0]+'단원 '+t.title)+'</option>').join('');
$('#selTest').onchange = e=>{ cur=e.target.value; qsel=1; render(); };
$('#tabs').onclick = e=>{ const b=e.target.closest('[data-tab]'); if(!b) return; tab=b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); render(); };
document.addEventListener('click', e=>{
  const o = e.target.closest('[data-open]'); if(o){ openStudent(o.dataset.open, +o.dataset.q); return; }
  const st = e.target.closest('[data-stu]'); if(st){ e.preventDefault(); openStudent(st.dataset.stu); return; }
  if(e.target.id==='mdClose' || e.target===$('#ov')){ $('#ov').classList.remove('show'); render(); return; }
  const qc = e.target.closest('.qchips [data-q]'); if(qc){ qsel=+qc.dataset.q; render(); return; }
  const sb = e.target.closest('[data-set]'); if(sb){
    const sub=subs.find(s=>s.key===sb.dataset.sub), q=test().questions.find(x=>x.no===+sb.dataset.q);
    const kind=sb.dataset.set, v = sb.dataset.v===''?null:Number(sb.dataset.v);
    const cur_ = sub.manual[kind][q.no];
    setScore(sub,q,kind,(cur_===v)?null:v); // 같은 버튼을 다시 누르면 취소
    if($('#ov').classList.contains('show')) refreshModal(); else render();
  }
});
document.addEventListener('change', e=>{
  const i = e.target.closest('[data-setin]'); if(!i) return;
  const sub=subs.find(s=>s.key===i.dataset.sub), q=test().questions.find(x=>x.no===+i.dataset.q);
  let v = i.value===''?null:Math.max(0,Math.min(q.points,Number(i.value)));
  setScore(sub,q,i.dataset.setin,v);
  if($('#ov').classList.contains('show')) refreshModal(); else render();
});
render();
</script>
</body>
</html>
