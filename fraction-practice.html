<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>분수 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F8FC;--panel:#fff;--ink:#25324A;--sub:#6B7690;--blue:#3D5A80;--blue-soft:#DCE6F2;--org:#E8873A;--org-soft:#FBE6D2;--ok:#4C8C5C;--ok-soft:#E1F0E3;--bad:#C0503F;--bad-soft:#FAE4E0;--line:#D7E3EE;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Gowun Batang",serif;min-height:100vh;display:flex;justify-content:center;padding:24px 14px 60px}
.app{width:100%;max-width:620px}
header{text-align:center;margin-bottom:16px}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:30px;margin:0 0 4px;color:var(--blue)}
.subtitle{color:var(--sub);font-size:14.5px;margin:0}
.stats{display:flex;justify-content:center;gap:10px;margin:12px 0 16px;flex-wrap:wrap}
.chip{background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:6px 16px;font-size:15px}
.chip b{font-family:"Jua",sans-serif;font-weight:400;font-size:20px;color:var(--blue)}
.chip-btn{cursor:pointer;background:var(--blue-soft);color:var(--blue);font-family:"Jua",sans-serif;font-size:15px;border-color:#b9cfe3}
.assess-box,.card,.result-block{background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:20px 20px 22px;box-shadow:0 3px 14px rgba(61,90,128,.08)}
.assess-title{font-family:"Jua",sans-serif;font-size:22px;color:var(--blue);margin-bottom:6px}
.assess-q{font-size:17px;margin-bottom:14px}
.assess-btn{display:block;width:100%;text-align:left;margin:0 0 10px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;color:var(--ink)}
.assess-btn:hover{border-color:var(--blue);background:var(--blue-soft)}
.assess-btn-main{display:block;font-family:"Jua",sans-serif;font-size:19px;color:var(--blue)}
.assess-btn-sub{display:block;font-size:13.5px;color:var(--sub);margin-top:2px}
.assess-btn.test{border-color:#f0c9a6;background:var(--org-soft)}
.level-indicator{font-family:"Jua",sans-serif;font-size:14px;color:#fff;background:var(--blue);display:inline-block;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.level-indicator.test{background:var(--org)}
.problem-row{font-size:21px;font-weight:700;line-height:1.7;margin:2px 0 10px}
.cols{display:block}
.visual{margin:6px 0 12px;padding:10px;border-radius:14px;background:#F8FBFE;border:1.5px dashed var(--line);min-height:20px}
.visual:empty{display:none}
.dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.dots i{display:inline-block;width:17px;height:17px;border-radius:50%;background:#fff;border:2px solid var(--blue)}
.dots.grouped{gap:8px}
.grp{display:inline-flex;flex-wrap:wrap;gap:3px;padding:5px 6px;border:2px solid var(--blue);border-radius:10px;background:#fff;max-width:96px;justify-content:center}
.grp.on{background:var(--org-soft);border-color:var(--org)}
.grp.on i{background:var(--org);border-color:#c76a22}
.bar-block{margin:4px 0 10px}
.bar-label{font-family:"Jua",sans-serif;color:var(--blue);margin-bottom:3px;font-size:16px}
.barrow{display:flex;align-items:center;margin-bottom:4px}
.barrow .cells{display:flex;flex:0 1 auto}
.bc{width:30px;height:26px;border:2px solid var(--blue);margin-left:-2px;background:#fff}
.bc:first-child{margin-left:0}
.bc.on{background:var(--org-soft);box-shadow:inset 0 0 0 100px var(--org-soft);border-color:var(--org)}
.bw{font-family:"Jua",sans-serif;font-size:13px;color:var(--sub);margin-left:6px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;font-family:"Jua",sans-serif;font-weight:400}
.fr .n{border-bottom:3px solid currentColor;padding:0 5px;text-align:center}
.fr .d{padding:0 5px;text-align:center}
.mx{display:inline-flex;align-items:center;vertical-align:middle;font-family:"Jua",sans-serif;font-weight:400}
.mx b{font-weight:400;font-size:1.15em;margin-right:2px}
.pf{font-size:1.25em}
.step{margin:10px 0;padding:12px 14px;border-radius:14px;border:2px solid var(--blue-soft);background:#fff}
.step.locked{display:none}
.step.done{background:var(--ok-soft);border-color:#bfdcc4}
.step.cur{border-color:var(--blue)}
.step-prompt{font-size:17px;line-height:1.7;margin-bottom:8px}
.ans-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:"Jua",sans-serif;font-size:22px}
.dcell{width:62px;height:50px;border:2.5px solid var(--blue);border-radius:10px;text-align:center;font-family:"Jua",sans-serif;font-size:26px;color:var(--ink);background:#fff;padding:0;outline:none}
.dcell:focus{border-color:var(--org);box-shadow:0 0 0 3px var(--org-soft)}
.dcell.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.dcell.ok{border-color:var(--ok);background:var(--ok-soft)}
.dcell.w5{width:92px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.big .n,.big .d{padding:3px 6px}
.big{font-size:24px}
.big .st{display:inline-block;min-width:32px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font-family:"Jua",sans-serif;font-size:22px;min-width:74px;padding:9px 16px;border-radius:12px;border:2.5px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
.opt:hover{background:var(--blue-soft)}
.opt.sel{background:var(--org-soft);border-color:var(--org);color:#b4560f}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt:disabled{cursor:default}
.signbox{display:inline-block;min-width:1.6em;text-align:center;border:2.5px dashed var(--org);border-radius:8px;margin:0 6px;color:var(--org);font-family:"Jua",sans-serif}
.signbox.set{border-style:solid;color:var(--ok);border-color:var(--ok)}
.step-help{display:none;margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--org-soft);font-size:15px;line-height:1.6}
.step-help.show{display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.actions button{font-family:"Jua",sans-serif;font-size:18px;padding:10px 20px;border-radius:12px;border:0;cursor:pointer}
.btn-check{background:var(--blue);color:#fff}
.btn-next{background:var(--ok);color:#fff}
.btn-next:disabled,.btn-check:disabled{opacity:.4;cursor:default}
.btn-ghost{background:var(--blue-soft);color:var(--blue)}
.feedback{margin-top:10px;font-family:"Jua",sans-serif;font-size:19px;min-height:26px}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}.feedback.info{color:var(--blue)}
.explain{display:none;margin-top:8px;padding:10px 14px;border-radius:12px;background:var(--blue-soft);font-size:16px;line-height:1.7}
.explain.show{display:block}
.result-block{margin-top:16px}
.result-title{font-family:"Jua",sans-serif;font-size:20px;color:var(--blue);margin-bottom:12px}
.who-card{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:16px}
.who-card input{height:44px;border:2px solid var(--blue);border-radius:10px;font-size:18px;padding:0 10px;font-family:inherit}
.who-num{width:90px;text-align:center}.who-name{flex:1;min-width:160px}
.btn-submit{font-family:"Jua",sans-serif;font-size:19px;padding:12px 22px;border-radius:14px;border:0;background:var(--org);color:#fff;cursor:pointer}
.btn-submit:disabled{opacity:.4}
.submit-status{margin-top:10px;font-size:15px}
.submit-status.ok{color:var(--ok)}.submit-status.err{color:var(--bad)}.submit-status.pending{color:var(--sub)}
footer{text-align:center;color:var(--sub);font-size:13px;margin-top:22px}
@media (min-width:720px){
  .app{max-width:940px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
  .colR{position:sticky;top:8px}
}

body.tabletui header{margin-bottom:4px}
body.tabletui h1{font-size:24px;margin:0}
body.tabletui .subtitle{display:none}

body.landshort .level-indicator{font-size:11px;margin-bottom:4px}
body.landshort .visual{padding:4px;margin:2px 0 4px}
body.landshort .dots i{width:12px;height:12px}
body.landshort .bc{width:20px;height:16px}
body.landshort .step{padding:6px 10px;margin:4px 0}

body.landshort .dcell{height:36px;width:48px;font-size:20px}
body.landshort .opt{font-size:18px;padding:5px 12px}
body.landshort .actions button{font-size:14px;padding:6px 12px}
body.landshort .feedback{font-size:15px;min-height:18px;margin-top:4px}
body.landshort .explain{font-size:13px;padding:6px 10px}
body.landshort .cols{gap:12px}
body.landshort #npad{left:auto;top:0;bottom:0;right:0;width:172px;padding:6px 8px;border-top:0;border-left:2px solid #b9d3e6;box-shadow:-4px 0 14px rgba(40,70,100,.18);align-items:center}
body.landshort.npad-on #npad{display:flex}
body.landshort #npad .npad-row{grid-template-columns:repeat(3,1fr);gap:5px;width:100%}
body.landshort #npad button{height:min(54px,calc((100vh - 40px)/4));font-size:22px;border-radius:10px}
body.landshort .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

.mp-open-row{margin:6px 0 2px}
.mp-open-btn{font-family:"Jua",sans-serif;font-size:17px;padding:8px 16px;border-radius:12px;border:2px solid var(--org);background:var(--org-soft);color:#b4560f;cursor:pointer}
#mpOverlay{display:none;position:fixed;inset:0;z-index:200000;background:rgba(37,50,74,.55);align-items:center;justify-content:center;padding:10px}
#mpOverlay.on{display:flex}
.mp-panel{background:#fff;border-radius:18px;width:100%;max-width:720px;max-height:100%;overflow:auto;padding:14px 16px 16px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.mp-head h2{font-family:"Jua",sans-serif;font-weight:400;font-size:20px;margin:0;color:var(--blue);flex:1}
.mp-tab,.mp-close,.mp-ctl button{font-family:"Jua",sans-serif;font-size:16px;padding:7px 14px;border-radius:10px;border:2px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
.mp-tab.on{background:var(--blue);color:#fff}
.mp-close{border-color:var(--bad);color:var(--bad)}
.mp-stage{background:#F8FBFE;border:1.5px dashed var(--line);border-radius:14px;padding:12px;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mp-stage .barrow{margin-bottom:6px}
.mp-stage .bc{width:44px;height:38px;cursor:pointer;background:#fff;box-shadow:none}
.mp-stage .bc.on{background:var(--org);border-color:#c76a22;box-shadow:none}
.mp-stage .grp{cursor:pointer;max-width:130px}
.mp-stage .dots.grouped{justify-content:center}
.mp-ctl{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin:10px 0 6px}
.mp-ctl .grp2{display:flex;align-items:center;gap:6px;font-size:15px}
.mp-ctl .grp2 b{font-family:"Jua",sans-serif;font-weight:400;font-size:20px;min-width:26px;text-align:center;color:var(--blue)}
.mp-ctl button{padding:4px 12px;font-size:18px}
.mp-info{margin-top:8px;padding:10px 14px;border-radius:12px;background:var(--blue-soft);font-size:17px;line-height:1.8;min-height:44px}
.mp-hint{font-size:13.5px;color:var(--sub);margin-top:6px}
body.landshort .mp-stage .bc{width:30px;height:26px}
body.landshort .mp-panel{padding:8px 12px}
body.landshort .mp-info{font-size:14px;padding:6px 10px;line-height:1.5}
.pwrap{margin-top:4px}
.nrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.part{cursor:pointer;fill:#fff;stroke:#3D5A80;stroke-width:3;transition:fill .12s}
.part.on{fill:#E8873A}.part.static{cursor:default}
.tick{cursor:pointer}
svg text{font-family:"Jua",sans-serif}
</style>

<body>
<div class="app">
  <header>
    <h1>분수 연습</h1>
    <p class="subtitle">3학년 2학기 · 4. 분수 · 그림과 단계로 차근차근</p>
  </header>

  <div class="assess-box" id="assessScreen">
    <div class="assess-title">🙋 시작하기 전에 하나만 물어볼게요</div>
    <div class="assess-q">분수, 지금 어느 정도 할 수 있을 것 같아요?</div>
    <button class="assess-btn" data-start-level="1"><span class="assess-btn-main">아직 낯설어요</span><span class="assess-btn-sub">전체를 똑같이 나누어 분수로 나타내기부터</span></button>
    <button class="assess-btn" data-start-level="2"><span class="assess-btn-main">전체의 몇 분의 몇은 알아요</span><span class="assess-btn-sub">분수만큼은 얼마인지 구하기부터</span></button>
    <button class="assess-btn" data-start-level="3"><span class="assess-btn-main">분수 이름을 알아요</span><span class="assess-btn-sub">진분수·가분수·대분수부터</span></button>
    <button class="assess-btn" data-start-level="5"><span class="assess-btn-main">대분수·가분수 바꾸기도 자신 있어요</span><span class="assess-btn-sub">분수의 크기 비교부터</span></button>
    <button class="assess-btn test" data-start-level="test"><span class="assess-btn-main">바로 종합 테스트에 도전할래요</span><span class="assess-btn-sub">10문제 · 힌트 없이 풀어요</span></button>
  </div>

  <div class="stats" id="statsBar" style="display:none">
    <div class="chip">맞힌 문제 <b id="statScore">0</b></div>
    <div class="chip">연속 정답 <b id="statStreak">0</b></div>
    <div class="chip chip-btn" id="btnToTest" role="button" tabindex="0">종합 테스트 도전 ▶</div>
  </div>

  <div class="card" id="card" style="display:none">
    <div class="level-indicator" id="levelIndicator"></div>
    <div class="cols">
      <div class="colL">
        <div class="problem-row" id="problemRow"></div>
        <div class="visual" id="visual"></div>
      </div>
      <div class="colR">
        <div class="mp-open-row" id="mpOpenRow"><button type="button" class="mp-open-btn" id="mpOpen">🧩 분수 조작판으로 해보기</button></div>
        <div id="stepsArea"></div>
        <div class="actions">
          <button class="btn-check" id="btnCheck">확인</button>
          <button class="btn-next" id="btnNext" disabled>다음 문제</button>
          <button class="btn-ghost" id="btnReset">다시 풀기</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="explain" id="explain"></div>
      </div>
    </div>
  </div>

  <div class="result-block" id="resultBlock" style="display:none">
    <div class="result-title">🎉 종합 테스트가 끝났어요! 번호와 이름을 쓰고 제출해주세요.</div>
    <div class="who-card">
      <label for="numInput">번호</label>
      <input type="number" id="numInput" inputmode="numeric" min="1" max="19" placeholder="예: 3" class="who-num">
      <label for="nameInputField">이름</label>
      <input type="text" id="nameInputField" placeholder="본인 이름을 정확히 입력하세요" class="who-name">
    </div>
    <div class="submit-bar"><button class="btn-submit" id="btnSubmit" disabled>내 결과 선생님께 제출하기</button></div>
    <div class="submit-status" id="submitStatus"></div>
  </div>

<div id="mpOverlay" aria-hidden="true"><div class="mp-panel" role="dialog" aria-label="분수 조작판">
  <div class="mp-head"><h2>🧩 분수 조작판</h2>
    <button type="button" class="mp-tab on" data-tab="bar">분수 막대</button>
    <button type="button" class="mp-tab" data-tab="dots">묶음 나누기</button>
    <button type="button" class="mp-close" id="mpClose">닫기 ✕</button></div>
  <div class="mp-stage" id="mpStage"></div>
  <div class="mp-ctl" id="mpCtl"></div>
  <div class="mp-info" id="mpInfo"></div>
  <div class="mp-hint" id="mpHint"></div>
</div></div>

  <footer>화천초등학교 3학년 2반 · 분수 연습</footer>
</div>

const fr = (n,d) => `<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;

function barHTML(d, n, label){
  const W = Math.max(1, Math.ceil(n/d)); let h = '<div class="bar-block">';
  if(label) h += `<div class="bar-label">${label}</div>`;
  for(let w=0; w<W; w++){

    for(let c=0; c<d; c++) h += `<span class="bc${(w*d+c)<n?' on':''}"></span>`;
    h += `</span><span class="bw">${w+1}</span></div>`;
  }
  return h + '</div>';
}

      explain:`${mx(w,q,d)} = ${fr(w*d+q,d)} 이므로 ${win}네 모둠의 나무가 더 높아요.`};
  }
  let b,m; do{ b=rand(2,6); m=rand(2,8); }while(b*m>36);
  const a=rand(1,b-1), T=b*m, [item,unit]=pick(ITEMS.slice(0,4));
  return {lv:6, manip:{t:'dots',T,G:b}, plain:`${item} ${T}${unit} 중 ${a}/${b} 먹고 남은 수`, q:`${item} ${T}${unit} 중 ${fr(a,b)}을(를) 먹었어요. 남은 ${item}은 몇 ${unit}일까요?`,
    vis:(st)=>dotsHTML(T,m,st>=2?a:0,st>=1), essential:false,
    steps:[
      one(`${T}${unit}을 ${b}묶음으로 똑같이 나누면 한 묶음은 몇 ${unit}일까요?`, m, unit, `그림의 ${T}${unit}을 ${b}묶음으로 나누어 보아요.`),
      one(`먹은 것은 ${a}묶음이에요. 먹은 ${item}은 몇 ${unit}일까요?`, a*m, unit, `한 묶음이 ${m}${unit}이에요.`),
      one(`남은 ${item}은 몇 ${unit}일까요?`, T-a*m, unit, `전체에서 먹은 수를 빼 보아요.`)
    ], final:2, stageAt:[1,2],
    explain:`한 묶음은 ${m}${unit}, 먹은 것은 ${a*m}${unit}이므로 남은 것은 ${T}−${a*m}=${T-a*m}${unit}이에요.`};
}
const GENS = {1:gen1,2:gen2,3:gen3,4:gen4,5:gen5,6:gen6};

/* ── 상태 ── */
let level=1, P=null, score=0, attempts=0, streak=0, bestStreak=0, lvlRun=0, lvlMiss=0, returnTo=null;
let inTest=false, testIdx=0, testResults=[], done=false, curStep=0, stage=0, pendingMsg='', nextAction='next';
let prac={}, moves=[];
const els = {assess:$('assessScreen'),stats:$('statsBar'),card:$('card'),lvl:$('levelIndicator'),prob:$('problemRow'),vis:$('visual'),steps:$('stepsArea'),
  check:$('btnCheck'),next:$('btnNext'),reset:$('btnReset'),fb:$('feedback'),ex:$('explain'),res:$('resultBlock'),score:$('statScore'),streak:$('statStreak'),
  num:$('numInput'),name:$('nameInputField'),submit:$('btnSubmit'),status:$('submitStatus')};

function practiceSummary(){
  const ks = Object.keys(prac).sort(); if(!ks.length) return '';
  const s = ks.map(k=>`${k}단계 ${prac[k].c}/${prac[k].n}`).join(', ');
  return ` [연습기록: ${s}${moves.length?` · 단계이동: ${moves.join(' ')}`:''}]`;
}
function updateStats(){ els.score.textContent=score; els.streak.textContent=streak; }

function cellInput(i,k,ans){
  const len = String(ans).length;
  return `<input class="dcell${len>=4?' w5':''}" data-s="${i}" data-k="${k}" type="text" inputmode="numeric" autocomplete="off" maxlength="${len}" aria-label="답">`;
}
function stepHTML(s,i){
  let inner='';
  if(s.layout==='paint') inner=`<div class="pwrap" id="pw${i}"></div>`;
  else if(s.layout==='point') inner=`<div class="pwrap" id="pw${i}"></div>`;
  else if(s.layout==='choice'){
    inner = `<div class="opts">${s.opts.map(o=>`<button type="button" class="opt" data-s="${i}" data-v="${o.v}">${o.h}</button>`).join('')}</div>`;
  } else {
    let c='';
    if(s.layout==='one') c = cellInput(i,'v',s.ans.v) + (s.unit?`<span>${s.unit}</span>`:'');
    else if(s.layout==='frac') c = `<span class="fr big"><span class="n">${cellInput(i,'n',s.ans.n)}</span><span class="d">${cellInput(i,'d',s.ans.d)}</span></span>`;
    else if(s.layout==='imp') c = `<span class="fr big"><span class="n">${cellInput(i,'n',s.ans.n)}</span><span class="d"><span class="st">${s.stat}</span></span></span>`;
    else if(s.layout==='mixed') c = `<span class="mx big">${cellInput(i,'w',s.ans.w)}<span class="fr big"><span class="n">${cellInput(i,'n',s.ans.n)}</span><span class="d"><span class="st">${s.stat}</span></span></span></span>`;
    inner = `<div class="ans-row">${c}</div>`;
  }
  return `<div class="step locked" id="step${i}" data-i="${i}"><div class="step-prompt">${s.prompt}</div>${inner}<div class="step-help"></div></div>`;
}
function drawPW(i){ const s=P.steps[i], el=$('pw'+i); if(!el) return;
  if(s.layout==='paint') el.innerHTML=shapeSVG(s.shape.kind,s.shape.d,s.shape.W,s.sel,'p',!P.stepDone[i]);
  else el.innerHTML=numLine(s.d,s.pos,!P.stepDone[i]); }
function setVisual(st){
  stage = st;
  if(inTest && !P.essential){ els.vis.innerHTML=''; return; }
  els.vis.innerHTML = P.vis ? P.vis(st) : '';
}
function renderProblem(){
  done=false; curStep=0; stage=0; P.miss=0; P.stepMiss=P.steps.map(()=>0); P.stepDone=P.steps.map(()=>false);
  els.lvl.textContent = inTest ? `종합 테스트 · ${testIdx+1} / ${TEST_TOTAL}` : LEVEL_NAME[P.lv];
  els.lvl.className = 'level-indicator'+(inTest?' test':'');
  els.prob.innerHTML = P.q;
  els.steps.innerHTML = P.steps.map(stepHTML).join('');
  els.ex.className='explain'; els.ex.innerHTML='';
  P.steps.forEach((s,i)=>{ if(s.sel) s.sel.clear(); if(s.layout==='point') s.pos=null; });
  P.steps.forEach((s,i)=>drawPW(i));
  els.fb.className='feedback'; els.fb.textContent = pendingMsg; if(pendingMsg) els.fb.className='feedback info'; pendingMsg='';
  els.next.disabled=true; els.next.textContent = inTest ? '다음 문제' : '다음 문제'; els.next.style.display = inTest?'none':'';
  els.check.style.display=''; els.check.textContent = inTest ? (testIdx===TEST_TOTAL-1?'확인하고 끝내기':'확인하고 다음 문제') : '확인'; els.check.disabled=false;
  els.reset.style.display = inTest?'none':''; $('mpOpenRow').style.display = inTest?'none':'';
  nextAction='next';
  setVisual(0);
  if(inTest){ const s=$('step'+P.final); s.classList.remove('locked'); s.classList.add('cur'); const pr=s.querySelector('.step-prompt'); if(P.steps.length>1 && P.steps[P.final].layout!=='choice' && P.steps[P.final].layout!=='one') {} focusStep(P.final); }
  else unlock(0);
}
function unlock(i){
  curStep=i; const s=$('step'+i); s.classList.remove('locked'); s.classList.add('cur'); focusStep(i);
}
function focusStep(i){
  const s=$('step'+i); const c=s.querySelector('input.dcell'); if(c) setTimeout(()=>{ try{ c.focus(); }catch(e){} }, 30);
}
function cellsOf(i){ return Array.from(document.querySelectorAll(`#step${i} input.dcell`)); }
function stepFilled(i){ const s=P.steps[i]; return cellsOf(i).every(c=>c.value.length >= String(s.ans[c.dataset.k]).length); }
function stepVals(i){ const o={}; cellsOf(i).forEach(c=>{ o[c.dataset.k]=c.value; }); return o; }
function stepOK(i,v){ const s=P.steps[i]; return Object.keys(s.ans).every(k=>String(parseInt(v[k],10))===String(s.ans[k])); }
function userStr(i,v){ const s=P.steps[i]; if(s.layout==='choice') return v===undefined||v===''?'미선택':v; return Object.keys(s.ans).map(k=>(v[k]===''||v[k]===undefined)?'□':v[k]).join('/'); }
function ansStr(i){ const s=P.steps[i]; return Object.keys(s.ans).map(k=>s.ans[k]).join('/'); }

function checkStep(i, forced){
  if(done || P.stepDone[i]) return;
  const s=P.steps[i];
  if(s.layout==='choice'||s.layout==='point') return; // 선택지·눈금은 클릭 즉시 처리
  if(s.layout==='paint'){ if(!forced) return; if(s.sel.size===s.ans.v) stepCorrect(i); else { P.miss++; P.stepMiss[i]++; setFb('bad',pick(NUDGE)); const h=$('step'+i).querySelector('.step-help'); h.textContent='💡 '+(s.help||''); h.classList.add('show'); } return; }
  if(!stepFilled(i)){ if(forced){ setFb('bad','빈 칸을 모두 채워 보아요.'); } return; }
  const v=stepVals(i);
  if(stepOK(i,v)) stepCorrect(i);
  else stepWrong(i,Object.keys(s.ans).filter(k=>String(parseInt(v[k],10))!==String(s.ans[k])));
}
function setFb(cls,t){ els.fb.className='feedback '+cls; els.fb.textContent=t; }
function stepWrong(i,badKeys){
  P.miss++; P.stepMiss[i]++;
  const cs=cellsOf(i).filter(c=>badKeys.indexOf(c.dataset.k)>=0);
  cs.forEach(c=>c.classList.add('bad'));
  setFb('bad', pick(NUDGE));
  if(P.stepMiss[i]>=2 || P.steps[i].help){ const h=$('step'+i).querySelector('.step-help'); if(P.stepMiss[i]>=1){ h.textContent='💡 '+(P.steps[i].help||''); h.classList.add('show'); } }
  setTimeout(()=>{ cs.forEach(c=>{ c.value=''; c.classList.remove('bad'); }); if(cs[0]) try{cs[0].focus();}catch(e){} }, 750);
}
function stepCorrect(i){
  P.stepDone[i]=true; drawPW(i);
  const st=$('step'+i); st.classList.remove('cur'); st.classList.add('done');
  cellsOf(i).forEach(c=>{ c.classList.add('ok'); c.readOnly=true; });
  st.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; });
  const sw = P.stageAt ? P.stageAt.indexOf(i) : -1;
  if(i===P.steps.length-1){ finishProblem(); }
  else { setFb('ok','좋아요! 다음 단계로 가요.'); setVisual(Math.max(stage, sw>=0?sw+1:stage)); unlock(i+1); }
}
function finishProblem(){
  done=true;
  setVisual(2);
  const ok = P.miss===0;
  attempts++; prac[P.lv]=prac[P.lv]||{n:0,c:0}; prac[P.lv].n++;
  if(ok){ score++; streak++; bestStreak=Math.max(bestStreak,streak); prac[P.lv].c++; lvlRun++; lvlMiss=0; }
  else { streak=0; lvlRun=0; lvlMiss++; }
  updateStats();
  setFb(ok?'ok':'info', ok ? pick(PRAISE) : '끝까지 풀었어요! 다음엔 한 번에 맞혀 봐요.');
  els.ex.innerHTML = P.explain; els.ex.className='explain show';
  els.next.disabled=false; els.check.disabled=true;
  decideNext();
  els.next.focus && els.next.focus({preventScroll:true});
}
function decideNext(){
  nextAction='next'; els.next.textContent='다음 문제';
  if(returnTo && lvlRun>=2){ level=returnTo; returnTo=null; lvlRun=0; lvlMiss=0; moves.push('↩'+level); pendingMsg=`잘했어요! 다시 ${level}단계로 돌아가요.`; }
  else if(lvlRun>=3 && !returnTo){
    if(level<6){ level++; lvlRun=0; lvlMiss=0; moves.push('↑'+level); pendingMsg=`🎉 ${level}단계로 올라가요!`; }
    else { nextAction='test'; els.next.textContent='종합 테스트 시작 ▶'; pendingMsg=''; }
  }
  else if(lvlMiss>=3 && level>1){ returnTo = returnTo||level; level--; lvlMiss=0; lvlRun=0; moves.push('↓'+level); pendingMsg=`괜찮아요, ${level}단계에서 한 번 더 다져 볼까요?`; }
  else if(lvlMiss>=3){ lvlMiss=0; }
}
function newProblem(){ P = GENS[level](); renderProblem(); }

/* ── 이벤트 ── */
els.steps.addEventListener('input', e=>{
  const t=e.target; if(!t.classList.contains('dcell')) return;
  t.value = t.value.replace(/\D/g,''); t.classList.remove('bad');
  if(inTest || done) return;
  const i=+t.dataset.s; if(i===curStep && stepFilled(i)) checkStep(i,false);
});
els.steps.addEventListener('click', e=>{
  const part=e.target.closest('.part');
  if(part&&!part.classList.contains('static')){ const st=part.closest('.step'), i=+st.dataset.i, s=P.steps[i]; if(done||P.stepDone[i]) return; const k=+part.dataset.i; s.sel.has(k)?s.sel.delete(k):s.sel.add(k); drawPW(i); if(!inTest&&s.sel.size===s.ans.v) stepCorrect(i); return; }
  const tk=e.target.closest('.tick');
  if(tk){ const st=tk.closest('.step'), i=+st.dataset.i, s=P.steps[i]; if(done||P.stepDone[i]) return; s.pos=+tk.dataset.p; drawPW(i);
    if(!inTest){ if(s.pos===s.ans.v) stepCorrect(i); else { P.miss++; P.stepMiss[i]++; setFb('bad',pick(NUDGE)); const h=st.querySelector('.step-help'); h.textContent='💡 '+(s.help||''); h.classList.add('show'); setTimeout(()=>{ s.pos=null; drawPW(i); },600); } } return; }
  const b=e.target.closest('.opt'); if(!b || b.disabled) return;
  const i=+b.dataset.s, v=b.dataset.v, s=P.steps[i];
  if(inTest){ els.steps.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
    const sb=$('signBox'); if(sb){ sb.textContent=b.textContent; sb.classList.add('set'); } return; }
  if(done || P.stepDone[i]) return;
  if(v===String(s.ans.v)){ b.classList.add('ok'); const sb=$('signBox'); if(sb){ sb.textContent=b.textContent; sb.classList.add('set'); } stepCorrect(i); }
  else { P.miss++; P.stepMiss[i]++; b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),600); setFb('bad',pick(NUDGE)); const h=$('step'+i).querySelector('.step-help'); h.textContent='💡 '+(s.help||''); h.classList.add('show'); }
});
els.check.addEventListener('click', ()=>{ if(inTest) submitTestQ(); else checkStep(curStep,true); });
els.next.addEventListener('click', ()=>{ if(!done) return; if(nextAction==='test') startTest(); else newProblem(); });
els.reset.addEventListener('click', ()=>{ if(P){ const keep=P; P.miss=0; renderProblem(); } });
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(!els.card || els.card.style.display==='none') return;
  const tg=e.target; if(tg && (tg.id==='numInput'||tg.id==='nameInputField')) return;
  if(inTest){ submitTestQ(); return; }
  if(done){ els.next.click(); } else checkStep(curStep,true);
});
document.querySelectorAll('[data-start-level]').forEach(b=>b.addEventListener('click', ()=>{
  const v=b.getAttribute('data-start-level'); els.assess.style.display='none'; els.stats.style.display='flex'; els.card.style.display='block';
  if(v==='test'){ startTest(); } else { level=+v; newProblem(); }
}));
$('btnToTest').addEventListener('click', ()=>{ if(inTest) return; startTest(); });

/* ── 종합 테스트 ── */
function startTest(){
  inTest=true; testIdx=0; testResults=[]; els.res.style.display='none'; els.stats.style.display='none';
  els.card.style.display='block'; P=GENS[TEST_SEQ[0]](); renderProblem();
}
function submitTestQ(){
  const i=P.final, s=P.steps[i]; let v, ok, u;
  if(s.layout==='paint'){ ok=s.sel.size===s.ans.v; u=s.sel.size+'칸'; }
  else if(s.layout==='point'){ if(s.pos===null){ setFb('bad','눈금을 눌러 점을 찍어 보아요.'); return; } ok=s.pos===s.ans.v; u=String(s.pos); }
  else if(s.layout==='choice'){ const sel=els.steps.querySelector('.opt.sel'); if(!sel){ setFb('bad','답을 하나 골라 보아요.'); return; } v=sel.dataset.v; ok = v===String(s.ans.v); u=v; }
  else { if(!cellsOf(i).every(c=>c.value!=='')){ setFb('bad','빈 칸을 모두 채워 보아요.'); return; } v=stepVals(i); ok=stepOK(i,v); u=userStr(i,v); }
  testResults.push({plain:P.plain, correct:ok, user:u, ans:ansStr(i)});
  testIdx++;
  if(testIdx>=TEST_TOTAL){ finishTest(); } else { P=GENS[TEST_SEQ[testIdx]](); renderProblem(); window.scrollTo({top:0}); }
}
function finishTest(){
  els.card.style.display='none'; els.res.style.display='block'; window.scrollTo({top:0,behavior:'smooth'});
  const n=testResults.filter(r=>r.correct).length;
  $('resultBlock').querySelector('.result-title').textContent = `🎉 종합 테스트가 끝났어요! ${TEST_TOTAL}문제 중 ${n}문제를 맞혔어요. 번호와 이름을 쓰고 제출해주세요.`;
  updateSubmitEnabled();
}

/* ── 제출 ── */
function updateSubmitEnabled(){ els.submit.disabled = !(els.num.value.trim() && els.name.value.trim()); }
els.num.addEventListener('input', updateSubmitEnabled); els.name.addEventListener('input', updateSubmitEnabled);
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function resolveStudent(){
  const numRaw=els.num.value.trim(), nameRaw=els.name.value.trim(), num=parseInt(numRaw,10);
  const matched=(num>=1 && num<=ROSTER.length && ROSTER[num-1]===nameRaw);
  return {valid:!!(numRaw&&nameRaw), matched, recordName: matched?ROSTER[num-1]:'미분류',
    note: matched?'':`[확인필요 · 학생 입력: 번호 ${numRaw||'?'} / 이름 ${nameRaw||'?'}] `};
}
async function submitResult(){
  const who=resolveStudent();
  if(!who.valid){ els.status.textContent='먼저 내 번호와 이름을 입력해주세요.'; els.status.className='submit-status err'; return; }
  if(testResults.length<TEST_TOTAL){ els.status.textContent='종합 테스트를 끝까지 풀고 제출해주세요.'; els.status.className='submit-status err'; return; }
  const n=testResults.filter(r=>r.correct).length, rate=Math.round(n/TEST_TOTAL*100);
  const pos = rate>=80?'긍정✅':(rate>=50?'중립📋':'관찰필요🔍');
  const detail=testResults.map((r,i)=>`${i+1})${r.plain} ${r.correct?'정답':`오답(입력:${r.user}, 정답:${r.ans})`}`).join(', ');
  const record={'기록제목':'분수 종합 테스트 결과','날짜':todayStr(),'분야':'학습능력','긍정도':pos,'출처':'학생직접제출','과목':'수학',
    '내용':`${who.note}분수(3-2 4단원) 종합 테스트 ${TEST_TOTAL}문제 중 ${n}문제 정답(정답률 ${rate}%). 세부: ${detail}.${practiceSummary()}`,'🧑‍🎓 이름':who.recordName};
  els.submit.disabled=true; els.status.textContent='제출 중...'; els.status.className='submit-status pending';
  try{
    if(navigator.onLine===false) throw new Error('오프라인(navigator.onLine=false)');
    const res=await fetch(`${SUPABASE_URL}/rest/v1/class-manage`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(record)});
    if(!res.ok){ let t=''; try{ t=await res.text(); }catch(e){} throw new Error(`HTTP ${res.status} ${t}`.trim()); }
    els.status.textContent = who.matched ? '제출 완료! 결과가 선생님께 전달되었어요.' : "제출 완료! (번호·이름이 명단과 달라 '미분류'로 저장했어요. 선생님께 확인을 부탁드리세요.)";
    els.status.className='submit-status ok';
  }catch(err){ els.status.textContent=`제출에 실패했어요. 인터넷 연결을 확인하고 다시 눌러주세요. (오류: ${err.message})`; els.status.className='submit-status err'; }
  finally{ updateSubmitEnabled(); }
}
els.submit.addEventListener('click', submitResult);

/* ── 분수 조작판 (직접 칠하고 나누어 보는 연습 도구) ── */
const MP = {tab:'bar', d:4, W:2, n:0, T:12, G:3, a:0};
const mpEl = {ov:$('mpOverlay'), stage:$('mpStage'), ctl:$('mpCtl'), info:$('mpInfo'), hint:$('mpHint')};
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
function mpStepper(label,key,lo,hi){ return `<div class="grp2">${label}<button type="button" data-k="${key}" data-dx="-1">−</button><b>${MP[key]}</b><button type="button" data-k="${key}" data-dx="1">＋</button></div>`; }
function mpRender(){
  document.querySelectorAll('.mp-tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===MP.tab));
  if(MP.tab==='bar'){
    const {d,W,n}=MP; let h='';
    for(let w=0; w<W; w++){ h+='<div class="barrow"><span class="cells">'; for(let c=0;c<d;c++){ const i=w*d+c; h+=`<span class="bc${i<n?' on':''}" data-i="${i}"></span>`; } h+=`<span class="bw">${w+1}</span></div>`; }
    mpEl.stage.innerHTML=h;
    mpEl.ctl.innerHTML = mpStepper('한 칸 나누기 (분모)','d',2,10)+mpStepper('막대 수','W',1,5)+'<div class="grp2"><button type="button" id="mpClear">🧽 지우기</button></div>';
    let t;
    if(n===0) t='칸을 눌러 앞에서부터 색칠해 보아요.';
    else{
      const w=Math.floor(n/d), q=n%d;
      t=`색칠한 칸은 ${fr(1,d)}이 <b>${n}</b>개 → ${fr(n,d)}`;
      if(n<d) t+=` <b>(진분수)</b>`;
      else if(q===0) t+=` <b>(가분수)</b> = 자연수 <b>${w}</b>`;
      else t+=` <b>(가분수)</b> = ${mx(w,q,d)} <b>(대분수)</b>`;
    }
    mpEl.info.innerHTML=t; mpEl.hint.textContent='칸을 누르면 그 칸까지 색칠돼요. 마지막으로 칠한 칸을 다시 누르면 한 칸 지워져요.';
  } else {
    const {T,G,a}=MP, ok = T%G===0, m=ok?T/G:0;
    mpEl.stage.innerHTML = ok ? dotsHTML(T,m,a,true).replace(/class="grp/g,'data-g="" class="grp') : dotsHTML(T,1,0,false);
    if(ok){ mpEl.stage.querySelectorAll('.grp').forEach((g,i)=>g.dataset.g=i); }
    mpEl.ctl.innerHTML = mpStepper('전체 개수','T',2,48)+mpStepper('몇 묶음으로 나눌까','G',2,10)+'<div class="grp2"><button type="button" id="mpClear">🧽 지우기</button></div>';
    if(!ok) mpEl.info.innerHTML=`${T}개를 ${G}묶음으로 똑같이 나눌 수 없어요. 숫자를 바꿔 보아요.`;
    else if(a===0) mpEl.info.innerHTML=`${T}개를 ${G}묶음으로 나누면 한 묶음은 <b>${m}</b>개예요. 묶음을 눌러 색칠해 보아요.`;
    else mpEl.info.innerHTML=`한 묶음 ${m}개 · 색칠한 것은 ${a}묶음 → ${T}의 ${fr(a,G)} = ${a}×${m} = <b>${a*m}</b>`;
    mpEl.hint.textContent='묶음을 누르면 그 묶음까지 색칠돼요.';
  }
}
function mpOpen(){
  const m = P && P.manip;
  if(m){ if(m.t==='bar'){ MP.tab='bar'; MP.d=clamp(m.d,2,10); MP.W=clamp(m.W,1,5); MP.n=0; } else { MP.tab='dots'; MP.T=clamp(m.T,2,48); MP.G=clamp(m.G,2,10); MP.a=0; } }
  try{ document.activeElement && document.activeElement.blur(); }catch(e){}
  window.__btOpen=true; mpEl.ov.classList.add('on'); mpEl.ov.setAttribute('aria-hidden','false'); mpRender();
}
function mpClose(){ window.__btOpen=false; mpEl.ov.classList.remove('on'); mpEl.ov.setAttribute('aria-hidden','true'); if(P && !done && !inTest) focusStep(curStep); }
$('mpOpen').addEventListener('click', mpOpen);
$('mpClose').addEventListener('click', mpClose);
mpEl.ov.addEventListener('click', e=>{ if(e.target===mpEl.ov) mpClose(); });
document.querySelectorAll('.mp-tab').forEach(b=>b.addEventListener('click', ()=>{ MP.tab=b.dataset.tab; mpRender(); }));
mpEl.ctl.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='mpClear'){ MP.n=0; MP.a=0; mpRender(); return; }
  const k=b.dataset.k, dx=+b.dataset.dx; const lim={d:[2,10],W:[1,5],T:[2,48],G:[2,10]}[k];
  MP[k]=clamp(MP[k]+dx,lim[0],lim[1]); MP.n=Math.min(MP.n,MP.d*MP.W); MP.a=Math.min(MP.a,MP.G); mpRender();
});
mpEl.stage.addEventListener('click', e=>{
  const c=e.target.closest('.bc'); if(c){ const i=+c.dataset.i; MP.n = (i===MP.n-1) ? i : i+1; mpRender(); return; }
  const g=e.target.closest('.grp'); if(g && g.dataset.g!==undefined){ const j=+g.dataset.g; MP.a = (j===MP.a-1) ? j : j+1; mpRender(); }
});
window.__frac = {gens:GENS, get P(){return P;}};
})();
</script>

<style>
#npad{position:fixed;left:0;right:0;bottom:0;z-index:100000;display:none;background:#e8f1f8;border-top:2px solid #b9d3e6;box-shadow:0 -4px 14px rgba(40,70,100,.18);padding:6px 8px calc(6px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;touch-action:manipulation}

#npad button:active{transform:translateY(2px);box-shadow:none;background:#dcecf7}

@media (max-width:640px){#npad .npad-row{grid-template-columns:repeat(6,1fr)}#npad button{height:46px;font-size:24px}}

<div id="npad" aria-hidden="true"><div class="npad-row">
<button type="button" tabindex="-1" data-k="1">1</button><button type="button" tabindex="-1" data-k="2">2</button><button type="button" tabindex="-1" data-k="3">3</button><button type="button" tabindex="-1" data-k="4">4</button><button type="button" tabindex="-1" data-k="5">5</button><button type="button" tabindex="-1" data-k="6">6</button><button type="button" tabindex="-1" data-k="7">7</button><button type="button" tabindex="-1" data-k="8">8</button><button type="button" tabindex="-1" data-k="9">9</button><button type="button" tabindex="-1" data-k="0">0</button><button type="button" class="npad-fn" tabindex="-1" data-k="bs">⌫</button><button type="button" class="npad-ok" tabindex="-1" data-k="ok">↵</button>
</div></div>
<script>
/* 터치 기기 내장 숫자패드: OS 키보드가 화면을 가리지 않도록 함. ?pad=1 강제 켜기, ?pad=0 끄기 */
(function(){
  var q = location.search.match(/[?&]pad=(\d)/);
  var touchy = q ? q[1] === '1' : !!((window.matchMedia && (matchMedia('(any-pointer: coarse)').matches || matchMedia('(pointer: coarse)').matches)) || navigator.maxTouchPoints > 0 || ('ontouchstart' in window));
  if(!touchy) return;
  var pad = document.getElementById('npad'), last = null;
  var SEL = 'input.dcell, input[type=number], input[data-digit], input[data-carry]';
  function eligible(el){ return el && el.tagName === 'INPUT' && el.matches(SEL) && el.id !== 'btRepeatN'; }
  function arm(el){ el.setAttribute('inputmode','none'); el.readOnly = true; }   // OS 키보드가 뜨지 않게 함(값은 패드·실제 키보드로 입력)
  function mark(root){ (root.querySelectorAll ? root.querySelectorAll(SEL) : []).forEach(function(el){ if(eligible(el)) arm(el); }); }
  mark(document);
  new MutationObserver(function(ms){ ms.forEach(function(m){ m.addedNodes.forEach(function(n){ if(n.nodeType===1){ if(eligible(n)) arm(n); mark(n); } }); }); }).observe(document.body,{childList:true,subtree:true});
  function ui(){
    document.body.classList.toggle('tabletui', innerWidth >= 700);
    document.body.classList.toggle('landshort', innerWidth > innerHeight && innerHeight <= 520);
  }
  ui();
  function layout(){
    ui();
    var on = !!last && document.body.contains(last) && !window.__btOpen;
    document.body.classList.toggle('npad-on', on);
    var side = document.body.classList.contains('landshort');
    document.body.style.paddingBottom = (on && !side) ? (pad.offsetHeight + 12) + 'px' : '';
    document.body.style.paddingRight = (on && side) ? (pad.offsetWidth + 8) + 'px' : '';
  }
  function reveal(el){
    if(!el || !pad.offsetHeight) return;
    var side = document.body.classList.contains('landshort');
    var r = el.getBoundingClientRect(), limit = side ? innerHeight - 8 : innerHeight - pad.offsetHeight - 8;
    if(r.bottom > limit || r.top < 0){ try{ el.scrollIntoView({block:'center'}); }catch(e){} }
  }
  document.addEventListener('focusin', function(e){
    var t = e.target;
    if(eligible(t)){ last = t; layout(); setTimeout(function(){ reveal(t); }, 30); }
    else if(t && t.tagName === 'INPUT' && t.type === 'text'){ last = null; layout(); }
  });
  window.addEventListener('resize', layout);
  setInterval(layout, 500);
  function press(el, k){
    var v = el.value;
    if(k === 'bs'){ v = v.slice(0,-1); }
    else {
      var ml = parseInt(el.getAttribute('maxlength'),10);
      if(ml === 1) v = k;
      else if(!(ml > 0 && v.length >= ml)) v += k;
    }
    el.value = v;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    if(el.id === 'numInput') el.dispatchEvent(new Event('change',{bubbles:true}));
  }
  /* 실제 키보드(블루투스 등)를 쓰는 경우에도 숫자·지우기가 동작하도록 */
  document.addEventListener('keydown', function(e){
    var el = e.target;
    if(!eligible(el) || !el.readOnly || el.disabled || e.ctrlKey || e.metaKey || e.altKey) return;
    if(/^[0-9]$/.test(e.key)){ e.preventDefault(); press(el, e.key); }
    else if(e.key === 'Backspace'){ e.preventDefault(); press(el, 'bs'); }
  }, true);
  pad.addEventListener('mousedown', function(e){ e.preventDefault(); });
  pad.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var el = document.activeElement;
    if(!eligible(el)) el = last;
    if(!eligible(el) || !document.body.contains(el) || el.disabled) return;
    if(document.activeElement !== el) el.focus();
    var k = b.getAttribute('data-k');
    if(k === 'ok'){
      ['keydown','keyup'].forEach(function(t){ el.dispatchEvent(new KeyboardEvent(t,{key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true,cancelable:true})); });
      return;
    }
    press(el, k);
  });
})();
</script>
