<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2f6bd6">
<title>우리 반 교실 연결</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#1d2433;--sub:#5b6577;--line:#d5dce8;--main:#2f6bd6;--mainInk:#fff;--ann:#fff4d6;--annInk:#6b4a00;--me:#e8f0ff;--tc:#e6f4ea;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--card:#1b212b;--ink:#e8ecf3;--sub:#9aa5b8;--line:#2f3846;--main:#6c9bff;--mainInk:#0d1522;--ann:#3a3014;--annInk:#f0d68a;--me:#1f2c47;--tc:#1a2e23;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}
.sub{color:var(--sub);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;font-weight:700;margin:10px 0 4px}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:72px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--main);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--main);color:var(--mainInk)}
button.ghost{background:transparent;color:var(--main);border:2px solid var(--main);padding:8px 12px;font-size:16px}
button:disabled{opacity:.5;cursor:not-allowed}
button+button{margin-left:8px}
details{margin-top:14px}summary{cursor:pointer}
.hidden{display:none}
.err{color:var(--err);font-weight:700;min-height:1.5em}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#2e7d4f;margin-right:6px}
.dot.off{background:#b3261e}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.msg{border-radius:12px;padding:10px 12px;margin:8px 0;border:1px solid var(--line)}
.msg small{display:block;color:var(--sub);font-size:13px}
.msg.announce{background:var(--ann);color:var(--annInk)}
.msg.announce small{color:inherit;opacity:.8}
.msg.to_student{background:var(--tc)}
.msg.to_teacher{background:var(--me)}
.msg.new{outline:3px solid var(--main)}
label.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:16px}label.chk input{width:22px;height:22px;margin-top:4px;flex:none}
.msg p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="wrap">
  <section id="login" class="card">
    <h1>우리 반 교실 연결</h1>
    <p class="sub">선생님의 알림을 받고, 선생님께 짧은 말을 보낼 수 있어요.</p>
    <div id="gBox">
      <p><b>구글 계정으로 들어가요</b></p>
      <p><button id="gGo">🔑 구글로 들어가기</button></p>
      <p class="sub">학교 구글 계정이나 내 구글 계정으로 들어와요. 처음이면 선생님이 확인해 줘요.</p>
    </div>
    <details id="nameBox">
      <summary class="sub">구글로 안 될 때: 번호와 이름으로 들어가요</summary>
      <label for="num">번호</label><input id="num" type="number" inputmode="numeric" min="1" max="60" autocomplete="off">
      <label for="nm">이름</label><input id="nm" type="text" autocomplete="off" maxlength="20">
      <p><button id="start">들어가기</button></p>
    </details>
    <p id="loginErr" class="err" role="alert"></p>
  </section>

  <section id="request" class="card hidden">
    <h1>처음 오셨어요</h1>
    <p id="reqWho" class="sub"></p>
    <label for="reqNum">내 번호</label><input id="reqNum" type="number" inputmode="numeric" min="1" max="60" autocomplete="off">
    <label class="chk"><input type="checkbox" id="reqOk"> <span>내 구글 이메일과 이름을 선생님이 확인하는 데 쓰는 것에 동의해요. 이 정보는 선생님만 볼 수 있어요.</span></label>
    <p id="reqErr" class="err" role="alert"></p>
    <button id="reqGo">선생님께 확인 요청하기</button>
    <button class="ghost" id="reqBack">처음으로</button>
  </section>

  <section id="pending" class="card hidden">
    <h1>선생님 확인을 기다려요</h1>
    <p>선생님이 확인하면 이 계정으로 들어올 수 있어요.</p>
    <p id="pendErr" class="err" role="alert"></p>
    <button id="pendCheck">다시 확인하기</button>
    <button class="ghost" id="pendBack">처음으로</button>
  </section>

  <section id="app" class="hidden">
    <div class="bar"><h1 id="who"></h1><div><span id="conn" class="sub"></span> <button class="ghost" id="out">나가기</button></div></div>
    <div class="card">
      <b>선생님께 보내기</b>
      <div class="quick" id="quick"></div>
      <textarea id="body" maxlength="300" placeholder="선생님께 하고 싶은 말을 써요. (전화번호나 주소는 쓰지 않아요)"></textarea>
      <p id="sendErr" class="err" role="alert"></p>
      <button id="send">보내기</button>
    </div>
    <div class="card"><b>선생님 알림과 대화</b><div id="list"></div></div>
  </section>
</div>
<script>
const CONFIG={SUPABASE_URL:'https://erzdvlcbjneabxqwnwfy.supabase.co',FUNCTION_NAME:'school-tool',KEY:'sb_publishable_29w26VjvhHwI5O6iKOXTwA_sSTKUhfz',USE_GOOGLE:true};   // USE_GOOGLE: Supabase 의 구글 로그인을 켠 뒤 true 로. false 면 번호+이름 입장만 보여요.
const $=s=>document.querySelector(s);
let session=null,timer=null,lastCursor=null,first=true;
const store={get(k){try{return sessionStorage.getItem(k)}catch{return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch{}},del(k){try{sessionStorage.removeItem(k)}catch{}}};
async function freshAccess(){
  if(!session||!session.access)return null;
  if(Date.now()>session.exp-60000){
    const r=await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:CONFIG.KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.access_token)throw Object.assign(new Error('session_expired'),{status:401,code:'session_expired'});
    session={...session,access:j.access_token,refresh:j.refresh_token||session.refresh,exp:Date.now()+(j.expires_in||3600)*1000};
    store.set('st_s',JSON.stringify(session));
  }
  return session.access;
}
async function call(payload){
  const jwt=await freshAccess();
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
  try{
    const r=await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${CONFIG.FUNCTION_NAME}`,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({...(jwt?{jwt}:{number:session&&session.num,name:session&&session.name}),...payload})});
    let j={};try{j=await r.json()}catch{}
    if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{code:j.error,status:r.status});
    return j;
  }finally{clearTimeout(to)}
}
const kind={announce:'📢 선생님 알림',to_student:'💬 선생님이 보냄',to_teacher:'✉️ 내가 보냄'};
function fmt(iso){const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function render(msgs){
  const list=$('#list');list.replaceChildren();
  if(!msgs.length){const p=document.createElement('p');p.className='sub';p.textContent='아직 받은 글이 없어요.';list.append(p);return}
  const newest=msgs[0].created_at;
  msgs.forEach(m=>{
    const d=document.createElement('div');d.className='msg '+m.direction+((!first&&lastCursor&&m.created_at>lastCursor&&m.direction!=='to_teacher')?' new':'');
    const s=document.createElement('small');s.textContent=`${kind[m.direction]||''} · ${fmt(m.created_at)}`;
    const p=document.createElement('p');p.textContent=m.body;d.append(s,p);list.append(d);
  });
  lastCursor=newest;first=false;
}
async function tick(){
  if(!session)return;
  try{
    const r=await call({action:'ping',visible:!document.hidden});
    $('#conn').innerHTML='';const dot=document.createElement('span');dot.className='dot';$('#conn').append(dot,'연결됨');
    render(r.messages||[]);
  }catch(e){
    $('#conn').innerHTML='';const dot=document.createElement('span');dot.className='dot off';$('#conn').append(dot,'연결 안 됨');
    if(e.status===401){logout('다시 들어와 봐요.')}
  }
}
function start(){
  const nx=store.get('st_next');if(nx==='education.html'){store.del('st_next');location.href='../education.html';return}
  show('app');
  $('#who').textContent=`${session.num}번`;first=true;lastCursor=null;
  tick();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)tick()},10000);
}
function show(id){['login','request','pending','app'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
function logout(msg){clearInterval(timer);if(session&&session.access){fetch(`${CONFIG.SUPABASE_URL}/auth/v1/logout?scope=local`,{method:'POST',headers:{apikey:CONFIG.KEY,Authorization:'Bearer '+session.access}}).catch(()=>{})}session=null;store.del('st_s');show('login');$('#loginErr').textContent=msg||''}
async function login(num,name){
  $('#loginErr').textContent='';
  if(!(num>=1&&num<=60)){$('#loginErr').textContent='번호를 써 봐요.';return}
  if(!name){$('#loginErr').textContent='이름을 써 봐요.';return}
  $('#start').disabled=true;
  try{session={num,name};const r=await call({action:'hello'});session={num:r.number||num,name};store.set('st_s',JSON.stringify(session));start()}
  catch(e){session=null;$('#loginErr').textContent=e.status===401?'번호와 이름이 명단과 맞지 않아요. 다시 써 봐요.':e.status===429?'잠시 뒤에 다시 해 봐요.':'연결이 안 돼요. 잠시 뒤에 다시 해 봐요.'}
  finally{$('#start').disabled=false}
}
$('#start').onclick=()=>login(parseInt($('#num').value,10),$('#nm').value.trim());
$('#nm').addEventListener('keydown',e=>{if(e.key==='Enter')$('#start').click()});
$('#out').onclick=()=>logout('');
['도와주세요','화장실 다녀올게요','다 했어요','질문 있어요'].forEach(t=>{const b=document.createElement('button');b.className='ghost';b.textContent=t;b.onclick=()=>{$('#body').value=t;$('#body').focus()};$('#quick').append(b)});
$('#send').onclick=async()=>{
  const t=$('#body').value.trim(),e=$('#sendErr');e.textContent='';
  if(!t){e.textContent='보낼 말을 써 봐요.';return}
  if(/\d{2,4}[-\s]?\d{3,4}[-\s]?\d{4}/.test(t)||/@/.test(t)){e.textContent='전화번호나 이메일은 쓰지 않아요.';return}
  $('#send').disabled=true;
  try{await call({action:'send',body:t});$('#body').value='';await tick()}
  catch(x){e.textContent=x.code==='too_many_messages'?'너무 많이 보냈어요. 잠시 뒤에 해 봐요.':'보내지 못했어요. 다시 해 봐요.'}
  finally{$('#send').disabled=false}
};

/* ===== 구글 로그인(Supabase Auth): 구글로 이동 -> 돌아오면 토큰 저장 -> (처음이면) 번호 신청 -> 교사 승인 ===== */
function errText(e){return e.code==='bad_login'?'구글 확인에 실패했어요. 다시 해 봐요.':e.code==='login_required'?'구글 계정으로 들어와야 해요.':e.status===429?'잠시 뒤에 다시 해 봐요.':'연결이 안 돼요. 잠시 뒤에 다시 해 봐요.'}
function goGoogle(){
  const back=location.origin+location.pathname;
  location.href=`${CONFIG.SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(back)}&prompt=select_account`;
}
async function afterLogin(){
  // 로그인한 구글 계정의 상태를 서버에 물어본다
  try{
    const r=await call({action:'account'});
    if(r.approved){session={...session,num:r.number};store.set('st_s',JSON.stringify(session));start()}
    else if(r.pending){show('pending');$('#pendErr').textContent=''}
    else if(r.need_request){$('#reqWho').textContent=r.name?`${r.name} 님, 내 번호를 알려 줘요.`:'내 번호를 알려 줘요.';$('#reqNum').value='';$('#reqOk').checked=false;$('#reqErr').textContent='';show('request')}
  }catch(e){session=null;store.del('st_s');show('login');$('#loginErr').textContent=errText(e)}
}
$('#reqGo').onclick=async()=>{
  const n=parseInt($('#reqNum').value,10),e=$('#reqErr');e.textContent='';
  if(!(n>=1&&n<=60)){e.textContent='번호를 써 봐요.';return}
  if(!$('#reqOk').checked){e.textContent='동의에 체크해 줘요.';return}
  $('#reqGo').disabled=true;
  try{await call({action:'request',number:n,consent:true});show('pending');$('#pendErr').textContent=''}
  catch(x){e.textContent=x.code==='no_student'?'그 번호는 명단에 없어요.':errText(x)}
  finally{$('#reqGo').disabled=false}
};
$('#reqBack').onclick=$('#pendBack').onclick=()=>logout('');
$('#pendCheck').onclick=async()=>{
  $('#pendErr').textContent='';await afterLogin();
  if(!$('#pending').classList.contains('hidden'))$('#pendErr').textContent='아직 확인 중이에요. 조금 뒤에 다시 눌러 봐요.';
};
$('#gGo').onclick=goGoogle;
function initGoogle(){
  if(!CONFIG.USE_GOOGLE){$('#gBox').classList.add('hidden');$('#nameBox').open=true;return}
  // 구글에서 돌아온 주소(#access_token=...)를 읽는다
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  if(h.get('access_token')){
    session={access:h.get('access_token'),refresh:h.get('refresh_token'),exp:Date.now()+Number(h.get('expires_in')||3600)*1000};
    store.set('st_s',JSON.stringify(session));history.replaceState(null,'',location.pathname+location.search);
  }else if(h.get('error')){
    $('#loginErr').textContent='구글 로그인이 취소되었거나 실패했어요.';history.replaceState(null,'',location.pathname+location.search);
  }
}
initGoogle();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
try{const s=JSON.parse(store.get('st_s')||'null');if(s&&s.access){session=s;(s.num?start():afterLogin())}else if(s&&s.num&&s.name){session=s;start()}}catch{}
</script>
</body>
</html>
