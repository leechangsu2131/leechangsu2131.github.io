<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>그림책 제작 코치 — 우리 반 그림책 작가 되기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff7e6; --paper2:#fffdf6; --ink:#4a3b2a; --ink2:#7a6650; --line:#e6d3ae;
  --c1:#f2a93b; --c2:#e86f6f; --c3:#5aa9e6; --c4:#8bc34a; --c5:#a77bd6; --c6:#f08a4b; --c7:#2fb5a0;
  --accent:#e8890c; --ok:#4c9a3d; --warn:#c0392b;
  --r:22px 18px 24px 16px / 18px 24px 16px 22px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.65;font-size:17px;
  background-image:radial-gradient(#f3e3c0 1.2px,transparent 1.2px);background-size:22px 22px}
h1,h2,h3{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;margin:0;line-height:1.3}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.topbar .brand{font-family:'Jua';font-size:18px;color:var(--ink2)}
.tbtn{border:2px dashed var(--line);background:var(--paper2);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink2)}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.banner{position:relative;border-radius:var(--r);overflow:hidden;margin:4px 0 18px;box-shadow:0 6px 0 #ecd9b0,0 10px 18px rgba(120,90,40,.15)}
.banner img{display:block;width:100%;height:auto}
.banner .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12%}
.banner h1{font-size:clamp(22px,5.2vw,44px);color:#6b4a1d;text-shadow:0 2px 0 #fff8}
.banner p{margin:2px 0 0;font-family:'Gowun Batang',serif;font-size:clamp(13px,2.4vw,19px);color:#7a5a2c}
.notice{background:#fff3c4;border:2px dashed #e7c25b;border-radius:var(--r);padding:10px 16px;margin:0 0 16px;font-size:15px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 20px}
.rule{background:var(--paper2);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:15px;box-shadow:0 3px 0 #ecd9b0}
.rule b{font-family:'Jua';font-size:18px;display:block;color:var(--accent);font-weight:400}
h2.sec{font-size:24px;margin:10px 0 12px}
h2.sec small{font-family:'Noto Sans KR';font-size:14px;color:var(--ink2);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{--c:var(--c1);position:relative;text-align:left;background:var(--paper2);border:3px solid var(--c);border-radius:var(--r);padding:14px 14px 14px;box-shadow:4px 5px 0 color-mix(in srgb,var(--c) 40%,#fff);transition:transform .15s}
.card:nth-child(odd){transform:rotate(-.6deg)}.card:nth-child(even){transform:rotate(.5deg)}
.card:hover,.card:focus-visible{transform:rotate(0) translateY(-3px);outline:none}
.card .no{position:absolute;top:-12px;left:-8px;background:var(--c);color:#fff;font-family:'Jua';width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;border:3px solid var(--paper2)}
.card img{display:block;width:84px;height:84px;object-fit:contain;margin:0 auto 6px}
.card h3{font-size:18px;text-align:center;color:var(--ink)}
.card .sub{display:block;text-align:center;font-size:13px;color:var(--ink2);margin-top:2px}
.card .tag{display:block;text-align:center;margin-top:8px;font-size:12.5px}
.tag i{font-style:normal;display:inline-block;padding:1px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,#fff);border:1.5px solid var(--c)}
/* session page */
.back{background:none;border:none;color:var(--ink2);font-size:15px;padding:4px 0;margin-bottom:4px}
.book{--c:var(--c1);background:var(--paper2);border:3px solid var(--c);border-radius:var(--r);padding:20px 20px 24px;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,#fff),0 12px 22px rgba(120,90,40,.12);position:relative}
.book .head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.book .head img{width:96px;height:96px;object-fit:contain}
.book .head .chip{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:1px 14px;font-family:'Jua';font-size:15px}
.book h2{font-size:clamp(24px,5vw,32px);margin-top:4px}
.book .goal{font-family:'Gowun Batang',serif;font-size:18px;color:var(--ink2);margin:0}
.step1{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--c) 14%,#fff);border:2px dashed var(--c);border-radius:var(--r);padding:12px 16px;margin:14px 0}
.step1 .big{font-family:'Jua';font-size:20px}
.pbtn{display:inline-block;text-decoration:none;background:var(--c);color:#fff;border-radius:999px;padding:7px 16px;font-size:15px;border:none;font-weight:500}
.pbtn.alt{background:var(--paper2);color:var(--ink);border:2px solid var(--c)}
.parts{display:grid;gap:12px;margin-top:8px}
.part{background:#fff;border:2px solid var(--line);border-radius:var(--r);overflow:hidden}
.part>button.ph{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:none;padding:12px 14px}
.part .dot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-family:'Jua';display:grid;place-items:center}
.part .pt{flex:1}.part .pt b{font-family:'Jua';font-weight:400;font-size:19px;display:block}
.part .pt span{font-size:14px;color:var(--ink2)}
.part .arrow{transition:transform .2s;color:var(--ink2)}
.part.open .arrow{transform:rotate(90deg)}
.pb{display:none;padding:2px 16px 16px}
.part.open .pb{display:block}
.hl{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.hbtn{border:2px solid var(--c);background:var(--paper2);border-radius:999px;padding:5px 14px;font-size:15px}
.hbtn[aria-pressed=true]{background:var(--c);color:#fff}
.hbtn.ask{border-color:var(--c5);background:#f4ecfc}
.bubble{display:none;position:relative;background:#fffbe3;border:2.5px solid #e9c964;border-radius:20px 24px 22px 8px;padding:12px 16px;margin:6px 0 8px;font-family:'Gowun Batang',serif;font-size:18px}
.bubble.show{display:block}
.bubble em{font-style:normal;background:linear-gradient(transparent 60%,#ffe08a 60%)}
.bubble ul{margin:6px 0 0;padding-left:20px}
.coach{display:flex;gap:14px;align-items:center;background:#f4ecfc;border:2.5px solid var(--c5);border-radius:var(--r);padding:14px 16px;margin-top:20px;flex-wrap:wrap}
.coach img{width:84px;height:84px;object-fit:contain}
.coach .tx{flex:1;min-width:200px}
.coach .tx b{font-family:'Jua';font-weight:400;font-size:20px;display:block}
.coach .mode{font-size:14px;color:#6b4b94}
.askbtn{background:var(--c5);color:#fff;border:none;border-radius:999px;padding:10px 20px;font-size:17px;font-family:'Jua'}
.askbtn:hover{filter:brightness(1.06)}
.pn{display:flex;justify-content:space-between;margin-top:18px;gap:8px}
/* modal */
.modal{position:fixed;inset:0;background:#4a3b2a99;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.show{display:flex}
.mbox{background:var(--paper2);border:3px solid var(--c5);border-radius:var(--r);padding:18px 18px 16px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.mbox h3{font-size:22px;margin-bottom:6px}
.mbox textarea,.mbox input[type=text],.mbox input[type=password],.mbox select{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.mbox textarea{min-height:84px;resize:vertical}
.mbox .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.warn{font-size:14px;color:var(--warn)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#4a3b2a;color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:99;font-size:15px;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
/* teacher */
.tcard{background:var(--paper2);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 16px}
.tcard h3{font-size:21px;margin-bottom:6px}
.tcard table{width:100%;border-collapse:collapse;font-size:15px}
.tcard th,.tcard td{border-bottom:1px dashed var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.tcard select,.tcard input[type=text]{font:inherit;font-size:15px;padding:5px 8px;border:2px solid var(--line);border-radius:10px;background:#fff;max-width:100%;width:100%}
.tcard select{width:auto}
pre.copy{white-space:pre-wrap;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:14px;max-height:260px;overflow:auto;font-family:'Noto Sans KR',monospace}
.bar{height:12px;border-radius:6px;background:var(--c2);display:inline-block;vertical-align:middle}
.small{font-size:13.5px;color:var(--ink2)}
.foot{margin-top:30px;padding-top:14px;border-top:3px dotted var(--line);font-size:13px;color:var(--ink2);text-align:center}
.foot img{width:70px;display:block;margin:0 auto 4px}
@media(max-width:640px){
  .banner p{display:none}.banner h1{font-size:22px}.rule{padding:8px 12px}.rule b{display:inline;margin-right:6px}
  body{font-size:16px}.rules{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:14px 10px}
  .card img{width:64px;height:64px}.card h3{font-size:16px}.book{padding:16px 14px 20px}.banner .t{padding:0 6%}
  .book .head img{width:72px;height:72px}
}
@media print{.topbar,.coach,.pn,.back,.hl,.toast{display:none!important}.part .pb{display:block}body{background:#fff}}
</style>
</head>

 ["이 장면에서 ____한 마음이 들었어요","문장 틀 두 번째 칸 · 기분 ○표","기분 ○표 목록을 천천히 읽고, 가장 가까운 것에 ○를 해요. 두 개를 골라도 괜찮아요.","<em>이렇게 말해 봐요</em><ul><li>콩콩 뛰었어요 / 따뜻했어요</li><li>쓸쓸했어요 / 궁금했어요</li><li>조금 무서웠어요</li></ul>"],
 ["짝에게 말하기","나눔 칸","짝에게 책을 보여 주고 ‘여기가 마음에 남았어. 왜냐하면…’ 하고 한 문장만 말해 봐요.","‘왜냐하면’이 어렵다면 ‘이 장면이 ○○ 같아서’ 라고 말해도 돼요."]]},
{n:2,t:"장면을 말과 그림으로 표현하기",c:1,ic:"i1",g:1,pdf:"02_한줄시와그림.pdf",sheet:"한 줄 시와 그림",goal:"내 장면을 한 줄 시와 그림으로 나타내요.",
 parts:[
 ["느낌 낱말 고르기","낱말 목록","목록을 읽다가 내 마음에 ‘딱’ 맞는 낱말에 동그라미를 쳐요. 하나만 골라도 괜찮아요.","맞는 낱말이 없으면 비슷한 낱말을 내가 만들어 적어도 돼요."],
 ["한 줄 시 쓰기","한 줄 시 칸 (선생님 시범과 함께)","시는 길지 않아도 돼요. 고른 낱말 하나 + 장면에 있는 물건 하나를 이어 봐요.","<em>예</em> ‘쓸쓸한 의자’ ‘콩콩 뛰는 풍선’<br>선생님 시범을 떠올려 보세요."],
 ["그림으로 나타내기","그림 칸","잘 그리지 않아도 돼요. 가장 마음이 멈춘 한 가지만 크게 그려요.","점과 선, 낙서 선만 써도 괜찮아요. 실수는 새로운 시작이에요."]]},
{n:3,t:"은유거울 — 내 마음을 빗대어 보기",c:2,ic:"i2",g:2,pdf:"03_은유거울.pdf",sheet:"은유거울 (컬러 인쇄)",goal:"내 마음을 물건·동물·날씨·색·숫자에 빗대어 말해요.",
 parts:[
 ["물건에 빗대기","물건 칸","오늘 내 마음과 닮은 물건이 있나요? 교실 안에서 하나 찾아봐요. 닮은 점이 한 가지만 있어도 돼요.","<em>예</em> ‘오늘 내 마음은 풍선 같아요. 가벼워서요.’"],
 ["동물에 빗대기","동물 칸","오늘의 나를 동물로 말하면? 움직임을 떠올려 봐요. 천천히? 폴짝? 웅크려서?","<em>예</em> ‘나는 달팽이예요. 천천히 가고 싶어서요.’"],
 ["날씨에 빗대기","날씨 칸","맑음·비·바람·구름 중 오늘 마음과 가까운 것을 골라요. 이유를 ‘왜냐하면’으로 써요.","<em>예</em> ‘흐림이에요. 조금 가라앉아 있어요.’"],
 ["색·숫자 카드","색 카드 · 숫자 카드","마음이 떠오르는 색 카드를 하나 골라요. 숫자는 ‘마음의 크기’로 생각해 봐요. (0은 아주 조용, 10은 아주 커요.)","정답이 없어요. 고른 이유를 한마디만 말해도 충분해요."]]},
{n:4,t:"마음에 이름 붙이기 — 내 걱정 캐릭터",c:2,ic:"worry",g:2,pdf:"04_마음친구카드.pdf",sheet:"마음 친구 카드",goal:"걱정이나 장점에 이름과 모습을 주어 ‘마음 친구’로 만나요.",
 parts:[
 ["이름 짓기","이름 칸","걱정이나 장점이 하나의 친구라면 어떤 이름이 어울릴까요? 소리나 모양을 떠올려 봐요.","<em>예</em> ‘콩닥이’ ‘먹구름이’ ‘용기별’"],
 ["모습 그리기","모습 칸","이 친구는 크기·색·표정이 어때요? 눈과 입만 먼저 그려 봐요.","동그라미 하나에서 시작해도 괜찮아요."],
 ["언제 커져요 / 언제 작아져요","두 가지 칸","언제 마음이 커졌는지 오늘 있었던 일을 떠올려 봐요. 작아졌던 때도 한 번 생각해 봐요.","<em>예</em> ‘발표 전에 커져요.’ ‘친구가 웃어 주면 작아져요.’"],
 ["잘 지내는 방법","방법 칸","이 친구가 너무 커졌을 때 내가 해 볼 수 있는 일은 뭘까요? 작은 일도 좋아요.","<em>예</em> ‘숨을 세 번 쉬어요.’ ‘친구에게 말해요.’"]]},
{n:5,t:"「우리 반 마음 사용설명서」① 내 쪽 만들기",c:2,ic:"sad",g:2,pdf:"05_마음사용설명서쪽.pdf",sheet:"마음 사용설명서 쪽",goal:"슬픔·화·걱정 중 하나를 골라 내 쪽을 써요.",
 parts:[
 ["마음 고르기 (슬픔·화·걱정)","고르는 칸","요즘 가장 자주 만나는 마음은 어떤 마음인가요? 하나만 골라요. 다른 친구와 같아도 괜찮아요.","셋 중에 모르겠다면 ‘언제 가장 많이 느꼈지?’ 하고 떠올려 봐요."],
 ["문장 틀 채우기","설명서 문장 틀","문장 틀을 위에서부터 한 줄씩 읽고 빈칸만 채워요. 길게 쓰지 않아도 돼요.","생각이 안 나면 이렇게 시작해 봐요: ‘이 마음이 올 때 나는 ___ 해요.’"],
 ["그림 그리기","그림 칸","이 마음을 색이나 모양으로 그려 봐요. 얼굴이 없어도 괜찮아요.","어두운 색도 괜찮아요. 솔직한 마음이면 충분해요."]]},
{n:6,t:"「우리 반 마음 사용설명서」② 책으로 묶기",c:2,ic:"i9",g:2,pdf:"06_미니북접는법.pdf",sheet:"미니북 접는 법",goal:"쪽을 순서대로 묶고 미니북 접는 법을 익혀요.",
 parts:[
 ["미니북 접는 법 1~4단계","접는 법 그림 (네 단계)","종이를 반으로 접어서 펼치기를 세 번 반복하면 8칸이 돼요. 단계 그림을 손가락으로 따라가며 한 단계씩 해요.","두 번째 단계에서 가운데 선만 칸 두 개 길이로 잘라요. 가위질은 선생님과 함께 확인해요."],
 ["쪽 순서 정하기","쪽 번호","내 쪽을 어디에 넣을지 친구들과 이야기해요. 처음에는 밝은 마음, 끝에는 편안한 마음처럼 흐름을 생각해 봐요.","정답은 없어요. 모두가 ‘괜찮다’고 하는 순서면 돼요."]]},
{n:7,t:"여섯 칸 이야기 — 내 이야기의 뼈대",c:3,ic:"i5",g:3,pdf:"07_여섯칸이야기.pdf",sheet:"이야기의 여섯 칸",goal:"여섯 칸에 주인공부터 끝까지 순서대로 채워요.",coach:true,
 parts:[
 ["① 주인공","첫째 칸","누구 이야기인가요? 사람, 동물, 물건, 마음 친구도 돼요. 좋아하는 것에서 골라도 괜찮아요.","<em>예</em> 작은 달팽이 / 겁 많은 토끼 / 4차시 마음 친구"],
 ["② 하고 싶은 일","둘째 칸","주인공은 무엇을 하고 싶거나 해내야 해요? 한 줄이면 충분해요.","<em>예</em> ‘언덕 위 깃발까지 가고 싶어요.’"],
 ["③ 방해하는 것","셋째 칸","그 일을 어렵게 만드는 건 뭘까요? 사람이 아니어도 돼요. 비, 큰 돌, 걱정도 좋아요.","<em>예</em> ‘돌이 길을 막아요.’ ‘비가 와요.’"],
 ["④ 도와주는 것","넷째 칸","누가, 무엇이 도와줄까요? 도움을 주는 건 친구일 수도, 작은 도구일 수도 있어요.","<em>예</em> ‘개미들이 돌을 함께 밀어 줘요.’"],
 ["⑤ 해결하는 과정","다섯째 칸","어떻게 해결할까요? ‘먼저, 그다음’으로 두 가지만 생각해 봐요.","<em>예</em> ‘먼저 돌을 옮기고, 그다음 천천히 올라가요.’"],
 ["⑥ 끝","여섯째 칸","이야기는 어떻게 끝나요? 꼭 행복하지 않아도 돼요. 주인공 마음은 처음과 어떻게 달라졌나요?","‘달라진 마음’ 한 가지만 써도 끝이 돼요."]]},
{n:8,t:"이야기 모양 고르기 + 한 줄 소개",c:4,ic:"i6",g:4,pdf:"08_이야기모양카드.pdf",pdf2:"08_이야기구상카드.pdf",sheet:"이야기 모양 카드 · 이야기 구상 카드",goal:"수수께끼 또는 바꾸어 쓰기 중 내 이야기 모양을 골라요.",coach:true,
 parts:[
 ["이야기 모양 고르기","모양 카드 (수수께끼 / 바꾸어 쓰기)","<b>수수께끼</b>는 독자에게 ‘이게 뭘까?’ 하고 물어요. <b>바꾸어 쓰기</b>는 아는 이야기의 한 부분을 바꿔요. 내 여섯 칸에 더 잘 맞는 것은?","<em>예</em> 비밀을 숨겨 두고 싶다면 → 수수께끼. 내가 아는 이야기를 다르게 만들고 싶다면 → 바꾸어 쓰기."],
 ["이야기 구상 카드","구상 카드","여섯 칸에서 쓴 내용을 구상 카드에 옮겨 적어요. 바꾸고 싶은 곳이 생기면 고쳐도 돼요.","여섯 칸을 보면서 ‘이 칸은 책의 몇 쪽일까?’ 하고 번호만 붙여 봐요."],
 ["한 줄 소개","한 줄 소개 칸","친구에게 이 책을 한 줄로 알려 준다면? ‘ㅇㅇ가 ~하는 이야기’로 시작해 봐요.","<em>예</em> ‘작은 달팽이가 언덕 깃발에 도전하는 이야기’"]]},
{n:9,t:"계획 그림(스토리보드) 그리기",c:5,ic:"i7",g:5,pdf:"09_미니북계획그림.pdf",sheet:"미니북 계획 그림",goal:"여섯 쪽을 작은 칸에 먼저 그려 보며 책의 흐름을 봐요.",coach:true,
 parts:[
 ["처음·가운데·끝 나누기","큰 흐름","여섯 쪽 중 처음 2쪽, 가운데 2쪽, 끝 2쪽으로 나눠 봐요. 어떤 장면이 어디에 들어갈까요?","여섯 칸의 ①②는 처음, ③④는 가운데, ⑤⑥은 끝으로 보면 쉬워요."],
 ["작은 칸 그리기","계획 그림 칸","칸마다 사람은 동그라미와 막대, 물건은 네모 정도로 간단하게 그려요. 위치만 정해도 돼요.","못 그려도 괜찮아요. 계획 그림은 ‘나만 알아보면’ 돼요."],
 ["바꿔도 돼요","수정","그리다가 마음이 바뀌었나요? 지우개나 새 종이를 써도 좋아요. 바꾸는 것은 더 좋은 책이 되는 길이에요.","바뀐 장면에 ★을 붙여 놓으면 나중에 찾기 쉬워요."]]},
{n:10,t:"그림 그리기 — 내 그림책 장면 만들기",c:6,ic:"i8",g:6,pdf:"10_재료실험기록.pdf",sheet:"재료 실험 기록",goal:"어울리는 재료로 장면을 만들고 기록해요.",coach:true,
 parts:[
 ["재료 고르기","고르는 칸","내 이야기 마음에 어울리는 재료는? 부드러운 마음은 색연필, 힘찬 마음은 크레용처럼 생각해 봐요.","두 가지를 가볍게 시험해 보고 더 마음에 드는 것을 골라도 돼요."],
 ["좁히기","제한 칸","활동지에서 ‘좁히기’ 제한 중 하나를 골라 해 봐요. 선택지가 줄면 오히려 쉬워져요.","예를 들어 ‘선만 쓰기’처럼 해 보면 어떤 장면이 되는지 놀라울 거예요."],
 ["실수 약속","약속 칸","그림이 마음에 안 들 때는 어떻게 할지 미리 정해요. 실수는 새로운 시작이에요.","<em>예</em> ‘실수한 곳 위에 꽃을 그려요.’"]]},
{n:11,t:"그림책 완성 — 작가의 말과 표지",c:7,ic:"i9",g:7,pdf:"11_작가의말과표지.pdf",sheet:"내 책 완성하기",goal:"제목, 작가의 말, 추천의 말을 써서 책을 마무리해요.",coach:true,
 parts:[
 ["책 제목","제목 칸","책의 가장 중요한 낱말 하나를 골라요. 주인공 이름이나 ‘~하는 날’ 도 좋아요.","한 줄 소개에서 가장 마음에 드는 낱말을 뽑아 봐요."],
 ["작가의 말 (문장 틀)","작가의 말 문장 틀","문장 틀의 빈칸에 ‘왜 이 책을 만들었는지’를 써요. 길게 쓰지 않아도 괜찮아요.","<em>예</em> ‘이 책을 만든 까닭은 ○○ 때문이에요.’ 12차시 작가 잔치에서 말할 연습이 돼요."],
 ["추천의 말","추천 칸","읽는 친구에게 한마디 해 본다면? ‘이 책은 ~한 친구에게 좋아요.’","<em>예</em> ‘천천히 가는 친구에게 추천해요.’"]]},
{n:12,t:"읽고 나누기 — 작가 잔치",c:7,ic:"praise",g:7,pdf:"12_작가잔치.pdf",sheet:"작가 인터뷰와 한 줄 시",goal:"친구 책을 읽고 작가 인터뷰와 한 줄 시로 나눠요.",
 parts:[
 ["작가 인터뷰","인터뷰 칸","친구에게 하고 싶은 질문을 하나 정해요. ‘이 장면은 왜 그렸어요?’ ‘가장 어려운 부분은요?’ 같은 질문이 좋아요.","질문은 ‘좋았던 점 + 궁금한 점’ 한 가지씩이면 충분해요."],
 ["친구 책 한 줄 시","한 줄 시 칸","2차시처럼 해요. 친구 책에서 마음에 남은 낱말 하나를 골라 한 줄로 써요.","<em>예</em> ‘달팽이의 느린 용기’"]]}
];
const MODES={direct:"학생 직접 사용",side:"선생님 곁에서 사용",off:"힌트만 (코치 쉬기)"};
const DEFMODES={1:"off",2:"off",3:"off",4:"off",5:"off",6:"off",7:"off",8:"off",9:"off",10:"off",11:"off",12:"off"};

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const SB="https://erzdvlcbjneabxqwnwfy.supabase.co",SK="sb_publishable_29w26VjvhHwI5O6iKOXTwA_sSTKUhfz";
let CFG={gem:GEM_DEFAULT,modes:{...DEFMODES},note:""};
function applyCfg(c){
  if(!c||typeof c!=='object')return false;
  const before=JSON.stringify(CFG);
  CFG.gem=/^https:\/\/gemini\.google\.com\//.test(c.gem||'')?c.gem:GEM_DEFAULT;
  CFG.modes={...DEFMODES,...(c.modes||{})};
  CFG.note=String(c.note||'').slice(0,120);
  return before!==JSON.stringify(CFG);
}
async function rpc(name,args){
  const r=await fetch(SB+"/rest/v1/rpc/"+name,{method:"POST",headers:{apikey:SK,Authorization:"Bearer "+SK,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  if(!r.ok)throw new Error(r.status);
  const t=await r.text();return t?JSON.parse(t):null;
}
async function refreshCfg(){
  try{const c=await rpc("picture_book_coach_get");if(c){store.set('pb-cfg',JSON.stringify(c));return applyCfg(c)}}catch(e){}
  return false;
}
function logStuck(n,part,kind){rpc("picture_book_coach_log_add",{p_session:n,p_part:part,p_kind:kind}).catch(()=>{})}

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
async function copy(text){try{await navigator.clipboard.writeText(text);return true}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}
const COLORS=['','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)'];
const plain=h=>h.replace(/<br\s*\/?>/g,' ').replace(/<\/li>/g,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();

/* ---------- 홈 ---------- */
function home(){
  window.scrollTo(0,0);
  $('#app').innerHTML=`
  <div class="banner"><img src="${IMG.banner}" alt=""><div class="t"><h1>그림책 제작 코치</h1><p>종이에 먼저 쓰고, 막히면 힌트를 열어 봐요</p></div></div>
  ${CFG.note?`<div class="notice" id="note"></div>`:''}
  <div class="rules">
   <div class="rule"><b>① 종이에 먼저</b>활동지에 내 생각을 먼저 써요. 틀려도 괜찮아요.</div>
   <div class="rule"><b>② 막히면 힌트</b>막힌 칸을 눌러 작은 힌트부터 열어 봐요.</div>
   <div class="rule"><b>③ 그래도 막히면 코치</b>그림책 코치에게 물어요. 코치는 질문으로 도와줘요.</div>
  </div>
  <h2 class="sec">우리 반 12차시 <small>오늘 차시를 눌러요</small></h2>
  <div class="grid">${S.map(s=>`<button class="card" style="--c:${COLORS[s.c]}" data-n="${s.n}"><span class="no">${s.n}</span><img src="${IMG[s.ic]}" alt=""><h3>${esc(s.t.split(' — ')[0])}</h3><span class="sub">${esc(s.sheet)}</span><span class="tag"><i>${GSTEP[s.g]}</i></span></button>`).join('')}</div>`;
  if(CFG.note)$('#note').textContent='📢 '+CFG.note;
  document.querySelectorAll('.card').forEach(b=>b.onclick=()=>session(+b.dataset.n));
}

/* ---------- 차시 ---------- */
function session(n){
  refreshCfg().then(ch=>{if(ch&&document.querySelector('.book')&&!document.querySelector('.part.open'))session(n)});
  const s=S[n-1],mode=CFG.modes[n]||'off',c=COLORS[s.c];
  window.scrollTo(0,0);
  const coachBox=mode==='off'?`<div class="coach"><img src="${IMG.think}" alt=""><div class="tx"><b>이번 차시는 힌트로 해 봐요</b><span class="mode">힌트를 봐도 어려우면 손을 들어 선생님께 말해요.</span></div></div>`
  :`<div class="coach"><img src="${IMG.base}" alt=""><div class="tx"><b>그림책 코치에게 물어볼까요?</b><span class="mode">${mode==='side'?'🧑‍🏫 선생님 곁에서 같이 해요. 선생님께 먼저 말해요.':'💬 막혔을 때만 직접 물어볼 수 있어요.'}<br>코치는 대신 써 주지 않아요. 질문으로 도와줘요.</span></div><button class="askbtn" id="askGen">🤖 코치에게 물어보기</button></div>`;
  $('#app').innerHTML=`
  <button class="back" id="bk">← 12차시 목록</button>
  <div class="book" style="--c:${c}">
   <div class="head"><img src="${IMG[s.ic]}" alt=""><div><span class="chip">${s.n}차시 · ${GSTEP[s.g]}</span><h2>${esc(s.t)}</h2><p class="goal">${esc(s.goal)}</p></div></div>
   <div class="step1"><span class="big">✏️ 먼저 종이 활동지에 써요</span>
     <a class="pbtn" href="${PDF}#page=${PG[s.n]}" target="_blank" rel="noopener">📄 ${esc(s.sheet)} 보기</a>${s.pdf2?`<a class="pbtn alt" href="${PDF}#page=10" target="_blank" rel="noopener">📄 이야기 모양 카드</a>`:''}</div>
   <h3 style="font-size:21px;margin:14px 0 4px">어디가 막혔어요? <span class="small" style="font-family:'Noto Sans KR'">칸을 눌러 힌트를 열어요</span></h3>
   <div class="parts">${s.parts.map((p,i)=>`
    <div class="part" data-i="${i}"><button class="ph" aria-expanded="false"><span class="dot">${i+1}</span><span class="pt"><b>${p[0]}</b><span>${esc(p[1])}</span></span><span class="arrow">▶</span></button>
     <div class="pb">
      <div class="hl"><button class="hbtn" data-h="1" aria-pressed="false">💡 힌트 1</button><button class="hbtn" data-h="2" aria-pressed="false">🌱 예시 보기</button>${mode!=='off'?`<button class="hbtn ask" data-h="3">🤖 그래도 막혀요</button>`:`<button class="hbtn ask" data-h="4">✋ 그래도 막혀요</button>`}</div>
      <div class="bubble" data-b="1">${p[2]}</div><div class="bubble" data-b="2">${p[3]}</div>
      <div class="bubble" data-b="4">손을 들고 선생님께 ‘이 칸이 막혔어요’ 하고 말해요.</div>
     </div></div>`).join('')}</div>
   ${coachBox}
   <div class="pn"><button class="tbtn" id="pv" ${n===1?'disabled style="opacity:.4"':''}>← 이전 차시</button><button class="tbtn" id="nx" ${n===12?'disabled style="opacity:.4"':''}>다음 차시 →</button></div>
  </div>`;
  $('#bk').onclick=home;$('#pv').onclick=()=>n>1&&session(n-1);$('#nx').onclick=()=>n<12&&session(n+1);
  document.querySelectorAll('.part').forEach(el=>{
    const i=+el.dataset.i;
    el.querySelector('.ph').onclick=e=>{const o=el.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o)};
    el.querySelectorAll('.hbtn').forEach(b=>b.onclick=()=>{
      const h=b.dataset.h;
      if(h==='3'){openAsk(n,i);return}
      if(h==='4'){el.querySelector('[data-b="4"]').classList.add('show');logStuck(n,i,'hand');return}
      const bb=el.querySelector(`[data-b="${h}"]`);const on=!bb.classList.contains('show');bb.classList.toggle('show',on);b.setAttribute('aria-pressed',on);
      if(on&&h==='1')logStuck(n,i,'hint');
    });
  });
  const ag=$('#askGen');if(ag)ag.onclick=()=>openAsk(n,-1);
}

/* ---------- 코치에게 물어보기 (Gem 링크) ---------- */
function openAsk(n,i){
  const s=S[n-1],p=i>=0?s.parts[i]:null;
  const m=$('#askModal');
  m.innerHTML=`<div class="mbox"><h3>🤖 그림책 코치에게 물어보기</h3>
   <p style="margin:4px 0 8px">${n}차시 · ${GSTEP[s.g]}${p?`<br>막힌 곳: <b>${esc(plain(p[0]))}</b>`:''}</p>
   <label class="small">지금까지 내가 쓴 것을 옮겨 써도 좋아요 (안 써도 돼요)</label>
   <textarea id="mine" maxlength="400" placeholder="예) 주인공은 달팽이예요."></textarea>
   <p class="warn">내 이름, 학교, 전화번호, 주소는 쓰지 않아요.</p>
   <p class="small">누르면 질문이 복사돼요. 코치 창이 열리면 <b>붙여넣기(길게 눌러서 ‘붙여넣기’)</b> 해요.</p>
   <div class="row"><button class="tbtn" id="mx">닫기</button><button class="askbtn" id="mgo">질문 복사하고 코치 열기</button></div></div>`;
  m.classList.add('show');
  $('#mx').onclick=()=>m.classList.remove('show');
  $('#mgo').onclick=async()=>{
    const mine=$('#mine').value.trim();
    const q=`[그림책 코치에게 물어요]\n나는 3학년이고 ${n}차시 「${s.t}」 활동을 하고 있어. (단계: ${GSTEP[s.g]})\n활동지: ${s.sheet}\n${p?`막힌 곳: ${plain(p[0])} (${p[1]})\n`:''}${mine?`지금까지 내가 쓴 것: ${mine}\n`:''}대신 써 주지 말고, 질문을 하나씩 해서 내가 생각하도록 도와줘.`;
    const ok=await copy(q);
    logStuck(n,i,'coach');
    m.classList.remove('show');
    const w=window.open(CFG.gem,'_blank','noopener');
    if(ok)toast('질문을 복사했어요. 코치 창에 붙여넣기 해요!');
    else{toast('복사가 안 되어 질문을 보여 드려요');prompt('이 글을 복사해서 코치 창에 붙여 넣어요',q)}
    if(!w)toast('코치 창이 안 열리면 선생님께 말해요');
  };
}

$('#askModal').onclick=e=>{if(e.target.id==='askModal')e.target.classList.remove('show')};
try{applyCfg(JSON.parse(store.get('pb-cfg')||'null'))}catch(e){}
home();refreshCfg().then(ch=>{if(ch&&!document.querySelector('.book'))home()});
</script>
</body>
</html>
